<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANTE UP: HOUSE RULES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Special+Elite&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#e9dcc3; --dim:#9c8c72; --amber:#ffb45a; --blood:#b3261e; --bone:#f4ead6;
  --paper:#d9c7a1; --paperInk:#2b1d10; --bg:#030203; --line:rgba(233,220,195,.18);
  --fell:'IM Fell English','Cormorant Garamond',Georgia,serif;
  --sc:'IM Fell English SC','IM Fell English',Georgia,serif;
  --type:'Special Elite','Courier New',monospace;
  --body:'Cormorant Garamond',Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;user-select:none;-webkit-user-select:none;color:var(--ink);font-family:var(--body)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#gl.drag{cursor:grabbing}
#gl.hot{cursor:pointer}
#ui{position:absolute;inset:0;pointer-events:none}
#ui button,#ui input,#ui .click{pointer-events:auto}

/* meters */
#meters{position:absolute;left:18px;top:14px;display:flex;gap:16px;align-items:flex-end;transition:opacity .6s}
.meter{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px}
.meter b{font:700 22px var(--body);font-variant-numeric:lining-nums;color:var(--bone);text-shadow:0 0 8px #000}
.meter span{font:11px var(--sc);letter-spacing:2px;color:var(--dim)}
.meter.warn b{color:#ff6b4a;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45}}

#status{position:absolute;top:14px;right:20px;text-align:right;font:600 19px var(--body);font-variant-numeric:lining-nums;text-align:center;text-shadow:0 0 6px #000,0 0 14px #000;white-space:pre;line-height:1.35}
#status small{font-size:13px;color:var(--dim);letter-spacing:1px}
#timer{position:absolute;left:50%;transform:translateX(-50%);top:14px;font:700 30px var(--body);font-variant-numeric:lining-nums;color:var(--bone);text-shadow:0 0 10px #000;display:none;text-align:center}
#timer small{display:block;font:11px var(--sc);letter-spacing:2px;color:var(--dim)}
#timer.low{color:#ff5a3c;animation:pulse .6s infinite}
#keys{position:absolute;left:18px;bottom:14px;font:13px var(--sc);letter-spacing:1px;color:var(--dim);line-height:1.6;text-shadow:0 0 4px #000;white-space:pre}
#keys kbd{font:12px var(--type);color:var(--bone);border:1px solid var(--line);border-radius:3px;padding:0 5px;background:rgba(0,0,0,.4)}

#toasts{position:absolute;top:64px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
.toast{font:17px var(--fell);background:rgba(10,6,4,.78);border:1px solid var(--line);padding:6px 16px;border-radius:2px;animation:tin .4s ease-out}
.toast.bad{color:#ff8c70;border-color:rgba(255,90,60,.4)}
.toast.good{color:#ffd59a}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}

#cross{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:rgba(255,240,220,.35);display:none}
#prompt{position:absolute;transform:translate(-50%,22px);font:16px var(--fell);color:var(--bone);background:rgba(0,0,0,.62);padding:4px 12px;border-radius:2px;border:1px solid var(--line);display:none;white-space:nowrap}
#prompt.cheat{border-color:rgba(255,80,60,.55);color:#ffc1b0}
#prompt.locked{color:var(--dim)}
#ring{position:absolute;width:54px;height:54px;transform:translate(-50%,-50%);display:none}

#dlg{position:absolute;left:50%;bottom:48px;transform:translateX(-50%);width:min(860px,92vw);text-align:center;display:none}
#dlg .who{font:14px var(--sc);letter-spacing:4px;color:var(--dim);margin-bottom:4px}
#dlg .txt{font:25px/1.35 var(--fell);color:var(--bone);text-shadow:0 0 6px #000,0 0 18px #000,0 2px 2px #000}
#dlg.dealer .txt{color:#f6f1ff;letter-spacing:.5px}
#dlg.dealer .who{color:#cfc8ff}
#dlg.candle .txt{color:#ffd28a;font-style:italic}
#dlg.you .txt{color:#d8cdb8;font-style:italic;font-size:22px}
#dlg .more{font:12px var(--sc);color:var(--dim);letter-spacing:2px;margin-top:6px;opacity:0}
#dlg.ready .more{opacity:1;animation:pulse 1.4s infinite}
#dlg .r{color:#9a9a9a;background:#9a9a9a;border-radius:1px}

#choices{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:min(900px,94vw)}
.btn{font:19px var(--fell);color:var(--bone);background:rgba(16,10,7,.82);border:1px solid rgba(233,220,195,.32);padding:8px 18px;cursor:pointer;border-radius:2px;transition:background .15s,border-color .15s}
.btn:hover{background:rgba(60,32,14,.9);border-color:var(--amber)}
.btn:disabled{opacity:.35;cursor:default}
.btn small{display:block;font:12px var(--body);color:var(--dim)}
.btn.danger{border-color:rgba(200,60,40,.55)}

#panel{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);pointer-events:auto}
.sheet{width:min(820px,94vw);max-height:86vh;overflow:auto;background:linear-gradient(#1a120c,#0f0a07);border:1px solid rgba(233,220,195,.25);padding:22px 28px;box-shadow:0 0 60px #000}
.sheet h2{font:30px var(--fell);margin:0 0 4px;color:var(--bone)}
.sheet h3{font:20px var(--fell);margin:18px 0 6px;color:var(--amber)}
.sheet p,.sheet li{font:19px/1.45 var(--body)}
.sheet .tabs{display:flex;gap:6px;margin-bottom:14px}
.sheet .tabs .btn{font-size:15px;padding:4px 12px}
.sheet .tabs .btn.on{border-color:var(--amber);color:var(--amber)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.item{border:1px solid var(--line);padding:10px;background:rgba(0,0,0,.3)}
.item b{font:18px var(--fell);display:block;color:var(--bone)}
.item span{font:15px/1.3 var(--body);color:var(--dim)}
.item svg{width:40px;height:40px;display:block;margin-bottom:4px}
.entry{border-left:2px solid rgba(255,180,90,.35);padding:2px 0 2px 12px;margin:10px 0}
.entry b{font:18px var(--fell);color:var(--bone)}
.entry p{margin:2px 0;font-size:17px;color:#cbbd9f}
.paper{background:var(--paper);color:var(--paperInk);font:20px/1.5 var(--type);padding:26px 30px;box-shadow:inset 0 0 50px rgba(80,40,10,.5),0 0 50px #000;width:min(680px,92vw);max-height:84vh;overflow:auto;position:relative}
.paper h4{font:22px var(--fell);margin:0 0 10px;color:#3b2410}
.paper p{margin:0 0 12px}
.paper .sig{text-align:right;font-style:italic}
.paper .nav{display:flex;justify-content:space-between;margin-top:14px;font:15px var(--sc)}
.paper .nav span{cursor:pointer;color:#6b3a14}
.paper.hand{font:21px/1.5 var(--fell)}
.paper.blue{background:#c8cdd6;color:#1b2440}
.red{color:#7a120c}
.redact{background:#2b1d10;color:transparent;border-radius:1px}

#modal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.5);pointer-events:auto}
#modal .q{font:26px var(--fell);text-align:center;margin-bottom:16px;max-width:760px;text-shadow:0 0 10px #000}
#modal input{font:26px var(--fell);background:transparent;color:var(--bone);border:none;border-bottom:1px solid var(--dim);text-align:center;width:min(420px,80vw);outline:none;padding:6px}
#modal .box{display:flex;flex-direction:column;align-items:center;gap:14px}

#screen{position:absolute;inset:0;display:none;pointer-events:auto;align-items:center;justify-content:center;flex-direction:column;background:#000;text-align:center}
#screen.clear{background:transparent}
#screen h1{font:clamp(40px,7vw,88px) var(--fell);margin:0;color:var(--bone);letter-spacing:6px;text-shadow:0 0 24px rgba(255,170,80,.35)}
#screen h1 em{display:block;font:clamp(16px,2.2vw,26px) var(--sc);letter-spacing:12px;color:var(--amber);font-style:normal;margin-top:6px}
#screen .sub{font:20px var(--fell);color:var(--dim);margin-top:18px;font-style:italic}
#screen .menu{display:flex;flex-direction:column;gap:10px;margin-top:34px;min-width:280px}
#screen .menu .btn{font-size:22px}
#screen .wake{font:28px var(--fell);color:var(--bone);cursor:pointer;animation:pulse 2.6s infinite;margin-top:10px}
#screen .row{display:flex;gap:8px;justify-content:center;margin-top:24px;flex-wrap:wrap}
#screen .note{font:15px var(--body);color:#6d6252;margin-top:28px;max-width:640px;line-height:1.5}
.diffbtn.on{border-color:var(--amber);color:var(--amber)}
.card{font:22px/1.5 var(--fell);max-width:760px;padding:0 20px;color:var(--bone);white-space:pre-line}
.actcard{animation:fadein 2.4s ease}
.actcard .n{font:18px var(--sc);letter-spacing:10px;color:var(--amber)}
.actcard .t{font:clamp(34px,6vw,70px) var(--fell);letter-spacing:4px;margin-top:6px}
@keyframes fadein{from{opacity:0}}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;width:min(1000px,94vw);margin-top:20px}
.gal div{border:1px solid var(--line);padding:16px;text-align:left;background:rgba(255,255,255,.02)}
.gal b{font:22px var(--fell);display:block}
.gal i{font:16px var(--body);color:var(--dim)}
.gal .got b{color:var(--amber)}
.set{display:grid;grid-template-columns:200px 1fr;gap:12px 18px;align-items:center;text-align:left;font:18px var(--fell)}
.set input[type=range]{width:100%;accent-color:#c98a3c}

#peek{position:absolute;right:40px;bottom:140px;width:200px;height:200px;border-radius:50%;overflow:hidden;display:none;border:2px solid rgba(220,220,230,.4);box-shadow:0 0 30px rgba(200,200,255,.25)}
#peek canvas{width:100%;height:100%}
#black{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .2s}
#scare{position:absolute;inset:0;display:none}
.sm{font-size:14px;color:var(--dim)}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui">
  <div id="meters">
    <div class="meter" id="mSan"><canvas width="48" height="76"></canvas><b>100</b><span>SANITY</span></div>
    <div class="meter" id="mSus"><canvas width="76" height="48"></canvas><b>0</b><span>SUSPICION</span></div>
  </div>
  <div id="status"></div>
  <div id="timer"></div>
  <div id="toasts"></div>
  <div id="cross"></div>
  <div id="prompt"></div>
  <svg id="ring" viewBox="0 0 54 54"><circle cx="27" cy="27" r="22" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="4"/><circle id="ringArc" cx="27" cy="27" r="22" fill="none" stroke="#ffb45a" stroke-width="4" stroke-dasharray="138.2" stroke-dashoffset="138.2" transform="rotate(-90 27 27)"/></svg>
  <div id="keys"></div>
  <div id="choices"></div>
  <div id="dlg"><div class="who"></div><div class="txt"></div><div class="more">click to continue</div></div>
  <div id="peek"><canvas width="200" height="200"></canvas></div>
  <div id="panel"></div>
  <div id="modal"></div>
  <div id="black"></div>
  <div id="screen"></div>
</div>
<script type="module" src="/src/ante-up/main.js"></script>
</body>
</html>
