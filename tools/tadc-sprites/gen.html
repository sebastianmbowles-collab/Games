<!doctype html><html><body style="margin:0;background:#556"><div id="out" style="display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;padding:8px"></div>
<script type="module">
import { FIGURES } from './figures.js'
const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'
const F = 8
// spec: { key, fig, pose, scale }
window.make = (spec) => {
  const scale = spec.scale || 1
  const N = 120
  const cv = document.createElement('canvas')
  cv.width = N * F
  cv.height = N * F
  const c = cv.getContext('2d')
  // Origin at a whole pixel, so shapes drawn on whole numbers stay crisp.
  const ox = (N / 2) * F
  const oy = (N - 10) * F
  c.save()
  c.translate(ox, oy)
  c.scale(F * scale, F * scale)
  const eyes = FIGURES[spec.fig](c, spec.pose || {}) || []
  c.restore()
  const W = N, H = N
  const d = c.getImageData(0, 0, N * F, N * F).data
  const thr = spec.thr ?? 0.4
  const grid = []
  for (let py = 0; py < H; py++) {
    const row = []
    for (let px = 0; px < W; px++) {
      let cov = 0
      const votes = {}
      for (let sy = 0; sy < F; sy++) for (let sx = 0; sx < F; sx++) {
        const i = ((py * F + sy) * N * F + px * F + sx) * 4
        if (d[i + 3] > 128) {
          cov++
          if (d[i + 3] > 230) {
            const k = ((d[i] >> 3) << 10) | ((d[i + 1] >> 3) << 5) | (d[i + 2] >> 3)
            votes[k] = (votes[k] || 0) + 1
          }
        }
      }
      if (cov / (F * F) < thr) { row.push(null); continue }
      let best = null, bn = 0
      for (const k in votes) if (votes[k] > bn) { bn = votes[k]; best = +k }
      row.push(best)
    }
    grid.push(row)
  }
  // Crop to what was drawn, plus a 1px border for the outline.
  let x0 = W, y0 = H, x1 = 0, y1 = 0
  grid.forEach((r, y) => r.forEach((k, x) => { if (k !== null) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y) } }))
  x0--; y0--; x1++; y1++
  const OUT = -1
  const crop = []
  for (let y = y0; y <= y1; y++) crop.push(grid[y].slice(x0, x1 + 1))
  const res = crop.map((r) => r.slice())
  for (let y = 0; y < crop.length; y++) for (let x = 0; x < crop[0].length; x++) {
    if (crop[y][x] !== null) continue
    if ([[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => crop[y + dy] && crop[y + dy][x + dx] != null && crop[y + dy][x + dx] !== OUT)) res[y][x] = OUT
  }
  const rgb = (k) => [((k >> 10) & 31) * 8 + 4, ((k >> 5) & 31) * 8 + 4, (k & 31) * 8 + 4]
  const used = [...new Set(res.flat().filter((k) => k !== null))]
  const pal = used.map((k) => (k === OUT ? '#140c1c' : '#' + rgb(k).map((v) => Math.min(255, v).toString(16).padStart(2, '0')).join('')))
  const rows = res.map((r) => r.map((k) => (k === null ? '.' : CHARS[used.indexOf(k)])).join(''))
  // Figure coordinates -> sprite pixels.
  const toX = (fx) => (fx * scale * F + ox) / F - x0
  const toY = (fy) => (fy * scale * F + oy) / F - y0
  const ax = Math.round(toX(0))
  const eyeOut = eyes.map((e) => ({ x: +toX(e.x).toFixed(1), y: +toY(e.y).toFixed(1), w: Math.max(1, Math.round(e.w * scale)), h: Math.max(1, Math.round(e.h * scale)), color: e.color, rx: +(e.rx * scale).toFixed(1), ry: +(e.ry * scale).toFixed(1) }))
  // Preview (pupils drawn in the middle).
  const Z = window.ZOOM || 4
  const pv = document.createElement('canvas')
  pv.width = rows[0].length * Z
  pv.height = rows.length * Z
  const pc = pv.getContext('2d')
  rows.forEach((r, y) => [...r].forEach((ch, x) => { if (ch !== '.') { pc.fillStyle = pal[CHARS.indexOf(ch)]; pc.fillRect(x * Z, y * Z, Z, Z) } }))
  for (const e of eyeOut) { pc.fillStyle = e.color; pc.fillRect(Math.round(e.x - e.w / 2) * Z, Math.round(e.y - e.h / 2) * Z, e.w * Z, e.h * Z) }
  const wrap = document.createElement('div')
  wrap.style.cssText = 'color:#fff;font:12px sans-serif;text-align:center'
  wrap.append(pv, document.createElement('br'), `${spec.key} ${rows[0].length}x${rows.length}`)
  document.getElementById('out').appendChild(wrap)
  return { key: spec.key, pal, rows, ax, eyes: eyeOut }
}
document.title = 'ready'
</script></body></html>
