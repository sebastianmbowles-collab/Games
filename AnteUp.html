table, into the blackest part of the dark, where no candlelight reaches. He looked for it. He looked <i>straight at it</i> and could not find it.</p><p class="red"><b>He cannot see what lies wholly in absolute shadow.</b></p><p>Not partly. Wholly. A man could hide a great deal in the dark. Perhaps even himself.</p>`},{title:`To whoever finds this`,body:`<p>I keep these pages under the loose board behind my chair. I hid the screwdriver in the drain so he would not wonder at it.</p><p>If you are reading this, then I did not finish either.</p><p>Do not be afraid of losing to him. <b>Be afraid of winning the way he wants you to.</b></p>`,sig:`E.H.`}]},marguerite:{title:`A letter, folded small`,cls:`hand`,pages:[{title:`Rosie,`,body:`<p>If this ever reaches you it will be a miracle, and I have stopped believing in those.</p><p>The teeth on the table are real. I counted them in the dark: one hundred and twelve. Some of them have fillings. I keep thinking one of them might be mine one day.</p>`},{title:``,body:`<p>I found matches in my coat. Eleven of them. I hid them here behind the stone, because I could not think of a single thing worth burning that he would let me burn.</p><p>Maybe whoever reads this will think of something.</p><p>Tell Mum I was brave.</p>`,sig:`Margie, 1962`}]},tomas:{title:`Tomás's notebook`,cls:`blue`,pages:[{title:`Day 3??`,body:`<p>Watch stopped. Whatever. This house is OLDER than the cellar, I swear. The stones up top are 1880s, I did a school project on houses like this.</p><p>There is a gas line. I can hear it hissing behind the <b>east wall</b> when he goes away.</p>`},{title:`Day ?`,body:`<p>If somebody had <b>oil</b>, and a <b>light</b>, and knew where the <b>valve</b> was, they could burn this whole place down. Everything. The cards, the chair, HIM.</p><p>But I think it would take the parts of you he's holding too. Memories. Names. Who you are.</p><p>I don't know if I'd do it. I want to remember my mom.</p>`},{title:`later`,body:`<p>Found a pair of dice in my pocket from the arcade. They're honest. His aren't. His always roll what he wants.</p><p>I'm going to hide mine somewhere cold where he won't smell them. If you find them, swap them in when he isn't looking.</p>`,sig:`— T.R. 1994`}]},drawing:{title:`A child's drawing`,cls:`hand`,pages:[{title:`NELL 1908`,body:`<p>Three stick figures: a tall one in a hat, one in a skirt, a small one in between. Beside them, a black dog with one red eye.</p><p>Underneath, in crayon: <i>mama papa me</i>.</p><p>On the back, smaller: <i>the woolf ate papa first</i>.</p>`}]},silas:{title:`A ledger page`,cls:`hand`,pages:[{title:`LEDGER of S. CRANE, Esq.`,body:`<p>Gaming accounts, Crane House, 1887.</p><p><b>Won:</b> every hand. Every match. Every game he set before me.<br><b>Lost:</b> nothing.<br><b>Owed:</b> &mdash;</p><p>I played him perfectly. I broke no rule. And when the last die stopped, I found I could not rise from the chair. The smoke came up through the floorboards and into my sleeves, and the shackle did not open.</p><p class="red">I am the house now. The house always wins.</p>`}]},map:{title:`House plan`,cls:`blue`,pages:[{title:`CRANE HOUSE: CELLAR & GAS LINE, 1887`,body:`<p>Main valve: <b>east wall, behind the third stone</b>, knee height.</p><p>Line runs up to the kitchen. Cellar is beneath the whole house. Stair door, north-east corner.</p><p class="red">DO NOT OPEN NEAR AN OPEN FLAME.</p>`}]},lastpage:{title:`Edward's last page`,pages:[{title:`To whoever sits in my chair`,body:`<p>I won. I won every game, honestly, exactly the way he wanted, and the chair kept me. <b>I am the one across the table now.</b> Silas is in here too, and others, older.</p><p>There is not much of me left, but enough to write this while he sleeps in the cold. Listen:</p><p class="red"><b>He only exists where you look.</b></p><p>In the last game, stop looking at the board. <b>Put out the light</b>, so the whole room is absolute shadow and he cannot see you. Then hold up the glass and <b>show him his face</b>. Show him all of us.</p>`,sig:`E.H.`}]},dicenote:{title:`A note around two dice`,cls:`blue`,pages:[{title:``,body:`<p>These are honest.</p><p>His are not.</p>`,sig:`— T.R.`}]}},hh={pet:{q:`Tell me about an animal you loved. What was its name?`,ph:`a name`,kq:`And what was {pet}? A dog? A cat? Something else?`,kph:`what kind of animal`},friend:{q:`Who would you run to, if you ever got out of here? Tell me their name.`,ph:`a name`},home:{q:`Where is home? Name the place.`,ph:`a town, a street, a place`}},gh={shattered:{title:`The Shattered Illusion`,hint:`Darkness is the one place he cannot look. Put out the light, then show him what he is.`},hollow:{title:`The Hollow Chair`,hint:`Win his last game. Exactly the way he wants you to.`},consumed:{title:`The Consumed`,hint:`Let the candle inside you go out where the floor has fallen away, or where the frost is.`},sacrificial:{title:`The Sacrificial Escape`,hint:`Oil. A light. A valve behind a stone. Some fires burn more than wood.`}},_h=()=>Y.props;function vh(e){B.items[e]||(B.items[e]=!0,W.sfx(`pick`),Q(`Picked up: <b>${_d[e].name}</b>`,`good`,3.5))}async function yh(e){B.docs=B.docs||{},B.docs[e]=mh[e].title;let t=V.paused;V.paused=!0,await Rm(mh[e]),V.paused=t}Z.openDoc=e=>yh(e);async function bh(e){let t=Od().timers[e-1];await J.sinkAway(),W.sfx(`shackle`),await uf(.5),Q(`The shackle on your ankle loosens.`,``,3.5),W.music(e===3?`void`:`off`),W.duck(0),setTimeout(()=>W.unduck(),2500),V.walk.x=0,V.walk.z=1.05,V.walk.radius=[3.1,4.7,2.9,5.7][e-1],Zd(`walk`,{yaw:V.view.yaw,pitch:-.15}),wm(!0);let n=Y.hemi.intensity;df(3,t=>{Y.eyesLight.intensity=t*(e===3?.7:1.4),Y.hemi.intensity=n+t*.4}),ah.breath=e===4,Sm(`<kbd>W A S D</kbd> walk &nbsp; <kbd>drag</kbd> look &nbsp; <kbd>click</kbd> glowing things &nbsp; <kbd>I</kbd> items &nbsp; <kbd>J</kbd> journal`),xm(e===1?`<small>Find what you can. Click your chair to sit before he returns.</small>`:``);let r=[],i={act:e,hots:r,done:!1};xh(e),Sh(e,i), <script>
// shows problems on screen instead of a black page
(function () {
  var shown = false;
  function fail(msg) {
    if (shown) return; shown = true;
    var b = document.getElementById('boot'), m = document.getElementById('bootMsg');
    if (!b || !m) return;
    b.style.display = 'flex';
    m.style.color = '#ff8c70';

  }
  window.__bootFail = fail;
  window.addEventListener('error', function (e) { if (!window.__booted) fail(e.message || 'script error'); });
  window.addEventListener('unhandledrejection', function (e) { if (!window.__booted) fail((e.reason && e.reason.message) || e.reason); });
  try {
    var c = document.createElement('canvas');
    if (!(c.getContext('webgl2') || c.getContext('webgl'))) fail('Your browser has 3D graphics (WebGL) turned off or not available.');
  } catch (e) { fail(e.message); }
  setTimeout(function () { if (!window.__booted && !shown) { var m = document.getElementById('bootMsg'); if (m) m.innerHTML = 'Still lighting the candle&hellip; slow computers can take up to a minute.'; } }, 12000);
})();
</script>
