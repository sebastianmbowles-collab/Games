// =====================================================================
//  DAD QUEST: THE BIRTHDAY BASH  —  created by Sebby
// =====================================================================
const W = 320, H = 192, TS = 16, ROWS = 12, FLOOR = 160;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const buf = document.createElement('canvas'); buf.width = W; buf.height = H;
const g = buf.getContext('2d'); g.imageSmoothingEnabled = false;
let scale = 1, offX = 0, offY = 0;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.floor(innerWidth * dpr); cv.height = Math.floor(innerHeight * dpr);
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  scale = Math.min(cv.width / W, cv.height / H);
  offX = Math.floor((cv.width - W * scale) / 2); offY = Math.floor((cv.height - H * scale) / 2);
}
addEventListener('resize', resize); resize();

// ---------- text (drawn crisp on top of the pixel canvas) ----------
let texts = [];
function txt(s, x, y, o = {}) { texts.push([String(s), x, y, o.size || 8, o.c || '#fff', o.a || 'left', o.sh !== false]); }
function flushText() {
  ctx.textBaseline = 'top';
  for (const [s, x, y, sz, c, a, sh] of texts) {
    ctx.font = `${Math.round(sz * scale)}px 'Press Start 2P', monospace`;
    ctx.textAlign = a;
    const px = offX + x * scale, py = offY + y * scale;
    if (sh) { ctx.fillStyle = '#000'; ctx.fillText(s, px + scale, py + scale); }
    ctx.fillStyle = c; ctx.fillText(s, px, py);
  }
  texts = [];
}
function wrap(s, max) {
  const out = []; let line = '';
  for (const w of s.split(' ')) {
    if ((line + ' ' + w).trim().length > max) { out.push(line.trim()); line = w; } else line += ' ' + w;
  }
  if (line.trim()) out.push(line.trim());
  return out;
}

// ---------- input ----------
const keys = {}, touchK = {};
const cur = {}, prev = {};
const KM = { ArrowLeft: 'l', ArrowRight: 'r', ArrowUp: 'u', ArrowDown: 'd', KeyZ: 'a', Space: 'a', KeyX: 'b', KeyC: 'x', KeyV: 'y', Enter: 'st', Escape: 'st', KeyP: 'st', KeyM: 'mute' };
addEventListener('keydown', e => { initAudio(); const k = KM[e.code]; if (k) { keys[k] = 1; e.preventDefault(); } });
addEventListener('keyup', e => { const k = KM[e.code]; if (k) keys[k] = 0; });
const touchEl = document.getElementById('touch');
function setupTouch() {
  touchEl.style.display = 'block';
  const bs = [...touchEl.querySelectorAll('.tb')];
  const upd = ev => {
    ev.preventDefault(); initAudio();
    for (const b of bs) touchK[b.dataset.k] = 0;
    for (const t of ev.touches) {
      for (const b of bs) {
        const r = b.getBoundingClientRect();
        if (t.clientX > r.left - 10 && t.clientX < r.right + 10 && t.clientY > r.top - 10 && t.clientY < r.bottom + 10) touchK[b.dataset.k] = 1;
      }
    }
    for (const b of bs) b.classList.toggle('on', !!touchK[b.dataset.k]);
  };
  ['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach(n => addEventListener(n, upd, { passive: false }));
}
addEventListener('touchstart', function once() { removeEventListener('touchstart', once); setupTouch(); }, { passive: true });
addEventListener('mousedown', () => initAudio());
function pollInput() {
  for (const k of ['l', 'r', 'u', 'd', 'a', 'b', 'x', 'y', 'st', 'mute']) { prev[k] = cur[k]; cur[k] = !!(keys[k] || touchK[k]); }
}
const pr = k => cur[k] && !prev[k];
const anyPr = () => pr('a') || pr('st') || pr('b');

// ---------- audio ----------
let AC = null, master = null, noiseBuf = null, muted = false;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.22; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    nextT = AC.currentTime + 0.05;
  } catch (e) { AC = null; }
}
function tone(f, t, d, type = 'square', v = 0.3, slide = 0) {
  if (!AC || !f) return;
  const o = AC.createOscillator(), ga = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t + d);
  ga.gain.setValueAtTime(v, t); ga.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(ga); ga.connect(master); o.start(t); o.stop(t + d + 0.02);
}
function noise(t, d, v = 0.2, freq = 0) {
  if (!AC) return;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const ga = AC.createGain(); ga.gain.setValueAtTime(v, t); ga.gain.exponentialRampToValueAtTime(0.001, t + d);
  if (freq) { const f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = freq; s.connect(f); f.connect(ga); } else s.connect(ga);
  ga.connect(master); s.start(t); s.stop(t + d + 0.02);
}

    case 'slow': tone(800, t, 0.6, 'sine', 0.25, 0.25); break;

    case 'candle': [1047, 1319, 1568, 2093, 2637].forEach((f, i) => tone(f, t + i * 0.05, 0.2, 'triangle', 0.2)); break;

    case 'quake': noise(t, 0.8, 0.35); tone(50, t, 0.8, 'sawtooth', 0.3, 0.6); break;
    case 'text': tone(880 + Math.random() * 100, t, 0.025, 'square', 0.05); break;
  }
}

let curSong = null, songName = '', step = 0, nextT = 0, musicSpeed = 1;
function playMusic(n) { if (songName === n) return; songName = n; curSong = SONGS[n] || null; step = 0; if (AC) nextT = AC.currentTime + 0.05; }
function drum(c, t) {
  if (c === 'k') tone(150, t, 0.12, 'sine', 0.5, 0.3);
  else if (c === 's') noise(t, 0.1, 0.18, 1000);
  else if (c === 'h') noise(t, 0.03, 0.08, 6000);

setInterval(() => {
  if (!AC || !curSong || muted) return;
  const sp = 60 / curSong.bpm / 2 / musicSpeed;
  if (nextT < AC.currentTime) nextT = AC.currentTime + 0.02;
  while (nextT < AC.currentTime + 0.15) {
    const m = curSong.m[step % curSong.m.length]; if (m !== '-') tone(nf(m), nextT, sp * 0.9, curSong.mt, curSong.mt === 'sawtooth' ? 0.07 : 0.11);
    const b = curSong.b[step % curSong.b.length]; if (b !== '-') tone(nf(b), nextT, sp * 0.9, 'triangle', 0.28);
    drum(curSong.d[step % curSong.d.length], nextT);
    step++; nextT += sp;
    if (!curSong.loop && step >= curSong.m.length) { curSong = null; break; }
  }

  o: '#ff8a1c', c: '#8fe8ff', C: '#30a0e0', e: '#9aa0a8', E: '#4a4e58', n: '#f2e2c0', N: '#c8a070',
  v: '#9050e0', V: '#3a1a5a', m: '#ff40ff', x: '#7a6a5a', d: '#222',

function mkSpr(rows, pal) {
  const h = rows.length, w = Math.max(...rows.map(r => r.length));

  const x = c.getContext('2d');
  rows.forEach((r, j) => { for (let i = 0; i < r.length; i++) { const col = pal[r[i]]; if (col) { x.fillStyle = col; x.fillRect(i, j, 1, 1); } } });

}

const rnd = (a, b) => a + Math.random() * (b - a);
const ov = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const cx = o => o.x + o.w / 2;

function tileAt(x, y) { if (x < 0 || x >= lv.w) return 1; if (y < 0 || y >= ROWS) return 0; return lv.t[y * lv.w + x]; }
function solidAt(tx, ty, oneWayOK) {
  const v = tileAt(tx, ty);
  if (v === 1 || v === 4) return true;
  if (!oneWayOK) return false;
  if (v === 2) return true;
  if (v === 3) return reveal > 0;
  if (v === 5) return vanishT <= 0;
  return false;
}
function moveBody(o) {
  let hitX = false;
  o.x += o.vx;
  if (o.vx !== 0) {
    const dir = Math.sign(o.vx), tx = Math.floor((dir > 0 ? o.x + o.w - 0.01 : o.x) / TS);
    for (let ty = Math.floor(o.y / TS); ty <= Math.floor((o.y + o.h - 0.01) / TS); ty++) {
      if (solidAt(tx, ty, false)) { o.x = dir > 0 ? tx * TS - o.w : (tx + 1) * TS; hitX = true; break; }
    }
  }
  const oldBot = o.y + o.h;
  o.y += o.vy; o.onGround = false;
  if (o.vy > 0) {
    const ty = Math.floor((o.y + o.h - 0.01) / TS);
    for (let tx = Math.floor((o.x + 1) / TS); tx <= Math.floor((o.x + o.w - 1.01) / TS); tx++) {
      const oneWay = !o.drop && oldBot <= ty * TS + 0.5;
      if (solidAt(tx, ty, oneWay)) { o.y = ty * TS - o.h; o.vy = 0; o.onGround = true; o.groundTile = tileAt(tx, ty); break; }
    }
  } else if (o.vy < 0) {
    const ty = Math.floor(o.y / TS);
    for (let tx = Math.floor((o.x + 1) / TS); tx <= Math.floor((o.x + o.w - 1.01) / TS); tx++) {
      if (ty >= 0 && solidAt(tx, ty, false)) { o.y = (ty + 1) * TS; o.vy = 0; break; }
    }
  }

}

function titleScene(skipIntro) {

  for (let y = -2; y <= 10; y += 2) { outline.push([-20, y]); outline.push([20, y]); }
  for (let x = -12; x <= 12; x += 2) outline.push([x, -12]);
  for (let y = -12; y <= -2; y += 2) { outline.push([-12, y]); outline.push([12, y]); }
