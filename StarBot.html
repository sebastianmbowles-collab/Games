<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Star Bot</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#02030a;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{display:block;position:absolute;left:0;top:0;cursor:crosshair}
#touch{display:none;position:absolute;inset:0;pointer-events:none}
.stick{position:absolute;bottom:24px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.35);pointer-events:auto}
.nub{position:absolute;left:45px;top:45px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.3);pointer-events:none}
.lbl{position:absolute;width:100%;top:-20px;text-align:center;color:rgba(255,255,255,.55);font:bold 11px monospace;pointer-events:none}
.tb{position:absolute;width:70px;height:70px;border-radius:50%;background:rgba(190,90,255,.25);border:2px solid rgba(255,255,255,.45);color:#fff;font:bold 13px monospace;display:flex;align-items:center;justify-content:center;pointer-events:auto}
.tb.sm{width:64px;height:32px;border-radius:16px;font-size:10px;background:rgba(255,255,255,.12)}
.tb.on{background:rgba(190,90,255,.6)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="touch">
  <div class="stick" id="stickL" style="left:24px"><div class="lbl">MOVE</div><div class="nub"></div></div>
  <div class="stick" id="stickR" style="right:24px"><div class="lbl">AIM + SHOOT</div><div class="nub"></div></div>
  <div class="tb" data-k="bomb" style="right:58px;bottom:190px">BOMB</div>
  <div class="tb sm" data-k="pause" style="right:16px;top:56px">PAUSE</div>
  <div class="tb sm" data-k="vol" style="right:16px;top:96px">SOUND</div>
</div>
<script>
'use strict';
// ===== Canvas =====
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const PF = '"Press Start 2P", monospace';
let cw = 0, ch = 0, dpr = 1, zoom = 1, vw = 0, vh = 0;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cw = window.innerWidth; ch = window.innerHeight;
  cv.width = cw * dpr; cv.height = ch * dpr;
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  zoom = Math.max(0.55, Math.min(1.3, Math.min(cw, ch) / 700));
  vw = cw / zoom; vh = ch / zoom;
}
window.addEventListener('resize', resize); resize();

// ===== Helpers =====
const W = 2000, H = 2000; // size of the space arena
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const pick = a => a[Math.random() * a.length | 0];
const hyp = Math.hypot;
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); }
function txt(s, x, y, size, col, align = 'center') {
  ctx.font = size + 'px ' + PF; ctx.textAlign = align; ctx.textBaseline = 'middle';
  const w = ctx.measureText(s).width, max = cw - 20;
  if (w > max) { size *= max / w; ctx.font = size + 'px ' + PF; }
  ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, size / 3); ctx.strokeStyle = '#000';
  ctx.strokeText(s, x, y); ctx.fillStyle = col; ctx.fillText(s, x, y);
}
const fmtTime = t => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');

// ===== Sound =====
let AC = null, master = null, noiseBuf = null, soundOn = true;
try { soundOn = localStorage.getItem('starbot-sound') !== '0'; } catch (e) { /* no storage */ }
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = soundOn ? 0.35 : 0; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function toggleSound() {
  soundOn = !soundOn;
  if (master) master.gain.value = soundOn ? 0.35 : 0;
  try { localStorage.setItem('starbot-sound', soundOn ? '1' : '0'); } catch (e) { /* no storage */ }
}
function tone(freq, dur, type = 'square', vol = 0.2, slide = 0, delay = 0) {
  if (!AC || !soundOn) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.3, freq = 800, delay = 0) {
  if (!AC || !soundOn) return;
  const t = AC.currentTime + delay, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass';
  f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(60, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.02);
}
let clinkT = 0, hitT = 0;
const sfx = {
  shoot: () => tone(880, 0.06, 'square', 0.04, 0.5),
  hit: () => { if (hitT > 0) return; hitT = 0.04; tone(300, 0.05, 'square', 0.06, 0.6); },
  clink: () => { if (clinkT > 0) return; clinkT = 0.1; tone(1500, 0.05, 'triangle', 0.06); },
  pop: () => { noise(0.25, 0.25, 1500); tone(200, 0.15, 'sawtooth', 0.07, 0.3); },
  boom: () => { noise(0.8, 0.5, 900); tone(90, 0.6, 'sawtooth', 0.15, 0.3); },
  hurt: () => { tone(220, 0.25, 'sawtooth', 0.18, 0.4); noise(0.2, 0.2, 600); },
  pickup: () => { tone(660, 0.08, 'square', 0.1); tone(880, 0.08, 'square', 0.1, 0, 0.08); tone(1320, 0.12, 'square', 0.1, 0, 0.16); },
  bomb: () => { noise(1.2, 0.6, 2500); tone(60, 1, 'sine', 0.4, 0.5); },
  eshoot: () => tone(500, 0.12, 'triangle', 0.04, 0.5),
  wave: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.15, 'square', 0.08, 0, i * 0.1)),
  alarm: () => { for (let i = 0; i < 3; i++) tone(440, 0.3, 'sawtooth', 0.1, 0.5, i * 0.4); },
  win: () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, 0.2, 'square', 0.09, 0, i * 0.13)),
};

// ===== Input =====
const keys = {}, pressed = {};
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (!keys[k]) pressed[k] = true; keys[k] = true;
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
  initAudio();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
const mouse = { x: 0, y: 0, down: false, used: false };
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.down = false; });
cv.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.used = true; });
cv.addEventListener('mousedown', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.down = mouse.used = true; pressed.click = true; initAudio(); });
window.addEventListener('mouseup', () => { mouse.down = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('touchstart', e => { e.preventDefault(); pressed.tap = true; initAudio(); }, { passive: false });

const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
const touchEl = document.getElementById('touch');
function makeStick(id) {
  const el = document.getElementById(id), nub = el.querySelector('.nub');
  const s = { x: 0, y: 0, id: null, on: false };
  const move = t => {
    const r = el.getBoundingClientRect(), max = r.width / 2;
    let dx = t.clientX - (r.left + max), dy = t.clientY - (r.top + max);
    const m = hyp(dx, dy);
    if (m > max) { dx *= max / m; dy *= max / m; }
    s.x = dx / max; s.y = dy / max;
    nub.style.transform = `translate(${dx}px,${dy}px)`;
  };
  const end = e => {
    for (const t of e.changedTouches) if (t.identifier === s.id) { s.id = null; s.on = false; s.x = s.y = 0; nub.style.transform = ''; }
  };
  el.addEventListener('touchstart', e => { e.preventDefault(); initAudio(); const t = e.changedTouches[0]; s.id = t.identifier; s.on = true; move(t); }, { passive: false });
  el.addEventListener('touchmove', e => { e.preventDefault(); for (const t of e.changedTouches) if (t.identifier === s.id) move(t); }, { passive: false });
  el.addEventListener('touchend', end); el.addEventListener('touchcancel', end);
  return s;
}
const stickL = makeStick('stickL'), stickR = makeStick('stickR');
for (const b of touchEl.querySelectorAll('.tb')) {
  const k = b.dataset.k;
  b.addEventListener('touchstart', e => { e.preventDefault(); initAudio(); pressed[k] = true; b.classList.add('on'); }, { passive: false });
  b.addEventListener('touchend', () => b.classList.remove('on'));
}

// ===== Game data =====
const WAVES = [
  { name: 'ASTEROID FIELD', hint: 'Shoot the space rocks! Big ones break into little ones.', list: [['rock', 4]] },
  { name: 'SPACE BUGS', hint: 'Bugs are fast but weak. Keep moving!', list: [['rock', 2], ['bug', 10]] },
  { name: 'ALIEN ATTACK', hint: 'Aliens shoot green goo. Dodge it!', list: [['alien', 4], ['bug', 8]] },
  { name: 'EVIL ROBOTS', hint: 'Evil robots are tough and shoot 3 lasers at once.', list: [['robot', 4], ['alien', 2], ['rock', 2]] },
  { name: 'EVERYTHING!', hint: 'All of them at once. Use a BOMB if it gets crazy!', list: [['rock', 3], ['bug', 12], ['alien', 3], ['robot', 3]] },
];
const COLORS = { rock: '#b09a84', bug: '#b65cff', alien: '#5cff8a', robot: '#ff4a4a' };
const NEBULAS = [
  { x: 400, y: 500, r: 750, c: 'rgba(120,40,200,0.20)' },
  { x: 1600, y: 1400, r: 850, c: 'rgba(30,90,220,0.18)' },
  { x: 1500, y: 300, r: 550, c: 'rgba(20,180,160,0.12)' },
  { x: 500, y: 1650, r: 500, c: 'rgba(220,60,120,0.12)' },
];
const stars = [];
for (let L = 0; L < 3; L++) for (let i = 0; i < 70; i++)
  stars.push({ x: Math.random(), y: Math.random(), f: [0.15, 0.35, 0.6][L], s: [1, 1.6, 2.4][L], tw: rnd(0, 6) });

let state = 'title', clock = 0, score = 0, waveIdx = 0, waveScore = 0, waveBombs = 1, playT = 0, endT = 0, newBest = false;
let bestTime = 0;
try { bestTime = +(localStorage.getItem('starbot-best') || 0); } catch (e) { /* no storage */ }
let P = null, bullets = [], ebullets = [], enemies = [], parts = [], pickups = [], texts = [], rings = [];
let boss = null, spawnQ = [], spawnT = 0, banner = null, clearT = 0, deadT = 0, shake = 0, flashT = 0, camX = 0, camY = 0;

function startGame(w) {
  const retry = w > 0;
  if (!retry) playT = 0;
  P = { x: W / 2, y: H / 2, vx: 0, vy: 0, r: 20, hp: 5, maxHp: 5, inv: 2, aim: -Math.PI / 2, cool: 0,
    triple: 0, rapid: 0, bombs: retry ? Math.max(1, waveBombs) : 1, dead: false, moving: false };
  score = retry ? waveScore : 0;
  bullets = []; ebullets = []; enemies = []; parts = []; pickups = []; texts = []; rings = [];
  boss = null; spawnQ = []; clearT = 0; deadT = 0; shake = 0; flashT = 0;
  state = 'play';
  startWave(w);
}
function startWave(i) {
  waveIdx = i; waveScore = score; waveBombs = P.bombs; clearT = 0;
  if (i >= WAVES.length) { startBoss(); return; }
  const wv = WAVES[i];
  spawnQ = [];
  for (const [t, n] of wv.list) for (let k = 0; k < n; k++) spawnQ.push(t);
  for (let k = spawnQ.length - 1; k > 0; k--) { const j = Math.random() * (k + 1) | 0; [spawnQ[k], spawnQ[j]] = [spawnQ[j], spawnQ[k]]; }
  spawnT = 2.5;
  banner = { title: 'WAVE ' + (i + 1) + ': ' + wv.name, hint: wv.hint, t: 3.5, max: 3.5 };
  sfx.wave();
}

// ===== Enemies =====
function spawnPoint(minD = 650) {
  for (let i = 0; i < 30; i++) {
    const x = rnd(80, W - 80), y = rnd(80, H - 80);
    if (hyp(x - P.x, y - P.y) > minD) return [x, y];
  }
  return [P.x < W / 2 ? W - 100 : 100, P.y < H / 2 ? H - 100 : 100];
}
function makeEnemy(type, x, y, size = 3) {
  const e = { type, x, y, vx: 0, vy: 0, t: rnd(0, 10), flash: 0, cool: rnd(1, 2.5), spawn: 0.7, drops: true };
  if (type === 'rock') {
    e.size = size; e.r = [0, 18, 30, 48][size]; e.hp = [0, 1, 3, 5][size]; e.score = [0, 20, 30, 50][size];
    const a = rnd(0, TAU), sp = [0, 140, 100, 60][size];
    e.vx = Math.cos(a) * sp; e.vy = Math.sin(a) * sp;
    e.rot = rnd(0, TAU); e.spin = rnd(-1.5, 1.5);
    e.pts = []; for (let i = 0; i < 9 + size * 2; i++) e.pts.push(rnd(0.75, 1.1));
  } else if (type === 'bug') { e.r = 14; e.hp = 1; e.score = 25; }
  else if (type === 'alien') { e.r = 26; e.hp = 4; e.score = 75; e.orbit = rnd(260, 380); e.dir = Math.random() < 0.5 ? 1 : -1; }
  else if (type === 'robot') { e.r = 28; e.hp = 8; e.score = 120; }
  e.maxHp = e.hp;
  enemies.push(e);
  return e;
}
function shootE(x, y, a, sp, kind) {
  ebullets.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: kind === 'goo' ? 8 : 6, kind, life: 6 });
}
function updateEnemies(dt) {
  for (const e of enemies) {
    e.t += dt; if (e.flash > 0) e.flash -= dt;
    if (e.spawn > 0) { e.spawn -= dt; continue; }
    const dx = P.x - e.x, dy = P.y - e.y, d = hyp(dx, dy) || 1;
    if (e.type === 'rock') e.rot += e.spin * dt;
    else if (e.type === 'bug') {
      const a = Math.atan2(dy, dx) + Math.sin(e.t * 6) * 0.7;
      e.vx += (Math.cos(a) * 230 - e.vx) * 2.5 * dt; e.vy += (Math.sin(a) * 230 - e.vy) * 2.5 * dt;
    } else if (e.type === 'alien') {
      // circle around the robot at a safe distance and spit goo
      const radial = clamp((d - e.orbit) / 100, -1.5, 1.5);
      const tx = dx / d * radial - dy / d * e.dir, ty = dy / d * radial + dx / d * e.dir, tm = hyp(tx, ty) || 1;
      e.vx += (tx / tm * 150 - e.vx) * 2 * dt; e.vy += (ty / tm * 150 - e.vy) * 2 * dt;
      e.cool -= dt;
      if (e.cool <= 0 && d < 750 && !P.dead) { e.cool = rnd(1.6, 2.6); shootE(e.x, e.y, Math.atan2(dy, dx), 260, 'goo'); sfx.eshoot(); }
    } else if (e.type === 'robot') {
      e.vx += (dx / d * 85 - e.vx) * 1.5 * dt; e.vy += (dy / d * 85 - e.vy) * 1.5 * dt;
      e.cool -= dt;
      if (e.cool <= 0 && d < 700 && !P.dead) {
        e.cool = rnd(2.2, 3);
        const a = Math.atan2(dy, dx);
        for (const o of [-0.25, 0, 0.25]) shootE(e.x, e.y, a + o, 300, 'laser');
        sfx.eshoot();
      }
    }
    e.x += e.vx * dt; e.y += e.vy * dt;
    if (e.x < e.r) { e.x = e.r; e.vx = Math.abs(e.vx); }
    if (e.x > W - e.r) { e.x = W - e.r; e.vx = -Math.abs(e.vx); }
    if (e.y < e.r) { e.y = e.r; e.vy = Math.abs(e.vy); }
    if (e.y > H - e.r) { e.y = H - e.r; e.vy = -Math.abs(e.vy); }
  }
}
function damage(e, n) {
  if (e.dead) return;
  e.hp -= n; e.flash = 0.08; sfx.hit();
  if (e.hp <= 0) kill(e);
}
function kill(e, quiet) {
  e.dead = true;
  explode(e.x, e.y, COLORS[e.type], e.r, e.r * 6);
  if (quiet) return;
  score += e.score;
  texts.push({ x: e.x, y: e.y - e.r, s: '+' + e.score, life: 0.9, col: '#fff' });
  e.type === 'rock' || e.type === 'bug' ? sfx.pop() : sfx.boom();
  if (e.type === 'rock' && e.size > 1)
    for (let i = 0; i < 2; i++) { const k = makeEnemy('rock', e.x + rnd(-10, 10), e.y + rnd(-10, 10), e.size - 1); k.spawn = 0; }
  const chance = { rock: 0.1, bug: 0.08, alien: 0.25, robot: 0.4 }[e.type];
  if (e.drops && Math.random() < chance) dropPickup(e.x, e.y);
}
function dropPickup(x, y) {
  let kind;
  if (P.hp < P.maxHp && Math.random() < 0.35) kind = 'heart';
  else kind = pick(['triple', 'rapid', 'bomb']);
  pickups.push({ x, y, kind, life: 12, t: 0 });
}

// ===== Boss: the Mothership =====
const BOSS_R = 150;
function startBoss() {
  spawnQ = [];
  const bx = P.x < W / 2 ? W * 0.68 : W * 0.32;
  boss = { x: bx, y: H / 2, rot: 0, phase: 0, enter: 3, core: 120, coreMax: 120, flash: 0, t: 0,
    spiral: 0, cool: 0, ringT: 3, bugT: 8, dying: 0,
    guns: Array.from({ length: 6 }, (_, i) => ({ ang: i * TAU / 6, hp: 14, max: 14, cool: rnd(1, 3), flash: 0, dead: false, x: 0, y: 0, aim: 0 })) };
  banner = { title: 'WARNING: MOTHERSHIP!', hint: 'Blast all 6 cannons, then shoot the glowing core!', t: 4, max: 4 };
  sfx.alarm();
}
function placeGuns(b) {
  for (const g of b.guns) {
    g.x = b.x + Math.cos(g.ang + b.rot) * 135; g.y = b.y + Math.sin(g.ang + b.rot) * 135;
    g.aim = Math.atan2(P.y - g.y, P.x - g.x);
  }
}
function updateBoss(dt) {
  const b = boss;
  b.t += dt; if (b.flash > 0) b.flash -= dt;
  placeGuns(b);
  if (b.enter > 0) { b.enter -= dt; return; }
  if (b.dying > 0) {
    b.dying -= dt; shake = Math.max(shake, 8);
    if (Math.random() < 0.3) { const a = rnd(0, TAU), r = rnd(0, BOSS_R); explode(b.x + Math.cos(a) * r, b.y + Math.sin(a) * r, pick(['#ff4af0', '#ffcc33', '#fff']), 20, 200); sfx.pop(); }
    if (b.dying <= 0) {
      explode(b.x, b.y, '#ff4af0', 150, 800); explode(b.x, b.y, '#ffcc33', 150, 600);
      rings.push({ x: b.x, y: b.y, r: 0, max: 700, life: 0.5 }); flashT = 0.4; shake = 25; sfx.boom();
      boss = null; win();
    }
    return;
  }
  b.rot += (b.phase ? 0.5 : 0.22) * dt;
  const alive = b.guns.filter(g => !g.dead);
  if (b.phase === 0) {
    for (const g of alive) {
      if (g.flash > 0) g.flash -= dt;
      g.cool -= dt;
      if (g.cool <= 0 && !P.dead) { g.cool = rnd(1.8, 2.8) * (0.45 + alive.length / 11); shootE(g.x, g.y, g.aim, 270, 'laser'); sfx.eshoot(); }
    }
    if (!alive.length) {
      b.phase = 1;
      banner = { title: 'THE CORE IS OPEN!', hint: 'Shoot the glowing middle! Watch out, it moves now.', t: 3, max: 3 };
      sfx.alarm();
    }
  } else {
    // drift toward the robot
    const dx = P.x - b.x, dy = P.y - b.y, d = hyp(dx, dy) || 1;
    b.x = clamp(b.x + dx / d * 40 * dt, BOSS_R + 40, W - BOSS_R - 40);
    b.y = clamp(b.y + dy / d * 40 * dt, BOSS_R + 40, H - BOSS_R - 40);
    // spinning spiral of orbs: 4 seconds on, 2 seconds off so you can breathe
    if (b.t % 6 < 4) {
      b.cool -= dt;
      if (b.cool <= 0) { b.cool = 0.18; b.spiral += 0.35; for (const o of [0, Math.PI]) shootE(b.x, b.y, b.spiral + o, 200, 'orb'); }
    }
    if (b.core < b.coreMax / 2) {
      b.ringT -= dt;
      if (b.ringT <= 0) { b.ringT = 3.5; for (let i = 0; i < 16; i++) shootE(b.x, b.y, i * TAU / 16 + b.t, 170, 'orb'); sfx.eshoot(); }
    }
  }
  // sends out bugs to help it
  b.bugT -= dt;
  if (b.bugT <= 0) {
    b.bugT = b.phase ? 6 : 9;
    if (enemies.length < 6) for (let i = 0; i < 2; i++) {
      const a = rnd(0, TAU), e = makeEnemy('bug', b.x + Math.cos(a) * (BOSS_R + 30), b.y + Math.sin(a) * (BOSS_R + 30));
      e.score = 10; e.drops = Math.random() < 0.5;

// ===== Update =====
function updatePlayer(dt) {
  if (P.dead) return;
  let mx = 0, my = 0;
  if (keys.a) mx -= 1; if (keys.d) mx += 1; if (keys.w) my -= 1; if (keys.s) my += 1;
  if (stickL.on) { mx = stickL.x; my = stickL.y; }
  const m = hyp(mx, my);
  if (m > 1) { mx /= m; my /= m; }
  const k = Math.min(1, 10 * dt);
  P.vx += (mx * 340 - P.vx) * k; P.vy += (my * 340 - P.vy) * k;
  P.x = clamp(P.x + P.vx * dt, P.r, W - P.r); P.y = clamp(P.y + P.vy * dt, P.r, H - P.r);
  P.moving = m > 0.1;

  // aim: right stick, then arrow keys, then the mouse
  let fire = false, ax = 0, ay = 0;
  if (keys.arrowleft) ax -= 1; if (keys.arrowright) ax += 1; if (keys.arrowup) ay -= 1; if (keys.arrowdown) ay += 1;
  if (stickR.on && hyp(stickR.x, stickR.y) > 0.25) { P.aim = Math.atan2(stickR.y, stickR.x); fire = true; }
  else if (ax || ay) { P.aim = Math.atan2(ay, ax); fire = true; }

  P.cool -= dt;
  if (fire && P.cool <= 0) {
    P.cool = P.rapid > 0 ? 0.075 : 0.15;
    const gx = P.x + Math.cos(P.aim) * 32, gy = P.y + 2 + Math.sin(P.aim) * 32;
    for (const o of P.triple > 0 ? [-0.18, 0, 0.18] : [0]) {
      const a = P.aim + o;
      bullets.push({ x: gx, y: gy, vx: Math.cos(a) * 850, vy: Math.sin(a) * 850, r: 5, dmg: 1, life: 1.1 });
    }
    sfx.shoot();
  }

}
function step(dt) {

    if (spawnT <= 0) { spawnT = rnd(0.4, 0.9); const [x, y] = spawnPoint(); makeEnemy(spawnQ.shift(), x, y); }
  }
  updateEnemies(dt);
  if (boss) updateBoss(dt);

  // robot lasers
  for (const b of bullets) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0 || b.x < 0 || b.y < 0 || b.x > W || b.y > H) { b.dead = true; continue; }
    if (boss && hitBoss(b)) { b.dead = true; spark(b.x, b.y, '#7ff'); continue; }
    for (const e of enemies) {
      if (e.dead || e.spawn > 0 || hyp(b.x - e.x, b.y - e.y) > e.r + b.r) continue;
      damage(e, b.dmg); b.dead = true; spark(b.x, b.y, '#7ff'); break;

  // enemy shots

    if (b.life <= 0 || b.x < -50 || b.y < -50 || b.x > W + 50 || b.y > H + 50) { b.dead = true; continue; }
    if (!P.dead && hyp(b.x - P.x, b.y - P.y) < b.r + P.r * 0.7) { b.dead = true; hurt(); }
  }
  ebullets = ebullets.filter(b => !b.dead);

  // bumping into things

      else if (p.kind === 'rapid') P.rapid = 10;
      else P.bombs = Math.min(3, P.bombs + 1);

    }
  }
  pickups = pickups.filter(p => p.life > 0);

  // wave finished?
  if (!boss && !spawnQ.length && !enemies.length && !P.dead && state === 'play') {
    if (clearT === 0) {
      banner = { title: 'WAVE CLEAR!', hint: P.hp < P.maxHp ? '+1 HEART' : 'NICE SHOOTING!', t: 2, max: 2 };

  }
  ctx.strokeStyle = 'rgba(34,232,255,' + (0.35 + 0.15 * Math.sin(clock * 3)) + ')';
  ctx.lineWidth = 4; ctx.setLineDash([24, 16]); ctx.strokeRect(0, 0, W, H); ctx.setLineDash([]);
  for (const p of pickups) drawPickup(p);
  if (boss) drawBoss();
  for (const e of enemies) drawEnemy(e);
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (const b of bullets) {
    ctx.strokeStyle = '#2ad8ff'; ctx.lineWidth = 8; ctx.globalAlpha = 0.4;
    ctx.beginPath(); ctx.moveTo(b.x - b.vx * 0.025, b.y - b.vy * 0.025); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.strokeStyle = '#dff'; ctx.lineWidth = 3; ctx.globalAlpha = 1; ctx.stroke();
  }
  for (const b of ebullets) {
    if (b.kind === 'laser') {
      ctx.strokeStyle = '#ff3030'; ctx.lineWidth = 9; ctx.globalAlpha = 0.5;
      ctx.beginPath(); ctx.moveTo(b.x - b.vx * 0.04, b.y - b.vy * 0.04); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.strokeStyle = '#ffd0d0'; ctx.lineWidth = 3; ctx.globalAlpha = 1; ctx.stroke();
    } else {
      ctx.fillStyle = b.kind === 'goo' ? '#3cff6a' : '#ff4af0'; ctx.globalAlpha = 0.5; circle(b.x, b.y, b.r + 4); ctx.fill();
      ctx.globalAlpha = 1; circle(b.x, b.y, b.r); ctx.fill();
      ctx.fillStyle = '#fff'; circle(b.x, b.y, b.r * 0.4); ctx.fill();
    }
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  if (P && !P.dead && state !== 'win') drawBot(P.x, P.y, P.aim, P.moving, P.inv > 0 && (clock * 12 | 0) % 2);
  if (P && state === 'win') drawBot(P.x, P.y + Math.sin(clock * 5) * 6, -Math.PI / 2, true, false);
  for (const p of parts) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.col; ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s); }
  ctx.globalAlpha = 1;
  for (const r of rings) {
    ctx.strokeStyle = 'rgba(220,180,255,' + (r.life / 0.5) + ')'; ctx.lineWidth = 12;
    circle(r.x, r.y, r.r); ctx.stroke();
  }
  for (const t of texts) {
    ctx.globalAlpha = Math.min(1, t.life * 2);
    ctx.font = '12px ' + PF; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 4; ctx.strokeStyle = '#000'; ctx.strokeText(t.s, t.x, t.y); ctx.fillStyle = t.col; ctx.fillText(t.s, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}
function drawArrows() {
  const list = enemies.filter(e => e.spawn <= 0).map(e => [e.x, e.y, COLORS[e.type]]);
  if (boss) list.push([boss.x, boss.y, '#ff4af0']);
  for (const [x, y, col] of list) {
    const sx = (x - camX) * zoom, sy = (y - camY) * zoom;
    if (sx > 0 && sx < cw && sy > 0 && sy < ch) continue;
    const ax = clamp(sx, 20, cw - 20), ay = clamp(sy, 20, ch - 20), a = Math.atan2(sy - ch / 2, sx - cw / 2);
    ctx.save(); ctx.translate(ax, ay); ctx.rotate(a);
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-6, -7); ctx.lineTo(-6, 7); ctx.fill();
    ctx.restore();
  }
}
function drawHUD() {
  for (let i = 0; i < P.maxHp; i++) drawHeart(26 + i * 28, 26, 2, i < P.hp ? '#ff3b5c' : '#3a2030');
  txt('SCORE ' + score, cw - 16, 24, 14, '#fff', 'right');
  let y = 56;
  txt('BOMBS ' + P.bombs + (isTouch ? '' : ' (SPACE)'), 16, y, 10, '#b65cff', 'left');
  if (P.triple > 0) { y += 20; txt('TRIPLE SHOT ' + Math.ceil(P.triple), 16, y, 10, '#ff9a2a', 'left'); }
  if (P.rapid > 0) { y += 20; txt('RAPID FIRE ' + Math.ceil(P.rapid), 16, y, 10, '#ffe14a', 'left'); }
  if (boss) {
    const bw = Math.min(420, cw - 40), bx = (cw - bw) / 2, by = isTouch ? 60 : 50;
    let frac, label;
    if (boss.phase === 0) { frac = boss.guns.reduce((s, g) => s + Math.max(0, g.hp), 0) / (6 * 14); label = 'MOTHERSHIP CANNONS ' + boss.guns.filter(g => !g.dead).length + '/6'; }
    else { frac = Math.max(0, boss.core) / boss.coreMax; label = 'MOTHERSHIP CORE'; }
    txt(label, cw / 2, by - 14, 10, '#ff4af0');
    ctx.fillStyle = '#200818'; ctx.fillRect(bx, by, bw, 12);
    ctx.fillStyle = '#ff4af0'; ctx.fillRect(bx, by, bw * frac, 12);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(bx, by, bw, 12);
  } else if (waveIdx < WAVES.length) {
    txt('WAVE ' + (waveIdx + 1) + '/' + WAVES.length, cw / 2, 24, 12, '#22e8ff');
    const left = enemies.length + spawnQ.length;
    if (left) txt('ENEMIES LEFT: ' + left, cw / 2, 46, 9, '#aaa');
  }
  if (banner) {
    const k = banner.t / banner.max, a = Math.min(1, banner.t * 2, (1 - k) * banner.max * 3);
    ctx.globalAlpha = a;
    txt(banner.title, cw / 2, ch * 0.32, Math.min(28, cw / 18), '#ffcc33');
    txt(banner.hint, cw / 2, ch * 0.32 + 40, Math.min(12, cw / 40), '#fff');
    ctx.globalAlpha = 1;
  }
}
function drawStars() {
  for (const s of stars) {
    const x = ((s.x * cw - camX * zoom * s.f) % cw + cw) % cw, y = ((s.y * ch - camY * zoom * s.f) % ch + ch) % ch;
    ctx.globalAlpha = 0.5 + 0.5 * Math.sin(clock * 2 + s.tw);
    ctx.fillStyle = '#fff'; ctx.fillRect(x, y, s.s, s.s);
  }
  ctx.globalAlpha = 1;
}
function dim() { ctx.fillStyle = 'rgba(0,0,10,.6)'; ctx.fillRect(0, 0, cw, ch); }
function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#02030a'; ctx.fillRect(0, 0, cw, ch);
  if (state === 'title') {
    camX = W / 2 - vw / 2 + Math.sin(clock * 0.15) * 400; camY = W / 2 - vh / 2 + clock * 30;
    drawStars();
    const s = Math.min(3, cw / 260);
    ctx.save(); ctx.translate(cw / 2, ch * 0.3 + Math.sin(clock * 2) * 8); ctx.scale(s, s);
    drawBot(0, 0, Math.sin(clock) * 0.6 - 0.3, true, false); ctx.restore();
    txt('STAR BOT', cw / 2, ch * 0.3 + 100, Math.min(48, cw / 9), '#22e8ff');
    txt('Save the galaxy from the alien mothership!', cw / 2, ch * 0.3 + 150, Math.min(12, cw / 45), '#fff');
    const lines = isTouch
      ? ['LEFT STICK: MOVE', 'RIGHT STICK: AIM AND SHOOT', 'BOMB BUTTON: BLAST EVERYTHING NEARBY']
      : ['MOVE: W A S D', 'AIM: MOUSE    SHOOT: CLICK (OR ARROW KEYS)', 'BOMB: SPACE    PAUSE: P    SOUND: M'];
    lines.forEach((l, i) => txt(l, cw / 2, ch * 0.3 + 200 + i * 26, Math.min(11, cw / 50), '#9ab'));
    if ((clock * 2 | 0) % 2) txt(isTouch ? 'TAP TO START' : 'PRESS ENTER OR CLICK TO START', cw / 2, ch * 0.3 + 300, Math.min(14, cw / 36), '#ffcc33');
    if (bestTime) txt('BEST TIME ' + fmtTime(bestTime), cw / 2, ch - 30, 10, '#ff4af0');
    return;
  }
  if (P.dead) { /* camera stays where you blew up */ }
  else {
    camX = vw >= W ? (W - vw) / 2 : clamp(P.x - vw / 2, -60, W - vw + 60);
    camY = vh >= H ? (H - vh) / 2 : clamp(P.y - vh / 2, -60, H - vh + 60);
  }
  drawStars();
  ctx.save(); ctx.scale(zoom, zoom);
  ctx.translate(-camX + (shake ? rnd(-shake, shake) : 0), -camY + (shake ? rnd(-shake, shake) : 0));
  drawWorld();
  ctx.restore();
  if (flashT > 0) { ctx.fillStyle = 'rgba(255,255,255,' + Math.min(0.7, flashT * 3) + ')'; ctx.fillRect(0, 0, cw, ch); }
  if (state === 'play' || state === 'pause') { drawArrows(); drawHUD(); }
  const big = Math.min(32, cw / 16), small = Math.min(12, cw / 40);
  if (state === 'pause') {
    dim(); txt('PAUSED', cw / 2, ch * 0.4, big, '#22e8ff');
    txt(isTouch ? 'TAP TO KEEP GOING' : 'PRESS P TO KEEP GOING', cw / 2, ch * 0.4 + 50, small, '#fff');
  } else if (state === 'over') {
    dim(); txt('ROBOT DOWN!', cw / 2, ch * 0.35, big, '#ff3b3b');
    txt('SCORE ' + score, cw / 2, ch * 0.35 + 50, small, '#fff');
    const where = waveIdx < WAVES.length ? 'WAVE ' + (waveIdx + 1) : 'THE MOTHERSHIP';
    if (endT > 1) txt((isTouch ? 'TAP' : 'PRESS ENTER') + ' TO TRY ' + where + ' AGAIN', cw / 2, ch * 0.35 + 100, small, '#ffcc33');
  } else if (state === 'win') {
    ctx.fillStyle = 'rgba(0,0,10,.35)'; ctx.fillRect(0, 0, cw, ch);
    txt('YOU SAVED THE GALAXY!', cw / 2, ch * 0.25, big, '#ffcc33');
    txt('SCORE ' + score + '    TIME ' + fmtTime(playT), cw / 2, ch * 0.25 + 50, small, '#fff');
    if (newBest) txt('NEW BEST TIME!', cw / 2, ch * 0.25 + 80, small, '#ff4af0');
    else txt('BEST TIME ' + fmtTime(bestTime), cw / 2, ch * 0.25 + 80, small, '#ff4af0');
    if (endT > 1) txt((isTouch ? 'TAP' : 'PRESS ENTER') + ' TO PLAY AGAIN', cw / 2, ch * 0.25 + 130, small, '#22e8ff');
  }
}

// ===== Main loop =====
let last = performance.now(), touchShown = false;
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  update(dt); draw();
  for (const k in pressed) delete pressed[k];
  const show = isTouch && (state === 'play' || state === 'pause');
  if (show !== touchShown) { touchShown = show; touchEl.style.display = show ? 'block' : 'none'; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
