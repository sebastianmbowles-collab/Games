<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Alien Assault</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#gl,#hud{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#gl{image-rendering:pixelated;image-rendering:crisp-edges}
#touch{display:none;position:absolute;inset:0;pointer-events:none}
.tb{position:absolute;width:74px;height:74px;border-radius:50%;background:rgba(40,140,255,.18);border:2px solid rgba(140,210,255,.6);color:#dff3ff;font:bold 12px monospace;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:auto;touch-action:none}
.tb.sm{width:56px;height:56px;font-size:10px}
.tb.on{background:rgba(80,190,255,.55)}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="touch">
  <div class="tb" data-k="dashl" style="left:16px;bottom:24px">&#9664;<br>DASH</div>
  <div class="tb" data-k="dashr" style="left:100px;bottom:24px">DASH<br>&#9654;</div>
  <div class="tb" data-k="jump" style="right:16px;bottom:24px">JUMP</div>
  <div class="tb sm" data-k="od" style="right:104px;bottom:20px">OVER<br>DRIVE</div>
  <div class="tb sm" data-k="repair" style="right:28px;bottom:112px">FIX</div>
  <div class="tb sm" data-k="pause" style="left:12px;top:124px">II</div>
</div>
<script type="module" src="/src/alien-assault/main.js"></script>
</body>
</html>
