               user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }

<script>
'use strict';
// TONGUE TIED: Ribbit the frog hunts the Fly Queen. Everything is drawn in code on one canvas.
// The world is 960x540 "game pixels" and is stretched to fit the screen.
const W = 960, H = 540, T = 40;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 1, now = 0;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2), s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr); scale = s * dpr;
}
addEventListener('resize', resize); resize();

const rnd = (a, b) => a + Math.random() * (b - a), clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t;

// ---------------------------------------------------------------- save
const SAVE_KEY = 'tongueTied.v1';
let save = { unlocked: 1, coins: 0, gems: {}, lilies: {}, best: {}, up: { tongue: 0, jump: 0, mask: 0 }, skins: ['blue'],
             skin: 'blue', spent: 0, touch: null, mute: false, intro: false, seen: {}, won: false };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && typeof s === 'object') save = Object.assign(save, s); } catch (e) { /* storage blocked */ }
function store() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* storage blocked */ } }
const countAll = o => Object.values(o).reduce((n, a) => n + a.length, 0);
const gemsLeft = () => countAll(save.gems) - save.spent;
const highScore = () => Object.values(save.best).reduce((n, v) => n + v, 0);

// ---------------------------------------------------------------- sound
let ac = null, master = null, tune = null, musStep = 0, musNext = 0;
function audioInit() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = save.mute ? 0 : 0.5; master.connect(ac.destination);
    setInterval(musicTick, 50);
  } catch (e) { ac = null; }
}
function tone(f0, f1, d, type, vol, at) {
  if (!ac) return;
  const t = ac.currentTime + (at || 0), o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + d);
  g.gain.setValueAtTime(vol || 0.2, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.02);
}
function noise(d, vol, freq) {
  if (!ac) return;
  const n = Math.floor(ac.sampleRate * d), b = ac.createBuffer(1, n, ac.sampleRate), a = b.getChannelData(0);
  for (let i = 0; i < n; i++) a[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = b; f.type = 'lowpass'; f.frequency.value = freq || 1200; g.gain.value = vol || 0.3;
  s.connect(f); f.connect(g); g.connect(master); s.start();
}
const SFX = {
  hop: () => tone(280, 560, 0.12, 'sine', 0.25), mudhop: () => { tone(160, 260, 0.14, 'sine', 0.25); noise(0.1, 0.15, 500); },
  super: () => { tone(200, 1100, 0.35, 'sine', 0.3); tone(400, 1500, 0.3, 'triangle', 0.12); },
  tongue: () => tone(900, 300, 0.09, 'square', 0.1), gulp: () => { tone(420, 140, 0.12, 'sine', 0.3); tone(200, 320, 0.08, 'sine', 0.2, 0.12); },
  coin: () => { tone(988, 988, 0.07, 'square', 0.1); tone(1319, 1319, 0.14, 'square', 0.1, 0.07); },
  gem: () => [0, 1, 2, 3].forEach(i => tone(660 * Math.pow(1.26, i), 660 * Math.pow(1.26, i), 0.12, 'triangle', 0.2, i * 0.07)),
  hurt: () => tone(320, 70, 0.3, 'sawtooth', 0.2), splash: () => noise(0.35, 0.35, 900), stomp: () => tone(220, 60, 0.18, 'square', 0.18),
  mask: () => { tone(300, 300, 0.1, 'sawtooth', 0.12); tone(340, 340, 0.3, 'sawtooth', 0.12, 0.1); },
  maskoff: () => tone(500, 200, 0.25, 'triangle', 0.2), tink: () => tone(1500, 1400, 0.06, 'square', 0.1),
  zip: () => tone(300, 1200, 0.18, 'sawtooth', 0.12), thud: () => { noise(0.2, 0.4, 300); tone(90, 50, 0.2, 'sine', 0.3); },
  heal: () => { tone(523, 523, 0.1, 'triangle', 0.25); tone(784, 784, 0.2, 'triangle', 0.25, 0.1); },
  clear: () => [0, 4, 7, 12, 16].forEach((n, i) => tone(392 * Math.pow(2, n / 12), 392 * Math.pow(2, n / 12), 0.22, 'square', 0.12, i * 0.12)),
  lose: () => [0, -2, -5, -9].forEach((n, i) => tone(330 * Math.pow(2, n / 12), 330 * Math.pow(2, n / 12), 0.25, 'triangle', 0.2, i * 0.2)),
  boss: () => tone(140, 60, 0.5, 'sawtooth', 0.25), click: () => tone(600, 800, 0.05, 'square', 0.08),
};
function sfx(n) { if (ac && SFX[n]) SFX[n](); }
const TUNES = {
  swamp: { step: 0.2, base: 261.63, chords: [0, 0, -3, -3, -7, -7, -5, -5],
           mel: [0, 4, 7, 4, 7, null, 4, null, 9, 12, 9, 4, 9, null, 4, null, 5, 9, 12, 9, 5, null, 9, null, 7, 11, 14, 11, 7, null, 2, null] },
  boss:  { step: 0.15, base: 220, chords: [0, 0, -4, -4, -2, -2, -5, -5],
           mel: [0, 3, 7, 3, 12, null, 7, null, 8, 12, 15, 12, 8, null, 12, null, 10, 14, 17, 14, 10, null, 5, null, 7, 11, 14, 11, 7, null, 4, null] },
};
function music(name) { tune = name ? TUNES[name] : null; musStep = 0; if (ac) musNext = ac.currentTime + 0.1; }
function musicTick() {
  if (!ac || !tune) return;
  while (musNext < ac.currentTime + 0.15) {
    const s = musStep % 32, at = Math.max(0, musNext - ac.currentTime), m = tune.mel[s], ch = tune.chords[s >> 2];
    const hz = n => tune.base * Math.pow(2, n / 12);
    if (m !== null) tone(hz(m), hz(m), tune.step * 0.9, 'square', 0.035, at);
    if (s % 2 === 0) tone(hz(ch - 12), hz(ch - 12), tune.step * 1.2, 'triangle', 0.14, at);
    else tone(hz(ch), hz(ch), tune.step * 0.5, 'triangle', 0.06, at);
    musNext += tune.step; musStep++;
  }
}
function setMute(m) { save.mute = m; if (master) master.gain.value = m ? 0 : 0.5; store(); }

// ---------------------------------------------------------------- levels

const LEVELS = [
  { name: 'Lily Pad Lane', sky: 'day', kind: 'h', power: 'tongue',

  { name: 'Buzz Alley', sky: 'day', kind: 'h', power: 'mask',
    chunks: ['start', 1, 'swarm', 2, 'flies', 'pond', 3, 'swarm2', 'giant', 'wall', 'swarm', 'hookgem', 'mudgem', 'end'],
    signs: [k => `Too many flies! ${k.mask} to wear your FLY MASK. Flies will think you are a fly.`,

  { name: 'Hollow Trunk', sky: 'night', kind: 'v',
    map: [2, '            E', '         ---------', 2, '          h', 2, '  -------  g', '     s', 3, '           ^^', '        ---------', '          s     s', 3,
          '  o', '  -----          f', 2, '              h', 2, '         -------', '           s', 3, '   o o          l', '  ------', 3, '             g', '          -------', '            s', 3, '   1    P'],
    signs: [() => 'Knobs are like ladders. Lick, hold, then ZIP!'] },

const SKY = {
  day:    { wash: ['rgba(150,205,240,.6)', 'rgba(150,205,240,.05)'], hill: ['#d5ebc8', '#bfe0ae'], tree: '#a9d49a', trunk: '#d2b48c' },
  sunset: { wash: ['rgba(245,165,125,.6)', 'rgba(250,215,150,.3)'], hill: ['#f0d0a8', '#e3b890'], tree: '#d9b38c', trunk: '#c9a27e' },

  storm:  { wash: ['rgba(85,68,125,.85)', 'rgba(130,105,160,.65)'], hill: ['#a595c4', '#9080b2'], tree: '#8272a6', trunk: '#8d7f9c', moon: true },
};
const SKINS = {
  blue:    { name: 'Blue',    body: '#93c4ec', belly: '#e6f3fc', spot: '#6fa6d6', cost: 0 },
  green:   { name: 'Green',   body: '#a9d49a', belly: '#eaf6dc', spot: '#84b874', cost: 2 },

const UPS = {
  tongue: { name: 'Longer Tongue', desc: 'Reach further', cost: [40, 80, 140] },
  jump:   { name: 'Springy Legs',  desc: 'Super jump goes higher', cost: [40, 80, 140] },

let L = null, F = null, HAS = {};
const solid = t => t === '#' || t === '=';
const oneway = t => t === '-' || t === 'w';
const watery = t => t === '~' || t === 'w';
function tile(c, r) { if (r < 0) return ' '; if (c < 0 || c >= L.cols || r >= L.rows) return '#'; return L.grid[r][c]; }

function buildLevel(i) {
  const def = LEVELS[i]; let rows;
  if (def.kind === 'h') {
    const R = 16; rows = Array.from({ length: R }, () => []); let col = 0;
    for (const c0 of def.chunks) {
      const ch = typeof c0 === 'number' ? ['   ' + c0 + '   ', '#######'] : CH[c0];
      const n = ch.length, w = Math.max(...ch.map(s => s.length));
      for (let r = 0; r < R; r++) for (let c = 0; c < w; c++) rows[r][col + c] = ' ';
      for (let k = 0; k < n - 1; k++) { const r = 12 - (n - 1) + k; for (let c = 0; c < ch[k].length; c++) rows[r][col + c] = ch[k][c]; }
      for (let c = 0; c < w; c++) {
        const s = ch[n - 1][c] || '#', x = col + c;
        if (s === 'm') { rows[12][x] = 'm'; for (let r = 13; r < R; r++) rows[r][x] = '#'; }
        else if (s === '~' || s === 'p' || s === 'w') { rows[12][x] = s === 'w' ? 'w' : '~'; rows[13][x] = s === 'p' ? 'p' : '~'; rows[14][x] = '~'; rows[15][x] = '#'; }
        else for (let r = 12; r < R; r++) rows[r][x] = '#';
      }
      col += w;
    }
  } else {
    rows = []; const IW = def.iw || 22;
    for (const e of def.map) {
      if (typeof e === 'number') for (let k = 0; k < e; k++) rows.push(('#' + ' '.repeat(IW) + '#').split(''));
      else rows.push(('#' + e.padEnd(IW, ' ').slice(0, IW) + '#').split(''));
    }
    rows.push('#'.repeat(IW + 2).split(''), '#'.repeat(IW + 2).split(''));
  }
  const lv = { i, def, grid: rows, rows: rows.length, cols: rows[0].length, items: [], ents: [], hooks: [], signs: [], drops: [], logs: [], parts: [],
               score: 0, coinsGot: 0, gotG: [], gotL: [], exit: null, start: { x: 80, y: 80 }, camx: 0, camy: 0, shake: 0, deadT: 0, winT: 0, banner: null, boss: null, t: 0, nG: 0, nL: 0 };
  lv.w = lv.cols * T; lv.h = lv.rows * T;
  for (let r = 0; r < lv.rows; r++) for (let c = 0; c < lv.cols; c++) {
    const ch = rows[r][c], x = c * T + T / 2, y = r * T + T / 2; let keep = false;
    switch (ch) {
      case 'P': lv.start = { x: x - 14, y: r * T + T - 28 }; break;
      case 'E': lv.exit = { x, y: y - 6 }; break;
      case 'o': lv.items.push({ t: 'o', x, y, ph: c }); break;
      case 'g': lv.items.push({ t: 'g', x, y, ph: c, idx: lv.nG++ }); break;
      case 'l': lv.items.push({ t: 'l', x, y, ph: c, idx: lv.nL++ }); break;
      case 'f': lv.ents.push({ type: 'fly', x, y, hx: x, hy: y, r: 11, hp: 1, sight: 230, speed: 125, leash: 340, ph: c * 1.7, t: 0 }); break;
      case 'F': lv.ents.push({ type: 'fly', giant: true, x, y, hx: x, hy: y, r: 21, hp: 3, sight: 290, speed: 75, leash: 420, ph: c, t: 0 }); break;
      case 's': lv.ents.push({ type: 'spider', x, y, ay: r * T, r: 13, c, row: r, ph: c * 0.9, t: 0 }); break;
      case 'b': lv.ents.push({ type: 'beetle', x, y: r * T + T - 12, hx: x, r: 14, dir: c % 2 ? 1 : -1 }); break;
      case 'p': lv.ents.push({ type: 'fish', x, y, by: y, r: 13, c, row: r, dir: 1, st: 'swim', t: rnd(1, 2.5), vy: 0, vx: 0 }); rows[r][c] = '~'; keep = true; break;
      case 'h': lv.hooks.push({ x, y }); break;
      case 'L': lv.drops.push({ x, y: r * T, c, row: r, t: 1 + (lv.drops.length * 0.9) % 2.6 }); break;
      case 'K': lv.boss = { type: 'king', x, y, r: 38, hp: 10, max: 10, st: 'hover', t: 0, vx: 0, vy: 0, tx: x, flash: 0, cycle: 0 }; lv.ents.push(lv.boss); break;
      default:
        if (ch >= '1' && ch <= '9') lv.signs.push({ x, y: r * T + T, n: +ch - 1 }); else keep = true;
    }
    if (!keep) rows[r][c] = ' ';
  }
  const prev = L; L = lv;
  for (const e of lv.ents) {
    if (e.type === 'spider') { let rr2 = e.row; while (rr2 - e.row < 4 && tile(e.c, rr2 + 1) === ' ') rr2++; e.len = Math.max(20, (rr2 - e.row) * T - 6); }
    if (e.type === 'fish') { let a = e.c, b = e.c; while (watery(tile(a - 1, e.row))) a--; while (watery(tile(b + 1, e.row))) b++; e.x0 = a * T + 16; e.x1 = (b + 1) * T - 16; }
  }
  for (const d of lv.drops) { let rr2 = d.row + 1; while (rr2 < lv.rows && rr2 - d.row < 18) { const t = tile(d.c, rr2); if (solid(t) || t === 'm' || watery(t)) break; rr2++; } d.gy = rr2 * T; }
  if (lv.boss) { lv.boss.hy = (lv.rows - 2) * T - 330; lv.boss.y = lv.boss.hy; }
  L = prev;
  return lv;

function updFrog(dt) {

  else if (f.mud) { if (inp.jumpP) { f.vy = -450; f.ground = false; sfx('mudhop'); burst(cx, f.y + 26, '#6b4a26', 5); } }

}

function updTongue(dt) {

// ---------------------------------------------------------------- enemies
function updEnts(dt) {
