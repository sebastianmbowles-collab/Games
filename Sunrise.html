}

// ---------- ending ----------
// The ending is a short scene in steps. Some steps wait for Enter.
function startEnding() {
  state = 'ending';
  ending = { step: 0, t: 0, orbY: 0, owlX: 0, owlY: 0 };
  save.done = true;
  writeSave();
  SFX.solve();
}
const ENDING_STEPS = [
  { dur: 5.5 }, // Pip runs home through the forest with the Sun Stone
  { dur: 3 }, // Pip sets the stone at the roots of the old oak
  { dur: 6 }, // the stone rises and the sun comes up
  { dur: 3 }, // the owl lands on a branch
  { wait: true, say: 'Thank you, Pip.' },
  { dur: 5 }, // the owl flies away into the sunrise
  { wait: true, say: 'Professor Feathers never came back. Pip sat beneath the old oak and watched the sun rise. Alone.' },
  { wait: true, extra: true }, // only if all three murals were found
  { wait: true, end: true },
];
function updateEnding(dt) {
  const e = ending;
  let st = ENDING_STEPS[e.step];
  if (st.extra && !save.murals.every(Boolean)) { e.step++; e.t = 0; st = ENDING_STEPS[e.step]; }
  e.t += dt;
  if (st.dur && e.t >= st.dur) { e.step++; e.t = 0; if (e.step === 3) SFX.hoot(); }
  else if (st.wait && e.t > 0.6 && (pressed.start || pressed.jump)) {
    // the first press finishes the typing, the next one moves on
    if (st.say && e.t * 30 < st.say.length) { e.t = st.say.length / 30 + 1; return; }
    if (st.end) { state = 'title'; ending = null; return; }
    e.step++; e.t = 0;
  }
}
function drawEnding() {
  const e = ending, s = e.step, t = e.t;
  const dawnAt = s < 2 ? 0 : s === 2 ? Math.min(1, t / 5) : 1;
  if (s === 0) {
    drawForestScene(t * 70, 0);
    const f = Math.floor(time * 12) % 2 ? frames.runA : frames.runB;
    ctx.drawImage(f, 150, 163);
    drawOrb(160, 155 + Math.round(Math.sin(time * 12)), 4);
    text('Pip carried the Sun Stone home.', W / 2, 10, 8, '#f6ecd8', 'center');
    return;
  }
  // the old oak at sunrise
  drawSky(0, dawnAt);
  if (dawnAt > 0) {
    const sunY = 150 - dawnAt * 90;
    const gl = ctx.createRadialGradient(240, sunY, 2, 240, sunY, 60);
    gl.addColorStop(0, `rgba(255,220,140,${dawnAt * 0.7})`);
    gl.addColorStop(1, 'rgba(255,220,140,0)');
    ctx.fillStyle = gl;
    ctx.fillRect(180, sunY - 60, 120, 120);
  }
  const ls = sceneLayers();
  ctx.globalAlpha = 1;
  for (const l of ls) ctx.drawImage(l.c, 0, 0);
  ctx.fillStyle = `rgba(255,190,120,${dawnAt * 0.35})`;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = mixColor([11, 16, 34], [60, 50, 40], dawnAt);
  ctx.fillRect(0, 172, W, 20);
  // the oak
  ctx.fillStyle = mixColor([20, 16, 12], [70, 46, 26], dawnAt);
  ctx.fillRect(84, 70, 18, 104);
  ctx.fillRect(100, 92, 40, 5);
  ctx.fillRect(70, 166, 46, 8);
  ctx.fillStyle = mixColor([14, 30, 18], [60, 110, 50], dawnAt);
  pixelCircle(ctx, 92, 60, 34);
  pixelCircle(ctx, 62, 74, 22);
  pixelCircle(ctx, 124, 70, 24);
  // the stone, then the sun
  let orbX = 112, orbY = 164;
  if (s === 2) { orbX = lerp(112, 240, Math.min(1, t / 5)); orbY = lerp(164, 60, Math.min(1, t / 5)); }
  if (s >= 3) { orbX = 240; orbY = 60; }
  const r = s >= 2 ? Math.round(lerp(4, 16, s === 2 ? Math.min(1, t / 5) : 1)) : 4;
  drawOrb(Math.round(orbX), Math.round(orbY), r);
  ctx.save();
  ctx.translate(128, 175);
  ctx.scale(-1, 1);
  ctx.drawImage(s === 1 ? frames.stand : frames.stand, -8, -12);
  ctx.restore();
  // the owl
  if (s >= 3 && s <= 5) {
    let ox = 130, oy = 84;
    if (s === 3) { ox = lerp(340, 130, Math.min(1, t / 2.5)); oy = lerp(10, 84, Math.min(1, t / 2.5)); }
    if (s === 5) { ox = lerp(130, 250, Math.min(1, t / 5)); oy = lerp(84, 55, Math.min(1, t / 5)); }
    const sc = s === 5 ? Math.max(0.2, 1 - t / 5) : 1;
    ctx.save();
    ctx.translate(Math.round(ox), Math.round(oy));
    ctx.scale(sc, sc);
    ctx.drawImage(owlSprite, -6, -6);
    ctx.restore();
  }
  if (s === 1) wrap('At the roots of the old oak, Pip set down the stone.', 34).forEach((ln, k) => text(ln, W / 2, 8 + k * 11, 8, '#f6ecd8', 'center'));
  const st = ENDING_STEPS[s];
  if (st.say) {
    const lines = wrap(st.say, 34);
    ctx.fillStyle = 'rgba(4,6,18,0.7)';
    ctx.fillRect(0, 0, W, 16 + lines.length * 11);
    const shown = Math.floor(t * 30);
    let left = shown;
    lines.forEach((ln, k) => { text(ln.slice(0, Math.max(0, left)), W / 2, 8 + k * 11, 8, '#f6ecd8', 'center'); left -= ln.length + 1; });
  }
  if (st.extra) {
    ctx.fillStyle = 'rgba(4,6,18,0.85)';
    ctx.fillRect(0, 0, W, H);
    const gl = ctx.createRadialGradient(160, 84, 4, 160, 84, 70);
    gl.addColorStop(0, 'rgba(255,210,110,0.6)');
    gl.addColorStop(1, 'rgba(255,210,110,0)');
    ctx.fillStyle = gl;
    ctx.fillRect(90, 14, 140, 140);
    drawOrb(160, 84, 40);
    ctx.globalAlpha = 0.6 + Math.sin(time * 2) * 0.25;
    ctx.save();
    ctx.translate(160, 96);
    ctx.scale(2, 2);
    ctx.drawImage(sprite(BODY.concat(LEGS.stand), 16, 12, '#fffbe8'), -8, -12);
    ctx.restore();
    ctx.globalAlpha = 1;
    wrap('Deep inside the Sun Stone, a small light glows. It is shaped like a fox.', 36).forEach((ln, k) => text(ln, W / 2, 142 + k * 11, 8, '#f6ecd8', 'center'));
  }
  if (st.end) {
    ctx.fillStyle = 'rgba(4,6,18,0.55)';
    ctx.fillRect(0, 40, W, 80);
    text('THE END', W / 2, 52, 16, '#ffc86b', 'center');
    text('Coins ' + coins + '   Murals ' + save.murals.filter(Boolean).length + '/3', W / 2, 80, 8, '#f6ecd8', 'center');
    if (Math.floor(time * 2) % 2) text('ENTER', W / 2, 100, 8, '#c9a24a', 'center');
  }
  if (st.wait && t > 0.6 && !st.end && Math.floor(time * 2) % 2) text('ENTER', W - 8, H - 12, 8, '#c9a24a', 'right');
}

// ---------- render ----------
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (state === 'intro') { drawIntro(); return; }
  if (state === 'ending') { drawEnding(); return; }
  if (state === 'title') {
    if (!level || level.index !== 0) loadLevel(0);
    const cx = Math.round((Math.sin(time * 0.08) * 0.5 + 0.5) * 300);
    drawBackground(cx);
    drawTiles(cx);
    drawTorch(cx);
    drawCoins(cx);
    applyLight(cx, false);
    ctx.fillStyle = 'rgba(4,6,18,0.45)';
    ctx.fillRect(0, 0, W, H);
    text('SUNRISE', W / 2, 40, 24, '#ffc86b', 'center');
    text('A fox. A temple.', W / 2, 78, 8, '#c9d1f0', 'center');
    text('An endless night.', W / 2, 90, 8, '#c9d1f0', 'center');
    const hasSave = save && (save.checkpoint > 0 || save.coins > 0);
    if (hasSave) {
      if (Math.floor(time * 2) % 2 === 0) text('ENTER  CONTINUE (LEVEL ' + (save.checkpoint + 1) + ')', W / 2, 118, 8, '#f6ecd8', 'center');
      text('N  NEW GAME', W / 2, 132, 8, '#c9d1f0', 'center');
    } else if (Math.floor(time * 2) % 2 === 0) text('PRESS ENTER', W / 2, 124, 8, '#f6ecd8', 'center');
    text('ARROWS/WASD MOVE  SPACE JUMP', W / 2, 160, 8, '#8a93b8', 'center');
    text('UP CLIMB  DOWN DIG  G GRAB', W / 2, 172, 8, '#8a93b8', 'center');
    return;
  }
  let cx = Math.round(cam.x);
  if (shake > 0) ctx.setTransform(1, 0, 0, 1, Math.round((Math.random() - 0.5) * 3), Math.round((Math.random() - 0.5) * 3));
  drawBackground(cx);
  drawTiles(cx);
  for (const b of blocks) drawBlock(b, cx);
  drawTorch(cx);
  if (level.orb) drawOrb(level.orb.x - cx, level.orb.y + Math.round(Math.sin(time * 2) * 2), 7);
  drawCoins(cx);
  drawRocks(cx);
  drawEnemies(cx);
  drawPip(cx);
  drawDarts(cx);
  drawParticles(cx);
  drawFront(cx);
  applyLight(cx, true);
  drawOwl(cx);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (flash > 0) { ctx.fillStyle = `rgba(255,60,40,${flash})`; ctx.fillRect(0, 0, W, H); }
  drawPrompt(cx);

  drawHUD();
  if (banner > 0 && !dialog && !paused) {
    ctx.globalAlpha = Math.min(1, banner);
    text('LEVEL ' + (level.index + 1), W / 2, 60, 16, '#ffc86b', 'center');
    text(level.name.toUpperCase(), W / 2, 84, 8, '#c9d1f0', 'center');
    ctx.globalAlpha = 1;
  }
  if (toast) text(toast.text, W / 2, 24, 8, '#ff9ac0', 'center');
  if (restartAsk > 0 && state === 'play') text('PRESS R AGAIN TO RESTART (-1 LIFE)', W / 2, 24, 8, '#ffb08a', 'center');
  if (dialog) drawDialog();
  if (state === 'done' && doneT > 0.8) {
    const got = level.coins.filter(c => c.got).length;
    ctx.globalAlpha = Math.min(1, (doneT - 0.8) * 2);
    centerBox(48, 84);
    text('TORCH LIT!', W / 2, 58, 16, '#ffc86b', 'center');
    text('Level ' + (level.index + 1) + ' complete', W / 2, 84, 8, '#f6ecd8', 'center');
    text('Coins ' + got + '/' + level.coins.length, W / 2, 98, 8, '#f2c94c', 'center');
    if (doneT > 1.5 && Math.floor(time * 2) % 2 === 0) text('ENTER: KEEP GOING', W / 2, 116, 8, '#c9d1f0', 'center');
    ctx.globalAlpha = 1;
  }
  if (state === 'out') {
    ctx.fillStyle = 'rgba(4,6,18,0.6)';
    ctx.fillRect(0, 0, W, H);
    text('OUT OF LIVES', W / 2, 76, 16, '#ff8a6b', 'center');
    text('Back to the checkpoint: level ' + (Math.floor(level.index / 3) * 3 + 1), W / 2, 102, 8, '#c9d1f0', 'center');
  }
  if (state === 'mural') drawMuralView();
  if (paused) {
    ctx.fillStyle = 'rgba(4,6,18,0.75)';
    ctx.fillRect(0, 0, W, H);
    text('PAUSED', W / 2, 24, 16, '#f6ecd8', 'center');
    const help = ['ARROWS/WASD  move', 'UP/SPACE    jump, swim', 'UP          climb vines', 'DOWN        dig, dive', 'G           grab block, turn vine', 'H           ask the owl (5 coins)', 'R R         restart room (-1 life)', 'M           sound on/off'];
    help.forEach((h, k) => text(h, 36, 52 + k * 12, 8, '#c9d1f0'));
    text('MURALS FOUND ' + save.murals.filter(Boolean).length + '/3', W / 2, 156, 8, '#c9a24a', 'center');
    text('P or ESC to keep going', W / 2, 172, 8, '#8a93b8', 'center');
  }
  if (snd.muted) text('MUTE', W - 5, 180, 8, '#8a93b8', 'right');
  const black = Math.max(fadeIn > 0 ? fadeIn / 0.5 : 0, leaving > 0 ? 1 - leaving / 0.4 : 0);
  if (black > 0) { ctx.fillStyle = `rgba(0,0,0,${black})`; ctx.fillRect(0, 0, W, H); }
}

// a little key picture above Pip when there is something to do right here
function drawPrompt(cx) {
  const p = pip;
  if (state !== 'play' || dialog || paused || p.dying > 0 || p.climbing || Math.abs(p.vx) > 20 || !(p.onGround || inWater(p))) return;
  let key = null;
  if (blockAhead(p, p.face, 6)) key = 'G';
  else if (turnCandidates(p).some(c => pieceAt(c[0], c[1]))) key = 'G';
  else if (p.onGround && tileAt(Math.floor((p.x + p.w / 2) / TILE), Math.floor((p.y + p.h + 1) / TILE)) === 'D') key = 'v';
  else if (onVine(p)) key = '^';
  if (!key) return;
  const x = Math.round(p.x + p.w / 2 - cx) - 5, y = Math.round(p.y) - 16 + Math.round(Math.sin(time * 4));
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = '#2a2418';
  ctx.fillRect(x, y, 11, 11);
  ctx.fillStyle = '#f6ecd8';
  ctx.fillRect(x + 1, y + 1, 9, 9);
  ctx.fillStyle = '#2a2418';
  if (key === 'G') { ctx.font = `8px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillText('G', x + 2, y + 2); }
  else {
    const up = key === '^';
    for (let k = 0; k < 3; k++) ctx.fillRect(x + 5 - k, y + (up ? 3 + k : 7 - k), 1 + k * 2, 1);
    ctx.fillRect(x + 5, y + (up ? 5 : 3), 1, 3);
  }
  ctx.globalAlpha = 1;
}

// ---------- loop ----------
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000);
  last = now;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  render();
  requestAnimationFrame(frame);
}

if (!save || !save.murals) save = { checkpoint: 0, coins: 0, murals: [false, false, false], owl: {} };
if (!save.owl) save.owl = {};
loadLevel(0);
// a handle for testing from the browser console
window.sunrise = {
  get pip() { return pip; }, get level() { return level; }, get state() { return state; }, get blocks() { return blocks; },
  get enemies() { return enemies; }, get darts() { return darts; }, get lives() { return lives; }, get coins() { return coins; }, get dialog() { return dialog; },
  get pieces() { return pieces; }, LEVELS, startLevel: i => { lives = 3; startLevel(i); }, setCoins: c => { coins = c; },
  closeDialog: () => { dialog = null; owl = null; }, startEnding,
  hurtLog,
  freeze: (v, camX) => { frozen = v; if (camX !== undefined) cam.x = camX; }, get save() { return save; },
};
requestAnimationFrame(frame);
</script>
</body>
</html>
