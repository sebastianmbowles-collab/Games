<!doctype html>
<html lang="en">
<head>
<title>Ivy's Dessert Quest</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Ivy and the Quest for More Dessert.
   One canvas draws the world. One overlay panel (#ui) shows every menu and cutscene. */
:root{
  --pink:#ff7eb6;
  --pink-dark:#c2457f;
  --cream:#fff6e9;
  --choc:#5a3420;
  --mint:#3fc4a0;
  --mint-dark:#23866b;
  --gold:#ffd23f;
  --night:#2a1838;
  --font:'Fredoka','Comic Sans MS','Chalkboard SE',system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--night);overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);color:var(--choc)}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#c{display:block;background:#000;border-radius:6px}
#ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;box-sizing:border-box;background:rgba(42,24,56,.55);z-index:5}
#ui.cut{align-items:flex-end;background:rgba(42,24,56,.25)}
.card{background:var(--cream);border:5px solid var(--pink-dark);border-radius:26px;box-shadow:0 7px 0 var(--pink-dark),0 20px 50px rgba(0,0,0,.4);padding:18px 22px;max-width:820px;width:100%;max-height:calc(100% - 16px);overflow:auto;text-align:center;box-sizing:border-box}
h1{font-size:clamp(26px,5.5vw,50px);margin:2px 0 6px;color:var(--pink-dark);line-height:1.05;text-shadow:3px 3px 0 #ffd1e6}
h1 small{display:block;font-size:.48em;color:var(--choc);text-shadow:none;margin-bottom:4px}
h2{font-size:clamp(21px,4vw,32px);margin:2px 0 8px;color:var(--pink-dark)}
h3{margin:12px 0 6px;color:var(--choc);font-size:20px}
p{font-size:clamp(15px,2.4vw,19px);line-height:1.4;margin:6px 0}
.btn{font-family:var(--font);font-weight:700;font-size:clamp(16px,2.6vw,20px);border:none;border-radius:999px;padding:10px 22px;margin:5px;background:var(--pink);color:#fff;box-shadow:0 5px 0 var(--pink-dark);cursor:pointer;text-shadow:1px 1px 0 var(--pink-dark)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--pink-dark)}
.btn.mint{background:var(--mint);box-shadow:0 5px 0 var(--mint-dark);text-shadow:1px 1px 0 var(--mint-dark)}
.btn.choc{background:#8a5636;box-shadow:0 5px 0 var(--choc);text-shadow:1px 1px 0 var(--choc)}
.btn.gold{background:#f2b705;box-shadow:0 5px 0 #a87d00;text-shadow:1px 1px 0 #a87d00}
.btn.small{font-size:15px;padding:7px 14px}
.btn[disabled]{filter:grayscale(1);opacity:.6;cursor:not-allowed}
.btn:focus-visible,.lvl:focus-visible,.tab:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.stats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:4px 0 8px}
.chip{background:#fff;border:3px solid var(--choc);border-radius:999px;padding:4px 12px;font-weight:600;font-size:16px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.tab{font-family:var(--font);font-weight:700;font-size:15px;border:3px solid var(--choc);border-radius:14px;padding:6px 10px;background:#fff;color:var(--choc);cursor:pointer}
.tab.on{background:var(--gold)}
.tab[disabled]{opacity:.45;cursor:not-allowed}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.lvl{font-family:var(--font);border:4px solid var(--choc);border-radius:18px;padding:10px 8px;cursor:pointer;font-size:16px;font-weight:600;color:#fff;text-shadow:1px 1px 0 rgba(0,0,0,.55);min-height:96px}
.lvl[disabled]{filter:grayscale(1) brightness(.7);cursor:not-allowed}
.lvl .num{font-size:24px}
.lvl .got{font-size:15px;margin-top:4px;letter-spacing:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:8px 0}
.item{background:#fff;border:3px solid var(--choc);border-radius:16px;padding:8px;font-size:14px;font-weight:600}
.item canvas{display:block;margin:0 auto 4px}
.item.lock{opacity:.5}
.item.wear{background:#fff4c2;border-color:#f2b705}
.cutbox{display:flex;gap:14px;align-items:center;text-align:left;max-width:860px}
.cutbox canvas{flex:0 0 auto;background:#ffe3f0;border-radius:18px;border:3px solid var(--pink-dark)}
.cutbox .who{font-weight:700;color:var(--pink-dark);font-size:20px}
.cutbox p{font-size:clamp(17px,2.6vw,22px)}
.keys{text-align:left;display:inline-block;font-size:16px;line-height:1.6}
kbd{background:#fff;border:2px solid var(--choc);border-bottom-width:4px;border-radius:6px;padding:0 6px;font-family:var(--font);font-size:14px}
#touch{position:fixed;inset:auto 0 0 0;height:0;z-index:4}
.tb{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.28);border:4px solid rgba(255,255,255,.7);color:#fff;font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--font)}
.tb.on{background:rgba(255,126,182,.65)}
#tl{left:14px}#tr{left:104px}#td{left:59px;bottom:calc(100px + env(safe-area-inset-bottom,0px));width:60px;height:60px;font-size:24px}
#tj{right:18px;width:96px;height:96px}#ta{right:124px;width:70px;height:70px;font-size:26px}
#pauseBtn{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:10px;z-index:4;width:46px;height:46px;border-radius:14px;border:3px solid #fff;background:rgba(194,69,127,.85);color:#fff;font-size:20px;font-weight:700;font-family:var(--font);cursor:pointer}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="960" height="560" aria-label="Ivy and the Quest for More Dessert"></canvas></div>
<button id="pauseBtn" hidden aria-label="Pause">II</button>
<div id="touch" hidden>
  <div class="tb" id="tl">◀</div><div class="tb" id="tr">▶</div><div class="tb" id="td">▼</div>
  <div class="tb" id="ta">★</div><div class="tb" id="tj">⤒</div>
</div>
<div id="ui"><div class="card" id="card"></div></div>
<script>
'use strict';
// ================= Core: screen, random numbers, save file, sound =================
const cv=document.getElementById('c');
const MAIN=cv.getContext('2d');
let g=MAIN; // the pen we draw with (swapped when drawing little pictures in menus)
const TS=40, ROWS=14, VW=960, VH=560;
const $=id=>document.getElementById(id);
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const PI2=Math.PI*2;

function fit(){
  const s=Math.min(innerWidth/VW, innerHeight/VH);
  cv.style.width=Math.floor(VW*s)+'px'; cv.style.height=Math.floor(VH*s)+'px';
}
addEventListener('resize',fit); fit();

// Seeded random numbers: the same level always comes out the same.
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for(const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
const pick=(r,arr)=>arr[Math.floor(r()*arr.length)];
const ri=(r,a,b)=>a+Math.floor(r()*(b-a+1));

// ---------- Save ----------
const SAVE_KEY='ivyQuest.v2';
const SAVE0={coins:0,done:{},best:{},spoons:{},stars:{},cards:{},villains:{},secrets:{},
  owned:{ivy:['classic'],seb:['classic']},wear:{ivy:'classic',seb:'classic'},boosts:{},
  players:'ivy',sound:true,music:true,seenIntro:false,beatGame:false,secretEnd:false,world:0};
let save=JSON.parse(JSON.stringify(SAVE0));
try{ const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null'); if(s&&typeof s==='object') save=Object.assign(save,s); }catch(e){}
function persist(){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify(save)); }catch(e){} }
const count=o=>Object.keys(o||{}).length;

// ---------- Sound: little beeps the computer makes ----------
let ac=null, master=null;
function audio(){
  if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); master=ac.createGain(); master.gain.value=.8; master.connect(ac.destination); }catch(e){ return null; } }
  if(ac.state==='suspended') ac.resume();
  return ac;
}
function note(freq,when,dur,type='square',vol=.05,slide=0){
  const a=ac; if(!a) return;
  const o=a.createOscillator(), v=a.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,when);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),when+dur);
  v.gain.setValueAtTime(vol,when); v.gain.exponentialRampToValueAtTime(.0001,when+dur);
  o.connect(v); v.connect(master); o.start(when); o.stop(when+dur+.03);
}
function tone(freq,dur,type='square',vol=.05,delay=0,slide=0){
  if(!save.sound) return; const a=audio(); if(!a) return;
  note(freq,a.currentTime+delay,dur,type,vol,slide);
}
const arp=(fs,step=.07,type='triangle',vol=.07)=>fs.forEach((f,i)=>tone(f,.13,type,vol,i*step));
const sfx={
  jump:()=>tone(330,.14,'square',.045,0,300),
  djump:()=>tone(520,.14,'triangle',.06,0,400),
  coin:()=>{tone(988,.06,'square',.04);tone(1319,.12,'square',.04,.05);},
  yum:()=>{tone(784,.08,'triangle',.08);tone(1046,.12,'triangle',.08,.07);},
  stomp:()=>tone(200,.18,'square',.07,0,-140),
  hurt:()=>{tone(220,.2,'sawtooth',.06,0,-120);tone(160,.25,'sawtooth',.05,.12,-80);},
  boing:()=>tone(180,.3,'sine',.14,0,500),
  power:()=>arp([523,659,784,1046,1318],.06),
  heart:()=>{tone(660,.1,'sine',.1);tone(880,.15,'sine',.1,.1);},
  flag:()=>arp([392,523,659],.08),
  win:()=>arp([523,659,784,659,784,1046],.12,'triangle',.08),
  boss:()=>{tone(110,.5,'sawtooth',.08,0,-60);tone(82,.6,'sawtooth',.06,.2,-40);},
  block:()=>tone(150,.08,'square',.07),
  swim:()=>tone(260,.12,'sine',.06,0,180),
  shield:()=>arp([880,660,440],.05,'sine',.08),
  boost:()=>{tone(120,.4,'sawtooth',.08,0,600);},
  slam:()=>{tone(90,.4,'sawtooth',.1,0,-50);tone(60,.5,'square',.06,.05,-30);},
  secret:()=>arp([523,622,784,1046,1245,1568],.09,'sine',.08),
  shoot:()=>tone(440,.12,'triangle',.04,0,-200),
  bossHit:()=>{tone(300,.15,'square',.08,0,-200);tone(150,.3,'sawtooth',.06,.1,-80);},
  select:()=>tone(660,.07,'triangle',.06),
};

// ---------- Music: a tiny tune that changes for every world ----------
const music={timer:null,step:0,next:0,mel:null,bass:null,spb:.15,seed:0};
function startMusic(seed,boss=false){
  stopMusic(); if(!save.music) return; const a=audio(); if(!a) return;
  const r=mulberry(seed*7+3);
  const root=boss?110:[131,147,165,175,196,220][seed%6];
  const scale=boss?[0,3,5,7,10,12,15]:[0,2,4,7,9,12,14,16];
  const hz=s=>root*2*Math.pow(2,s/12);
  music.mel=[]; let idx=3;
  for(let i=0;i<32;i++){ if(r()<(i%4===0?.9:.45)){ idx=clamp(idx+ri(r,-2,2),0,scale.length-1); music.mel.push(hz(scale[idx])); } else music.mel.push(0); }
  const prog=boss?[0,0,3,5]:[0,5,3,4];
  music.bass=prog.map(d=>root*Math.pow(2,(scale[d%scale.length]-12)/12));
  music.spb=boss?.12:.15; music.step=0; music.next=a.currentTime+.1;
  music.timer=setInterval(()=>{
    if(!ac||!save.music) return;
    while(music.next<ac.currentTime+.3){
      const s=music.step, f=music.mel[s%32];
      if(f) note(f,music.next,music.spb*1.6,'triangle',.028);
      if(s%4===0) note(music.bass[Math.floor(s/8)%4],music.next,music.spb*3,'square',.018);
      if(s%2===1) note(2400,music.next,.03,'square',.006);
      music.step++; music.next+=music.spb;
    }
  },90);
}
function stopMusic(){ clearInterval(music.timer); music.timer=null; }
// ================= Art: everything is drawn with shapes, no pictures needed =================
function circ(x,y,r){ g.beginPath(); g.arc(x,y,r,0,PI2); g.fill(); }
function ell(x,y,rx,ry,rot=0){ g.beginPath(); g.ellipse(x,y,Math.abs(rx),Math.abs(ry),rot,0,PI2); g.fill(); }
function rr(x,y,w,h,r){ g.beginPath(); if(g.roundRect) g.roundRect(x,y,w,h,r); else g.rect(x,y,w,h); g.fill(); }
function poly(pts){ g.beginPath(); pts.forEach(([a,b],i)=>i?g.lineTo(a,b):g.moveTo(a,b)); g.closePath(); g.fill(); }
function fs(c){ g.fillStyle=c; }
function star(x,y,R,r,fill,stroke){ g.beginPath(); for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, k=i%2?r:R; g.lineTo(x+Math.cos(a)*k,y+Math.sin(a)*k); } g.closePath(); fs(fill); g.fill(); if(stroke){ g.strokeStyle=stroke; g.lineWidth=2; g.stroke(); } }
function heart(x,y,s,col){ fs(col); g.beginPath(); g.moveTo(x,y+s*.9); g.bezierCurveTo(x-s*1.4,y-s*.1,x-s*.6,y-s*1.1,x,y-s*.35); g.bezierCurveTo(x+s*.6,y-s*1.1,x+s*1.4,y-s*.1,x,y+s*.9); g.fill(); }
function withCtx(ctx,fn){ const o=g; g=ctx; try{ fn(); } finally { g=o; } }
function outlineText(txt,x,y,col='#fff',size=20,align='center',stroke='#3a2416'){
  g.font=`700 ${size}px Fredoka,sans-serif`; g.textAlign=align; g.lineWidth=Math.max(3,size/5); g.strokeStyle=stroke; g.lineJoin='round';
  g.strokeText(txt,x,y); fs(col); g.fillText(txt,x,y);
}

// ---------- Heroes ----------
const HERO={
  ivy:{name:'Ivy',hair:'#5b3418',eye:'#3b1f10',skin:'#ffd3b0',style:'bob',scale:1},
  seb:{name:'Sebastian',hair:'#6b4423',eye:'#8a7a3a',skin:'#f7c9a3',style:'curly',scale:1.13},
};
const COSTUMES={
  ivy:[
    {id:'classic',name:'Adventure Ivy',price:0,top:'#ff7eb6',topStyle:'tee',bottom:'#8a5cd6',bottomStyle:'skirt',shoes:['#ff4f7b','#fff']},
    {id:'princess',name:'Princess Ivy',price:80,top:'#ffb3e1',topStyle:'dress',bottom:'#ffb3e1',bottomStyle:'gown',shoes:['#fff','#ffd23f'],hat:'tiara'},
    {id:'chef',name:'Baker Ivy',price:100,top:'#ffffff',topStyle:'chef',bottom:'#3b3b4f',bottomStyle:'pants',shoes:['#222','#fff'],hat:'chef'},
    {id:'ninja',name:'Ninja Ivy',price:120,top:'#2b2b3a',topStyle:'tee',bottom:'#2b2b3a',bottomStyle:'pants',shoes:['#111','#e8213a'],hat:'ninja'},
    {id:'astro',name:'Astronaut Ivy',price:150,top:'#f2f2f2',topStyle:'suit',bottom:'#f2f2f2',bottomStyle:'pants',shoes:['#9aa6b2','#fff'],hat:'astro'},
    {id:'unicorn',name:'Unicorn Ivy',price:200,top:'#fff1fb',topStyle:'hoodie',bottom:'#fff1fb',bottomStyle:'pants',shoes:['#ffb3e1','#fff'],hat:'unicorn'},
    {id:'hero',name:'Super Ivy',price:250,top:'#ff4f7b',topStyle:'tee',bottom:'#3a5fb0',bottomStyle:'pants',shoes:['#ffd23f','#fff'],hat:'mask',cape:'#ffd23f'},
  ],
  seb:[
    {id:'classic',name:'Hoodie Sebastian',price:0,top:'#3fae4a',topStyle:'hoodie',bottom:'#3a6fc4',bottomStyle:'jeans',shoes:['#151515','#ffffff'],pixel:true},
    {id:'knight',name:'Knight Sebastian',price:100,top:'#a8b0bd',topStyle:'armor',bottom:'#6b7280',bottomStyle:'pants',shoes:['#4b5563','#a8b0bd'],hat:'knight'},
    {id:'pirate',name:'Pirate Sebastian',price:120,top:'#f2ead8',topStyle:'tee',bottom:'#5a3420',bottomStyle:'pants',shoes:['#151515','#8a5636'],hat:'pirate'},
    {id:'chef',name:'Baker Sebastian',price:100,top:'#ffffff',topStyle:'chef',bottom:'#3b3b4f',bottomStyle:'pants',shoes:['#222','#fff'],hat:'chef'},
    {id:'robot',name:'Robot Sebastian',price:150,top:'#9aa6b2',topStyle:'armor',bottom:'#6b7280',bottomStyle:'pants',shoes:['#374151','#ffd23f'],hat:'robot'},
    {id:'explorer',name:'Explorer Sebastian',price:180,top:'#c9a66b',topStyle:'tee',bottom:'#7a5a32',bottomStyle:'shorts',shoes:['#5a3420','#fff'],hat:'explorer'},
    {id:'hero',name:'Super Sebastian',price:250,top:'#3fae4a',topStyle:'tee',bottom:'#151515',bottomStyle:'pants',shoes:['#e8213a','#fff'],hat:'mask',cape:'#e8213a'},
  ],
};
const costumeOf=(ch,id)=>COSTUMES[ch].find(c=>c.id===id)||COSTUMES[ch][0];

function drawHero(ch,x,y,face,t,state,cos,scale=1,opt={}){
  const H=HERO[ch], C=cos||costumeOf(ch,save.wear[ch]);
  const s=scale*H.scale;
  g.save(); g.translate(x,y); g.scale(face*s,s);
  const run=state==='run', air=state==='jump'||state==='fall', climb=state==='climb', swim=state==='swim';
  const sp=run?t*.35:climb?t*.25:swim?t*.2:0;
  const sw=run?Math.sin(sp)*.65:swim?Math.sin(sp)*.5:0;
  const bob=run?Math.abs(Math.sin(sp))*2:(state==='idle'?Math.sin(t*.06)*.8:0);
  g.translate(0,-bob);
  if(climb) g.scale(-1,1); // seen from the back-ish: just flip
  // cape behind everything
  if(C.cape){ fs(C.cape); const fl=run?Math.sin(sp*2)*3:air?-4:0; poly([[-7,-36],[7,-36],[-4+fl*.3,-12],[-20+fl,-10]]); }
  // hair behind the head
  fs(H.hair);
  if(H.style==='bob'&&C.hat!=='astro'&&C.hat!=='unicorn'&&C.hat!=='ninja'&&C.hat!=='knight'&&C.hat!=='robot'){ rr(-14,-58,20,22,6); }
  if(H.style==='curly'&&C.hat!=='astro'&&C.hat!=='knight'&&C.hat!=='robot'){ for(let i=0;i<5;i++) circ(-11+Math.sin(i*1.7)*2,-56+i*4.2,5.5); }
  if(C.hat==='unicorn'||C.topStyle==='hoodie'&&!C.hat&&false){}
  // legs
  const leg=(ang,dx)=>{ g.save(); g.translate(dx,-18);
    g.rotate(climb?Math.sin(sp+(dx>0?Math.PI:0))*.4:air?(dx<0?.55:-.35):ang);
    const long=C.bottomStyle==='jeans'||C.bottomStyle==='pants'||C.bottomStyle==='gown';
    fs(long?C.bottom:H.skin); g.fillRect(-3.5,0,7,14);
    if(C.bottomStyle==='shorts'){ fs(C.bottom); g.fillRect(-3.5,0,7,6); }
    if(C.bottomStyle==='jeans'){ fs('rgba(255,255,255,.18)'); g.fillRect(-3.5,8,7,1.5); }
    // shoes / runners
    fs(C.shoes[0]); rr(-4.5,12,11,6,3); fs(C.shoes[1]); g.fillRect(-4.5,16,11,2); if(ch==='seb'&&C.id==='classic'){ fs('#fff'); g.fillRect(-1,13,5,1.5);}
    g.restore(); };
  leg(sw,-4); leg(-sw,4);
  // body
  const T=C.top;
  if(C.topStyle==='dress'||C.bottomStyle==='gown'){ fs(T); poly([[-8,-36],[8,-36],[14,-12],[-14,-12]]); fs('rgba(255,255,255,.55)'); g.fillRect(-13,-16,26,2.5); fs('#ffd23f'); circ(0,-30,2); }
  else{
    fs(T); rr(-9.5,-37,19,20,5);
    if(C.bottomStyle==='skirt'){ fs(C.bottom); poly([[-10,-21],[10,-21],[13,-12],[-13,-12]]); }
    else if(C.bottomStyle!=='shorts'){ fs(C.bottom); rr(-9.5,-21,19,5,2); }
    else { fs(C.bottom); rr(-9.5,-21,19,7,2); }
    if(C.topStyle==='hoodie'){
      fs('rgba(0,0,0,.12)'); rr(-9.5,-28,19,6,2); // pocket
      if(C.pixel){ // blocky pixel pattern on the hoodie
        fs('#2f8a3a'); [[-8,-35],[0,-33],[4,-29],[-6,-25],[2,-23]].forEach(([a,b])=>g.fillRect(a,b,4,4));
        fs('#6fd27a'); [[-4,-31],[5,-35],[-8,-29]].forEach(([a,b])=>g.fillRect(a,b,3,3));
      }
      fs('#fff'); g.fillRect(2,-36,1.5,7); g.fillRect(6,-36,1.5,6); // hood strings
      fs(T); ell(-9,-37,7,4,-.3); // hood behind neck
    }
    if(C.topStyle==='armor'){ fs('rgba(255,255,255,.35)'); g.fillRect(-9,-35,18,3); fs('rgba(0,0,0,.2)'); g.fillRect(-9,-27,18,2); }
    if(C.topStyle==='chef'){ fs('#ddd'); circ(3,-32,1.5); circ(3,-26,1.5); }

function drawProj(p){
  if(p.kind==='ginger'){ g.save(); g.translate(p.x,p.y); g.rotate(p.t*.2); fs('#b5652d'); circ(0,-6,6); rr(-5,-1,10,12,4); rr(-10,0,20,5,3); fs('#fff'); circ(-2,-7,1.2); circ(2,-7,1.2); g.restore(); }
  else if(p.kind==='frost'||p.kind==='splat'){ fs('#c56bff'); circ(p.x,p.y,p.r); fs('#fff'); circ(p.x-p.r*.3,p.y-p.r*.3,p.r*.3); }
  else if(p.kind==='bomb'){ fs('#ff8ec2'); circ(p.x,p.y,p.r); fs('#fff'); circ(p.x-3,p.y-4,4); fs('#3a2416'); g.fillRect(p.x-1,p.y-p.r-6,2,6); fs(p.t%6<3?'#ffd23f':'#ff4f7b'); circ(p.x,p.y-p.r-7,3); }
  else if(p.kind==='icicle'){ fs('#c9f2ff'); poly([[p.x-9,p.y-18],[p.x+9,p.y-18],[p.x,p.y+16]]); fs('#fff'); poly([[p.x-4,p.y-16],[p.x,p.y-16],[p.x-1,p.y+4]]); }
  else if(p.kind==='magic'){ star(p.x,p.y,p.r,p.r*.45,['#ff4f7b','#ffd23f','#5ad1ff','#b47cff'][Math.floor(p.t/4)%4],'#fff'); }
  else if(p.kind==='crumb'){ fs('#c9853f'); rr(p.x-p.r,p.y-p.r,p.r*2,p.r*2,3); fs('#8a4b1a'); circ(p.x+2,p.y-1,2); }
  else if(p.kind==='custard'){ fs('#ffe27a'); circ(p.x,p.y,p.r); fs('#c98e00'); circ(p.x+3,p.y+3,p.r*.35); }
  else if(p.kind==='jelly'){ fs('rgba(255,79,123,.85)'); circ(p.x,p.y,p.r); }
  else { fs('#fff'); circ(p.x,p.y,p.r); }
}

function prevLevel(id){ const L=LEVELS[id]; if(L.bonus){ const n=+id.split('-')[1]; return n>1?`${id[0]}-${n-1}`:null; } const i=ORDER.indexOf(id); return i>0?ORDER[i-1]:null; }
function isUnlocked(id){
  const L=LEVELS[id]; if(!L) return false;
  if(L.kind==='secret') return !!save.secrets[L.W.key];
  if(L.bonus){ if(count(save.spoons)<L.W.need) return false; const p=prevLevel(id); return !p||!!save.done[p]; }
  const p=prevLevel(id); return !p||!!save.done[p];
}
function worldUnlocked(wi){ return isUnlocked(`${WORLDS[wi].key}-1`); }

    if(v===1){ A.gnd(x,x+9); A.set(x+4,11,'M'); A.ent(x+4,2,'R'); A.ent(x+7,11,'u'); return 10; }
    return SEG.secretWall(A,x,d,r,'R'); },
  card(A,x,d,r){ A.gnd(x,x+13); A.plat(x+3,9,3); A.plat(x+7,7,3); A.plat(x+10,4,2); A.ent(x+10,3,'Y'); A.ent(x+4,8,'o'); A.ent(x+8,6,'o'); A.ent(x+12,11,'E'); return 14; },
  check(A,x){ A.gnd(x,x+7); A.ent(x+3,11,'C'); A.ent(x+1,10,'o'); A.ent(x+6,10,'o'); return 8; },
  goal(A,x){ A.gnd(x,x+13); A.ent(x+9,11,'>'); A.ent(x+3,11,'u'); A.ent(x+5,11,'u'); return 14; },
  arena(A,x,d,r,boss){ A.gnd(x,x+25); A.fill(x+2,0,x+2,7,'W'); A.fill(x+25,0,x+25,11,'W');
    A.plat(x+6,8,4); A.plat(x+17,8,4);
    if(boss==='melt') A.fill(x+3,12,x+24,12,'I');
    A.ent(x+18,11,'K');
    A.arena={x0:(x+3)*TS,x1:(x+25)*TS,wall:x+2,plats:[[(x+6)*TS,(x+10)*TS,8*TS],[(x+17)*TS,(x+21)*TS,8*TS]],floor:12*TS};
    return 26; },
};
const CORE=['flat','gap','plat','stairs','floaters','prize','bats','hoppers'];
const FEAT={marsh:['marsh','marsh'],water:['water','water','water'],cave:['spiderHall'],ladder:['ladder','ladder'],lava:['lava','lava'],
  turret:['turret','turret'],prize:['prize','prize'],spider:['spiderHall','spiderHall'],gaps:['gap','gap','floaters','floaters'],jungle:['bats','hoppers','bats'],ice:['flat','gap']};

function buildLevel(L){
  const r=mulberry(hashStr(L.id+'!'));
  const d=L.wi>=7?.75:L.wi/6;
  const grid=Array.from({length:ROWS},()=>[]);
  const ents=[];
  const A={
    arena:null,
    set(x,y,ch){ if(y>=0&&y<ROWS&&x>=0) grid[y][x]=ch; },
    gnd(a,b,top=12){ for(let x=a;x<=b;x++) for(let y=top;y<ROWS;y++) A.set(x,y,'#'); },
    fill(x0,y0,x1,y1,ch){ for(let x=x0;x<=x1;x++) for(let y=y0;y<=y1;y++) A.set(x,y,ch); },
    plat(x,y,n){ for(let i=0;i<n;i++) A.set(x+i,y,'='); },
    ent(x,y,ch){ ents.push({x,y,ch}); },
  };
  let segs=[];
  if(L.kind==='rematch') segs=['start','arena'];
  else if(L.kind==='boss') segs=['start',pick(r,CORE),pick(r,CORE),'check','arena'];
  else if(L.kind==='secret') segs=['start','prize','marsh','floaters','prize','spoon','marsh','prize','goal'];
  else {
    let pool=[...CORE]; L.feats.forEach(f=>pool.push(...(FEAT[f]||[])));
    if(L.wi>=5) pool.push('chase','chase');
    if(L.feats.includes('water')) pool=pool.filter(s=>s!=='floaters').concat(['water','water']);
    const n=6+Math.round(d*4);
    const mid=[]; let last='';
    for(let i=0;i<n;i++){ let s; do{ s=pick(r,pool); }while(s===last); mid.push(s); last=s; }
    const ins=(s)=>mid.splice(ri(r,1,mid.length-1),0,s);
    ins('spoon'); ins('star'); ins('card'); if(L.id.endsWith('-2')) ins('door');
    mid.splice(Math.floor(mid.length/2),0,'check');
    segs=['start',...mid,'goal'];
  }
  let x=0;
  for(const s of segs){
    if(s==='spoon') x+=SEG.secretWall(A,x,d,r,'G');
    else if(s==='door') x+=SEG.secretWall(A,x,d,r,'D');
    else if(s==='arena') x+=SEG.arena(A,x,d,r,L.boss);
    else x+=SEG[s](A,x,d,r);
  }
  const w=x;
  for(let y=0;y<ROWS;y++) for(let i=0;i<w;i++) if(!grid[y][i]) grid[y][i]='.';
  const cave=L.feats.includes('cave');
  if(cave) for(let i=0;i<w;i++){ grid[0][i]='#'; grid[1][i]='#'; }
  if(L.feats.includes('ice')) for(let y=2;y<ROWS;y++) for(let i=0;i<w;i++) if(grid[y][i]==='#') grid[y][i]='I';
  if(L.kind==='secret'){ for(let i=3;i<w-3;i+=2) if(grid[12][i]==='#') ents.push({x:i,y:7,ch:'o'}); }
  // fill enemy slots with this world's enemies
  const E=L.W.enemies;
  for(const e of ents){
    if('EJFSTX'.includes(e.ch)){
      let list=E[e.ch]; if(!list||!list.length) list=e.ch==='S'||e.ch==='F'?[]:E.E;
      e.type=list.length?pick(r,list):null;
    }
  }
  return {grid,w,ents:ents.filter(e=>!('EJFSTX'.includes(e.ch))||e.type),arena:A.arena,cave,pal:L.W.pal};
}
// ================= Engine: moving, jumping, bumping, collecting =================
let mode='menu', G=null, t60=0;
const GRAV=.62, RUN=4.3, JUMP=-12.6, DJUMP=-11, BOUNCE=-18.5;
const SOLIDS='#I?!UMW';
function tileAt(x,y){ if(x<0||x>=G.w) return y<0?'.':'#'; if(y<0||y>=ROWS) return '.'; return G.grid[y][x]; }
function solidAt(x,y){ const t=tileAt(x,y); return t!=='.'&&SOLIDS.includes(t); }
function overlap(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
function alivePlayers(){ return G.players.filter(p=>!p.down); }
function nearestPlayer(x,y){ let best=null,bd=1e9; for(const p of alivePlayers()){ const d=Math.abs(p.x+p.w/2-x)+Math.abs(p.y+p.h/2-y)*.5; if(d<bd){bd=d;best=p;} } return best; }

// Move something through the tile world. Returns what it bumped into.
function moveBody(b,oneWay=true){
  const res={wall:false,ground:false,gt:null,bounce:false,head:[]};
  b.x+=b.vx;
  const y0=Math.floor(b.y/TS), y1=Math.floor((b.y+b.h-1)/TS);
  if(b.vx>0){ const tx=Math.floor((b.x+b.w)/TS); for(let ty=y0;ty<=y1;ty++) if(solidAt(tx,ty)){ b.x=tx*TS-b.w-.01; b.vx=0; res.wall=true; break; } }
  else if(b.vx<0){ const tx=Math.floor(b.x/TS); for(let ty=y0;ty<=y1;ty++) if(solidAt(tx,ty)){ b.x=(tx+1)*TS+.01; b.vx=0; res.wall=true; break; } }
  const prevBottom=b.y+b.h;
  b.y+=b.vy;
  const x0=Math.floor(b.x/TS), x1=Math.floor((b.x+b.w-1)/TS);
  if(b.vy>0){
    const ty=Math.floor((b.y+b.h)/TS);
    for(let tx=x0;tx<=x1;tx++){
      const ch=tileAt(tx,ty);
      if(solidAt(tx,ty) || (oneWay && ch==='=' && prevBottom<=ty*TS+1 && !(b.drop>0))){
        b.y=ty*TS-b.h; b.vy=0; res.ground=true; res.gt=ch; if(ch==='M') res.bounce=true; break;
      }
    }
  } else if(b.vy<0){
    const ty=Math.floor(b.y/TS);
    let hit=false;
    for(let tx=x0;tx<=x1;tx++) if(ty>=0&&solidAt(tx,ty)){ hit=true; res.head.push([tx,ty]); }
    if(hit){ b.y=(ty+1)*TS; b.vy=0; }
  }
  return res;
}

// ---------- Effects ----------
function burst(x,y,cols,n=12,spd=4){ for(let i=0;i<n;i++){ const a=Math.random()*PI2, s=Math.random()*spd+1; G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:40+Math.random()*20,col:cols[i%cols.length],sz:3+Math.random()*3}); } }
function say(x,y,txt,col='#fff',size=20){ G.texts.push({x,y,txt,col,life:70,size}); }
function toast(txt,col='#fff'){ G.toast={txt,col,t:170}; }

// ---------- Players ----------
function makePlayer(ch,idx){
  const big=ch==='seb';
  return {ch,idx,w:big?24:22,h:big?54:48,x:0,y:0,vx:0,vy:0,face:1,ground:false,gt:null,coyote:0,buffer:0,air:1,ladder:false,water:false,
    hearts:3,maxH:3,inv:0,shield:false,rushT:0,speedT:0,megaT:0,rainT:0,slam:0,spring:false,meter:0,down:false,downT:0,
    anim:0,state:'idle',drop:0,hurtT:0,told:false,ctrl:{l:0,r:0,u:0,d:0,j:0,a:0,jp:0,ap:0}};
}
function hurtPlayer(p,src){
  if(p.down||p.inv>0||p.rushT>0||p.megaT>0||mode!=='play') return;
  if(p.shield){ p.shield=false; p.inv=70; sfx.shield(); burst(p.x+p.w/2,p.y+p.h/2,['#5ad1ff','#fff'],16); say(p.x,p.y-10,'Shield!','#5ad1ff'); return; }
  p.hearts--; p.inv=100; p.hurtT=25; p.vy=-7; p.vx=(src?Math.sign(p.x+p.w/2-(src.x+(src.w||0)/2))||-p.face:-p.face)*5; p.ladder=false;
  sfx.hurt(); G.shake=8;
  if(p.hearts<=0) knockOut(p);
}
function playerFell(p){
  if(p.down) return;
  p.hearts--; sfx.hurt(); G.shake=8; p.ladder=false;
  if(p.hearts<=0){ knockOut(p); return; }
  respawnPlayer(p); p.inv=100;
}
function respawnPlayer(p){
  const o=G.players.find(q=>q!==p&&!q.down&&q.ground&&!q.water);
  if(o){ p.x=o.x; p.y=o.y+o.h-p.h-4; } else { p.x=G.respawn.x; p.y=G.respawn.y-p.h; }
  p.vx=0; p.vy=0; p.water=false;
}
function knockOut(p){
  const other=G.players.find(q=>q!==p&&!q.down);
  if(other){ p.down=true; p.downT=360; p.hearts=0; say(p.x,p.y-20,HERO[p.ch].name+' will be back!','#fff'); }
  else { p.down=true; gameOver(); }
}
function gameOver(){ if(mode!=='play') return; mode='over'; stopMusic(); setTimeout(()=>{ if(mode==='over') showOver(); },900); }

function activateAbility(p){
  if(p.meter<100){ if(!p.toldMeter){ say(p.x,p.y-30,'Collect more treats!','#fff',16); p.toldMeter=30; } return; }
  p.meter=0;
  if(p.ch==='ivy'){ p.rushT=420; sfx.power(); say(p.x+p.w/2,p.y-24,'SUGAR RUSH!','#ffd23f',24); burst(p.x+11,p.y+24,['#ffd23f','#ff8ec2','#5ad1ff'],24,6); }
  else {
    p.vy=-19; p.spring=true; p.slam=1; p.ground=false; p.ladder=false; sfx.boost();
    say(p.x+p.w/2,p.y-24,'BIG BROTHER BOOST!','#7fe08a',24);
    for(const q of alivePlayers()) if(q!==p && Math.abs(q.x-p.x)<110 && Math.abs(q.y-p.y)<90){ q.vy=-19; q.spring=true; q.air=1; q.ground=false; say(q.x,q.y-10,'Wheee!','#ff8ec2'); }
  }
}
function shockwave(p){
  const cx=p.x+p.w/2, cy=p.y+p.h;
  sfx.slam(); G.shake=16;
  for(let i=0;i<40;i++){ const a=i/40*PI2; G.parts.push({x:cx,y:cy-6,vx:Math.cos(a)*7,vy:Math.sin(a)*2.5,life:35,col:i%2?'#7fe08a':'#fff',sz:6}); }
  for(const e of G.enemies) if(e.alive && Math.abs(e.x+e.w/2-cx)<260 && Math.abs(e.y+e.h/2-cy)<180) killEnemy(e,p);
  const B=G.boss; if(B&&B.awake&&!B.dying&&B.hurt<=0&&Math.abs(B.x+B.w/2-cx)<320&&Math.abs(B.y+B.h-cy)<200) damageBoss(B,p);
}

function updatePlayer(p){
  const c=p.ctrl;
  if(p.down){
    if(mode!=='play') return;
    const o=G.players.find(q=>q!==p&&!q.down); if(!o) return;
    p.x+=(o.x-p.x-30)*.06; p.y+=(o.y-70-p.y)*.06; p.downT--;
    if(p.downT<=0){ p.down=false; p.hearts=2; p.inv=120; p.x=o.x; p.y=o.y+o.h-p.h; p.vx=p.vy=0; sfx.heart(); }
    return;
  }
  for(const k of ['inv','rushT','speedT','megaT','rainT','hurtT','drop','toldMeter']) if(p[k]>0) p[k]--;
  if(c.ap) activateAbility(p);
  const dir=(c.r?1:0)-(c.l?1:0);
  if(dir) p.face=dir;
  const fast=p.speedT>0||p.rushT>0;
  const spd=RUN*(fast?1.45:1);
  const cx=p.x+p.w/2, cy=p.y+p.h/2;
  const tc=tileAt(Math.floor(cx/TS),Math.floor(cy/TS));
  // ---- ladders ----
  if(tc==='L' && !p.ladder && (c.u||c.jp||(c.d&&!p.ground))){ p.ladder=true; p.vx=0; p.buffer=0; }
  if(p.ladder && tc!=='L'){ p.ladder=false; if(c.u||c.j){ p.vy=-7; } }
  if(p.ladder){
    p.vx=dir*2; p.vy=(c.u||c.j)?-3.2:c.d?3.2:0; p.air=1; p.slam=0;
    if(c.jp && dir){ p.ladder=false; p.vy=JUMP*.85; sfx.jump(); }
    const res=moveBody(p,false); if(res.ground&&c.d) p.ladder=false;
    p.ground=false; p.state='climb'; if(p.vy||p.vx) p.anim++;
    afterMove(p); return;
  }
  // ---- swimming ----
  if(tc==='w'){
    if(!p.water){ p.water=true; p.vy*=.3; burst(cx,p.y+p.h,G.pal.water?[G.pal.water,'#fff']:['#6b3a1e','#fff'],10,3); }
    p.air=1; p.slam=0;
    p.vx+=(dir*spd*.6-p.vx)*.1; p.vy=Math.min(p.vy+.16,2.4);
    if(c.jp){ const above=tileAt(Math.floor(cx/TS),Math.floor((p.y-2)/TS)); p.vy=above!=='w'?-10.5:-5.2; sfx.swim(); }
    const res=moveBody(p,true); p.ground=res.ground; p.gt=res.gt;
    p.state='swim'; p.anim++;
    afterMove(p); return;
  }
  p.water=false;
  // ---- running and jumping ----
  const onIce=p.ground&&p.gt==='I';
  p.vx+=(dir*spd-p.vx)*(p.ground?(onIce?.035:.28):.14);
  if(c.jp) p.buffer=8; else if(p.buffer>0) p.buffer--;
  if(p.ground){ p.coyote=7; p.air=1; } else if(p.coyote>0) p.coyote--;
  if(p.buffer>0){
    if(p.coyote>0){ p.vy=JUMP*(fast?1.06:1); p.coyote=0; p.buffer=0; p.ground=false; sfx.jump(); }
    else if(c.jp && (p.air>0||p.rainT>0)){
      p.vy=DJUMP; if(p.rainT<=0) p.air--; p.buffer=0; p.spring=false; sfx.djump();
      burst(cx,p.y+p.h,p.rainT>0?['#ff4f7b','#ffd23f','#5ee08a','#5ad1ff','#b47cff']:['#fff','#ffd1e6'],10,3);
    }
  }
  if(p.vy>=0) p.spring=false;
  if(!c.j && p.vy<-4 && !p.spring) p.vy*=.8;
  p.vy=Math.min(p.vy+GRAV,14);
  if(c.d && p.ground && p.gt==='=') p.drop=12;
  const wasGround=p.ground;
  const res=moveBody(p,true);
  p.ground=res.ground; p.gt=res.gt;
  if(res.bounce){ p.vy=BOUNCE; p.spring=true; p.ground=false; p.air=1; sfx.boing(); burst(cx,p.y+p.h,['#fff','#ffd1e6'],8,3); }
  for(const [tx,ty] of res.head) hitBlock(tx,ty,p);
  if(p.slam===1&&!p.ground) p.slam=2;
  if(p.slam===2&&p.ground){ p.slam=0; shockwave(p); }
  if(!wasGround&&p.ground&&p.megaT>0){ G.shake=4; }
  p.state=p.hurtT>0?'hurt':!p.ground?(p.vy<0?'jump':'fall'):Math.abs(p.vx)>.6?'run':'idle';
  p.anim+=Math.abs(p.vx)>.6?Math.abs(p.vx)/3.5:1;
  afterMove(p);
}
function afterMove(p){
  const cx=p.x+p.w/2;
  if(p.y>ROWS*TS+40){ playerFell(p); return; }
  if(tileAt(Math.floor(cx/TS),Math.floor((p.y+p.h-6)/TS))==='v'){ burst(cx,p.y+p.h,['#ffa83f','#ffd23f'],14,4); playerFell(p); return; }
  if((p.rushT>0||p.rainT>0)&&t60%3===0) G.parts.push({x:cx,y:p.y+p.h*.6,vx:-p.vx*.3,vy:-1,life:25,col:['#ffd23f','#ff8ec2','#5ad1ff','#7fe08a'][t60%4],sz:4});
  if(p.speedT>0&&t60%4===0) G.parts.push({x:cx,y:p.y+p.h-4,vx:-p.vx*.2,vy:-.5,life:18,col:'#fff3a8',sz:4});
  if(p.meter>=100&&!p.told){ p.told=true; toast((p.ch==='ivy'?'Sugar Rush':'Big Brother Boost')+' is ready! Press '+abilityKey(p)); }
  if(p.meter<100) p.told=false;
}
function hitBlock(tx,ty,p){
  const ch=G.grid[ty][tx];
  if(ch==='?'){ G.grid[ty][tx]='U'; sfx.coin(); addCoins(1,p); G.parts.push({x:tx*TS+20,y:ty*TS-10,vx:0,vy:-6,life:30,col:'#ffd23f',sz:12,coin:true}); }
  else if(ch==='!'){ G.grid[ty][tx]='U'; sfx.block(); const type=pick(Math.random,['sugar','shield','mega','rainbow','heart']); G.items.push({type:'power',pw:type,x:tx*TS+20,y:ty*TS+20,vy:-5,ty:ty*TS-22,pop:true,ph:0}); }
  else sfx.block();
  for(const e of G.enemies) if(e.alive&&Math.abs(e.x+e.w/2-(tx*TS+20))<30&&Math.abs(e.y+e.h-ty*TS)<8) killEnemy(e,p);
}
function addCoins(n,p){ G.coins+=n; save.coins+=n; if(p) p.meter=Math.min(100,p.meter+2*n); }

// ---------- Items ----------
function collect(it,p){
  it.got=true; const id=G.id;
  const cx=it.x, cy=it.y;
  switch(it.type){
    case 'coin': addCoins(1,p); sfx.coin(); break;
    case 'cup': G.cups++; p.meter=Math.min(100,p.meter+10); sfx.yum(); burst(cx,cy,['#fff','#ffd23f','#ff8ec2'],8,3); say(cx,cy-20,['Yum!','Mmm!','Yummy!','Nom!','Sweet!'][G.cups%5]); break;
    case 'heart': p.hearts=Math.min(5,p.hearts+1); sfx.heart(); say(cx,cy-20,'+1 heart','#ff4f7b'); break;
    case 'spoon': if(it.old){ addCoins(5,p); say(cx,cy-20,'+5 coins','#ffd23f'); } else { save.spoons[id]=1; toast('You found a SECRET GOLDEN SPOON!','#ffd23f'); } G.found.spoon=true; sfx.secret(); burst(cx,cy,['#ffd23f','#fff'],24,5); break;
    case 'star': if(it.old){ addCoins(5,p); say(cx,cy-20,'+5 coins','#ffd23f'); } else { save.stars[id]=1; toast('You found a HIDDEN STAR!','#fff3a8'); } G.found.star=true; sfx.secret(); burst(cx,cy,['#fff3a8','#ffd23f'],24,5); break;
    case 'card': if(it.old){ addCoins(5,p); say(cx,cy-20,'+5 coins','#ffd23f'); } else { save.cards[id]=1; toast('Dessert card: '+CARDS[G.L.card][0]+'!','#ff8ec2'); } G.found.card=true; sfx.secret(); burst(cx,cy,['#ff8ec2','#fff'],20,5); break;
    case 'door': { const W=G.L.W; if(!save.secrets[W.key]){ save.secrets[W.key]=1; toast('SECRET DOOR! You unlocked '+W.secret+'!','#ffd23f'); } else say(cx,cy-40,'Secret door (already found)'); sfx.secret(); it.got=false; it.used=true; break; }
    case 'power': givePower(p,it.pw); break;
  }
  persist();
}
function givePower(p,pw){
  sfx.power(); say(p.x+p.w/2,p.y-20,POWER_INFO[pw]||pw,'#ffd23f');
  if(pw==='sugar') p.speedT=540;
  else if(pw==='shield') p.shield=true;
  else if(pw==='mega'){ p.megaT=540; G.shake=6; }
  else if(pw==='rainbow') p.rainT=720;
  else if(pw==='heart') p.hearts=Math.min(5,p.hearts+1);
  else if(pw==='charge') p.meter=100;
}

const ENEMY={
  cookie:{w:30,h:30,init:e=>e.vx=-1.1,up:walker},

  donut:{w:28,h:28,init:e=>e.vx=-2.6,up:e=>{ walker(e); e.rot=(e.rot||0)+e.vx*.08; }},
  jelly:{w:24,h:20,init:e=>e.hue=Math.floor(Math.random()*5),up:hopToward},

  hopper:{w:30,h:30,up:e=>{ e.vy=Math.min(e.vy+GRAV,14); const r=moveBody(e,true);
    if(r.ground){ e.vx=0; e.st--; if(e.st<=0){ e.vy=-11-Math.random()*4; e.vx=(Math.random()<.5?-1:1)*(1+Math.random()*2); e.st=40+Math.random()*90; } } }},
  bat:{w:34,h:22,fly:true,up:e=>{

    e.oy=e.oy||0; if(e.dive){ e.oy+=5; if(e.oy>=e.target){ e.dive=0; e.cool=120; } } else e.oy=Math.max(0,e.oy-2);

  spider:{w:26,h:22,fly:true,init:e=>{ e.ay=e.y; let ty=Math.floor(e.y/TS)-1; while(ty>=0&&!solidAt(Math.floor((e.x+13)/TS),ty)) ty--; e.top=(ty+1)*TS; e.st=0; },up:e=>{
    const p=G.players.find(q=>!q.down&&Math.abs(q.x+q.w/2-(e.x+13))<50&&q.y>e.y);

    else if(e.st===1){ e.y+=6; const ty=Math.floor((e.y+e.h)/TS); if(solidAt(Math.floor((e.x+13)/TS),ty)||e.y>e.ay+320){ e.y=Math.min(e.y,ty*TS-e.h); e.st=2; e.wait=50; } }
    else if(e.st===2){ if(--e.wait<=0) e.st=3; }

  cupcake:{w:30,h:34,up:e=>{

    if(e.st>140&&p&&Math.abs(p.x-e.x)<520){ e.st=0; const T=55, gr=.25, dx=p.x+p.w/2-(e.x+15), dy=p.y+p.h/2-(e.y+5);
      shoot({x:e.x+15,y:e.y+5,vx:clamp(dx/T,-6,6),vy:clamp((dy-.5*gr*T*T)/T,-11,4),r:7,grav:gr,kind:'frost'}); } }},
  minion:{w:26,h:36,up:e=>{
    e.vy=Math.min(e.vy+GRAV,14); const p=nearestPlayer(e.x,e.y);

ENEMY_ART.biscuit=ENEMY_ART.cookie;
function walker(e){
  e.vy=Math.min(e.vy+GRAV,14);
  if(e.stun>0){ e.stun--; e.vx=0; moveBody(e,true); if(e.stun===0) e.vx=e.lastVx||-1.5; return; }
  const front=e.vx>0?e.x+e.w+2:e.x-2, tx=Math.floor(front/TS), ty=Math.floor((e.y+e.h+4)/TS), ch=tileAt(tx,ty);
  const v=e.vx; const r=moveBody(e,true);
  if(r.wall) e.vx=-v; else if(r.ground&&!(solidAt(tx,ty)||ch==='=')) e.vx=-v;
  if(e.vx===0) e.vx=-v||-1;
}
function hopToward(e,power=7.5){
  e.vy=Math.min(e.vy+GRAV,14); const r=moveBody(e,true);
  if(r.ground){ e.vx*=.7; e.st=(e.st||0)+1; if(e.st>45+(e.t%25)){ e.st=0; const p=nearestPlayer(e.x,e.y); e.vy=-power; e.vx=(p&&p.x>e.x?1:-1)*2.2; } }
}
function spawnEnemy(type,x,y,extra){
  const D=ENEMY[type]; if(!D) return null;
  const e={type,x:x+(TS-D.w)/2,y:y+TS-D.h,w:D.w,h:D.h,vx:0,vy:0,t:Math.random()*60,alive:true,hp:D.hp||1,st:0,fly:!!D.fly};
  e.hx=e.x; e.hy=e.y; if(D.init) D.init(e); if(extra) Object.assign(e,extra);
  G.enemies.push(e); return e;
}
function killEnemy(e,p){
  e.alive=false; sfx.stomp(); burst(e.x+e.w/2,e.y+e.h/2,['#ffd23f','#ff8ec2','#fff','#8bd16a'],14);
  if(e.type!=='clone'&&e.type!=='biscuit'){ addCoins(1,p); say(e.x+e.w/2,e.y,'+1','#ffd23f',16); }
}
function updateEnemies(){
  for(const e of G.enemies){
    if(!e.alive) continue;
    if(e.x<G.cam-320||e.x>G.cam+VW+320) continue;
    e.t++; ENEMY[e.type].up(e);
    if(e.vx) e.lastVx=e.vx;
    if(e.y>ROWS*TS+80){ e.alive=false; continue; }
    for(const p of G.players){
      if(p.down||!e.alive||!overlap(p,e)) continue;
      if(p.rushT>0||p.megaT>0){ killEnemy(e,p); continue; }
      if(p.vy>0 && p.y+p.h-p.vy<=e.y+14){
        e.hp--; p.vy=p.ctrl.j?-12:-9; p.air=1; p.meter=Math.min(100,p.meter+8);
        if(e.hp<=0) killEnemy(e,p); else { e.stun=70; sfx.stomp(); say(e.x,e.y,'Bonk!'); }
        if(p.slam){ p.slam=0; shockwave(p); }
      } else if(!(e.stun>0)) hurtPlayer(p,e);
    }
  }
  if(G.enemies.length>60) G.enemies=G.enemies.filter(e=>e.alive);
}

// ---------- Projectiles (bad guys throw things) ----------
function shoot(o){ G.projs.push(Object.assign({t:0,life:300,grav:0,r:8,solidDie:true},o)); if(o.kind!=='crumb'&&o.kind!=='icicle') sfx.shoot(); }
function updateProjs(){
  for(const q of G.projs){
    q.t++; q.life--; q.vy+=q.grav; q.x+=q.vx; q.y+=q.vy;
    if(q.homing){ const p=nearestPlayer(q.x,q.y); if(p){ const dx=p.x+p.w/2-q.x, dy=p.y+p.h/2-q.y, d=Math.hypot(dx,dy)||1; q.vx+=dx/d*.12; q.vy+=dy/d*.12; const s=Math.hypot(q.vx,q.vy); if(s>3.2){ q.vx*=3.2/s; q.vy*=3.2/s; } } }
    if(q.solidDie && solidAt(Math.floor(q.x/TS),Math.floor((q.y+q.r*.5)/TS))){
      q.life=0;
      if(q.kind==='bomb'){ for(const s of [-1,0,1]) shoot({x:q.x,y:q.y-8,vx:s*3,vy:-4,r:6,grav:.3,kind:'splat',life:70}); burst(q.x,q.y,['#ff8ec2','#fff'],14,4); }
      else burst(q.x,q.y,['#fff','#ffd1e6'],5,2);
    }
    for(const p of G.players){ if(!p.down&&q.life>0&&Math.abs(p.x+p.w/2-q.x)<p.w/2+q.r-2&&Math.abs(p.y+p.h/2-q.y)<p.h/2+q.r-2){ hurtPlayer(p,{x:q.x,w:0}); if(!(p.rushT>0||p.megaT>0)) q.life=0; } }
    if(q.y>ROWS*TS+60||q.x<G.cam-200||q.x>G.cam+VW+200) q.life=0;
  }
  G.projs=G.projs.filter(q=>q.life>0);
}

// ---------- Starting a level ----------
function levelFor(id){
  if(id.startsWith('rematch:')){
    const boss=id.slice(8); let W=WORLDS.find(w=>w.boss[1]===boss), wi=W?WORLDS.indexOf(W):7;
    if(!W){ BONUS.forEach((b,bi)=>{ if(b.stages.some(s=>s[1]===boss)){ W=b; wi=7+bi; } }); }
    if(boss==='cakeeater') { W=WORLDS[5]; wi=5; }
    return {id,wi,W,name:'Rematch: '+SPEAKERS[boss].name,feats:[],kind:'rematch',boss};
  }
  return LEVELS[id];
}
function startLevel(id){
  const L=levelFor(id); const B=buildLevel(L);
  G={L,id,grid:B.grid,w:B.w,pal:PAL[B.pal]||PAL.forest,cave:B.cave,arena:B.arena,items:[],enemies:[],projs:[],checks:[],goal:null,boss:null,players:[],
     cam:0,parts:[],texts:[],shake:0,time:0,cups:0,cupsTotal:0,coins:0,found:{},respawn:{x:60,y:480},banner:150,toast:null,final:false};
  for(const e of B.ents){
    const px=e.x*TS, py=e.y*TS, item=(type,more)=>G.items.push(Object.assign({type,x:px+20,y:py+20,ph:Math.random()*6},more||{}));
    switch(e.ch){
      case '@': G.respawn={x:px+8,y:py+TS}; break;
      case '>': G.goal={x:px-10,y:py-40,w:60,h:80}; break;
      case 'C': G.checks.push({x:px+20,y:py+TS,on:false}); break;
      case 'o': item('coin'); break;
      case 'u': item('cup',{hue:G.cupsTotal%CUP_COLORS.length}); G.cupsTotal++; break;
      case 'H': item('heart'); break;
      case 'G': item('spoon',{old:!!save.spoons[id]}); break;
      case 'R': item('star',{old:!!save.stars[id]}); break;
      case 'Y': item('card',{old:!!save.cards[id]}); break;
      case 'D': item('door'); break;
      case 'K': G.boss=makeBoss(L.boss,px,py+TS); break;
      default: if(e.type) spawnEnemy(e.type,px,py);
    }
  }
  const chars=save.players==='duo'?['ivy','seb']:[save.players==='seb'?'seb':'ivy'];
  G.players=chars.map((ch,i)=>{ const p=makePlayer(ch,i); p.x=G.respawn.x+i*30; p.y=G.respawn.y-p.h; return p; });
  // Boosts bought in the Dessert Shop get used now.
  const used=[];
  for(const b of BOOSTS){ if((save.boosts[b.id]||0)>0){ save.boosts[b.id]--; used.push(b.name); for(const p of G.players){
    if(b.id==='shield') p.shield=true; else if(b.id==='heart'){ p.maxH=4; p.hearts=4; } else if(b.id==='sugar') p.speedT=900;
    else if(b.id==='charge') p.meter=100; else if(b.id==='rainbow') p.rainT=1200; else if(b.id==='mega') p.megaT=900; } } }
  if(used.length){ persist(); toast('Using: '+used.join(', ')); }
  G.cam=0; mode='play'; showGame(); audio();
  startMusic(L.wi+1,false);
}

// ---------- Big update ----------
function update(){
  t60++;
  if(!G) return;
  if(mode!=='play'){ if(mode==='done'||mode==='over'||mode==='cut'){ stepFx(); } return; }
  G.time++;
  readControls();
  for(const p of G.players) updatePlayer(p);
  if(mode!=='play') return;
  // items
  for(const it of G.items){
    if(it.got) continue;
    if(it.pop){ it.y+=it.vy; it.vy+=.3; if(it.vy>0&&it.y>=it.ty){ it.y=it.ty; it.pop=false; } continue; }
    if(it.fall){ it.vy=(it.vy||0)+.4; it.y+=it.vy; const ty=Math.floor((it.y+16)/TS); if(solidAt(Math.floor(it.x/TS),ty)){ it.y=ty*TS-18; it.fall=false; } }
    for(const p of G.players){ if(p.down||it.got) continue;
      const near=it.type==='door'?(Math.abs(p.x+p.w/2-it.x)<30&&Math.abs(p.y+p.h-(it.y+20))<40):(Math.abs(p.x+p.w/2-it.x)<p.w/2+14&&Math.abs(p.y+p.h/2-it.y)<p.h/2+14);
      if(near&&!(it.type==='door'&&it.used)) collect(it,p); }
  }
  // checkpoints
  for(const ck of G.checks) if(!ck.on&&G.players.some(p=>!p.down&&Math.abs(p.x+p.w/2-ck.x)<30)){ ck.on=true; G.respawn={x:ck.x-12,y:ck.y}; sfx.flag(); say(ck.x,ck.y-100,'Checkpoint!','#7fe08a'); }
  updateEnemies();
  updateProjs();
  // boss room
  if(G.boss&&G.arena&&!G.arena.locked&&G.players.some(p=>!p.down&&p.x>G.arena.x0+60)){
    G.arena.locked=true;
    for(let y=0;y<12;y++) G.grid[y][G.arena.wall]='W';
    for(const p of G.players) if(p.x<G.arena.x0+10){ p.x=G.arena.x0+40; p.y=G.arena.floor-p.h; p.vx=p.vy=0; }
    G.boss.awake=true; sfx.boss(); startMusic(G.L.wi+1,true);
    const lines=STORY.boss[G.boss.id]; if(lines&&G.L.kind!=='rematch') playCut(lines,()=>{ mode='play'; showGame(); });
  }
  if(G.boss) updateBoss(G.boss);
  // goal
  if(G.goal&&G.players.some(p=>!p.down&&overlap(p,G.goal))) levelDone();
  // camera
  const al=alivePlayers();
  if(al.length){
    let tx=al.reduce((s,p)=>s+p.x+p.w/2,0)/al.length-VW*.42;
    if(al.length===1) tx+=al[0].face*50;
    if(G.arena&&G.arena.locked) tx=(G.arena.x0+G.arena.x1)/2-VW/2;
    tx=clamp(tx,0,G.w*TS-VW); G.cam+=(tx-G.cam)*.12;
    if(G.players.length>1) for(const p of al) p.x=clamp(p.x,G.cam+2,G.cam+VW-p.w-2);
  }
  if(G.shake>0) G.shake--;
  if(G.banner>0) G.banner--;
  if(G.toast&&--G.toast.t<=0) G.toast=null;
  stepFx();
}
function stepFx(){
  for(const p of G.parts){ p.x+=p.vx; p.y+=p.vy; p.vy+=p.coin?.3:.15; p.life--; }
  G.parts=G.parts.filter(p=>p.life>0);
  for(const f of G.texts){ f.y-=.7; f.life--; }
  G.texts=G.texts.filter(f=>f.life>0);
}
function levelDone(){
  if(mode!=='play') return;
  mode='done'; sfx.win(); stopMusic();
  const id=G.id;
  if(G.L.kind!=='rematch'){
    save.done[id]=1; save.best[id]=Math.max(save.best[id]||0,G.cups);
    if(G.L.kind==='boss') save.villains[G.L.boss]=1;
  }
  persist();
  for(const p of G.players) p.state='happy';
  setTimeout(()=>{ if(mode==='done') showDone(); },1000);
}
// ================= The 12 villains =================
// Every boss: jump on its head to hurt it. Some can only be hurt at certain times.
function makeBoss(id,x,bottom){
  const D=BOSSES[id];
  const B={id,def:D,x:x+20-D.w/2,y:bottom-D.h,w:D.w,h:D.h,hp:D.hp,max:D.hp,t:0,vx:0,vy:0,face:-1,hurt:0,awake:false,dying:0,st:'idle',timer:60,hit:[],ground:false,alpha:1};
  if(D.init) D.init(B);
  return B;
}
function bgrav(B,g2=GRAV){ B.vy=Math.min(B.vy+g2,14); const r=moveBody(B,false); B.ground=r.ground; return r; }
function towardP(B){ const p=nearestPlayer(B.x+B.w/2,B.y); return p?(Math.sign(p.x+p.w/2-(B.x+B.w/2))||1):-1; }
function lob(x,y,kind,T=50,gr=.3,dx=0,r=9){ const p=nearestPlayer(x,y); if(!p) return; const tx=p.x+p.w/2+dx, ty=p.y+p.h/2;
  shoot({x,y,vx:clamp((tx-x)/T,-9,9),vy:clamp((ty-y-.5*gr*T*T)/T,-16,6),grav:gr,kind,r}); }
function bossMinions(type){ return G.enemies.filter(e=>e.alive&&e.type===type).length; }

function updateBoss(B){
  B.t++;
  if(!B.awake){ bgrav(B); return; }
  if(B.dying){
    B.dying--; if(B.dying%5===0) burst(B.x+Math.random()*B.w,B.y+Math.random()*B.h,['#ffd23f','#ff8ec2','#fff','#8bd16a'],8,4);
    if(B.dying<=0) bossDefeated(B); return;
  }
  if(B.hurt>0) B.hurt--;
  B.hit=[];
  B.def.update(B);
  const A=G.arena;
  if(A){ if(B.x<A.x0){ B.x=A.x0; if(B.vx<0) B.vx=0; } if(B.x+B.w>A.x1){ B.x=A.x1-B.w; if(B.vx>0) B.vx=0; } }
  if(B.y>ROWS*TS){ B.y=(A?A.floor:400)-B.h; B.vy=0; }
  const D=B.def;
  for(const p of G.players){
    if(p.down) continue;
    if(overlap(p,B)){
      const fromTop=p.vy>0 && p.y+p.h-p.vy<=B.y+(D.stompZone||24);
      if(fromTop){
        if((D.canStomp?D.canStomp(B):true)&&B.hurt<=0){ damageBoss(B,p); p.vy=-13; }
        else { p.vy=-12; sfx.boing(); if(D.noStompMsg&&t60%20===0) say(B.x+B.w/2,B.y-20,D.noStompMsg,'#fff',16); }
        p.y=B.y-p.h-1; p.air=1; p.spring=true;
      } else if(!(D.harmless&&D.harmless(B)) && B.hurt<50) hurtPlayer(p,B);
    }
    for(const h of B.hit) if(overlap(p,h)) hurtPlayer(p,B);
  }
}
function damageBoss(B,p){
  B.hp--; B.hurt=70; sfx.bossHit(); G.shake=12;
  burst(B.x+B.w/2,B.y+10,['#fff','#ffd23f','#ff8ec2'],20,5);
  if(p){ p.inv=Math.max(p.inv,30); p.meter=Math.min(100,p.meter+15); }
  const lines=B.def.ouch||['Ouch!'];
  if(B.hp>0) say(B.x+B.w/2,B.y-24,lines[(B.max-B.hp-1)%lines.length],'#fff',20);
  if(B.def.onHurt) B.def.onHurt(B);
  if(B.hp<=0){ B.dying=100; B.hit=[]; G.projs=[]; for(const e of G.enemies) if(['biscuit','clone','minion','gummy'].includes(e.type)&&e.alive) killEnemy(e,null); say(B.x+B.w/2,B.y-30,B.def.lose||'Nooooo!','#ffd23f',24); sfx.win(); }
}
function bossDefeated(B){
  G.boss=null;
  if(G.id==='7-4'&&B.id==='licorice'&&!G.final){
    playCut(STORY.twist,()=>{
      G.final=true; const A=G.arena;
      G.boss=makeBoss('cakeeater',(A.x0+A.x1)/2+120,A.floor); G.boss.final=true; G.boss.hp=G.boss.max=6; G.boss.awake=true; G.boss.y=-200;
      G.shake=30; sfx.boss(); startMusic(9,true); mode='play'; showGame(); toast('SECRET FINAL BOSS: THE CAKE EATER!','#ff8ec2');
    });
    return;
  }
  if(B.final){
    save.done['7-4']=1; save.villains.licorice=1; save.villains.cakeeater=1; save.beatGame=true; save.best['7-4']=Math.max(save.best['7-4']||0,G.cups); persist();
    stopMusic(); sfx.win(); for(const p of G.players) p.state='happy';
    playCut(STORY.ending,()=>{
      if(count(save.stars)>=21) playCut(STORY.secret,()=>{ save.secretEnd=true; persist(); showEnd(true); });
      else showEnd(false);
    });
    return;
  }
  if(G.id==='6-4'){ playCut(STORY.cakeEscape,()=>{ mode='play'; levelDone(); }); return; }
  levelDone();
}

const BOSSES={
  // ---------- Ginger Grim ----------

      if(B.throwT>0) B.throwT--; if(B.hp===1&&r.ground&&B.t%150===0) B.vy=-12; },

function draw(){
  g=MAIN; g.setTransform(1,0,0,1,0,0);
  if(!G){ drawMenuBg(); return; }
  const P=G.pal;
  drawSky(P);
  const sx=G.shake?(Math.random()-.5)*G.shake:0, sy=G.shake?(Math.random()-.5)*G.shake:0;
  g.save(); g.translate(Math.round(-G.cam+sx),Math.round(sy));
  const c0=Math.max(0,Math.floor(G.cam/TS)-1), c1=Math.min(G.w-1,Math.ceil((G.cam+VW)/TS)+1);
  // which fake walls should turn see-through
  const near=(x,y)=>G.players.some(p=>!p.down&&Math.abs(p.x+p.w/2-(x*TS+20))<90&&Math.abs(p.y+p.h/2-(y*TS+20))<70);
  // checkpoints
  for(const c of G.checks){ fs('#ddd'); g.fillRect(c.x-2,c.y-80,4,80); fs('#bbb'); rr(c.x-6,c.y-86,12,10,5);
    fs(c.on?'#7fe08a':'#999'); poly([[c.x+2,c.y-78],[c.x+30+Math.sin(t60*.1)*3,c.y-68],[c.x+2,c.y-58]]); if(c.on) drawCupcake(c.x+14,c.y-70,.45); }
  if(G.goal) drawGoal(G.goal);
  // items
  for(const it of G.items){ if(it.got) continue; if(it.x<G.cam-40||it.x>G.cam+VW+40) continue; const bob=it.pop||it.fall?0:Math.sin(t60*.07+it.ph)*4, y=it.y+bob;
    if(it.old) g.globalAlpha=.45;
    switch(it.type){
      case 'coin': drawCoin(it.x,y,t60+it.ph*20); break;
      case 'cup': drawCupcake(it.x,y,1,CUP_COLORS[it.hue||0]); break;
      case 'heart': drawPower('heart',it.x,y,t60); break;
      case 'spoon': fs('rgba(255,210,63,.3)'); circ(it.x,y,22+Math.sin(t60*.1)*3); drawSpoon(it.x,y+4); break;
      case 'star': fs('rgba(255,243,168,.35)'); circ(it.x,y,24+Math.sin(t60*.1)*3); drawHiddenStar(it.x,y,t60); break;
      case 'card': fs('rgba(255,142,194,.3)'); circ(it.x,y,22); drawCardIcon(it.x,y); break;
      case 'door': drawDoor(it.x,it.y+20,t60); break;
      case 'power': fs('rgba(255,255,255,.35)'); circ(it.x,y,20); drawPower(it.pw,it.x,y,t60); break;

  // enemies
  for(const e of G.enemies) if(e.alive&&e.x>G.cam-80&&e.x<G.cam+VW+80) ENEMY_ART[e.type](e);
  if(G.boss){ const B=G.boss; if(!(B.hurt>0&&Math.floor(B.hurt/4)%2===0)){ g.save(); if(B.dying) g.globalAlpha=B.dying/100; B.def.draw(B); g.restore(); } }
  for(const q of G.projs) drawProj(q);
  // heroes
  for(const p of G.players) drawPlayer(p);
  // particles and words
  for(const p of G.parts){ g.globalAlpha=Math.min(1,p.life/20); if(p.coin) drawCoin(p.x,p.y,t60); else { fs(p.col); g.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz); } }
  g.globalAlpha=1;
  for(const f of G.texts){ g.globalAlpha=Math.min(1,f.life/20); outlineText(f.txt,f.x,f.y,f.col,f.size); }
  g.globalAlpha=1;
  g.restore();
  if(G.cave){ const gr=g.createRadialGradient(VW/2,VH/2,250,VW/2,VH/2,620); gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,.45)'); fs(gr); g.fillRect(0,0,VW,VH); }

}

  const L=G.L, rem=L.kind==='rematch';
  let extra='';
  if(L.kind==='level') extra=`<div class="stats"><span class="chip">${save.spoons[G.id]?'🥄 Golden spoon found':'🥄 Spoon still hidden'}</span><span class="chip">${save.stars[G.id]?'⭐ Hidden star found':'⭐ Star still hidden'}</span><span class="chip">${save.cards[G.id]?'🃏 '+esc(CARDS[L.card][0]):'🃏 Card still hidden'}</span></div>`;
  if(L.kind==='boss'||rem) extra=`<canvas id="dv" width="200" height="170" style="width:100px;height:85px"></canvas><p>${rem?'You won the rematch!':'Villain card unlocked: <b>'+esc(SPEAKERS[L.boss].name)+'</b>'}</p>`;
  const nx=rem?null:nextLevelId(G.id);
  ui(`<h2>${L.kind==='boss'||rem?'Villain defeated!':L.kind==='secret'?'Secret level cleared!':'Level complete!'}</h2>
    <p>${esc(L.name)}</p>${extra}
    <div class="stats"><span class="chip">🧁 ${G.cups}/${G.cupsTotal} cupcakes</span><span class="chip">🪙 +${G.coins} coins</span></div>
    ${nx&&isUnlocked(nx)?`<button class="btn" data-a="level" data-v="${nx}">Next: ${esc(nx)}</button>`:''}
    <button class="btn mint" data-a="restart">Play again</button><button class="btn choc" data-a="map">Map</button>`);
  if(L.kind==='boss'||rem) preview('dv',(w,h)=>bossPreview(L.boss,w,h));
}
function showOver(){
  ui(`<h2>Oh no!</h2><p>${G.players.length>1?'Ivy and Sebastian are':(G.players[0].ch==='ivy'?'Ivy is':'Sebastian is')} out of hearts. But dessert heroes never give up!</p>
    <button class="btn" data-a="restart">Try again</button><button class="btn choc" data-a="map">Map</button>`);
}
function showEnd(secret){
  mode='menu'; stopMusic();
  ui(`<h1>THE END</h1><canvas id="pv" width="520" height="300" style="width:260px;height:150px"></canvas>
    <div class="stats"><span class="chip">🥄 ${count(save.spoons)}/28</span><span class="chip">⭐ ${count(save.stars)}/21</span><span class="chip">🃏 ${count(save.cards)}/21</span><span class="chip">🪙 ${save.coins}</span></div>
    ${secret?'<p><b>You saw the secret ending!</b></p>':`<p>Find all 21 hidden stars to unlock the secret ending and discover who created the Dessert Kingdom!</p>`}
    ${count(save.spoons)<20?`<p>Collect golden spoons to open the bonus worlds (10 and 20 spoons).</p>`:''}
    <button class="btn" data-a="map">Back to map</button>`);
  preview('pv',(w,h)=>{ fs('#ffd1e6'); for(let i=0;i<10;i++){ fs(i%2?'#ffc1dc':'#fff3c4'); rr(w/2-120+i*4,h-30-i*22,240-i*8,22,6); } drawHero('ivy',w/2-150,h-14,1,t60,'happy',null,2.2); drawHero('seb',w/2+150,h-14,-1,t60,'idle',null,2.2,{mouth:'o'}); });
}

// ---------- Cutscenes ----------
function playCut(lines,done){ mode='cut'; cutState={lines,i:0,done,at:performance.now()}; renderCut(); }
function renderCut(){
  const [who,text]=cutState.lines[cutState.i];
  const name=SPEAKERS[who]?SPEAKERS[who].name:'';
  ui(`${who==='narr'?'':'<canvas id="por" width="240" height="240" style="width:110px;height:110px"></canvas>'}
    <div style="flex:1">${name?`<div class="who">${esc(name)}</div>`:''}<p>${esc(text)}</p>
    <div style="text-align:right"><button class="btn small" data-a="cutNext">${cutState.i<cutState.lines.length-1?'Next ▶':'OK!'}</button></div></div>`,'cut');
  if(who!=='narr') preview('por',(w,h)=>{
    if(who==='ivy'||who==='seb'){ const s=4.2; drawHero(who,w/2-6,h*.42+46*s*HERO[who].scale,1,t60,'idle',null,s,{mouth:text.includes('!')?'o':''}); }
    else bossPreview(who,w,h);
  });
}
function cutNext(){
  if(!cutState||performance.now()-cutState.at<200) return;
  cutState.at=performance.now(); sfx.select();
  cutState.i++;
  if(cutState.i>=cutState.lines.length){ const d=cutState.done; cutState=null; d&&d(); }
  else renderCut();
}

// ---------- Button actions ----------
const ACT={
  play(){ audio(); if(!save.seenIntro){ playCut(STORY.intro,()=>{ save.seenIntro=true; persist(); showMap(); }); } else showMap(); },
  help(){ showHelp(G?'map':'title'); }, settings(){ showSettings('title'); }, title:showTitle, map:showMap,
  level(v){ audio(); sfx.select(); startLevel(v); },
  restart(){ if(G) startLevel(G.id); },
  resume,
  world(v){ curWorld=+v; save.world=curWorld; persist(); showMap(); },
  players(v){ save.players=v; persist(); showMap(); },
  shop(){ showShop(); }, album:showAlbum, rematch:showRematch,
  shopTab(v){ shopTab=v; showShop(); },
  buyCos(v){ const c=costumeOf(shopTab,v); if(save.coins>=c.price&&!save.owned[shopTab].includes(v)){ save.coins-=c.price; save.owned[shopTab].push(v); save.wear[shopTab]=v; persist(); sfx.power(); } showShop(); },
  wear(v){ save.wear[shopTab]=v; persist(); sfx.select(); showShop(); },
  buyBoost(v){ const b=BOOSTS.find(x=>x.id===v); if(save.coins>=b.price){ save.coins-=b.price; save.boosts[v]=(save.boosts[v]||0)+1; persist(); sfx.coin(); } showShop(); },
  toggleSound(v){ save.sound=!save.sound; persist(); v==='pause'?(mode='play',pause()):showSettings(v); },
  toggleMusic(v){ save.music=!save.music; persist(); if(!save.music) stopMusic(); v==='pause'?(mode='play',pause()):showSettings(v); },
  resetAsk(){ ui(`<h2>Are you sure?</h2><p>This wipes ALL progress: levels, coins, costumes, spoons, stars and cards.</p><button class="btn choc" data-a="settings">No, keep it</button><button class="btn" data-a="resetYes">Yes, start over</button>`); },
  resetYes(){ save=JSON.parse(JSON.stringify(SAVE0)); persist(); curWorld=0; showTitle(); },
  cutNext,
  replayEnd(){ playCut(STORY.ending,showMap); }, replaySecret(){ playCut(STORY.secret,showMap); },
};
CARD.addEventListener('click',e=>{ const b=e.target.closest('[data-a]'); if(b&&!b.disabled){ ACT[b.dataset.a](b.dataset.v); } else if(mode==='cut'&&!b) cutNext(); });
$('pauseBtn').onclick=pause;

// ---------- Controls ----------
const kb=new Set();
const GAME_KEYS=new Set(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space']);
addEventListener('keydown',e=>{
  if(mode==='play'&&(GAME_KEYS.has(e.code)||e.code==='Enter')) e.preventDefault();
  if(mode==='cut'&&(e.code==='Space'||e.code==='Enter')){ e.preventDefault(); if(!e.repeat) cutNext(); return; }
  if(e.code==='Escape'){ if(mode==='play') pause(); else if(mode==='pause') resume(); return; }
  if(e.code==='KeyP'&&mode==='play'){ pause(); return; }
  kb.add(e.code);
});
addEventListener('keyup',e=>{ kb.delete(e.code); if(mode==='cut'&&e.code==='Space') e.preventDefault(); });
addEventListener('blur',()=>{ kb.clear(); for(const k in touch) touch[k]=false; if(mode==='play') pause(); });
const MAP1={l:['ArrowLeft','KeyA'],r:['ArrowRight','KeyD'],u:['ArrowUp','KeyW'],d:['ArrowDown','KeyS'],j:['Space','KeyZ','ArrowUp','KeyW','KeyK'],a:['KeyX','KeyE','ShiftLeft','ShiftRight','KeyJ','Enter']};
const MAPS2=[{l:['KeyA'],r:['KeyD'],u:['KeyW'],d:['KeyS'],j:['KeyW','Space'],a:['KeyE','KeyQ']},
             {l:['ArrowLeft'],r:['ArrowRight'],u:['ArrowUp'],d:['ArrowDown'],j:['ArrowUp'],a:['Enter','ShiftRight','Slash','Numpad0','Period']}];
const touch={l:false,r:false,d:false,j:false,a:false};
const prevBtn=[{},{}];
function padState(i,single){
  const pads=navigator.getGamepads?[...navigator.getGamepads()].filter(Boolean):[];
  const p=single?pads[0]:pads[i]; if(!p) return null;
  const b=k=>!!(p.buttons[k]&&p.buttons[k].pressed), ax=p.axes[0]||0, ay=p.axes[1]||0;
  return {l:ax<-.4||b(14),r:ax>.4||b(15),u:ay<-.5||b(12),d:ay>.5||b(13),j:b(0),a:b(2)||b(1)||b(3)};
}
function readControls(){
  const n=G.players.length;
  G.players.forEach((p,i)=>{
    const M=n>1?MAPS2[i]:MAP1, any=k=>M[k].some(c=>kb.has(c));
    const s={l:any('l'),r:any('r'),u:any('u'),d:any('d'),j:any('j'),a:any('a')};
    if(i===0) for(const k in touch) s[k]=s[k]||touch[k];
    const pad=padState(i,n===1); if(pad) for(const k in pad) s[k]=s[k]||pad[k];
    const pb=prevBtn[i];
    p.ctrl={...s,jp:s.j&&!pb.j,ap:s.a&&!pb.a};
    prevBtn[i]={j:s.j,a:s.a};
  });
}
function bindTouch(id,k){ const el=$(id);
  const on=e=>{ e.preventDefault(); touch[k]=true; el.classList.add('on'); audio(); };
  const off=e=>{ e.preventDefault(); touch[k]=false; el.classList.remove('on'); };
  el.addEventListener('pointerdown',on); el.addEventListener('pointerup',off); el.addEventListener('pointercancel',off); el.addEventListener('pointerleave',off); }
bindTouch('tl','l'); bindTouch('tr','r'); bindTouch('td','d'); bindTouch('tj','j'); bindTouch('ta','a');
// a game controller can skip cutscenes and pause
let padPrev={};
function pollPadMenus(){ const p=padState(0,true); if(!p) return; const st=navigator.getGamepads()[0]; const start=!!(st&&st.buttons[9]&&st.buttons[9].pressed);
  if(mode==='cut'&&p.j&&!padPrev.j) cutNext();
  if(start&&!padPrev.start){ if(mode==='play') pause(); else if(mode==='pause') resume(); }
  padPrev={j:p.j,start}; }

// ---------- Main loop ----------
let last=performance.now(), acc=0;
function frame(now){
  acc+=Math.min(100,now-last); last=now;
  while(acc>=1000/60){ update(); acc-=1000/60; }
  pollPadMenus();
  draw(); drawPreviews();
  requestAnimationFrame(frame);
}
showTitle();
requestAnimationFrame(frame);
window.__ivy={get G(){return G;},get mode(){return mode;},startLevel,LEVELS,ORDER,save:()=>save,kb,BOSSES,damageBoss};
</script>
