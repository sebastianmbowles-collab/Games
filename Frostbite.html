<canvas id="c"></canvas>
<script>
'use strict';
// FROSTBITE - step 1: the world, survival bars, day and night, gathering, fishing,
// cooking, the camp (tent -> hut -> cabin), the snow owl, sleeping and the map.
// Everything is drawn with wobbly "pencil" lines that re-draw a few times a second,
// so the whole world looks hand-drawn and alive.

const FONT = "'Gaegu','Comic Sans MS','Chalkboard SE',cursive";
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const dark = document.createElement('canvas'), dctx = dark.getContext('2d');
let VW = 0, VH = 0, DPR = 1, ZOOM = 1;
let touchUI = matchMedia('(pointer:coarse)').matches;

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  VW = innerWidth; VH = innerHeight;
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
  dark.width = Math.ceil(VW / 2); dark.height = Math.ceil(VH / 2);
  ZOOM = clamp(Math.min(VW, VH) / 380, 1, 2.3);
  chunkCache.clear();
}

// ---------- random numbers and noise ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash2(x, y, s) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 982451653)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s), c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, s, oct) {
  let t = 0, amp = 1, f = 1, n = 0;
  for (let i = 0; i < oct; i++) { t += vnoise(x * f, y * f, s + i * 17) * amp; n += amp; amp *= 0.5; f *= 2; }
  return t / n;
}

// ---------- pencil drawing helpers ----------
function trace(c, p, closed, smooth) {
  const n = p.length;
  c.beginPath();
  if (!smooth) {
    c.moveTo(p[0][0], p[0][1]);
    for (let i = 1; i < n; i++) c.lineTo(p[i][0], p[i][1]);
    if (closed) c.closePath();
    return;
  }
  if (closed) {
    c.moveTo((p[n - 1][0] + p[0][0]) / 2, (p[n - 1][1] + p[0][1]) / 2);
    for (let i = 0; i < n; i++) {
      const a = p[i], b = p[(i + 1) % n];
      c.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
    }
    c.closePath();
  } else {
    c.moveTo(p[0][0], p[0][1]);
    for (let i = 1; i < n - 1; i++) {
      const a = p[i], b = p[i + 1];
      c.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
    }
    c.lineTo(p[n - 1][0], p[n - 1][1]);
  }
}
function jit(p, r, j, ox = 0, oy = 0) {
  return p.map(q => [q[0] + ox + (r() - 0.5) * 2 * j, q[1] + oy + (r() - 0.5) * 2 * j]);
}
// Colour a shape like a marker (a bit outside the lines), then outline it twice with a pencil.
function shape(c, r, p, fill, stroke, o = {}) {
  const j = o.j ?? 1, lw = o.lw ?? 1.6, sm = o.smooth ?? true, closed = !o.open;
  if (fill) {
    c.fillStyle = fill;
    trace(c, jit(p, r, j * 0.5, (r() - 0.5) * 1.4, (r() - 0.5) * 1.4), true, sm);
    c.fill();
  }
  if (stroke) {
    c.strokeStyle = stroke; c.lineWidth = lw; c.lineCap = c.lineJoin = 'round';
    trace(c, jit(p, r, j), closed, sm); c.stroke();
    if (o.double !== false) {
      const ga = c.globalAlpha;
      c.globalAlpha = ga * 0.45; c.lineWidth = lw * 0.7;
      trace(c, jit(p, r, j * 1.3), closed, sm); c.stroke();
      c.globalAlpha = ga;
    }
  }
}
function ell(cx, cy, rx, ry, n = 10, r = null, j = 0) {
  const p = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2, k = r ? 1 + (r() - 0.5) * j : 1;
    p.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]);
  }
  return p;
}
function line(c, r, x1, y1, x2, y2, col, lw = 1.5, j = 0.8) {
  c.strokeStyle = col; c.lineWidth = lw; c.lineCap = 'round';
  c.beginPath();
  c.moveTo(x1 + (r() - 0.5) * j, y1 + (r() - 0.5) * j);
  c.quadraticCurveTo((x1 + x2) / 2 + (r() - 0.5) * 2 * j, (y1 + y2) / 2 + (r() - 0.5) * 2 * j, x2 + (r() - 0.5) * j, y2 + (r() - 0.5) * j);
  c.stroke();
}
function shadow(c, x, y, rx, ry, a = 0.18) {
  c.fillStyle = `rgba(60,85,115,${a})`;
  c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); c.fill();
}
function rrect(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
// A wobbly paper card, used for every menu and bubble.
function paper(c, x, y, w, h, r, fill = '#f7f2e6', stroke = '#3a3631') {
  const rr = mulberry32(boil * 31 + 7 + (w | 0));
  const p = [];
  const steps = Math.max(4, Math.round((w + h) / 40));
  for (let i = 0; i < steps; i++) p.push([x + w * i / steps, y]);
  for (let i = 0; i < steps; i++) p.push([x + w, y + h * i / steps]);
  for (let i = 0; i < steps; i++) p.push([x + w - w * i / steps, y + h]);
  for (let i = 0; i < steps; i++) p.push([x, y + h - h * i / steps]);
  shape(c, rr, p, fill, stroke, { j: Math.min(2, r / 3 + 0.8), lw: 2, smooth: false });
}

// ---------- pre-drawn sprites (3 "boil" frames each) ----------
const SPR = {}, SS = 3;
let boil = 0;
function mkSprite(name, w, h, ax, ay, fn) {
  const vs = [];
  for (let v = 0; v < 3; v++) {
    const c = document.createElement('canvas');
    c.width = w * SS; c.height = h * SS;
    const g = c.getContext('2d'); g.scale(SS, SS);
    fn(g, mulberry32(1000 + v * 77 + name.length * 13 + name.charCodeAt(0)));
    vs.push(c);
  }
  SPR[name] = { vs, w, h, ax, ay };
}
function drawSpr(c, name, x, y, v = boil) {
  const s = SPR[name];
  c.drawImage(s.vs[v % 3], x - s.ax, y - s.ay, s.w, s.h);
}
const INK = '#2b2f36';
function buildSprites() {
  mkSprite('pine', 50, 76, 25, 70, (g, r) => {

    for (let i = 0; i < 3; i++) {
      const top = 4 + i * 15, bot = 30 + i * 14, hw = 11 + i * 5, mid = top + (bot - top) * 0.5;

      shape(g, r, [[25, top + 1], [25 + hw * 0.5, mid], [25 + hw * 0.2, mid - 3], [25, mid + 1], [25 - hw * 0.25, mid - 3], [25 - hw * 0.5, mid]], '#f5f8fa', '#9fb3bf', { smooth: false, lw: 1, j: 0.7, double: false });
    }

      line(g, r, x, y, x2, y2, '#4b3526', w, 1);
      if (d === 1 && sr() < 0.6) { g.fillStyle = '#f5f8fa'; g.beginPath(); g.ellipse(x2, y2 - 1, 3, 1.6, a, 0, 7); g.fill(); }
      branch(x2, y2, a - 0.4 - sr() * 0.35, len * 0.7, w * 0.68, d - 1);
      branch(x2, y2, a + 0.4 + sr() * 0.35, len * 0.7, w * 0.68, d - 1);
    };
    branch(29, 66, -Math.PI / 2, 22, 4.5, 4);
  });
  const bush = (berries) => (g, r) => {
    shadow(g, 18, 25, 14, 4);
    shape(g, r, ell(12, 17, 9, 8, 8, r, 0.2), '#5c7f6a', '#2c4335', { lw: 1.4 });

    shape(g, r, ell(18, 12, 10, 8, 8, r, 0.2), '#628a72', '#2c4335', { lw: 1.4 });
    shape(g, r, [[10, 9], [16, 5], [24, 6], [27, 10], [20, 9], [14, 11]], '#f5f8fa', '#a9bcc6', { lw: 1, double: false });

      g.fillStyle = '#c8313d'; g.beginPath(); g.arc(x, y, 2.2, 0, 7); g.fill();
      g.fillStyle = '#ffd5d8'; g.beginPath(); g.arc(x - 0.7, y - 0.7, 0.7, 0, 7); g.fill();

  mkSprite('bushE', 36, 30, 18, 25, bush(false));

    for (let i = 0; i < 4; i++) line(g, r, 20 + i * 3, 20, 25 + i * 3, 12, '#6d7177', 0.9, 0.4);

    shape(g, r, ell(38, 11.5, 4, 5.5, 8), '#c9a27a', '#3a281b', { lw: 1.4 });
    g.strokeStyle = '#8a6440'; g.lineWidth = 0.8; g.beginPath(); g.ellipse(38, 11.5, 2, 3, 0, 0, 7); g.stroke();
    shape(g, r, [[8, 7], [20, 4], [34, 5], [36, 7], [22, 8]], '#f5f8fa', '#a9bcc6', { lw: 1, double: false });
  });
  const crystal = (full) => (g, r) => {

    for (const [x, y, w, h] of shards)

    if (full) line(g, r, 13, 28, 14, 12, 'rgba(255,255,255,.9)', 1.2, 0.4);

  mkSprite('crystal', 30, 38, 15, 34, crystal(true));
  mkSprite('crystalE', 30, 38, 15, 34, crystal(false));

  mkSprite('deadbear', 64, 34, 32, 26, (g, r) => {

    shape(g, r, ell(30, 18, 22, 9, 12, r, 0.06), '#ece7d8', '#7d7466', { lw: 1.5, j: 0.4 });
    shape(g, r, ell(53, 18, 8, 7, 9), '#ece7d8', '#7d7466', { lw: 1.4, j: 0.3 });
    g.fillStyle = '#1c1f26'; g.beginPath(); g.arc(60, 19, 1.6, 0, 7); g.fill();
    g.strokeStyle = '#1c1f26'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(52, 14); g.lineTo(55, 17); g.moveTo(55, 14); g.lineTo(52, 17); g.stroke();
    shape(g, r, [[14, 12], [24, 9], [40, 9], [46, 12], [34, 13], [22, 14]], '#ffffff', '#b8c4cf', { lw: 0.9, double: false });
  });
  mkSprite('bonepile', 40, 22, 20, 16, (g, r) => {
    shadow(g, 20, 16, 16, 4);
    for (const [x1, y1, x2, y2] of [[6, 14, 30, 10], [10, 8, 32, 15], [18, 16, 34, 6]]) {
      line(g, r, x1, y1, x2, y2, '#efe9da', 2.6, 0.4);
      g.fillStyle = '#efe9da'; g.beginPath(); g.arc(x1, y1, 2.2, 0, 7); g.arc(x2, y2, 2.2, 0, 7); g.fill();
    }
  });
  mkSprite('wsling', 26, 22, 13, 16, (g, r) => {
    shadow(g, 13, 16, 10, 3);
    line(g, r, 13, 16, 13, 9, '#6b4a32', 2.4, 0.3);
    line(g, r, 13, 10, 7, 3, '#6b4a32', 2, 0.3); line(g, r, 13, 10, 19, 3, '#6b4a32', 2, 0.3);
    g.strokeStyle = '#c8413d'; g.lineWidth = 1; g.beginPath(); g.moveTo(7, 3); g.quadraticCurveTo(13, 9, 19, 3); g.stroke();
  });
  mkSprite('wspear', 40, 16, 20, 10, (g, r) => {

    line(g, r, 4, 10, 26, 6, '#6b4a32', 2.2, 0.3);

  mkSprite('moss', 32, 18, 16, 12, (g, r) => {

  mkSprite('hut', 84, 76, 42, 62, (g, r) => {

      }

    if (!cand.length) continue;

// ---------- ground drawing in chunks ----------
const chunkCache = new Map();
let frameNo = 0;
function getChunk(cx, cy) {
  const key = cx + ',' + cy;
  let ch = chunkCache.get(key);
  if (!ch) {
    ch = { cv: buildChunk(cx, cy), used: 0 };
    chunkCache.set(key, ch);
    if (chunkCache.size > 16) {
      let oldK = null, oldU = Infinity;
      for (const [k, v] of chunkCache) if (v.used < oldU && v.used !== frameNo) { oldU = v.used; oldK = k; }
      if (oldK) chunkCache.delete(oldK);
    }
  }
  ch.used = frameNo;
  return ch.cv;
}
function buildChunk(cx, cy) {
  const gs = clamp(DPR * ZOOM, 1, 2);
  const c = document.createElement('canvas');
  c.width = Math.ceil(CPX * gs); c.height = Math.ceil(CPX * gs);
  const g = c.getContext('2d');
  g.scale(gs, gs); g.translate(-cx * CPX, -cy * CPX);
  g.fillStyle = TILE_COL[SNOW]; g.fillRect(cx * CPX, cy * CPX, CPX, CPX);
  const x0 = cx * CH - 1, y0 = cy * CH - 1, x1 = (cx + 1) * CH + 1, y1 = (cy + 1) * CH + 1;
  const blobPts = (x, y) => {
    const r = mulberry32((x * 7919 + y * 104729 + seed) | 0);
    return ell(x * T + T / 2 + (r() - 0.5) * 6, y * T + T / 2 + (r() - 0.5) * 6, T * 0.78, T * 0.74, 7, r, 0.35);
  };
  for (const type of [FOREST, VILL, ICE, ROCK, CAVE, SPRING, PEAK]) {
    const list = [];
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (tileAt(x, y) === type) list.push(blobPts(x, y));
    if (!list.length) continue;
    if (TILE_EDGE[type]) {
      g.strokeStyle = TILE_EDGE[type]; g.lineWidth = 3.2; g.lineJoin = 'round';
      for (const p of list) { trace(g, p, true, true); g.stroke(); }
    }
    g.fillStyle = TILE_COL[type];
    for (const p of list) { trace(g, p, true, true); g.fill(); }
  }
  // pencil details per tile
  g.lineCap = 'round';
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const t = tileAt(x, y), r = mulberry32((x * 31337 + y * 7331 + seed * 3) | 0), h = r();
    const bx = x * T, by = y * T;
    if (t === SNOW && h < 0.22) {
      line(g, r, bx + 6 + r() * 10, by + 10 + r() * 14, bx + 16 + r() * 10, by + 8 + r() * 14, '#c9d3dc', 1.2, 2);
    } else if (t === FOREST && h < 0.5) {
      for (let k = 0; k < 3; k++) { const px = bx + r() * T, py = by + r() * T; line(g, r, px, py, px + 3, py - 4, '#a9bdbd', 1, 0.5); }
    } else if (t === ICE && h < 0.25) {
      let px = bx + r() * T, py = by + r() * T;
      g.beginPath(); g.moveTo(px, py);
      for (let k = 0; k < 3; k++) { px += (r() - 0.5) * 22; py += (r() - 0.5) * 22; g.lineTo(px, py); }
      g.strokeStyle = '#ffffff'; g.lineWidth = 2; g.stroke();
      g.strokeStyle = '#8fbfd6'; g.lineWidth = 0.9; g.stroke();
    } else if (t === ROCK) {
      for (let k = 0; k < 3; k++) { const px = bx + r() * T, py = by + r() * T; line(g, r, px, py + 5, px + 5, py - 3, '#9d998f', 1, 0.4); }
    } else if (t === PEAK) {
      for (let k = 0; k < 5; k++) { const px = bx + r() * T, py = by + r() * T; line(g, r, px - 5, py + 5, px + 5, py - 5, '#58565b', 1, 0.5); line(g, r, px - 5, py - 5, px + 4, py + 4, '#636166', 0.8, 0.5); }
    } else if (t === CAVE) {
      for (let k = 0; k < 4; k++) { g.fillStyle = '#7d8aa0'; g.fillRect(bx + r() * T, by + r() * T, 1.6, 1.6); }
    } else if (t === VILL && h < 0.4) {
      for (let k = 0; k < 2; k++) { g.fillStyle = '#b8a487'; g.beginPath(); g.ellipse(bx + r() * T, by + r() * T, 2.5, 1.5, r(), 0, 7); g.fill(); }
    } else if (t === SPRING && h < 0.6) {
      g.strokeStyle = '#c8f0ea'; g.lineWidth = 1.2; g.beginPath(); g.ellipse(bx + 16, by + 16, 6 + r() * 4, 3, 0, 0, 7); g.stroke();
    }
  }

}

let babbleUntil = {};
function babble(text, voice, loud = 1) {
  if (!AC || muted || !text) return;
  let t = Math.max(AC.currentTime + 0.02, babbleUntil[voice.f] || 0);
  const words = text.split(/\s+/).filter(Boolean);
  let n = 0;
  for (const w of words) {
    const letters = w.replace(/[^a-z]/gi, '').length;
    const syl = Math.max(1, Math.round(letters / 3));
    for (let i = 0; i < syl && n < 18; i++, n++) {
      let f = voice.f * (1 + (Math.random() - 0.5) * 0.28);
      const last = i === syl - 1;
      if (last && /\?$/.test(w)) f *= 1.35;
      if (last && /[.!]$/.test(w)) f *= 0.85;
      bah(t, f, voice, loud);
      t += 0.085 + Math.random() * 0.02;
    }
    t += /[.!?,]$/.test(w) ? 0.16 : 0.03;
    if (n >= 18) break;
  }
  babbleUntil[voice.f] = t;
}

  o.type = voice.type;

  o.frequency.exponentialRampToValueAtTime(f * 0.92, when + 0.08);
  if (voice.wobble) {
    const lfo = AC.createOscillator(), lg = AC.createGain();

  flt.frequency.exponentialRampToValueAtTime(500, when + 0.08);
  g.gain.setValueAtTime(0, when);
  g.gain.linearRampToValueAtTime(voice.vol * loud, when + 0.008);
  g.gain.exponentialRampToValueAtTime(0.001, when + 0.085);
  o.connect(flt); flt.connect(g); g.connect(master);

}

function updateAudio(dt) {
  if (!AC) return;
  const now = AC.currentTime;
  const playing = state === 'play' || state === 'dead';
  const night = playing ? darkness(dayFrac()) / 0.8 : 0;
  let windAmt = 0.04;
  if (playing) {
    const t = tileAtW(player.x, player.y);
    windAmt = 0.035 + 0.04 * windNow() + (t === ROCK || t === PEAK ? 0.05 : 0) - (t === CAVE ? 0.03 : 0);
  }
  windGain.gain.setTargetAtTime(Math.max(0, windAmt), now, 0.5);
  windFilt.frequency.setTargetAtTime(380 + 300 * Math.sin(realT * 0.3) + 200 * Math.sin(realT * 0.71), now, 0.4);

  const bossOn = state === 'play' && (arena || enemies.some(e => e.type === 'boss' && e.hp > 0 && dist(e.x, e.y, player.x, player.y) < 650));
  droneGain.gain.setTargetAtTime(bossOn ? 0 : night * 0.05, now, 1);
  if (bossOn) {
    if (beatNext < now) beatNext = now + 0.05;
    const fast = arena && arena.spirit.phase === 3 ? 0.17 : arena ? 0.19 : 0.21;
    while (beatNext < now + 0.2) { bossStep(beatNext, beatStep++); beatNext += fast; }
    nextNote = now + 2.5;
    return;
  }
  beatStep = 0;
  if (now > nextNote - 0.1) {
    if (night > 0.5) {
      const n = NIGHT_NOTES[(Math.random() * NIGHT_NOTES.length) | 0];
      pianoNote(n, nextNote, 0.12, 4);
      if (Math.random() < 0.35) pianoNote(n * 1.0595, nextNote + 0.02, 0.06, 3);
      nextNote += 3 + Math.random() * 3;
    } else {
      const n = DAY_NOTES[(Math.random() * DAY_NOTES.length) | 0];
      pianoNote(n, nextNote, 0.16);
      if (Math.random() < 0.3) pianoNote(DAY_NOTES[Math.max(0, DAY_NOTES.indexOf(n) - 2)] / 2, nextNote, 0.1, 3.5);
      nextNote += 1.4 + Math.random() * 2.2;
    }
    if (nextNote < now) nextNote = now + 0.5;
  }
  if (playing && camp && camp.fuel > 0) {
    const d = dist(player.x, player.y, camp.fx, camp.fy);
    if (d < 260 && Math.random() < dt * 7) sfx.crackle(1 - d / 260);
  }
}

  const o = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain();
  o.type = 'sawtooth'; o.frequency.value = bass;

  if (i % 2 === 1) noise(0.03, 7000, 0.05, 'highpass', t);

  for (let j = -2; j <= 2; j++) for (let i = -2; i <= 2; i++) {

function gameUpdate(dt) {

  const moving = ml > 0.1;
  if (fade.phase !== 'none') { mx = my = 0; }
  if (S.sta <= 0) player.exhausted = true;
  if (player.exhausted && S.sta > 30) player.exhausted = false;
  const wantRun = keys.ShiftLeft || keys.ShiftRight || hold.run;
  const running = moving && wantRun && !player.exhausted;
  const sadWalk = S.warm < 30 || S.food < 30;
  const speed = (running ? 165 * (piecesN() >= 2 ? 1.1 : 1) : player.exhausted ? 70 : sadWalk ? 76 : 95);
  if (moving && player.fishing) { player.fishing = null; say('Oops, scared the fish away.', 1.2); }
  if (player.climb) {
    // up a tree: moving climbs back down
    player.x = player.climb.x; player.y = player.climb.y + 2;
    if (moving && !enemies.some(e => e.type === 'bear' && e.state === 'wait')) { player.climb = null; player.y += 14; }
  }
  player.moving = moving && fade.phase === 'none' && !player.climb;
  if (player.moving) {
    const vx = mx * speed * dt, vy = my * speed * dt;
    const ox = player.x, oy = player.y;
    if (!blocked(player.x + vx, player.y)) player.x += vx;
    if (!blocked(player.x, player.y + vy)) player.y += vy;
    const moved = dist(ox, oy, player.x, player.y);
    player.walk += moved * 0.16;
    player.stepD += moved;
    if (player.stepD > 13) {
      player.stepD = 0; player.foot ^= 1;
      const a = Math.atan2(my, mx), side = player.foot ? 1 : -1;
      const tl = tileAtW(player.x, player.y);
      if (tl !== CAVE && tl !== SPRING) prints.push({ x: player.x + Math.cos(a + Math.PI / 2) * 3 * side, y: player.y + Math.sin(a + Math.PI / 2) * 3 * side, a, t: 40 });
      if (prints.length > 140) prints.shift();
    }
    if (Math.abs(mx) > Math.abs(my)) player.dir = mx < 0 ? 'left' : 'right';
    else player.dir = my < 0 ? 'up' : 'down';
  }
  player.cool = Math.max(0, player.cool - dt);
  player.act = Math.max(0, player.act - dt);
  const k = 1 - Math.exp(-dt * 6);
  cam.x = lerp(cam.x, player.x, k); cam.y = lerp(cam.y, player.y - 10, k);

  // survival
  const tile = tileAtW(player.x, player.y);
  const night = darkness(t) / 0.8;
  const biomeMul = { [SNOW]: 1, [FOREST]: 0.85, [ICE]: 1.25, [ROCK]: 1.35, [PEAK]: 1.35, [CAVE]: 0.6, [VILL]: 0.9, [SPRING]: 0 }[tile];
  let warmRate = -0.62 * (1 + night * 0.75) * biomeMul * (1 + windNow() * 0.3) * ROBES[flags.robe || 0].mul * (flags.singed ? 1.35 : 1) * (piecesN() >= 1 ? 0.9 : 1);
  if (running) warmRate *= 0.8;
  let heat = 0, nearFire = false;
  if (camp && camp.fuel > 0) {
    const d = dist(player.x, player.y, camp.fx, camp.fy), R = FIRE_R[camp.level] * (0.55 + 0.45 * camp.fuel / 100);
    if (d < R) { heat += 9 * (1 - d / R * 0.6); nearFire = true; }
    if (dist(player.x, player.y, camp.tx, camp.ty) < 50) heat += 2 + camp.level * 1.5;
  }
  const dv = dist(player.x, player.y, vill.x, vill.y);
  if (dv < 110) { heat += 7 * (1 - dv / 110 * 0.6); nearFire = true; }
  if (tile === SPRING) heat += 7;
  if (player.torch > 0) heat += 2.5;
  S.warm = clamp(S.warm + (warmRate + heat) * dt, 0, 100);
  S.food = clamp(S.food - (running ? 0.5 : 0.33) * dt, 0, 100);
  const cold = S.warm < 30, hungry = S.food < 30;
  if (running) S.sta = clamp(S.sta - 22 * dt * (cold ? 1.5 : 1) * (hungry ? 1.5 : 1), 0, 100);
  else S.sta = clamp(S.sta + 16 * dt * (cold ? 0.5 : 1) * (hungry ? 0.5 : 1) * (piecesN() >= 4 ? 1.35 : 1), 0, 100);
  if (S.warm <= 0) { S.hp -= 2.5 * dt; deathCause = 'cold'; }
  if (S.food <= 0) { S.hp -= 1.5 * dt; if (S.warm > 0) deathCause = 'hunger'; }
  if (S.warm > 40 && S.food > 40) S.hp = Math.min(100, S.hp + 0.6 * dt);
  if (S.hp <= 0) { S.hp = 0; die(deathCause || 'cold'); return; }

  updateCombat(dt);
  updateEnemies(dt, running);
  updateBosses(dt);
  if (S.hp <= 0) { S.hp = 0; die(deathCause || 'cold'); return; }

  // the kid talks about how they feel
  if (S.warm < 25 && !flags.cold) { flags.cold = true; say(nearFire ? 'Warming up...' : "So cold... I need a fire, or a hot spring."); }
  if (S.warm > 50) flags.cold = false;
  if (S.food < 25 && !flags.hungry) { flags.hungry = true; say('My tummy hurts. I need food. (Q to eat)'); }
  if (S.food > 50) flags.hungry = false;
  const nowNight = t >= 0.62;
  if (nowNight && !lastNight) {
    say(camp ? "It's getting dark. Something big walks around at night. I'd better stay by my fire." : "It's getting dark... I need a fire. The village one is the only one I know.", 4.5);
    if (owl.on) sfx.hoot();
  }
  lastNight = nowNight;
  if (!camp) for (const s of spots) if (!flags.spotSeen[s.name] && dist(player.x, player.y, s.x, s.y) < T * 6) {
    flags.spotSeen[s.name] = true; s.found = true;
    say(`This place feels cozy... (${s.name})`);
  }

  // fishing
  if (player.fishing) {
    player.fishing.t += dt;
    if (player.fishing.t >= player.fishing.need) {
      const r = Math.random(), kind = r < 0.6 ? 'cod' : r < 0.9 ? 'perch' : 'char';
      inv[kind]++;
      floatText(`+1 ${ITEMS[kind].name.toLowerCase()}!`, player.x, player.y - 46, '#2a6a8a');
      sfx.splash();
      for (let i = 0; i < 8; i++) parts.push({ x: player.fishing.hx, y: player.fishing.hy, vx: (Math.random() - 0.5) * 50, vy: -30 - Math.random() * 40, t: 0.6, kind: 'drop' });
      if (!flags.firstFish) { flags.firstFish = true; say(kind === 'char' ? 'A rare silver char! Lucky!' : 'A fish! Cooking it at my fire would be best.'); }
      else if (kind === 'char') say('A silver char! Those are rare.');
      player.fishing = null;
    }
  }

  // camp fire
  if (camp && camp.fuel > 0) {
    camp.fuel = Math.max(0, camp.fuel - 100 / FIRE_LIFE[camp.level] * dt);
    if (camp.fuel <= 0 && dist(player.x, player.y, camp.fx, camp.fy) < 400) say('The fire went out! I need 2 sticks to light it again.');
    if (Math.random() < dt * (2 + camp.fuel / 20)) parts.push({ x: camp.fx + (Math.random() - 0.5) * 8, y: camp.fy - 10, vx: (Math.random() - 0.5) * 12, vy: -30 - Math.random() * 30, t: 0.8 + Math.random() * 0.6, kind: 'spark' });
    if (camp.level === 2 && Math.random() < dt * 4) parts.push({ x: camp.tx + 33, y: camp.ty - 78, vx: 6 + windNow() * 10, vy: -14, t: 2.5, kind: 'smoke' });
  }
  if (Math.random() < dt * 5) parts.push({ x: vill.x + (Math.random() - 0.5) * 16, y: vill.y - 14, vx: (Math.random() - 0.5) * 14, vy: -35 - Math.random() * 30, t: 0.9, kind: 'spark' });
  for (const s of springs) if (Math.random() < dt * 3 && dist(s.x, s.y, cam.x, cam.y) < 700)
    parts.push({ x: s.x + (Math.random() - 0.5) * 60, y: s.y + (Math.random() - 0.5) * 40, vx: 4, vy: -12, t: 2.2, kind: 'steam' });

  // world ticks once a second
  tickT += dt;
  if (tickT >= 1) {
    tickT = 0;
    spawnTick();
    shrineTick();
    for (const o of objs) if (o.stock <= 0 && o.regrowAt && gameTime >= o.regrowAt && !o.gone) { o.stock = OT[o.type].stock; o.regrowAt = 0; }
    let spoiled = 0;
    for (const k of ['ckBugs', 'ckCod', 'ckPerch', 'ckChar', 'ckMeat']) while (inv[k].length && inv[k][0] <= gameTime) { inv[k].shift(); spoiled++; }
    if (spoiled) say(`Ew. ${spoiled} cooked thing${spoiled > 1 ? 's' : ''} went bad.`);
  }
  const ti = Math.floor(player.y / T) * W + Math.floor(player.x / T);
  if (ti !== lastTile) { lastTile = ti; reveal(); }

  // the owl
  if (owl.on) {
    owl.flap += dt * 14;
    const side = player.dir === 'left' ? 1 : -1;
    let tx = player.x + side * 22, ty = player.y + 6;
    // the owl flies toward danger to show you where it is
    const danger = enemies.find(e => (e.type === 'yeti' && e.state !== 'leave' && dist(e.x, e.y, player.x, player.y) < 450) || (e.type === 'bear' && (e.state === 'chase' || (e.state === 'wander' && dist(e.x, e.y, player.x, player.y) < 320))));
    owl.warn = !!danger;
    if (danger) { tx = lerp(player.x, danger.x, 0.55); ty = lerp(player.y, danger.y, 0.55); owl.still = 0; }
    owl.still = player.moving ? 0 : owl.still + dt;
    const d = dist(owl.x, owl.y, tx, ty);
    const flying = d > 30 || owl.still < 1.2 || owl.warn;
    const sp = Math.min(1, dt * (d > 200 ? 3 : 2.2));
    owl.x = lerp(owl.x, tx, sp); owl.y = lerp(owl.y, ty, sp);
    owl.z = lerp(owl.z, flying ? (owl.warn ? 46 : 30) : 0, Math.min(1, dt * 3));
    if (Math.abs(tx - owl.x) > 2) owl.face = tx > owl.x ? 1 : -1;
    owl.hootT -= dt;
    if (owl.hootT <= 0) { owl.hootT = 25 + Math.random() * 30; if (night > 0.5) sfx.hoot(); }
  }
  // villagers wander a little
  const inVill = dist(player.x, player.y, vill.x, vill.y) < 230;
  villT = inVill ? villT + dt : Math.max(0, villT - dt * 3);
  const kael = villagers[2];
  if (!kael.mode && villT > 45 && !kaelWarned) { kaelWarned = true; speak(kael, "Kael: Hey, mask kid. You've been here too long.", 3.5); }
  if (!kael.mode && villT > 60) { kael.mode = 'chase'; speak(kael, 'Kael: OUT! Get out of our village!', 3); say('He has a torch! Run! (Shift)', 2.5); }
  if (villT === 0) kaelWarned = false;
  const mira = villagers[1];
  if (mira.hasDrawing === false && dayNum() > mira.burnDay) mira.hasDrawing = true;
  for (const v of villagers) {
    let speed = 30;
    if (v.mode === 'chase') {
      v.tx = player.x; v.ty = player.y; speed = 108;
      if (dist(v.x, v.y, player.x, player.y) < 16) {
        singeRobe();
        v.mode = 'return'; villT = 0;
        speak(v, 'Kael: And stay out!', 3);
      } else if (dist(player.x, player.y, vill.x, vill.y) > 340) {
        v.mode = 'return'; villT = 0;
        speak(v, 'Kael: Yeah, run! And stay out!', 3);
      }
    } else if (v.mode === 'return') {
      v.tx = v.hx; v.ty = v.hy; speed = 60;
      if (dist(v.x, v.y, v.hx, v.hy) < 4) v.mode = null;
    } else if (v.mode === 'burn') {
      v.tx = vill.x + (v.x < vill.x ? -20 : 20); v.ty = vill.y + 6; speed = 55;
      if (dist(v.x, v.y, v.tx, v.ty) < 4) {
        v.mode = null; v.hasDrawing = false; v.burnDay = dayNum(); v.wait = 3;
        pileFlare = 1.6; burstSparks(vill.x, vill.y - 10, 24); sfx.sizzle();
        speak(v, 'Mira: Into the fire! Ha ha!', 3);
        setTimeout(() => { if (state === 'play') say('...that was my drawing of the owl.', 3.5); }, 1200);
      }
    } else {
      v.wait -= dt;
      if (v.wait <= 0) {
        if (v.teen) {
          // Wren roams between the edge of the village and the woods
          for (let k = 0; k < 10; k++) {
            const a = Math.random() * Math.PI * 2, rr = T * (5 + Math.random() * 6);
            const nx = vill.x + Math.cos(a) * rr, ny = vill.y + Math.sin(a) * rr, t = tileAtW(nx, ny);
            if (t !== PEAK && t !== SPRING && t !== CAVE) { v.tx = nx; v.ty = ny; break; }
          }
          v.wait = 6 + Math.random() * 8;
        } else { v.tx = v.hx + (Math.random() - 0.5) * 60; v.ty = v.hy + (Math.random() - 0.5) * 50; v.wait = 2 + Math.random() * 4; }
      }
      if (v.teen) speed = 38;
      if (v.teen && v.say && dist(v.x, v.y, player.x, player.y) < 60) speed = 0;
    }
    const dx = v.tx - v.x, dy = v.ty - v.y, l = Math.hypot(dx, dy);
    if (l > 2 && speed) { const st = Math.min(l, speed * dt); v.x += dx / l * st; v.y += dy / l * st; v.walk += dt * (speed > 60 ? 10 : 5); if (Math.abs(dx) > 1) v.dir = dx > 0 ? 1 : -1; }
    if (v.say) { v.say.t -= dt; if (v.say.t <= 0) v.say = null; }
  }
  pileFlare = Math.max(0, pileFlare - dt);

  // particles, footprints, texts
  for (const p of parts) { p.t -= dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.kind === 'drop' || p.kind === 'dust') p.vy += 120 * dt; }
  parts = parts.filter(p => p.t > 0);
  if (parts.length > 400) parts.splice(0, parts.length - 400);
  for (const f of prints) f.t -= dt;
  while (prints.length && prints[0].t <= 0) prints.shift();
  for (const f of floats) { f.t -= dt; f.y -= 22 * dt; }
  floats = floats.filter(f => f.t > 0);
  for (const tt of toasts) tt.t -= dt;
  toasts = toasts.filter(tt => tt.t > 0);
  if (speech) { speech.t -= dt; if (speech.t <= 0) speech = null; }
  for (const o of shaking) o.shake -= dt;
  shaking = shaking.filter(o => o.shake > 0);
  if (helpT > 0) helpT -= dt;
  updateSnow(dt, player.moving ? mx * speed : 0, player.moving ? my * speed : 0);

  target = fade.phase === 'none' ? findTarget() : null;
  saveT += dt;
  if (saveT > 20) { saveT = 0; saveGame(); }
}

// ---------- step 2: enemies, weapons, the bear's bait and the masked traders ----------
const WEAPONS = {
  torch: { name: 'Torch', reach: 40, dmg: 2, cool: 0.5 },
  rockball: { name: 'Rock snowball', range: 230, dmg: 1, cool: 0.55, speed: 260 },
  slingshot: { name: 'Slingshot', range: 330, dmg: 1, cool: 0.45, speed: 390, ammo: 'stones' },
  spear: { name: 'Icicle spear', reach: 46, dmg: 2, cool: 0.4 },
  club: { name: 'Bone club', reach: 42, dmg: 3, cool: 0.8 },
};
const TORCH_TIME = 90, SPEAR_USES = 12;
const DIRV = { down: [0, 1], up: [0, -1], left: [-1, 0], right: [1, 0] };
const SHOP = [
  { k: 'slingshot', name: 'Slingshot', price: 6 },
  { k: 'spear', name: 'Icicle spear', price: 4 },
  { k: 'scraps', name: 'Robe scrap', price: 5 },
  { k: 'ckCod', name: 'Cooked fish', price: 2 },
  { k: 'stones', name: '5 stones', price: 1, amt: 5 },
];
const TRADER_LINES = [
  'Shards... you have shards? Let us trade.',
  'Five pieces of an old mask hide in the snow. We keep them safe. Not yet, little one.',
  'Your mask cries. Ours smiles. Both hide something.',
  'The Yeti hates fire. Carry a torch at night.',
];
let enemies = [], proj = [], drops = [], baits = [], traders = [];
let spawnT = 0, yetiNight = 0, beatT = 0, hurtFlash = 0, frostFlash = 0, camShake = 0;
let shopOpen = null, campOpen = false;
const hardness = () => 1 + 0.1 * (flags.pieces || 0);

function fireSafe(x, y, pad = 0) {
  if (camp && camp.fuel > 0 && dist(x, y, camp.fx, camp.fy) < FIRE_R[camp.level] + pad) return true;
  return dist(x, y, vill.x, vill.y) < 240 + pad;
}
function nearestEnemy(pred, maxD) {
  let best = null, bd = maxD;
  for (const e of enemies) { if (!pred(e)) continue; const d = dist(e.x, e.y, player.x, player.y); if (d < bd) { bd = d; best = e; } }
  return best;
}
function moveEnt(e, tx, ty, speed, dt) {
  const dx = tx - e.x, dy = ty - e.y, l = Math.hypot(dx, dy);
  if (l < 2) return false;
  const st = Math.min(l, speed * dt), vx = dx / l * st, vy = dy / l * st;
  const ok = (x, y) => tileAtW(x, y) !== PEAK && !(camp && dist(x, y, camp.tx, camp.ty) < 30);
  if (ok(e.x + vx, e.y)) e.x += vx;
  if (ok(e.x, e.y + vy)) e.y += vy;
  e.walk = (e.walk || 0) + st * 0.12;
  if (Math.abs(dx) > 1) e.dir = dx > 0 ? 1 : -1;
  return true;
}
function spawnPoint(minD, maxD, okTiles, awayFromFire) {
  for (let k = 0; k < 20; k++) {
    const a = Math.random() * Math.PI * 2, d = minD + Math.random() * (maxD - minD);
    const x = player.x + Math.cos(a) * d, y = player.y + Math.sin(a) * d;
    if (x < 3 * T || y < 3 * T || x > (W - 3) * T || y > (H - 3) * T) continue;
    if (!okTiles.includes(tileAtW(x, y))) continue;
    if (fireSafe(x, y, awayFromFire)) continue;
    return [x, y];
  }
  return null;
}

// ---------- spawning (once a second) ----------
function spawnTick() {
  const t = dayFrac(), night = t >= 0.62 || t < 0.04;
  // snowmen
  const nearSnow = enemies.filter(e => e.type === 'snowman' && dist(e.x, e.y, player.x, player.y) < 1000).length;
  if (gameTime > DAY * 0.15 && nearSnow < (night ? 5 : 4) && Math.random() < 0.35) {
    const p = spawnPoint(480, 760, [SNOW, FOREST, ROCK, ICE], 220);
    if (p) enemies.push({ type: 'snowman', x: p[0], y: p[1], hp: 3, cool: 1.5 + Math.random() * 2, hopT: Math.random(), dir: 1, flash: 0, dead: 0, hat: Math.random() < 0.4 });
  }
  // polar bears
  const nearBears = enemies.filter(e => e.type === 'bear' && dist(e.x, e.y, player.x, player.y) < 1500).length;
  if (gameTime > DAY * 0.35 && nearBears < 1 && Math.random() < 0.05) {
    const p = spawnPoint(650, 950, [FOREST, ICE, SNOW, ROCK], 350);
    if (p) enemies.push({ type: 'bear', x: p[0], y: p[1], state: 'wander', t: 0, tx: p[0], ty: p[1], dir: 1, walk: 0, calm: 0, flash: 0 });
  }
  // the Yeti comes once a night
  if (night && t >= 0.62 && yetiNight !== dayNum() && !enemies.some(e => e.type === 'yeti')) {
    const p = spawnPoint(650, 850, [SNOW, FOREST, ROCK, ICE, CAVE], 200);
    if (p) {
      yetiNight = dayNum();
      enemies.push({ type: 'yeti', x: p[0], y: p[1], state: 'hunt', t: 0, lx: p[0], ly: p[1], dir: 1, walk: 0, flash: 0, growlT: 3 });
    }
  }
  // forget enemies that are far away
  enemies = enemies.filter(e => {
    const d = dist(e.x, e.y, player.x, player.y);
    if (e.type === 'snowman') return d < 1300 && !(e.hp <= 0 && e.dead <= 0.02);
    if (e.type === 'bear') return d < 1800 || e.state === 'chase';
    if (e.type === 'boss') return e.hp > 0 && d < 1000;
    if (e.type === 'wolf') return e.hp > 0 && d < 800 && (enemies.includes(e.leader) || e.state === 'flee');
    return !(e.state === 'leave' && d > 950);
  });
}

// ---------- enemy brains ----------
function updateEnemies(dt, running) {
  const t = dayFrac(), day = t > 0.05 && t < 0.6, hard = hardness();
  const safe = fireSafe(player.x, player.y);
  for (const e of enemies) {
    e.flash = Math.max(0, (e.flash || 0) - dt);
    const d = dist(e.x, e.y, player.x, player.y);
    if (e.type === 'snowman') {
      if (e.hp <= 0) { e.dead = Math.max(0, e.dead - dt * 0.8); continue; }
      e.hopT += dt * 2.4;
      e.throwAnim = Math.max(0, (e.throwAnim || 0) - dt);
      if (d < 320) e.aware = true; else if (d > 700) e.aware = false;
      if (!e.aware) continue;
      // hop closer, but keep a little distance, and never into a fire's light
      let tx = e.x, ty = e.y;
      if (d > 140) { tx = player.x; ty = player.y; }
      else if (d < 90) { tx = e.x + (e.x - player.x); ty = e.y + (e.y - player.y); }
      const sp = 42 * hard * (Math.sin(e.hopT * Math.PI) > 0 ? 1.4 : 0.3);
      const nx = e.x + Math.sign(tx - e.x) * 3, ny = e.y + Math.sign(ty - e.y) * 3;
      if (!fireSafe(nx, ny, 40)) moveEnt(e, tx, ty, sp, dt);
      e.dir = player.x > e.x ? 1 : -1;
      e.cool -= dt;
      if (e.cool <= 0 && d < 280 && !player.climb) {
        e.cool = (2.2 + Math.random() * 1.2) / hard; e.throwAnim = 0.35;
        const sx = e.x + e.dir * 10, sy = e.y - 30, tx2 = player.x + (Math.random() - 0.5) * 16, ty2 = player.y - 12;
        const l = dist(sx, sy, tx2, ty2), sp2 = 170;
        proj.push({ x: sx, y: sy, vx: (tx2 - sx) / l * sp2, vy: (ty2 - sy) / l * sp2, from: 'snowman', kind: 'snowball', life: 2, life0: 2 });
        sfx.throw();
      }
    } else if (e.type === 'bear') {
      e.calm = Math.max(0, e.calm - dt);
      if (e.state === 'wander') {
        if (dist(e.x, e.y, e.tx, e.ty) < 6 || Math.random() < dt * 0.1) { e.tx = e.x + (Math.random() - 0.5) * 300; e.ty = e.y + (Math.random() - 0.5) * 300; }
        if (!fireSafe(e.tx, e.ty, 120)) moveEnt(e, e.tx, e.ty, 28, dt);
        if (d < 190 && !e.calm && !player.climb && !safe) {
          e.state = 'chase'; sfx.roar(); camShake = 0.4;
          if (!flags.bearTip) { flags.bearTip = true; say('A polar bear! RUN! Climb a tree (E) or throw it a fish (F)!', 4.5); }
          else say('A polar bear! Run!', 2);
        }
      } else if (e.state === 'chase') {
        moveEnt(e, player.x, player.y, 128 * hard, dt);
        if (player.climb) { e.state = 'wait'; e.t = 7; }
        else if (safe) { e.state = 'leave'; e.t = 6; say('It is scared of the fire.', 2); }

// ---------- step 3: the five shrines, their guardians, the mask, the castle and the Frost Spirit ----------
const GUARDIANS = [
  { kind: 'gsnow', name: 'Giant Snowman', tiles: [SNOW], hp: 30, r: 30 },
  { kind: 'wolf', name: 'Ice Wolf pack', tiles: [FOREST], hp: 14, r: 20 },
  { kind: 'bking', name: 'Old Bear King', tiles: [ICE], hp: 30, r: 34 },
  { kind: 'yking', name: 'King Yeti', tiles: [ROCK], hp: 32, r: 34 },
  { kind: 'golem', name: 'Ice Golem', tiles: [CAVE], hp: 34, r: 28 },

const POWERS = [
  'Your warmth lasts a little longer.',
  'You run a little faster.',
  'You can see farther in the dark.',
  'Your energy comes back faster.',
  'The old mask is whole.',

let shrines = [], castle = null, arena = null, bossT = 0;
const piecesN = () => flags.pieces || 0;

// picked during world making, with their own random numbers so the rest of the world stays the same
function placeShrines(dst) {
  const R = mulberry32(seed + 4242);
  shrines = [];
  const far = (x, y, d) => shrines.every(s => Math.hypot(s.tx - x, s.ty - y) >= d) && spots.every(s => Math.hypot(s.tx - x, s.ty - y) >= 14);
  const open = (x, y) => { for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) if (tileAt(x + dx, y + dy) === PEAK) return false; return true; };
  GUARDIANS.forEach((g, i) => {
    let cand = [];
    for (let k = 0; k < W * H; k++) {
      if (dst[k] < 25 || dst[k] > 90) continue;
      const x = k % W, y = (k / W) | 0;
      if (g.tiles.includes(tiles[k]) && open(x, y) && far(x, y, 22)) cand.push(k);
    }
    if (!cand.length) for (let k = 0; k < W * H; k++) {
      const x = k % W, y = (k / W) | 0;
      if (dst[k] >= 20 && tiles[k] !== SPRING && tiles[k] !== VILL && open(x, y) && far(x, y, 16)) cand.push(k);
    }
    if (!cand.length) return;
    const k = cand[(R() * cand.length) | 0], x = k % W, y = (k / W) | 0;
    shrines.push({ i, tx: x, ty: y, x: x * T + T / 2, y: y * T + T / 2, g });
  });
  // the frozen castle goes far away, in an open spot
  let best = -1, bk = -1;
  for (let k = 0; k < W * H; k++) {
    const x = k % W, y = (k / W) | 0;
    if (dst[k] < 30 || tiles[k] === SPRING || tiles[k] === VILL || tiles[k] === ICE) continue;
    let ok = true;
    for (let dy = -4; dy <= 3 && ok; dy++) for (let dx = -4; dx <= 4; dx++) if (tileAt(x + dx, y + dy) === PEAK) { ok = false; break; }
    if (!ok || !far(x, y, 14)) continue;
    const score = dst[k] + R() * 20;
    if (score > best) { best = score; bk = k; }
  }
  if (bk < 0) bk = (vill.ty + 20) * W + vill.tx;
  castle = { tx: bk % W, ty: (bk / W) | 0 };
  castle.x = castle.tx * T + T / 2; castle.y = castle.ty * T + T / 2;
}
const nearShrineOrCastle = (x, y) => shrines.some(s => Math.hypot(s.tx - x, s.ty - y) < 4) || (castle && Math.hypot(castle.tx - x, castle.ty - y) < 6);

// ---------- guardians ----------

}
function spawnGuardian(s) {

  const e = { type: 'boss', kind: g.kind, name: g.name, si: s.i, x: s.x, y: s.y + 70, hx: s.x, hy: s.y, hp: Math.round(g.hp * hard), max: Math.round(g.hp * hard), r: g.r, state: 'idle', t: 0, cool: 2, dir: 1, walk: 0, flash: 0, hopT: 0 };

function updateBosses(dt) {
  const hard = hardness();
  const torch = player.torch > 0;
  for (const e of enemies) {
    if (e.type !== 'boss' && e.type !== 'wolf') continue;
    e.flash = Math.max(0, e.flash - dt);
    const d = dist(e.x, e.y, player.x, player.y);
    const toP = () => { const l = d || 1; return [(player.x - e.x) / l, (player.y - e.y) / l]; };
    if (e.type === 'wolf' || e.kind === 'wolf') {
      // wolves circle you and lunge; they keep away from a torch
      if (e.type === 'wolf' && e.leader.hp <= 0) { e.state = 'flee'; }
      if (e.state === 'flee') { moveEnt(e, e.x + (e.x - player.x), e.y + (e.y - player.y), 120, dt); continue; }
      e.ang = (e.ang || 0) + dt * 0.9;
      const R = torch ? 170 : 105;
      if (e.state === 'lunge') {
        e.t -= dt;
        e.x += e.lx * 270 * dt; e.y += e.ly * 270 * dt;
        if (!e.bit && d < 20) { e.bit = true; hurt(e.type === 'boss' ? 14 : 10, 'wolf'); sfx.splat(); }
        if (e.t <= 0 || tileAtW(e.x, e.y) === PEAK) { e.state = 'circle'; e.cool = 2 + Math.random() * 2; }
      } else {
        moveEnt(e, player.x + Math.cos(e.ang) * R, player.y + Math.sin(e.ang) * R * 0.7, 105 * hard, dt);
        e.cool -= dt;
        if (e.cool <= 0 && !torch && d < 200 && !player.climb) {
          const [lx, ly] = toP(); e.lx = lx; e.ly = ly; e.state = 'lunge'; e.t = 0.5; e.bit = false; sfx.growl();
        }
      }
      continue;
    }
    if (e.kind === 'gsnow') {
      // too close and it belly-flops onto you
      if (e.state === 'flop') {
        e.t -= dt;
        if (e.t <= 0) { if (d < 70 && !player.climb) hurt(18, 'gsnow'); camShake = 0.5; sfx.poof(); e.state = 'idle'; e.flopCool = 3; for (let i = 0; i < 12; i++) parts.push({ x: e.x, y: e.y, vx: (Math.random() - 0.5) * 120, vy: -30 - Math.random() * 40, t: 0.6, kind: 'snow' }); }
        continue;
      }
      e.flopCool = Math.max(0, (e.flopCool || 0) - dt);
      if (d < 60 && !e.flopCool) { e.state = 'flop'; e.t = 0.75; sfx.growl(); continue; }
      e.hopT += dt * 1.6;
      if (d > 120) moveEnt(e, player.x, player.y, 30 * hard * (Math.sin(e.hopT * Math.PI) > 0 ? 1.5 : 0.2), dt);
      e.dir = player.x > e.x ? 1 : -1;
      e.cool -= dt; e.throwAnim = Math.max(0, (e.throwAnim || 0) - dt);
      if (e.cool <= 0 && d < 420) {
        e.cool = 3 / hard; e.throwAnim = 0.4;
        for (const spread of [-0.25, 0, 0.25]) {
          const a = Math.atan2(player.y - 12 - (e.y - 70), player.x - e.x) + spread;
          proj.push({ x: e.x, y: e.y - 70, vx: Math.cos(a) * 190, vy: Math.sin(a) * 190, from: 'boss', kind: 'bigball', warm: 10, life: 2.4, life0: 2.4 });
        }
        sfx.throw();
      }
      e.summon = (e.summon || 6) - dt;
      if (e.summon <= 0) {
        e.summon = 9;
        if (enemies.filter(m => m.type === 'snowman' && m.hp > 0 && dist(m.x, m.y, e.x, e.y) < 400).length < 4)
          for (const s of [-1, 1]) enemies.push({ type: 'snowman', x: e.x + s * 60, y: e.y + 20, hp: 2, cool: 2, hopT: 0, dir: 1, flash: 0, dead: 0, aware: true });
      }
    } else if (e.kind === 'bking') {
      // it scrapes the ground, charges in a straight line, then gets dizzy
      if (e.state === 'idle' || e.state === 'stalk') {
        e.state = 'stalk';
        moveEnt(e, player.x, player.y, 50 * hard, dt);
        e.cool -= dt;
        if (e.cool <= 0 && d < 330) { e.state = 'windup'; e.t = 1; const [lx, ly] = toP(); e.lx = lx; e.ly = ly; e.dir = lx > 0 ? 1 : -1; sfx.growl(); }
      } else if (e.state === 'windup') {
        e.t -= dt;
        if (e.t <= 0) { e.state = 'charge'; e.t = 0.9; e.bit = false; sfx.roar(); }
      } else if (e.state === 'charge') {
        e.t -= dt;
        const nx = e.x + e.lx * 310 * hard * dt, ny = e.y + e.ly * 310 * hard * dt;
        if (tileAtW(nx, ny) === PEAK) e.t = 0; else { e.x = nx; e.y = ny; }
        e.walk += dt * 14;
        if (!e.bit && d < 34 && !player.climb) { e.bit = true; hurt(25, 'bking'); }
        if (e.t <= 0) { e.state = 'dizzy'; e.t = 2.2; camShake = 0.3; }
      } else if (e.state === 'dizzy') {
        e.t -= dt;
        if (e.t <= 0) { e.state = 'stalk'; e.cool = 1.6; }
      }
    } else if (e.kind === 'yking') {
      if (e.state === 'scared') { e.t -= dt; moveEnt(e, e.x + (e.x - player.x), e.y + (e.y - player.y), 90, dt); if (e.t <= 0) e.state = 'idle'; continue; }
      if (torch && d < 120) { e.state = 'scared'; e.t = 2.5; sfx.roar(); continue; }
      if (e.state === 'slam') {
        e.t -= dt;
        if (e.t <= 0 && !e.wave) { e.wave = 0.01; camShake = 0.5; sfx.poof(); }
        if (e.wave) {
          e.wave += dt * 190;
          if (!e.bit && Math.abs(d - e.wave) < 14 && !player.climb) { e.bit = true; hurt(20, 'yking'); }
          if (e.wave > 130) { e.wave = 0; e.state = 'idle'; e.cool = 2.5; }
        }

}

// ---------- main loop ----------
function render() {
  frameNo++;
  hits = [];
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = true;
  if (state === 'title') { drawTitle(); return; }
  if (state === 'story') { drawStory(); return; }
  if (state === 'ending') { drawEnding(); drawFade(); return; }
  if (arena) drawArena();
  else { drawWorld(); drawHUD(); }
  if (mapOpen) drawMap();
  if (bagOpen) drawBag();
  if (shopOpen) drawShop();
  if (campOpen) drawCampMenu();
  if (paused) { hits = []; drawPause(); }
  if (state === 'dead') { hits = []; drawDead(); }
  drawFade();
}
let last = performance.now();
function frame(now) {
  const dt = clamp((now - last) / 1000, 0, 0.05);
  last = now;
  try { update(dt); render(); }
  catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
resize();
addEventListener('resize', resize);
buildSprites();
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') { saveGame(); paused = true; } });
requestAnimationFrame(frame);
</script>
</body>
</html>
