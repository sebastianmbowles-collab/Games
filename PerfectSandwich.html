<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Perfect Sandwich</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#1b1b2f; color:#fff; font-family:'Press Start 2P',monospace;
         display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:12px 16px; }
  canvas { width:min(100%, 960px); aspect-ratio:16/9; image-rendering:pixelated; border:4px solid #000;
           background:#000; touch-action:none; display:block; }
  #pad { display:none; width:min(100%, 960px); justify-content:space-between; margin-top:12px; gap:12px; }
  #pad div { display:flex; gap:12px; }
  #pad button { font:inherit; font-size:18px; width:64px; height:64px; border:4px solid #000; border-radius:8px;
                background:#ffd36b; color:#000; touch-action:none; user-select:none; }
  @media (pointer:coarse) { #pad { display:flex; } }
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<div id="pad">
  <div><button data-k="left">◀</button><button data-k="right">▶</button></div>
  <div><button id="bPause">II</button><button id="bSound">♪</button></div>
  <div><button data-k="act">E</button><button data-k="jump">▲</button></div>
</div>
<script>
// Everything is drawn on a tiny 320x180 "pixel" world, blown up 3x so it looks retro.
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const S = 3, VW = 320, VH = 180, GROUND = 150, PRICE = 30;
ctx.imageSmoothingEnabled = false;

// ---------- input ----------
const keys = {}, pressed = {}, raw = {};
const KEYMAP = { ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right', ArrowUp:'jump', KeyW:'jump',
                 Space:'jump', KeyE:'act', ArrowDown:'act', KeyS:'act', Enter:'act' };
function down(k) { if (!keys[k]) pressed[k] = true; keys[k] = true; }
function up(k) { keys[k] = false; }
addEventListener('keydown', e => {
  raw[e.code] = true;
  if (!e.repeat) {
    if (e.code === 'KeyM') muted = !muted;
    if (e.code === 'KeyP' && !screen) paused = !paused;
    if (e.code === 'KeyN') pressed.newGame = true;
  }
  const k = KEYMAP[e.code]; if (k) { e.preventDefault(); down(k); }
});
addEventListener('keyup', e => { raw[e.code] = false; const k = KEYMAP[e.code]; if (k) up(k); });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; for (const k in raw) raw[k] = false; });
document.querySelectorAll('#pad button').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); down(k); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => up(k)));
});
const pointer = { x:160, y:90, moved:false };
function pointerPos(e) {
  const r = cv.getBoundingClientRect();
  pointer.x = (e.clientX - r.left) / r.width * VW; pointer.y = (e.clientY - r.top) / r.height * VH; pointer.moved = true;
}
cv.addEventListener('pointermove', pointerPos);
cv.addEventListener('pointerdown', e => { pointerPos(e); pressed.tap = true; pointer.down = true; });
addEventListener('pointerup', () => { pointer.down = false; });
addEventListener('pointercancel', () => { pointer.down = false; });
document.getElementById('bPause').addEventListener('pointerdown', e => { e.preventDefault(); if (!screen) paused = !paused; });
document.getElementById('bSound').addEventListener('pointerdown', e => { e.preventDefault(); muted = !muted; });

// ---------- sound ----------
let AC, muted = false, paused = false;
function beep(f, d = .08, type = 'square', v = .05) {
  if (muted) return;
  try {
    AC = AC || new AudioContext();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f; g.gain.value = v;
    g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + d);
    o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime + d);
  } catch (e) { /* no sound, no problem */ }
}
// every place has its own little song (0 = rest). "every" = how many 40ms ticks per note
const TUNES = {
  street: { mel:[72,0,76,0,79,0,76,0,74,0,77,0,81,0,77,0,72,0,76,0,79,0,84,0,83,0,79,0,74,0,0,0], bass:[48,48,53,53,48,48,55,55], every:4, bassEvery:4 },
  inside: { mel:[67,0,0,72,0,0,71,0,0,67,0,0,69,0,0,65,0,0,64,0,0,0,0,0], bass:[48,43,45,41], every:5, bassEvery:6 },
  job:    { mel:[76,79,76,72,74,77,74,71,72,76,79,84,83,79,74,0], bass:[48,55,53,55], every:3, bassEvery:4 },
  jail:   { mel:[69,0,72,0,71,0,68,0,69,0,0,0,64,0,0,0], bass:[45,40], every:6, bassEvery:8 },
  title:  { mel:[60,64,67,72,0,67,72,76,0,72,76,79,84,0,0,0], bass:[48,53,55,48], every:4, bassEvery:4 },
  end:    { mel:[72,76,79,84,0,79,84,0,0,0,88,0,0,0,0,0], bass:[48,53,55,60], every:3, bassEvery:4 },
  secret: { mel:[70,0,73,0,75,0,78,0,77,0,73,0,0,0,0,0], bass:[46,42], every:5, bassEvery:8 },
};
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function tuneName() {
  if (screen) return { title:'title', jail:'jail', pay:'job', end:'end', secret:'secret' }[screen.type];
  if (mini) return 'job';
  return scene === 'street' ? 'street' : 'inside';
}
let tick = 0, step = 0, curTune = '';
setInterval(() => {
  if (!AC || muted || paused || !G) return;
  const name = tuneName(), t = TUNES[name];
  if (name !== curTune) { curTune = name; step = 0; tick = 0; }
  if (tick++ % t.every) return;
  const n = t.mel[step % t.mel.length];
  if (n) beep(midi(n), .12, 'square', .012);
  if (step % t.bassEvery === 0) beep(midi(t.bass[(step / t.bassEvery) % t.bass.length]), .3, 'triangle', .03);
  step++;
}, 40);

// ---------- drawing helpers ----------
function R(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); }
function T(str, x, y, size = 12, color = '#fff', align = 'left') {
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.font = size + 'px "Press Start 2P", monospace'; ctx.textAlign = align; ctx.textBaseline = 'top';
  ctx.fillStyle = '#000'; ctx.fillText(str, x * S + 2, y * S + 2);
  ctx.fillStyle = color; ctx.fillText(str, x * S, y * S);
  ctx.restore();
}
function disc(cx, cy, r, c) { for (let y = -r; y <= r; y++) { const w = Math.floor(Math.sqrt(r * r - y * y)); R(cx - w, cy + y, w * 2 + 1, 1, c); } }
function drawRows(rows, l, t, pal, flip, sc = 1) {
  for (let r = 0; r < rows.length; r++) for (let c = 0; c < rows[r].length; c++) {
    const ch = rows[r][c]; if (ch === '.') continue;
    const cx = flip ? rows[r].length - 1 - c : c;
    R(l + cx * sc, t + r * sc, sc, sc, pal[ch]);
  }
}
function bubbleAt(text, sx, sy) {   // sx, sy = logical screen coords of the speaker's head
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.font = '14px "Press Start 2P", monospace';
  const w = ctx.measureText(text).width + 20, h = 30;
  const x = Math.max(4, Math.min(cv.width - w - 4, sx * S - w / 2)), y = sy * S - h - 12;
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
  ctx.fillRect(x, y, w, h); ctx.strokeRect(x, y, w, h);
  ctx.beginPath(); ctx.moveTo(sx * S - 7, y + h); ctx.lineTo(sx * S, y + h + 10); ctx.lineTo(sx * S + 7, y + h);
  ctx.fill(); ctx.stroke(); ctx.fillRect(sx * S - 5, y + h - 2, 10, 4);
  ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, x + w / 2, y + h / 2 + 1);
  ctx.restore();
}

// ---------- sprites ----------
const BODY = [
  "...hhhh...",
  "..hhhhhh..",
  "..hssssh..",
  "..sesses..",
  "..ssssss..",
  "...smms...",
  "....ss....",
  "..rrrrrr..",
  ".srrrrrrs.",
  ".srrrrrrs.",
  "..rrrrrr..",
  "..pppppp..",
];
const LEGS = [
  ["..pp..pp..", "..pp..pp..", "..pp..pp..", ".kkk..kkk."],
  ["..pp..pp..", ".pp....pp.", ".pp....pp.", "kkk....kkk"],
];
const BASE = { h:'#5a3418', s:'#f2c194', e:'#111', m:'#a33', r:'#d63a2f', p:'#2f55a4', k:'#222' };
const STEVE = BASE;
const GARY = { ...BASE, r:'#7b3fb5', p:'#3b3b3b' };   // same face, purple shirt + pineapple hat
const STAR = ["...y...", "..yyy..", "yyyyyyy", ".yyyyy.", "..yyy..", ".yy.yy.", ".y...y."];

function drawPerson(x, y, pal, face, walk, sc = 1) {   // x = center, y = feet
  const l = Math.round(x - 5 * sc), t = Math.round(y - 16 * sc);
  drawRows(BODY, l, t, pal, face < 0, sc);
  drawRows(LEGS[Math.floor(walk) % 2], l, t + 12 * sc, pal, face < 0, sc);
}
// ---------- shop items ----------
const ITEMS = [
  { id:'cap',    slot:'hat',   name:'CAP',        price:4 },
  { id:'chef',   slot:'hat',   name:'CHEF HAT',   price:6 },
  { id:'cowboy', slot:'hat',   name:'COWBOY HAT', price:6 },
  { id:'crown',  slot:'hat',   name:'CROWN',      price:15 },
  { id:'blue',   slot:'shirt', name:'BLUE SHIRT', price:3, col:'#3a7bd5' },
  { id:'green',  slot:'shirt', name:'GREEN SHIRT', price:3, col:'#3c9d5b' },
  { id:'gold',   slot:'shirt', name:'GOLD SHIRT', price:10, col:'#e8b923' },
  { id:'shades', slot:'face',  name:'SUNGLASSES', price:6, info:'strangers notice you less' },
  { id:'stache', slot:'face',  name:'MUSTACHE',   price:8, info:"Gary won't know you" },
  { id:'cat',    slot:'pet',   name:'CAT',        price:8 },
  { id:'dog',    slot:'pet',   name:'DOG',        price:8 },
];
const HATS = {
  cap:    { rows:["...cccc...", "..cccccccc"], pal:{ c:'#2f55a4' } },
  chef:   { rows:["..wwwwww..", ".wwwwwwww.", ".wwwwwwww.", "..wwwwww..", "..wwwwww.."], pal:{ w:'#fff' } },
  cowboy: { rows:["...bbbb...", "...bbbb...", "bbbbbbbbbb"], pal:{ b:'#8b5a2b' } },
  crown:  { rows:["..y.yy.y..", "..yyyyyy..", "..yryyby.."], pal:{ y:'#ffcc00', r:'#e22', b:'#36f' } },
};
const PETS = {
  cat: { rows:["....c.c", "c...ccc", ".c..cec", ".ccccc.", ".c.c.c."], pal:{ c:'#8a8a8a', e:'#111' } },
  dog: { rows:["d....dd.", ".d..ddde", "..ddddd.", "..ddddd.", "..d.d.d."], pal:{ d:'#a0612b', e:'#111' } },
};
function drawHat(id, l, t, flip, sc = 1) { const h = HATS[id]; drawRows(h.rows, l, t - (h.rows.length - 1) * sc, h.pal, flip, sc); }
function drawSteve(x, y, face, walk, sc = 1) {
  const w = G ? G.wear : {}, shirt = w.shirt && ITEMS.find(i => i.id === w.shirt);
  drawPerson(x, y, shirt ? { ...STEVE, r:shirt.col } : STEVE, face, walk, sc);
  const l = Math.round(x - 5 * sc), t = Math.round(y - 16 * sc), flip = face < 0;
  if (w.face === 'shades') drawRows(["..gggggg.."], l, t + 3 * sc, { g:'#111' }, flip, sc);
  if (w.face === 'stache') drawRows(["..kkkkkk.."], l, t + 5 * sc, { k:'#3a2010' }, flip, sc);
  if (w.hat) drawHat(w.hat, l, t, flip, sc);
}
function drawPet() {
  const p = G.wear.pet && PETS[G.wear.pet];
  if (!p) return;
  drawRows(p.rows, Math.round(pet.x - camX - 4), GROUND - 5 - pet.hop, p.pal, pet.x > P.x);
}
function pineappleHat(x, y) {
  const l = Math.round(x - 5), t = Math.round(y - 16);
  R(l + 4, t - 7, 1, 3, '#3a9a2a'); R(l + 5, t - 8, 1, 4, '#3a9a2a'); R(l + 6, t - 7, 1, 3, '#3a9a2a');
  R(l + 3, t - 4, 5, 4, '#f2c12e'); R(l + 4, t - 3, 1, 1, '#a0711c'); R(l + 6, t - 2, 1, 1, '#a0711c');
}

// sandwich layers
const LAY = {
  bread:   { h:6, c:'#e9b86b', d:'#a8692a', name:'BREAD' },
  lettuce: { h:3, c:'#6dbb3c', d:'#3f8a22', name:'LETTUCE' },
  tomato:  { h:3, c:'#e2412f', d:'#9e2418', name:'TOMATO' },
  cheese:  { h:2, c:'#f6c533', d:'#d49a12', name:'CHEESE' },
  ham:     { h:3, c:'#f19aa5', d:'#c96d7a', name:'HAM' },
  bacon:   { h:2, c:'#b8452e', d:'#f2c7a6', name:'BACON' },
  egg:     { h:3, c:'#ffffff', d:'#f7b500', name:'EGG' },
  pickle:  { h:2, c:'#5d8a2c', d:'#a6c96a', name:'PICKLE' },
  onion:   { h:2, c:'#e6c6f0', d:'#b58ac4', name:'ONION' },
  pineapple: { h:3, c:'#f2c12e', d:'#a0711c', name:'PINEAPPLE' },
};
const FILLINGS = ['lettuce', 'tomato', 'cheese', 'ham', 'bacon', 'egg', 'pickle', 'onion'];
const LW = 56;
function drawLayer(id, cx, y) {   // y = top of layer
  const g = LAY[id], x = Math.round(cx - LW / 2);
  if (id === 'bread') { R(x + 1, y, LW - 2, g.h, g.d); R(x, y + 1, LW, g.h - 2, g.d); R(x + 2, y + 1, LW - 4, g.h - 3, g.c); }
  else if (id === 'tomato' || id === 'pickle' || id === 'onion') {
    for (let i = 0; i < 3; i++) { R(x + i * 19, y, 18, g.h, g.c); R(x + i * 19 + 6, y + 1, 6, 1, g.d); }
  } else if (id === 'lettuce') {
    R(x - 2, y + 1, LW + 4, 2, g.c); for (let i = 0; i < LW + 4; i += 6) R(x - 2 + i, y, 3, 1, g.c); R(x - 2, y + 2, LW + 4, 1, g.d);
  } else if (id === 'cheese') {
    R(x, y, LW, g.h, g.c); R(x + 10, y + 2, 3, 2, g.c); R(x + 40, y + 2, 3, 3, g.c);
  } else if (id === 'egg') {
    R(x + 2, y, LW - 4, g.h, g.c); R(x, y + 1, LW, 1, g.c); R(cx - 6, y, 12, g.h, g.d);
  } else if (id === 'bacon') {
    R(x, y, LW, g.h, g.c); R(x + 2, y + 1, LW - 4, 1, g.d);
  } else { R(x, y, LW, g.h, g.c); R(x, y + g.h - 1, LW, 1, g.d); }
}

// ---------- game state ----------
let G, scene, camX, fade, P, npcs, car, mini, screen, bubble, bubbleQ, fridgeOpen, frameN = 0;
let parts = [], pines = [], shake = 0, pet;
const SAVE_KEY = 'perfectSandwichSave';
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (e) { /* saving is optional */ } }
function newSave() { return { money:0, fridge:false, broke:false, food:false, done:{ deli:0, wash:0, pizza:0, lemon:0 }, owned:[], wear:{} }; }
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (s && s.done) { const d = newSave(); return { ...d, ...s, done:{ ...d.done, ...s.done } }; }
  } catch (e) { /* ignore */ }
  return null;
}
function resetGame(fresh) {
  G = (!fresh && load()) || newSave();
  if (fresh) save();
  scene = 'home'; camX = 0; fade = 0; npcs = null; car = null; mini = null; bubble = null; bubbleQ = []; fridgeOpen = 0;
  parts = []; pines = []; shake = 0;
  P = { x:40, y:GROUND, vy:0, face:1, walk:0, ground:true }; pet = { x:20, hop:0 };
  screen = { type:'title', t:0 };
}
function say(text) { bubble = { text, t:150 }; bubbleQ = []; }
function puff(x, y, c, n = 4, spd = .6) {
  for (let i = 0; i < n; i++) parts.push({ x, y, vx:(Math.random() - .5) * spd * 2, vy:-Math.random() * spd, t:20 + Math.random() * 15, c });
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const shuffle = a => a.map(v => [Math.random(), v]).sort((p, q) => p[0] - q[0]).map(p => p[1]);

function objective() {
  if (G.food) return 'Go HOME. Make the perfect sandwich at the counter!';
  if (!G.fridge) return 'Look in the fridge.';
  if (!G.broke) return 'Go to the STORE. Avoid strangers, police + Gary!';
  if (G.money >= PRICE) return 'You have $' + PRICE + '! Go buy food at the STORE.';
  if (!G.done.deli) return 'Get a job! The DELI is hiring.';
  if (!G.done.wash) return 'Need more money! The CAR WASH is hiring.';
  if (!G.done.pizza) return 'Need more money! PIZZA is hiring.';
  if (!G.done.lemon) return 'Need more money! LEMONADE is hiring.';
  return 'Work any job until you have $' + PRICE + '.';
}

// ---------- places ----------
const STREET_W = 1340;
const BUILDINGS = [
  { name:'HOME',     x:10,   w:70,  col:'#c9a36b', door:38 },
  { name:'DELI',     x:200,  w:90,  col:'#e07a5f', door:238, job:'deli' },
  { name:'CAR WASH', x:380,  w:100, col:'#4f9dd6', door:422, job:'wash' },
  { name:'CLOTHES',  x:580,  w:90,  col:'#c77dd6', door:618, shop:true },
  { name:'PIZZA',    x:760,  w:90,  col:'#f2b134', door:798, job:'pizza' },
  { name:'LEMONADE', x:950,  w:90,  col:'#fff176', door:988, job:'lemon' },
  { name:'STORE',    x:1170, w:120, col:'#6cbf6c', door:1222 },
];
const doorOf = name => BUILDINGS.find(b => b.name === name).door + 7;
function jobOpen(job) {
  if (!G.broke) return false;
  if (job === 'deli') return true;
  if (job === 'wash') return G.done.deli > 0;
  if (job === 'pizza') return G.done.wash > 0;
  return G.done.pizza > 0;
}
function targetDoor() {   // where the arrow on the street points
  let name;
  if (G.food) name = 'HOME';
  else if (!G.broke || G.money >= PRICE) name = 'STORE';
  else { const b = BUILDINGS.find(b => b.job && jobOpen(b.job) && !G.done[b.job]); if (!b) return null; name = b.name; }
  return BUILDINGS.find(b => b.name === name).door + 7;
}
const SCENES = {
  home: { w:320, things: () => [
    { x:110, w:24, label:'Open fridge', act() {
      fridgeOpen = 120; beep(300);
      if (G.food) say('food goes on the counter');
      else { say('nothing :('); G.fridge = true; }
    } },
    { x:160, w:54, label: G.food ? 'Make sandwich!' : 'Counter', act() {
      if (G.food) startStack('final'); else say(G.fridge ? 'no food :(' : 'hungry >:(');
    } },
    { x:282, w:22, label:'Go outside', act() {
      if (!G.fridge) say('fridge first...'); else goTo('street', 45);
    } },
  ] },
  street: { w:STREET_W, things: () => BUILDINGS.map(b => ({ x:b.door, w:14,
    label: b.job ? (jobOpen(b.job) ? 'Work at ' + b.name : b.name + ' (closed)') : 'Enter ' + b.name, act() {
      if (b.name === 'HOME') goTo('home', 280);
      else if (b.name === 'STORE') goTo('store', 34);
      else if (b.shop) { if (G.broke) goTo('shop', 34); else say('I need food, not clothes'); }
      else if (!G.broke) say('I need food, not a job');
      else if (!jobOpen(b.job)) say('closed :( try another job');
      else startJob(b.job);
    } })) },
  store: { w:320, things: () => [
    { x:8, w:18, label:'Go outside', act() { goTo('street', doorOf('STORE')); } },
    { x:236, w:30, label:'Buy food $' + PRICE, act() {
      if (G.food) say('got it already!');
      else if (G.money < PRICE) { say('I broke :('); G.broke = true; beep(160, .3, 'sawtooth'); }
      else { G.money -= PRICE; G.food = true; say('YES :D'); beep(660); setTimeout(() => beep(990), 100); }
    } },
  ] },
  shop: { w:460, things: () => [
    { x:8, w:18, label:'Go outside', act() { goTo('street', doorOf('CLOTHES')); } },
    ...ITEMS.map((it, i) => ({ x:46 + i * 36, w:24,
      label: G.owned.includes(it.id) ? (G.wear[it.slot] === it.id ? 'Take off ' : 'Wear ') + it.name : 'Buy ' + it.name + ' $' + it.price + (it.info ? ' (' + it.info + ')' : ''),
      act() {
        if (G.owned.includes(it.id)) { G.wear[it.slot] = G.wear[it.slot] === it.id ? null : it.id; beep(700); return; }
        if (G.money < it.price) { say('I broke :('); beep(160, .3, 'sawtooth'); return; }
        G.money -= it.price; G.owned.push(it.id); G.wear[it.slot] = it.id; say('cool :D'); beep(880); setTimeout(() => beep(1175), 90);
      } })),
  ] },
};

function goTo(name, x) {
  scene = name; P.x = x; P.y = GROUND; P.vy = 0; P.ground = true; car = null; fade = 1; pines = []; parts = []; pet.x = x - 14;
  if (name !== 'street') return;
  if (!npcs) makeNpcs();
  // nobody is standing right on the doorstep when you come out
  for (const n of npcs) {
    if (n.kind === 'gary') { if (Math.abs(n.x - P.x) < 200) n.x = P.x > 650 ? P.x - 260 : P.x + 260; }
    else if (Math.abs(n.x - P.x) < 60) n.x = clamp(P.x + (n.x >= P.x ? 1 : -1) * 90, 20, STREET_W - 20);
    n.cool = 60; n.phone = 0;
  }

// ---------- world update ----------
function nearest() {
  return SCENES[scene].things().find(t => Math.abs(P.x - (t.x + t.w / 2)) < t.w / 2 + 6);
}
function updateWorld() {
  const sc = SCENES[scene];
  const mv = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  P.x = clamp(P.x + mv * 1.4, 6, sc.w - 6);
  if (mv) { P.face = mv; P.walk += .15; if (P.ground && frameN % 12 === 0) puff(P.x - mv * 3, GROUND - 1, '#d8c8a8', 2, .3); } else P.walk = 0;
  if (pressed.jump && P.ground) { P.vy = -4.2; P.ground = false; beep(520, .06); }
  P.vy += .25; P.y += P.vy;
  if (P.y >= GROUND) { if (!P.ground) puff(P.x, GROUND - 1, '#d8c8a8', 5, .5); P.y = GROUND; P.vy = 0; P.ground = true; }
  pet.x += (P.x - P.face * 12 - pet.x) * .08;
  pet.hop = Math.abs(P.x - P.face * 12 - pet.x) > 2 ? Math.floor(frameN / 6) % 2 : 0;
  parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .05; p.t--; }); parts = parts.filter(p => p.t > 0);
  camX = Math.round(clamp(P.x - VW / 2, 0, sc.w - VW));
  if (fridgeOpen > 0) fridgeOpen--;
  if (fade > 0) fade -= .05;
  if (scene === 'street' && updateStreet()) return;
  const n = nearest();
  if (pressed.act && n) n.act();
  if (bubble && --bubble.t <= 0) bubble = null;
  if (!bubble && bubbleQ.length) bubble = { text:bubbleQ.shift(), t:120 };
}
function updateStreet() {   // returns true if Steve got sent to jail
  for (const n of npcs) {
    n.walk += .12; if (n.cool > 0) n.cool--; if (n.huh > 0) n.huh--;
    const fooled = n.kind === 'gary' && G.wear.face === 'stache';
    if (n.kind === 'gary' && !fooled) {   // Gary throws pineapples at you from a distance
      const d = Math.abs(P.x - n.x);
      n.throwT = (n.throwT || 120) - 1;
      if (n.throwT <= 0 && d > 70 && d < 170) {
        n.throwT = 150 + Math.random() * 90; n.dir = Math.sign(P.x - n.x) || 1;
        pines.push({ x:n.x, y:GROUND - 14, vx:n.dir * 1.8, vy:-2, t:220 }); beep(400, .05);
      }
    }
    if (n.phone > 0) n.phone--;
    else if (n.kind === 'gary' && !fooled && Math.abs(P.x - n.x) < 70) { n.dir = Math.sign(P.x - n.x) || 1; n.x = clamp(n.x + n.dir * .85, 10, STREET_W - 10); }
    else { n.x += n.dir * n.sp; if (n.x < n.min) n.dir = 1; if (n.x > n.max) n.dir = -1; }
    const hit = Math.abs(P.x - n.x) < 7 && P.y > GROUND - 13;
    if (!hit) continue;
    if (n.kind === 'gary') { if (fooled) continue; jail('gary'); return true; }
    if (!n.cool && G.wear.face === 'shades' && Math.random() < .5) { n.cool = 400; n.huh = 90; continue; }
    if (!n.cool) { n.cool = 400; n.phone = 120; beep(880, .15); callPolice(); }
  }
  for (const p of pines) {
    p.vy += .2; p.y += p.vy; p.x += p.vx; p.t--;
    if (p.y >= GROUND - 7) { p.y = GROUND - 7; p.vy = -Math.abs(p.vy) * .4; }
    if (Math.abs(p.x - P.x) < 6 && P.y > p.y + 2 && P.y - 16 < p.y + 7) {
      p.t = 0; shake = 8; puff(p.x, p.y, '#f2c12e', 10, 1.2); beep(180, .2, 'sawtooth');
      const lost = Math.min(2, G.money); G.money -= lost;
      say(lost ? 'ow! -$' + lost : 'ow! >:(');
    }
  }
  pines = pines.filter(p => p.t > 0);
  if (car) {
    car.x += car.dir * 2.3;
    if (frameN % 15 === 0) beep(frameN % 30 ? 700 : 950, .1, 'square', .02);
    if (!car.turned && (car.dir > 0 ? car.x > P.x + 180 : car.x < P.x - 180)) { car.dir *= -1; car.turned = true; }
    else if (car.turned && Math.abs(car.x - P.x) > 260) car = null;
    if (car && Math.abs(car.x - P.x) < 17 && P.y > GROUND - 11) { jail('police'); return true; }
  }
  return false;
}
function callPolice() {
  if (car) return;
  let x = P.x + P.face * 200;
  if (x < 0 || x > STREET_W) x = P.x - P.face * 200;
  car = { x, dir: Math.sign(P.x - x), turned:false };

function jail(reason) {
  const bail = Math.min(5, G.money);

}

function startJob(job) { ({ deli:() => startStack('deli'), wash:startWash, pizza:startPizza, lemon:startLemon })[job](); }

// --- Deli + the final sandwich: drop the swinging layer onto the stack ---
const PLATE = 166;
function startStack(kind) {
  const orders = kind === 'final'
    ? [['bread', ...FILLINGS, 'bread']]
    : [0, 1].map(() => ['bread', ...shuffle(FILLINGS).slice(0, 2 + (Math.random() * 2 | 0)), 'bread']);
  mini = { type:'stack', kind, orders, oi:0, stack:[], held:null, falling:[], earned:0, perfect:0, nice:0,
           sneaks:0, dodged:0, ew:0, msg:'', msgT:0, wait:40, doneT:0, update:updStack, draw:drawStack };
}
function stackTop(m) { return PLATE - m.stack.reduce((s, l) => s + LAY[l.id].h, 0); }
function updStack() {
  const m = mini;
  if (m.msgT > 0) m.msgT--;
  m.falling.forEach(f => { f.vy += .3; f.y += f.vy; f.x += f.vx; });
  m.falling = m.falling.filter(f => f.y < VH + 20);
  if (m.doneT > 0) {
    if (--m.doneT === 0) { m.oi++; m.stack = []; if (m.oi >= m.orders.length) finishStack(m); }
    return;
  }
  if (!m.held) {
    if (--m.wait > 0) return;
    // in the final sandwich, Gary sometimes sneaks a pineapple in. Don't drop it!
    const sneak = m.kind === 'final' && m.sneaks < 3 && m.stack.length > 0 && m.stack.length < 9 && Math.random() < .3;
    if (sneak) { m.sneaks++; beep(300, .15, 'sawtooth'); }
    m.held = { id: sneak ? 'pineapple' : m.orders[m.oi][m.stack.length], x: 70 + Math.random() * 180, y:30, life:170,
      dir: Math.random() < .5 ? 1 : -1, sp: (m.kind === 'final' ? 1.8 : 1.2 + G.done.deli * .25) + m.oi * .35, drop:false, vy:0 };
    return;
  }
  const h = m.held;
  if (h.id === 'pineapple' && !h.drop && --h.life <= 0) {
    m.held = null; m.wait = 20; m.dodged++; m.msg = 'NO pineapple! Good!'; m.msgT = 60; beep(990, .1);
    return;
  }
  if (!h.drop) {
    h.x += h.dir * h.sp;
    if (h.x > VW - LW / 2 - 6) h.dir = -1; if (h.x < LW / 2 + 6) h.dir = 1;
    if (pressed.jump || pressed.act || pressed.tap) h.drop = true;
  } else {
    h.vy += .35; h.y += h.vy;
    if (h.y + LAY[h.id].h >= stackTop(m)) landStack(m);
  }
}
function landStack(m) {
  const h = m.held, cx = m.stack.length ? m.stack[m.stack.length - 1].x : VW / 2, off = h.x - cx, a = Math.abs(off);
  const pay = m.kind === 'deli';
  m.held = null; m.wait = 25; m.msgT = 50;
  if (h.id === 'pineapple') {

  } else if (s.type === 'end') {
    R(0, 0, VW, VH, '#fff1d6');
    for (let x = 0; x < VW; x += 20) R(x, 0, 10, VH, '#ffe8bf');
    T('THE PERFECT SANDWICH!', VW / 2, 10, 20, '#e0702b', 'center');
    let y = 130; s.stack.forEach(id => { y -= LAY[id].h; drawLayer(id, 200, y); });
    R(168, 130, 64, 3, '#fff'); R(172, 133, 56, 2, '#ddd');
    drawSteve(100, 134, 1, 0, 3);
    bubbleAt(s.ew ? 'yum... (less pineapple pls)' : 'yum :D', 100, 86);
    // meanwhile, Gary finally got caught with his pineapple pizza
    drawPerson(276, 130, GARY, -1, 0, 2);
    for (let x = 258; x <= 294; x += 6) R(x, 92, 2, 40, '#777');
    R(256, 92, 40, 2, '#777'); R(256, 130, 40, 2, '#777');
    T('Gary got caught!', 276, 134, 8, '#3a2414', 'center');
    for (let i = 0; i < 5; i++) drawRows(STAR, 122 + i * 16, 40, { y: i < s.stars ? '#ffcc00' : '#c9b98f' }, false, 2);
    T('THE END', VW / 2, 146, 16, '#3a2414', 'center');
    if (s.t > 40) T(s.secret ? 'SPACE for... ???' : 'SPACE to play again', VW / 2, 164, 10, '#6b4a2b', 'center');
  } else if (s.type === 'secret') {
    // Steve finds the pineapple Gary left behind... and tries it.
    R(0, 0, VW, VH, '#2b2238'); R(0, 150, VW, 30, '#4a3a2a');
    R(230, 50, 50, 40, '#6b4226'); R(233, 53, 44, 34, '#1c2a4a');
    for (let i = 0; i < 8; i++) R(236 + (i * 13) % 40, 56 + (i * 7) % 26, 1, 1, '#fff');
    drawSteve(130, 150, 1, 0, 3);
    if (s.t > 30) { disc(150, 118, 5, '#f2c12e'); disc(150, 118, 2, '#2b2238'); }
    const lines = [[60, '...'], [150, '*nibble*'], [240, "it's... GOOD?!"], [340, "don't tell Gary"]];
    const line = lines.filter(l => s.t > l[0]).pop();
    if (line) bubbleAt(line[1], 130, 98);
    if (s.t > 420) { drawPerson(255, 92, GARY, -1, 0, 2); pineappleHat(255, 76); R(230, 86, 50, 8, '#6b4226'); }
    if (s.t > 450) { T('SECRET ENDING', VW / 2, 12, 20, '#ffe066', 'center'); T('PINEAPPLE TWIST', VW / 2, 30, 16, '#f2c12e', 'center'); }
    if (s.t > 500) T('SPACE to play again', VW / 2, 164, 10, '#fff', 'center');
  }
}

// ---------- main loop ----------
function loop() {
  frameN++;
  if (!paused) {
    if (screen) updateScreen(); else if (mini) mini.update(); else updateWorld();
    if (shake > 0) shake--;
    if (frameN % 60 === 0) save();
  }
  const sx = shake ? (Math.random() - .5) * shake * .6 : 0, sy = shake ? (Math.random() - .5) * shake * .6 : 0;
  ctx.setTransform(S, 0, 0, S, sx * S, sy * S);
  if (screen) drawScreen(); else if (mini) mini.draw(); else drawWorld();
  if (paused) { ctx.setTransform(S, 0, 0, S, 0, 0); R(0, 0, VW, VH, 'rgba(0,0,0,.6)'); T('PAUSED', VW / 2, 70, 28, '#ffe066', 'center'); T('Press P to keep playing', VW / 2, 100, 12, '#fff', 'center'); }
  for (const k in pressed) delete pressed[k];
  pointer.moved = false;
  requestAnimationFrame(loop);
}
resetGame();
loop();
</script>
