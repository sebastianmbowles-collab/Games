<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hush Little Baby</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#05010a;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{display:block;position:absolute;left:0;top:0}
#touch{display:none;position:absolute;inset:0;pointer-events:none}
#stick{position:absolute;left:24px;bottom:24px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.35);pointer-events:auto}
#nub{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.3)}
.tb{position:absolute;width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.45);color:#fff;font:bold 13px monospace;display:flex;align-items:center;justify-content:center;pointer-events:auto}
.tb.on{background:rgba(190,120,255,.45)}
.tb.sm{width:64px;height:32px;border-radius:16px;font-size:10px;display:none}
#touch.playing .tb.sm{display:flex}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="touch">
  <div id="stick"><div id="nub"></div></div>
  <div class="tb" data-k="jump" style="right:20px;bottom:30px">JUMP</div>
  <div class="tb" data-k="dash" style="right:104px;bottom:20px">DASH</div>
  <div class="tb" data-k="mom" style="right:30px;bottom:116px">MOMMY</div>
  <div class="tb sm" data-k="pause" style="left:24px;bottom:170px">PAUSE</div>
  <div class="tb sm" data-k="vol" style="left:96px;bottom:170px">SOUND</div>
</div>
<script>
'use strict';
// ===== Canvas =====
const cv = document.getElementById('c'), mainCtx = cv.getContext('2d');
const lo = document.createElement('canvas'), loCtx = lo.getContext('2d');
let ctx = mainCtx;
const PF = '"Press Start 2P", monospace';
let cw = 0, ch = 0, zoom = 1, vw = 0, vh = 0, dpr = 1, PIX = 4, GW = 0, GH = 0;
const RES = 2; // the world canvas has RES pixels per game pixel, so double-size sprites keep their detail
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cw = window.innerWidth; ch = window.innerHeight;
  cv.width = cw * dpr; cv.height = ch * dpr;
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  zoom = Math.max(0.7, Math.min(1.4, Math.min(cw, ch) / 620));
  vw = cw / zoom; vh = ch / zoom;
  // about 10 tiles tall on wide screens, about 8 tiles across on tall phone screens
  PIX = Math.max(2, Math.round(Math.min(ch / (16 * 10), cw / (16 * 8)) * dpr / RES) * RES); // a multiple of RES keeps pixels square
  GW = Math.ceil(cw * dpr / PIX); GH = Math.ceil(ch * dpr / PIX);
  lo.width = GW * RES; lo.height = GH * RES;
}
// shrink any text that would run off the screen (the pixel font is wide)
{
  const ft = mainCtx.fillText.bind(mainCtx);
  mainCtx.fillText = (t, x, y) => {
    const w = mainCtx.measureText(t).width, max = vw - 16;
    if (w <= max) return ft(t, x, y);
    const f = mainCtx.font, px = parseFloat(f);
    mainCtx.font = f.replace(/^[\d.]+px/, (px * max / w).toFixed(1) + 'px'); ft(t, x, y); mainCtx.font = f;
  };
}
let labels = []; // text found while drawing the world, drawn crisp on top afterwards
window.addEventListener('resize', resize); resize();

// ===== Helpers =====
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp(((n >> 16) & 255) * f, 0, 255) | 0, g = clamp(((n >> 8) & 255) * f, 0, 255) | 0, b = clamp((n & 255) * f, 0, 255) | 0;
  return `rgb(${r},${g},${b})`;
}

// ===== World =====
// Heights are in "units": half steps are walkable, full steps need a jump.
const W = 120, VOID = -100, STEP = 0.55;
const hgt = new Float32Array(W * W), typ = new Uint8Array(W * W);
const T = {
  NURSERY: 0, GRAVE: 1, MAZE: 2, BLOCK: 3, CLOWN: 4, FARM: 5, BRIDGE: 6, MAZEWALL: 7, FENCE: 8, BARN: 9, STONE: 10,
  SKY: 11, BAKERY: 12, OVEN: 13, ATTIC: 14, RAFTER: 15, PARK: 16, STAND: 17, WATER: 18, SEAL: 19, SKYRAIL: 21, PICKET: 22, CRIB: 23
};
const PAL = {
  0: ['#6a4e74', '#61466b'], 1: ['#3f4c43', '#39453d'], 2: ['#2f3654', '#2a3050'],
  3: ['#8a3a3a', '#3a5a8a', '#8a7a3a', '#4a7a4a'], 4: ['#7a2030', '#a89c90'], 5: ['#4d4a24', '#45421f'],
  6: ['#5a4632', '#4f3d2a'], 7: ['#7a5534', '#704d2f'], 8: ['#5a3a1e', '#53361c'], 9: ['#6e1d1d', '#661a1a'], 10: ['#5c6262', '#555b5b'],
  11: ['#1c2150', '#181c46'], 12: ['#6e5f44', '#8f8268'], 13: ['#2e2a2a', '#282424'], 14: ['#4a3826', '#43321f'], 15: ['#3a2a18', '#33250f'],
  16: ['#22381f', '#1f331c'], 17: ['#c8b040', '#c86a8a'], 18: ['#1d4448', '#1a3e42'], 19: ['#7a30b8', '#7a30b8'],
  21: ['#9ab0e0', '#8aa0d0'], 22: ['#b8b8b0', '#a8a8a0'], 23: ['#d8d0e0', '#c8c0d0']
};
// Which named zone each tile type belongs to (for the banner when you walk in)
const ZONE_OF = { 0: 0, 1: 1, 10: 1, 2: 2, 7: 2, 3: 3, 4: 4, 5: 5, 8: 5, 9: 5, 11: 11, 21: 11, 12: 12, 13: 12, 14: 14, 15: 14, 16: 16, 17: 16, 22: 16, 18: 18, 19: 18, 23: 18 };
const ZONES = {
  0: ['The Nursery', 'Mommy? ...Mommy?'], 1: ['The Toy Graveyard', 'The toys you threw away miss you.'], 2: ['The Crib Maze', "Don't get lost, little one."],
  3: ['The Block Stairs', "Don't look down."], 4: ['Clown Hills', 'Everybody is smiling. Forever.'], 5: ["Old MacDonald's Farm", 'E-I-E-I-O...'],
  11: ['The Night Sky', 'Up above the world so high...'], 12: ['The Creepy Bakery', 'Something is still in the oven.'], 14: ['The Attic', 'Down came the rain...'],
  16: ['The Lemonade Stand', 'Got any grapes?'], 18: ['The Nursery Cove', 'Heads, shoulders, knees and toes...']
};
function H(x, y) { return (x < 0 || y < 0 || x >= W || y >= W) ? VOID : hgt[y * W + x]; }
function TY(x, y) { return typ[y * W + x]; }
function set(x, y, h, t) { if (x < 0 || y < 0 || x >= W || y >= W) return; hgt[y * W + x] = h; typ[y * W + x] = t; }
function rect(x0, y0, x1, y1, h, t) { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) set(x, y, h, t); }

let enemies, pickups, props, bosses, door, particles, shots, waves, falls;

// Boss blueprints: where they live, how tough they are, and what they do.
const BOSS_DEFS = {
  mac: { name: 'OLD MACDONALD', song: 'mac', hp: 3, r: .7, h: 2.2, air: 0, minion: 'pig', arena: [92, 6, 106, 20], floor: 5, fence: T.FENCE, gates: [[99, 20], [100, 20]], at: [99.5, 12.5],
    intro: 'Old MacDonald had a baby. E. I. E. I. O.', tip: 'Stomp him when he is dizzy!', bubble: 'E-I-E-I-O!' },
  star: { name: 'TWINKLE TWINKLE', song: 'star', hp: 4, r: .8, h: 1.8, air: 2.6, minion: null, arena: [64, 102, 80, 118], floor: 6, fence: T.SKYRAIL, gates: [[80, 113], [80, 114]], at: [72.5, 109.5],
    intro: 'Twinkle twinkle, little baby. How I wonder where you are.', tip: 'When it falls down tired, stomp it!', bubble: 'Twinkle twinkle...' },
  bun: { name: 'HOT CROSS BUN', song: 'bun', hp: 4, r: .9, h: 1.8, air: 0, minion: 'littlebun', arena: [51, 18, 69, 33], floor: 1, fence: T.OVEN, gates: [[59, 33], [60, 33]], at: [59.5, 24.5],
    intro: 'Hot cross buns. Hot cross buns. One a penny, two a penny, one baby.', tip: 'Jump over the shockwaves! Stomp it when it gets stuck.', bubble: 'HOT! HOT!' },
  spider: { name: 'ITSY BITSY SPIDER', song: 'spider', hp: 5, r: .9, h: 1.4, air: 3.4, minion: 'tinyspider', arena: [12, 14, 28, 30], floor: 6, fence: T.RAFTER, gates: [[28, 21], [28, 22]], at: [20.5, 22.5],
    intro: 'The itsy bitsy spider climbed up to get the baby.', tip: 'Webs slow you down. Stomp it when it rests on the floor!', bubble: 'Itsy... bitsy...' },
  duck: { name: 'THE DUCK', song: 'duck', hp: 5, r: .8, h: 2, air: 0, minion: 'duckling', arena: [9, 77, 27, 95], floor: 1, fence: T.PICKET, gates: [[27, 85], [27, 86]], at: [18.5, 86.5],
    intro: 'Hey! Got any grapes?', tip: 'Watch for falling grapes! Stomp it when it trips.', bubble: 'Got any grapes?' },
  final: { name: 'HEADS, SHOULDERS, KNEES AND TOES', song: 'heads', hp: 8, r: .9, h: 2.2, air: 0, minion: null, arena: [34, 51, 49, 68], floor: 1, fence: T.CRIB, gates: [[49, 59], [49, 60]], at: [41.5, 59.5],
    intro: 'Heads. Shoulders. Knees. And. Toes.', tip: 'Beat every part of it!', bubble: 'HEADS!' }
};
const BOSS_ORDER = ['mac', 'star', 'bun', 'spider', 'duck', 'final'];
const PARTS = ['HEAD', 'SHOULDERS', 'KNEES', 'TOES'];

function buildWorld() {
  hgt.fill(VOID); typ.fill(0);
  const r = rng(2024);
  enemies = []; pickups = []; props = []; particles = []; shots = []; waves = []; falls = [];
  const foe = (kind, x, y, extra) => enemies.push(Object.assign({ kind, x: x + .5, y: y + .5, z: 0, r: .32, h: .9, dead: false, t: r() * 6, dir: 1 }, extra));
  const toy = (x, y, axis, range) => foe('toy', x, y, { ox: x + .5, oy: y + .5, axis, range, sp: 1.3 });
  const prop = (kind, x, y, text) => props.push({ kind, x: x + .5, y: y + .5, z: 0, text, t: 0 });
  const item = (kind, x, y) => pickups.push({ kind, x: x + .5, y: y + .5, z: 0 });

  // --- The Nursery (start, in the middle of everything) ---
  rect(54, 54, 65, 65, 1, T.NURSERY);
  set(56, 56, 2, T.BLOCK); set(57, 56, 2, T.BLOCK); set(56, 57, 3, T.BLOCK); set(63, 63, 2, T.BLOCK); set(63, 62, 2.5, T.BLOCK); set(62, 63, 3, T.BLOCK);
  prop('trunk', 63, 56); prop('bunny', 56, 62);
  prop('doll', 55, 64); prop('doll', 64, 55); prop('sign', 59, 61, 'Beat them all. Then you can wake up.');
  prop('sign', 64, 60, 'JUMP over the gaps. Jump ON the toys.');
  item('pacifier', 62, 63);
  // bridges out of the nursery
  rect(66, 59, 69, 60, 1, T.BRIDGE); set(67, 59, VOID, 0); set(67, 60, VOID, 0);        // east
  rect(59, 66, 60, 71, 1, T.BRIDGE);                                                     // south
  rect(59, 41, 60, 53, 1, T.BRIDGE); set(59, 47, VOID, 0); set(60, 47, VOID, 0);        // north
  rect(50, 59, 53, 60, 1, T.BRIDGE);                                                     // west (to the cove)
  item('bottle', 52, 59); // a little help before the hardest fight

  // --- The Toy Graveyard (east) ---
  for (let y = 50; y <= 69; y++) for (let x = 70; x <= 86; x++) set(x, y, r() < .25 ? 1.5 : 1, T.GRAVE);
  for (let i = 0; i < 26; i++) { const gx = 71 + (r() * 15 | 0), gy = 51 + (r() * 18 | 0); if (gy < 58 || gy > 61) set(gx, gy, 2.5, T.STONE); }
  set(85, 51, 3.5, T.STONE); item('bottle', 85, 51);
  toy(73, 59, 'x', 4); toy(78, 64, 'y', 3); toy(82, 54, 'x', 3); toy(76, 67, 'x', 5); toy(84, 60, 'y', 4);
  prop('coffin', 72, 53); prop('coffin', 80, 66); prop('soldier', 84, 57); prop('wreath', 75, 64);
  prop('doll', 74, 52); prop('doll', 83, 66); prop('jack', 80, 60); prop('sign', 71, 60, 'Mr. Teddy is waiting for you.');
  rect(87, 59, 91, 59, 1.5, T.BRIDGE); set(89, 59, VOID, 0);

  // --- Clown Hills (far east) ---
  for (let y = 36; y <= 84; y++) for (let x = 92; x <= 114; x++) {
    const v = 2 + Math.round((Math.sin(x * .45) + Math.cos(y * .38) + Math.sin((x + y) * .2)) * 1.2) * .5;
    set(x, y, clamp(v, 1.5, 4), T.CLOWN);
  }
  rect(92, 58, 93, 60, 1.5, T.CLOWN);
  rect(99, 36, 106, 39, 3, T.CLOWN);
  { const b = H(109, 70); set(110, 70, b + 1, T.BLOCK); set(111, 70, b + 2, T.BLOCK); set(112, 70, b + 3, T.BLOCK); pickups.push({ kind: 'bottle', x: 112.5, y: 70.5, z: 0 }); }
  item('pacifier', 96, 48);
  toy(95, 41, 'x', 4); toy(102, 47, 'y', 4); toy(108, 55, 'x', 4); toy(98, 66, 'y', 3); toy(105, 74, 'x', 3); toy(110, 44, 'y', 3); toy(100, 80, 'x', 4);
  for (const [mx, my] of [[97, 55], [106, 44], [111, 68], [101, 77]]) foe('monkey', mx, my); // wind-up monkeys clapping cymbals
  for (const [bx, by] of [[95, 45], [108, 50], [99, 72], [110, 78], [104, 66]]) prop('balloon', bx, by);
  prop('carousel', 103, 60); prop('jack', 100, 52); prop('jack', 108, 62); prop('jack', 96, 76); prop('doll', 112, 82); prop('sign', 102, 39, 'The farm is up there. He is waiting.');
  prop('sign', 100, 37, 'Gap too big? DASH while you JUMP!');
  // stairs up to the farm (the last gap needs a dash-jump)
  rect(102, 33, 103, 35, 3.5, T.BLOCK); rect(102, 31, 103, 32, 4, T.BLOCK); rect(102, 29, 103, 30, 4.5, T.BLOCK);

  // --- Old MacDonald's Farm (north-east, high up) ---
  rect(86, 4, 116, 25, 5, T.FARM);
  rect(108, 8, 112, 18, 8, T.BARN);
  prop('sign', 99, 22, 'Old MacDonald had a baby...');
  for (const [sx, sy] of [[88, 7], [89, 12], [87, 18], [113, 6], [115, 12], [114, 18]]) prop('scarecrow', sx, sy); // they watch you
  prop('doll', 88, 23); prop('jack', 114, 22); item('pacifier', 90, 6);

  // --- The Crib Maze (south) ---
  rect(48, 72, 72, 94, 3, T.MAZEWALL);
  {
    const MW = 12, MH = 11, seen = new Uint8Array(MW * MH), stack = [[5, 0]];
    const cell = (cx, cy) => [49 + cx * 2, 73 + cy * 2];
    seen[5] = 1; set(...cell(5, 0), 1, T.MAZE);
    let far = [5, 0], farD = 0;
    while (stack.length) {
      const [cx, cy] = stack[stack.length - 1];
      const nb = [[1, 0], [-1, 0], [0, 1], [0, -1]].filter(([dx, dy]) => { const nx = cx + dx, ny = cy + dy; return nx >= 0 && ny >= 0 && nx < MW && ny < MH && !seen[ny * MW + nx]; });
      if (!nb.length) { stack.pop(); continue; }
      const [dx, dy] = nb[r() * nb.length | 0], nx = cx + dx, ny = cy + dy;
      seen[ny * MW + nx] = 1;
      const [ax, ay] = cell(cx, cy); set(ax + dx, ay + dy, 1, T.MAZE); set(...cell(nx, ny), 1, T.MAZE);
      stack.push([nx, ny]);
      if (stack.length > farD) { farD = stack.length; far = [nx, ny]; }
    }
    const [fx, fy] = cell(...far); item('bottle', fx, fy);
  }
  set(59, 72, 1, T.MAZE);              // entrance from the nursery
  set(48, 83, 1, T.MAZE);              // west exit to the lemonade stand
  set(72, 93, 1, T.MAZE);              // east exit to the block stairs
  toy(51, 75, 'y', 2); toy(57, 81, 'x', 2); toy(65, 87, 'x', 2); toy(69, 77, 'y', 2);
  prop('sign', 59, 73, 'Shhh. The walls are listening.');
  prop('bunny', 55, 79); prop('shoe', 63, 85); prop('bunny', 67, 91);
  rect(36, 83, 47, 83, 1, T.BRIDGE); set(41, 83, VOID, 0);

  // --- The Block Stairs up to the Night Sky (south-east) ---
  rect(73, 93, 75, 93, 1, T.BRIDGE);
  const steps = [[76, 94, 1.5], [79, 96, 2], [82, 98, 2.5], [84, 101, 3], [86, 104, 3.5], [87, 107, 4], [86, 110, 4.5], [84, 112, 5], [81, 113, 5.5]];
  for (const [sx, sy, sh] of steps) rect(sx, sy, sx + 1, sy + 1, sh, T.BLOCK);
  item('pacifier', 87, 107); item('bottle', 86, 110);
  foe('dollhead', 80, 97); foe('dollhead', 85, 102); foe('dollhead', 87, 111);
  prop('sign', 76, 94, "Up, up, up. Don't look down.");

  // --- The Night Sky (Twinkle Twinkle) ---
  rect(64, 102, 80, 118, 6, T.SKY);
  for (const [hx, hy] of [[68, 106], [69, 106], [77, 112], [78, 112], [70, 114], [71, 114], [76, 105], [67, 111]]) set(hx, hy, VOID, 0);

  // --- The Creepy Bakery (north, Hot Cross Bun) ---
  rect(48, 16, 72, 40, 1, T.BAKERY);
  for (const [ox, oy] of [[49, 37], [50, 37], [70, 37], [71, 37], [53, 20], [54, 20], [66, 20], [67, 20]]) set(ox, oy, 3, T.OVEN);
  set(49, 38, 2, T.OVEN); item('bottle', 49, 37);
  foe('littlebun', 53, 38); foe('littlebun', 66, 36); foe('littlebun', 62, 39);
  prop('sign', 59, 39, 'One a penny, two a penny...'); prop('doll', 71, 39);
  for (const [kx, ky, kind] of [[52, 35, 'flour'], [68, 39, 'flour'], [55, 39, 'flour'], [64, 35, 'pin'], [57, 36, 'pin']]) prop(kind, kx, ky);

  // --- The Attic (north-west, high up, Itsy Bitsy Spider) ---
  const attic = [[45, 28, 2], [42, 27, 3], [39, 28, 4], [36, 27, 5]];
  for (const [sx, sy, sh] of attic) rect(sx, sy, sx + 1, sy + 1, sh, T.BLOCK);
  rect(46, 28, 47, 29, 1.5, T.BAKERY);
  rect(8, 12, 34, 36, 6, T.ATTIC);
  set(31, 15, 8, T.RAFTER); set(31, 33, 8, T.RAFTER); set(33, 24, 7, T.RAFTER); item('bottle', 33, 24);
  foe('tinyspider', 31, 20); foe('tinyspider', 32, 28); foe('tinyspider', 30, 25); foe('tinyspider', 33, 17);
  prop('sign', 33, 27, 'Down came the rain and washed the baby out.'); prop('doll', 30, 35);
  prop('trunk', 30, 13); prop('trunk', 32, 30); prop('rocker', 30, 19);

  // --- The Lemonade Stand (south-west, the Duck) ---
  rect(6, 74, 35, 102, 1, T.PARK);
  rect(12, 79, 14, 80, 2.5, T.STAND);
  foe('duckling', 31, 80); foe('duckling', 32, 90); foe('duckling', 30, 96);
  item('pacifier', 33, 99); item('bottle', 8, 100);
  prop('sign', 33, 85, 'Got any grapes?'); prop('doll', 30, 76); prop('jack', 33, 93);
  prop('lemontree', 30, 79); prop('lemontree', 34, 96); prop('lemontree', 29, 101);

  // --- Secret islands out in the dark: each has a music box ---
  rect(54, 44, 56, 46, 1, T.NURSERY); item('musicbox', 55, 45); item('bottle', 54, 46);
  rect(117, 58, 118, 60, 2, T.CLOWN); item('musicbox', 117, 59);
  rect(18, 105, 20, 107, 1, T.PARK); item('musicbox', 19, 106); item('pacifier', 20, 107);

  // --- The Nursery Cove (west, flooded, final boss) ---
  rect(34, 51, 49, 68, 1, T.WATER);
  for (const [bx, by, bh] of [[37, 54, 2], [46, 55, 1.5], [38, 65, 1.5], [45, 64, 2]]) set(bx, by, bh, T.BLOCK);
  prop('sign', 52, 60, 'Sealed until the other five are beaten.');

  // Arenas with fences, and the bosses inside them
  bosses = {};
  for (const id of BOSS_ORDER) {
    const d = BOSS_DEFS[id], [x0, y0, x1, y1] = d.arena, fh = d.floor + 2.5;
    for (let x = x0; x <= x1; x++) { set(x, y0, fh, d.fence); set(x, y1, fh, d.fence); }
    for (let y = y0; y <= y1; y++) { set(x0, y, fh, d.fence); set(x1, y, fh, d.fence); }
    for (const [gx, gy] of d.gates) set(gx, gy, d.floor, TY(gx + (gx === x1 ? -1 : gx === x0 ? 1 : 0), gy + (gy === y1 ? -1 : gy === y0 ? 1 : 0)));
    bosses[id] = { id, def: d, x: d.at[0], y: d.at[1], z: d.floor, air: d.air, hp: d.hp, state: id === 'final' ? 'locked' : 'wait',
      t: 0, mv: null, queue: [], dir: [0, 1], face: 1, hurtT: 0, sq: 0, phase: 0 };
  }
  sealCove(true);

  door = null;
  for (const e of enemies) {
    e.z = groundAt(e.x, e.y, 20, .3);
    if (e.kind === 'tinyspider') { e.hang = true; e.base = e.z; e.z = e.base + 3; }
  }
  for (const p of props) p.z = H(Math.floor(p.x), Math.floor(p.y));
  for (const p of pickups) p.z = H(Math.floor(p.x), Math.floor(p.y));
}
function sealCove(on) {
  for (const [gx, gy] of BOSS_DEFS.final.gates) set(gx, gy, on ? 9 : 1, on ? T.SEAL : T.WATER);
  mapDirty = true;
}

function groundAt(x, y, z, r) {
  let g = VOID;
  for (let i = 0; i < 4; i++) {
    const h = H(Math.floor(x + (i & 1 ? r : -r)), Math.floor(y + (i & 2 ? r : -r)));
    if (h !== VOID && h <= z + STEP && h > g) g = h;
  }
  return g;
}

// --- tile textures: two variants per tile type, drawn pixel by pixel ---
const texCache = {}, faceCache = {};
function makeTex(t, v) {
  const c = document.createElement('canvas'); c.width = c.height = TS;
  const x = c.getContext('2d'), r = rng(t * 97 + v * 13 + 1), pal = PAL[t], base = pal[v % pal.length];
  const dk = shade(base, .72), lt = shade(base, 1.25);
  const fill = (col, X, Y, w, h) => { x.fillStyle = col; x.fillRect(X, Y, w, h); };
  const dots = (col, n, w, h) => { for (let i = 0; i < n; i++) fill(col, r() * TS | 0, r() * TS | 0, w || 1, h || 1); };
  fill(base, 0, 0, TS, TS);
  switch (t) {
    case T.NURSERY: dots(dk, 18); dots(lt, 8); break;
    case T.GRAVE: dots(dk, 26); dots('#5a7050', 7, 1, 2); break;

  ctx.fillStyle = dim > .3 ? '#1a1430' : '#ffe8a8'; ctx.fillRect(cx - 87, fy - 87, 38, 34);
  ctx.fillStyle = '#3a2a1a'; ctx.fillRect(cx - 69, fy - 87, 2, 34); ctx.fillRect(cx - 87, fy - 71, 38, 2);
  ctx.fillStyle = `rgba(255,232,168,${(.18 * (1 - dim)).toFixed(2)})`; ctx.beginPath(); ctx.moveTo(cx - 87, fy - 53); ctx.lineTo(cx - 49, fy - 53); ctx.lineTo(cx + 10, fy + 30); ctx.lineTo(cx - 60, fy + 30); ctx.fill();
  // the crib, with the baby inside
  ctx.fillStyle = '#c8a070'; ctx.fillRect(cx - 26, fy - 40, 52, 4); ctx.fillRect(cx - 26, fy - 6, 52, 4);
  const baby = endT < 4 ? SPR.babyBlink : SPR.baby.down[0];
  ctx.drawImage(baby, cx - 8, fy - 26 - (endT > 4 && endT < 6 ? Math.floor(endT * 6) & 1 : 0));
  ctx.fillStyle = '#c8a070'; for (let x = cx - 26; x <= cx + 24; x += 5) ctx.fillRect(x, fy - 40, 2, 38);
  ctx.fillRect(cx - 28, fy - 44, 4, 46); ctx.fillRect(cx + 24, fy - 44, 4, 46);
  // Mommy
  if (endT < 9.5) ctx.drawImage(SPR.mommy, cx + 34, fy - SPR.mommy.height + 2);
  // twist: someone is looking in the window, the baby's eyes turn red, and then...
  if (endT > 12.5) {
    ctx.save(); ctx.beginPath(); ctx.rect(cx - 87, fy - 87, 38, 34); ctx.clip();
    ctx.globalAlpha = clamp((endT - 12.5) / 1.5, 0, 1); ctx.drawImage(SPR.mac, cx - 82, fy - 86 + Math.max(0, Math.round((14 - endT) * 8)), sw(SPR.mac), sh(SPR.mac));
    ctx.globalAlpha = 1; ctx.restore();
    if (endT > 14) { ctx.fillStyle = '#ff3040'; ctx.fillRect(cx - 72, fy - 75, 1, 1); ctx.fillRect(cx - 67, fy - 75, 1, 1); }
  }
  if (endT > 14.5) { ctx.fillStyle = Math.floor(endT * 4) & 1 ? '#ff2030' : '#c01020'; ctx.fillRect(cx - 3, fy - 20, 2, 2); ctx.fillRect(cx + 2, fy - 20, 2, 2); ctx.fillStyle = '#000'; ctx.fillRect(cx - 3, fy - 17, 7, 1); ctx.fillRect(cx - 4, fy - 18, 1, 1); ctx.fillRect(cx + 4, fy - 18, 1, 1); }
  if (endT < 3) winScared = 0;
  if (endT > 15.7 && winScared === 0) { winScared = 1; scareT = .7; scareImg = SPR.mac; sfx('scare'); }
  if (endT > 16.4 && winScared === 1) { winScared = 2; sfx('laugh'); say('E. I. E. I. O.', .1, .35, .9); }
  // the music box under the crib, and eyes in the dark
  if (dim > 0) {
    ctx.fillStyle = `rgba(6,0,12,${dim.toFixed(2)})`; ctx.fillRect(0, 0, LW, LH);
    ctx.drawImage(SPR.musicbox, cx - 6, fy - 2);
    if (Math.floor(endT * 3) % 2) { ctx.fillStyle = '#d8a0ff'; ctx.fillRect(cx + 6, fy - 8 - Math.floor(endT * 10) % 6, 2, 2); }
    if (endT > 11) [[.15, .3], [.82, .25], [.1, .62], [.88, .6], [.5, .15]].forEach(([ex, ey], k) => {
      if (endT > 11 + k * .6) ctx.drawImage(Math.sin(endT * 1.3 + k) > .9 ? SPR.eyeShut : SPR.eye, Math.round(LW * ex), Math.round(LH * ey));
    });
  }
}
function drawWin() {
  const a = clamp(endT / 2, 0, 1);
  if (endT < 2) { ctx.fillStyle = `rgba(255,244,214,${a})`; ctx.fillRect(0, 0, vw, vh); return; }
  const type = (txt, start) => txt.slice(0, Math.max(0, Math.floor((endT - start) * 22)));
  ctx.textAlign = 'center';
  if (endT < 9) {
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(vw * .1, vh * .06, vw * .8, 64);
    ctx.font = `${Math.min(22, vw / 26)}px ${PF}`; ctx.fillStyle = '#ffe8a8'; ctx.fillText('YOU WOKE UP!', vw / 2, vh * .06 + 26);
    ctx.font = `10px ${PF}`; ctx.fillStyle = '#fff'; ctx.fillText(type('Mommy: "Good morning, sweetie. It was only a dream."', 3), vw / 2, vh * .06 + 50);
  }
  if (endT > 11) {
    ctx.font = `${Math.min(13, vw / 40)}px ${PF}`; ctx.fillStyle = '#e02040';
    ctx.fillText(type('...but the music box under the crib is still playing.', 11), vw / 2, vh * .1);
    if (endT > 14) ctx.fillText(type("Hush, little baby. Don't say a word.", 14), vw / 2, vh * .1 + 30);
  }
  if (endT > 16) {
    ctx.font = `9px ${PF}`; ctx.fillStyle = '#c8b8d8'; ctx.fillText('Time: ' + clock(P.playT) + '     Secret music boxes: ' + P.secrets + ' / 3', vw / 2, vh * .9 - 66);
    if (newBest) { ctx.fillStyle = '#ffd23a'; ctx.fillText('NEW BEST TIME!', vw / 2, vh * .9 - 84); }
  }
  if (endT > 17) { ctx.font = `${Math.min(26, vw / 22)}px ${PF}`; ctx.fillStyle = '#c0283a'; ctx.fillText('THE END?', vw / 2, vh * .9 - 30); }
  if (endT > 19) { // the credits roll up
    const lines = ['HUSH LITTLE BABY', '', 'Bosses, story and big ideas:', 'a very brave kid', '', 'Pixels, code and the music box:', 'Claude', '', 'Thanks for playing.', 'Sleep tight...'];
    ctx.fillStyle = 'rgba(0,0,0,.75)'; ctx.fillRect(0, vh * .22, vw, vh * .5);
    ctx.save(); ctx.beginPath(); ctx.rect(0, vh * .22, vw, vh * .5); ctx.clip();
    lines.forEach((l, i) => {
      const y = vh * .72 + i * 22 - (endT - 19) * 28;
      ctx.font = `${i === 0 ? 14 : 9}px ${PF}`; ctx.fillStyle = i === 0 ? '#c0283a' : i % 3 === 2 ? '#c8b8d8' : '#ffd0f0'; ctx.fillText(l, vw / 2, y);
    });
    ctx.restore();
  }
  if (endT > 18) { ctx.fillStyle = '#8a6a8a'; ctx.font = `9px ${PF}`; ctx.fillText('Press Space or tap to play again', vw / 2, vh - 20); }
}
const STORY = ['Every night, Mommy sings the lullaby.', "Hush, little baby, don't say a word...", "But tonight, the song didn't stop.", 'And the nursery rhymes woke up.'];
function drawStoryScene() {
  const LW = GW, LH = GH, cx = LW >> 1, fy = Math.round(LH * .7);
  ctx.fillStyle = '#120a20'; ctx.fillRect(0, 0, LW, fy); ctx.fillStyle = '#1c1210'; ctx.fillRect(0, fy, LW, LH - fy);
  // moonlight through the window
  ctx.fillStyle = '#2a2050'; ctx.fillRect(cx + 50, fy - 90, 40, 36); ctx.fillStyle = '#120a20'; ctx.fillRect(cx + 69, fy - 90, 2, 36); ctx.fillRect(cx + 50, fy - 73, 40, 2);
  ctx.fillStyle = 'rgba(120,110,200,.08)'; ctx.beginPath(); ctx.moveTo(cx + 50, fy - 54); ctx.lineTo(cx + 90, fy - 54); ctx.lineTo(cx + 20, fy + 30); ctx.lineTo(cx - 30, fy + 30); ctx.fill();
  // the crib, the sleeping baby, and a mobile that won't stop spinning
  ctx.drawImage(SPR.babyBlink, cx - 8, fy - 26);
  ctx.fillStyle = '#5a4030'; ctx.fillRect(cx - 26, fy - 40, 52, 4); ctx.fillRect(cx - 26, fy - 6, 52, 4);
  for (let x = cx - 26; x <= cx + 24; x += 5) ctx.fillRect(x, fy - 40, 2, 38);
  ctx.fillRect(cx - 28, fy - 44, 4, 46); ctx.fillRect(cx + 24, fy - 44, 4, 46);
  ctx.fillStyle = '#8a7a6a'; ctx.fillRect(cx, fy - 92, 1, 30); ctx.fillRect(cx - 18, fy - 62, 37, 1);
  const spin = time * (1 + time * .15); // it spins faster and faster
  for (let k = 0; k < 4; k++) {
    const a = spin + k * Math.PI / 2, mx = Math.round(cx + Math.cos(a) * 18), my = fy - 62 + Math.round(Math.sin(a) * 4);
    ctx.fillStyle = '#8a7a6a'; ctx.fillRect(mx, fy - 62, 1, my - (fy - 62) + 6);
    ctx.drawImage(SPR.ministar, mx - 2, my + 6);
  }
  if (time > 12) { ctx.globalAlpha = clamp((time - 12) / 2, 0, 1); ctx.drawImage(SPR.eye, cx - 70, fy - 70); ctx.drawImage(SPR.eye, cx + 30, fy - 110); ctx.globalAlpha = 1; }
}
function drawStoryText() {
  ctx.fillStyle = 'rgba(8,4,16,.85)'; ctx.fillRect(vw * .08, vh * .12 - 26, vw * .84, 4 * 28 + 18);
  ctx.textAlign = 'center'; ctx.font = `${Math.min(12, vw / 40)}px ${PF}`;
  STORY.forEach((line, i) => {
    const t = time - i * 3; if (t <= 0) return;
    ctx.fillStyle = i < 2 ? '#c8b8e8' : '#e02040';
    ctx.fillText(line.slice(0, Math.floor(t * 24)), vw / 2, vh * .12 + i * 28);
  });
  ctx.font = `8px ${PF}`; ctx.fillStyle = '#6a5a7a'; ctx.fillText(isTouch ? 'Tap to skip' : 'Press any key to skip', vw / 2, vh - 18);
}
function drawTitle() {
  ctx.textAlign = 'center';
  ctx.font = `${Math.min(44, vw / 14)}px ${PF}`;
  // every few seconds the title glitches and says something else
  const glitch = time % 7 > 6.75, title = glitch ? "HE'S WATCHING" : 'HUSH LITTLE BABY', jx = glitch ? (Math.random() - .5) * 12 : 0;
  ctx.fillStyle = '#5a0a16'; ctx.fillText(title, vw / 2 + 4 + jx, vh * .22 + 4);
  ctx.fillStyle = glitch ? '#ff1030' : '#c0283a'; ctx.fillText(title, vw / 2 + jx, vh * .22);
  // blood dripping off the letters
  const tw = ctx.measureText('HUSH LITTLE BABY').width, fs = Math.min(44, vw / 14);
  for (let k = 0; k < 16; k++) {
    const x = Math.round(vw / 2 - tw / 2 + ((k * 37) % 100) / 100 * tw), len = (time * (5 + k % 4) + k * 13) % 46;
    ctx.fillStyle = '#8a0a1c'; ctx.fillRect(x, vh * .22, 4, len); ctx.fillRect(x - 1, vh * .22 + len - 2, 6, 5);
    if (k % 3 === 0) ctx.fillRect(x + 1, vh * .22 + ((time * 40 + k * 50) % (vh * .2)) + fs * .3, 3, 4); // a drop falling
  }
  ctx.font = `${Math.min(12, vw / 36)}px ${PF}`; ctx.fillStyle = '#a890c0';
  ctx.fillText("Don't say a word. The nursery rhymes are awake.", vw / 2, vh * .22 + 40);
  ctx.font = `9px ${PF}`; ctx.fillStyle = '#c8b8d8';
  const lines = isTouch
    ? ['Stick: move    JUMP: jump    DASH: dash', 'MOMMY: show the map for 5 seconds (10 times)', 'Jump on enemies to beat them. Beat all 6 bosses to wake up.']
    : ['Move: Arrow keys or WASD', 'Jump: Space or Z      Dash: Shift or X', 'Ask Mommy for the map: M (10 times)', 'Jump on enemies to beat them. Beat all 6 bosses to wake up.  Pause: P'];
  lines.forEach((l, i) => ctx.fillText(l, vw / 2, vh * .38 + i * 22));
  if (bestTime) { ctx.fillStyle = '#ffd23a'; ctx.fillText('Best time: ' + clock(bestTime), vw / 2, vh * .38 + lines.length * 22 + 34); }
  ctx.fillStyle = '#7a6a8a'; ctx.fillText(AC ? '' : '(press any key to hear the lullaby)', vw / 2, vh * .38 + lines.length * 22 + 10);
  if (Math.floor(time * 2) % 2) { ctx.font = `${Math.min(16, vw / 32)}px ${PF}`; ctx.fillStyle = '#ffd0f0'; ctx.fillText(isTouch ? 'Tap JUMP to begin' : 'Press Space to begin', vw / 2, vh * .76); }
}

// ===== Loop =====
let last = performance.now();
function frame(now) {
  const dt = clamp((now - last) / 1000, 0, .05); last = now;
  if (pressed.vol) { initAudio(); cycleVolume(); }
  if (isTouch) document.getElementById('touch').classList.toggle('playing', state === 'play' || state === 'pause'); // PAUSE and SOUND only while playing
  if (state === 'story') { // any key or tap skips the story
    time += dt;
    if (time > 17 || Object.keys(pressed).some(k => pressed[k])) { state = 'title'; time = 0; }
  } else if (state === 'title' || (state === 'over' && endT > 1) || (state === 'win' && endT > 18)) {
    if (pressed.jump || (pressed.start && state !== 'title')) { initAudio(); newGame(); }
    else if (pressed.start) initAudio();
    time += dt;
  } else update(dt);
  musicTick();
  render();
  for (const k in pressed) pressed[k] = false;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
