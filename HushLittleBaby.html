<body>
<canvas id="c"></canvas>
<div id="touch">

  <div class="tb" data-k="jump" style="right:20px;bottom:30px">JUMP</div>
  <div class="tb" data-k="dash" style="right:104px;bottom:20px">DASH</div>

</div>
<script>
'use strict';
// ===== Canvas =====
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let cw = 0, ch = 0, zoom = 1, vw = 0, vh = 0, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cw = window.innerWidth; ch = window.innerHeight;
  cv.width = cw * dpr; cv.height = ch * dpr;
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  zoom = Math.max(0.7, Math.min(1.4, Math.min(cw, ch) / 620));
  vw = cw / zoom; vh = ch / zoom;
}
window.addEventListener('resize', resize); resize();

// ===== Helpers =====
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp(((n >> 16) & 255) * f, 0, 255) | 0, g = clamp(((n >> 8) & 255) * f, 0, 255) | 0, b = clamp((n & 255) * f, 0, 255) | 0;
  return `rgb(${r},${g},${b})`;
}

// ===== World =====
// Heights are in "units": half steps are walkable, full steps need a jump.
const W = 120, VOID = -100, STEP = 0.55;
const hgt = new Float32Array(W * W), typ = new Uint8Array(W * W);
const T = {
  NURSERY: 0, GRAVE: 1, MAZE: 2, BLOCK: 3, CLOWN: 4, FARM: 5, BRIDGE: 6, MAZEWALL: 7, FENCE: 8, BARN: 9, STONE: 10,
  SKY: 11, BAKERY: 12, OVEN: 13, ATTIC: 14, RAFTER: 15, PARK: 16, STAND: 17, WATER: 18, SEAL: 19, SKYRAIL: 21, PICKET: 22, CRIB: 23
};
const PAL = {
  0: ['#6a4e74', '#61466b'], 1: ['#3f4c43', '#39453d'], 2: ['#2f3654', '#2a3050'],
  3: ['#8a3a3a', '#3a5a8a', '#8a7a3a', '#4a7a4a'], 4: ['#7a2030', '#a89c90'], 5: ['#4d4a24', '#45421f'],
  6: ['#5a4632', '#4f3d2a'], 7: ['#7a5534', '#704d2f'], 8: ['#5a3a1e', '#53361c'], 9: ['#6e1d1d', '#661a1a'], 10: ['#5c6262', '#555b5b'],
  11: ['#1c2150', '#181c46'], 12: ['#6e5f44', '#8f8268'], 13: ['#2e2a2a', '#282424'], 14: ['#4a3826', '#43321f'], 15: ['#3a2a18', '#33250f'],
  16: ['#22381f', '#1f331c'], 17: ['#c8b040', '#c86a8a'], 18: ['#1d4448', '#1a3e42'], 19: ['#7a30b8', '#7a30b8'],
  21: ['#9ab0e0', '#8aa0d0'], 22: ['#b8b8b0', '#a8a8a0'], 23: ['#d8d0e0', '#c8c0d0']
};
// Which named zone each tile type belongs to (for the banner when you walk in)
const ZONE_OF = { 0: 0, 1: 1, 10: 1, 2: 2, 7: 2, 3: 3, 4: 4, 5: 5, 8: 5, 9: 5, 11: 11, 21: 11, 12: 12, 13: 12, 14: 14, 15: 14, 16: 16, 17: 16, 22: 16, 18: 18, 19: 18, 23: 18 };
const ZONES = {
  0: ['The Nursery', 'Mommy? ...Mommy?'], 1: ['The Toy Graveyard', 'The toys you threw away miss you.'], 2: ['The Crib Maze', "Don't get lost, little one."],
  3: ['The Block Stairs', "Don't look down."], 4: ['Clown Hills', 'Everybody is smiling. Forever.'], 5: ["Old MacDonald's Farm", 'E-I-E-I-O...'],
  11: ['The Night Sky', 'Up above the world so high...'], 12: ['The Creepy Bakery', 'Something is still in the oven.'], 14: ['The Attic', 'Down came the rain...'],
  16: ['The Lemonade Stand', 'Got any grapes?'], 18: ['The Nursery Cove', 'Heads, shoulders, knees and toes...']
};
function H(x, y) { return (x < 0 || y < 0 || x >= W || y >= W) ? VOID : hgt[y * W + x]; }
function TY(x, y) { return typ[y * W + x]; }
function set(x, y, h, t) { if (x < 0 || y < 0 || x >= W || y >= W) return; hgt[y * W + x] = h; typ[y * W + x] = t; }
function rect(x0, y0, x1, y1, h, t) { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) set(x, y, h, t); }

let enemies, pickups, props, bosses, door, particles, shots, waves, falls;

// Boss blueprints: where they live, how tough they are, and what they do.
const BOSS_DEFS = {
  mac: { name: 'OLD MACDONALD', song: 'mac', hp: 3, r: .7, h: 2.2, air: 0, minion: 'pig', arena: [92, 6, 106, 20], floor: 5, fence: T.FENCE, gates: [[99, 20], [100, 20]], at: [99.5, 12.5],
    intro: 'Old MacDonald had a baby. E. I. E. I. O.', tip: 'Stomp him when he is dizzy!', bubble: 'E-I-E-I-O!' },
  star: { name: 'TWINKLE TWINKLE', song: 'star', hp: 4, r: .8, h: 1.8, air: 2.6, minion: null, arena: [64, 102, 80, 118], floor: 6, fence: T.SKYRAIL, gates: [[80, 113], [80, 114]], at: [72.5, 109.5],
    intro: 'Twinkle twinkle, little baby. How I wonder where you are.', tip: 'When it falls down tired, stomp it!', bubble: 'Twinkle twinkle...' },
  bun: { name: 'HOT CROSS BUN', song: 'bun', hp: 4, r: .9, h: 1.8, air: 0, minion: 'littlebun', arena: [51, 18, 69, 33], floor: 1, fence: T.OVEN, gates: [[59, 33], [60, 33]], at: [59.5, 24.5],
    intro: 'Hot cross buns. Hot cross buns. One a penny, two a penny, one baby.', tip: 'Jump over the shockwaves! Stomp it when it gets stuck.', bubble: 'HOT! HOT!' },
  spider: { name: 'ITSY BITSY SPIDER', song: 'spider', hp: 5, r: .9, h: 1.4, air: 3.4, minion: 'tinyspider', arena: [12, 14, 28, 30], floor: 6, fence: T.RAFTER, gates: [[28, 21], [28, 22]], at: [20.5, 22.5],
    intro: 'The itsy bitsy spider climbed up to get the baby.', tip: 'Webs slow you down. Stomp it when it rests on the floor!', bubble: 'Itsy... bitsy...' },
  duck: { name: 'THE DUCK', song: 'duck', hp: 5, r: .8, h: 2, air: 0, minion: 'duckling', arena: [9, 77, 27, 95], floor: 1, fence: T.PICKET, gates: [[27, 85], [27, 86]], at: [18.5, 86.5],
    intro: 'Hey! Got any grapes?', tip: 'Watch for falling grapes! Stomp it when it trips.', bubble: 'Got any grapes?' },
  final: { name: 'HEADS, SHOULDERS, KNEES AND TOES', song: 'heads', hp: 8, r: .9, h: 2.2, air: 0, minion: null, arena: [34, 51, 49, 68], floor: 1, fence: T.CRIB, gates: [[49, 59], [49, 60]], at: [41.5, 59.5],
    intro: 'Heads. Shoulders. Knees. And. Toes.', tip: 'Beat every part of it!', bubble: 'HEADS!' }
};
const BOSS_ORDER = ['mac', 'star', 'bun', 'spider', 'duck', 'final'];
const PARTS = ['HEAD', 'SHOULDERS', 'KNEES', 'TOES'];

function buildWorld() {
  hgt.fill(VOID); typ.fill(0);
  const r = rng(2024);
  enemies = []; pickups = []; props = []; particles = []; shots = []; waves = []; falls = [];
  const foe = (kind, x, y, extra) => enemies.push(Object.assign({ kind, x: x + .5, y: y + .5, z: 0, r: .32, h: .9, dead: false, t: r() * 6, dir: 1 }, extra));
  const toy = (x, y, axis, range) => foe('toy', x, y, { ox: x + .5, oy: y + .5, axis, range, sp: 1.3 });
  const prop = (kind, x, y, text) => props.push({ kind, x: x + .5, y: y + .5, z: 0, text, t: 0 });
  const item = (kind, x, y) => pickups.push({ kind, x: x + .5, y: y + .5, z: 0 });

  // --- The Nursery (start, in the middle of everything) ---
  rect(54, 54, 65, 65, 1, T.NURSERY);

  prop('doll', 55, 64); prop('doll', 64, 55); prop('sign', 59, 61, 'Beat them all. Then you can wake up.');

  rect(59, 41, 60, 53, 1, T.BRIDGE); set(59, 47, VOID, 0); set(60, 47, VOID, 0);        // north
  rect(50, 59, 53, 60, 1, T.BRIDGE);                                                     // west (to the cove)

  // --- The Toy Graveyard (east) ---
  for (let y = 50; y <= 69; y++) for (let x = 70; x <= 86; x++) set(x, y, r() < .25 ? 1.5 : 1, T.GRAVE);
  for (let i = 0; i < 26; i++) { const gx = 71 + (r() * 15 | 0), gy = 51 + (r() * 18 | 0); if (gy < 58 || gy > 61) set(gx, gy, 2.5, T.STONE); }
  set(85, 51, 3.5, T.STONE); item('bottle', 85, 51);
  toy(73, 59, 'x', 4); toy(78, 64, 'y', 3); toy(82, 54, 'x', 3); toy(76, 67, 'x', 5); toy(84, 60, 'y', 4);
  prop('doll', 74, 52); prop('doll', 83, 66); prop('jack', 80, 60); prop('sign', 71, 60, 'Mr. Teddy is waiting for you.');
  rect(87, 59, 91, 59, 1.5, T.BRIDGE); set(89, 59, VOID, 0);

  // --- Clown Hills (far east) ---
  for (let y = 36; y <= 84; y++) for (let x = 92; x <= 114; x++) {
    const v = 2 + Math.round((Math.sin(x * .45) + Math.cos(y * .38) + Math.sin((x + y) * .2)) * 1.2) * .5;
    set(x, y, clamp(v, 1.5, 4), T.CLOWN);
  }
  rect(92, 58, 93, 60, 1.5, T.CLOWN);
  rect(99, 36, 106, 39, 3, T.CLOWN);
  { const b = H(109, 70); set(110, 70, b + 1, T.BLOCK); set(111, 70, b + 2, T.BLOCK); set(112, 70, b + 3, T.BLOCK); pickups.push({ kind: 'bottle', x: 112.5, y: 70.5, z: 0 }); }
  item('pacifier', 96, 48);
  toy(95, 41, 'x', 4); toy(102, 47, 'y', 4); toy(108, 55, 'x', 4); toy(98, 66, 'y', 3); toy(105, 74, 'x', 3); toy(110, 44, 'y', 3); toy(100, 80, 'x', 4);
  prop('jack', 100, 52); prop('jack', 108, 62); prop('jack', 96, 76); prop('doll', 112, 82); prop('sign', 102, 39, 'The farm is up there. He is waiting.');
  // stairs up to the farm (the last gap needs a dash-jump)
  rect(102, 33, 103, 35, 3.5, T.BLOCK); rect(102, 31, 103, 32, 4, T.BLOCK); rect(102, 29, 103, 30, 4.5, T.BLOCK);

  // --- Old MacDonald's Farm (north-east, high up) ---
  rect(86, 4, 116, 25, 5, T.FARM);
  rect(108, 8, 112, 18, 8, T.BARN);
  prop('sign', 99, 22, 'Old MacDonald had a baby...'); prop('doll', 88, 23); prop('jack', 114, 22); item('pacifier', 90, 6);

  // --- The Crib Maze (south) ---
  rect(48, 72, 72, 94, 3, T.MAZEWALL);
  {
    const MW = 12, MH = 11, seen = new Uint8Array(MW * MH), stack = [[5, 0]];
    const cell = (cx, cy) => [49 + cx * 2, 73 + cy * 2];
    seen[5] = 1; set(...cell(5, 0), 1, T.MAZE);
    let far = [5, 0], farD = 0;
    while (stack.length) {
      const [cx, cy] = stack[stack.length - 1];
      const nb = [[1, 0], [-1, 0], [0, 1], [0, -1]].filter(([dx, dy]) => { const nx = cx + dx, ny = cy + dy; return nx >= 0 && ny >= 0 && nx < MW && ny < MH && !seen[ny * MW + nx]; });
      if (!nb.length) { stack.pop(); continue; }
      const [dx, dy] = nb[r() * nb.length | 0], nx = cx + dx, ny = cy + dy;
      seen[ny * MW + nx] = 1;
      const [ax, ay] = cell(cx, cy); set(ax + dx, ay + dy, 1, T.MAZE); set(...cell(nx, ny), 1, T.MAZE);
      stack.push([nx, ny]);
      if (stack.length > farD) { farD = stack.length; far = [nx, ny]; }
    }
    const [fx, fy] = cell(...far); item('bottle', fx, fy);
  }
  set(59, 72, 1, T.MAZE);              // entrance from the nursery
  set(48, 83, 1, T.MAZE);              // west exit to the lemonade stand
  set(72, 93, 1, T.MAZE);              // east exit to the block stairs
  toy(51, 75, 'y', 2); toy(57, 81, 'x', 2); toy(65, 87, 'x', 2); toy(69, 77, 'y', 2);
  prop('sign', 59, 73, 'Shhh. The walls are listening.');
  rect(36, 83, 47, 83, 1, T.BRIDGE); set(41, 83, VOID, 0);

  // --- The Block Stairs up to the Night Sky (south-east) ---
  rect(73, 93, 75, 93, 1, T.BRIDGE);
  const steps = [[76, 94, 1.5], [79, 96, 2], [82, 98, 2.5], [84, 101, 3], [86, 104, 3.5], [87, 107, 4], [86, 110, 4.5], [84, 112, 5], [81, 113, 5.5]];
  for (const [sx, sy, sh] of steps) rect(sx, sy, sx + 1, sy + 1, sh, T.BLOCK);
  item('pacifier', 87, 107); item('bottle', 86, 110);
  prop('sign', 76, 94, "Up, up, up. Don't look down.");

  // --- The Night Sky (Twinkle Twinkle) ---
  rect(64, 102, 80, 118, 6, T.SKY);
  for (const [hx, hy] of [[68, 106], [69, 106], [75, 110], [76, 110], [70, 114], [71, 114], [76, 105], [67, 111]]) set(hx, hy, VOID, 0);

  // --- The Creepy Bakery (north, Hot Cross Bun) ---
  rect(48, 16, 72, 40, 1, T.BAKERY);
  for (const [ox, oy] of [[49, 37], [50, 37], [70, 37], [71, 37], [53, 20], [54, 20], [66, 20], [67, 20]]) set(ox, oy, 3, T.OVEN);
  set(49, 38, 2, T.OVEN); item('bottle', 49, 37);
  foe('littlebun', 53, 38); foe('littlebun', 66, 36); foe('littlebun', 62, 39);
  prop('sign', 59, 39, 'One a penny, two a penny...'); prop('doll', 71, 39);

  // --- The Attic (north-west, high up, Itsy Bitsy Spider) ---
  const attic = [[45, 28, 2], [42, 27, 3], [39, 28, 4], [36, 27, 5]];
  for (const [sx, sy, sh] of attic) rect(sx, sy, sx + 1, sy + 1, sh, T.BLOCK);
  rect(46, 28, 47, 29, 1.5, T.BAKERY);
  rect(8, 12, 34, 36, 6, T.ATTIC);
  set(31, 15, 8, T.RAFTER); set(31, 33, 8, T.RAFTER); set(33, 24, 7, T.RAFTER); item('bottle', 33, 24);
  foe('tinyspider', 31, 20); foe('tinyspider', 32, 28); foe('tinyspider', 30, 25); foe('tinyspider', 33, 17);
  prop('sign', 33, 27, 'Down came the rain and washed the baby out.'); prop('doll', 30, 35);

  // --- The Lemonade Stand (south-west, the Duck) ---
  rect(6, 74, 35, 102, 1, T.PARK);
  rect(12, 79, 14, 80, 2.5, T.STAND);
  foe('duckling', 31, 80); foe('duckling', 32, 90); foe('duckling', 30, 96);
  item('pacifier', 33, 99); item('bottle', 8, 100);
  prop('sign', 33, 85, 'Got any grapes?'); prop('doll', 30, 76); prop('jack', 33, 93);

  // --- The Nursery Cove (west, flooded, final boss) ---
  rect(34, 51, 49, 68, 1, T.WATER);
  for (const [bx, by, bh] of [[37, 54, 2], [46, 55, 1.5], [38, 65, 1.5], [45, 64, 2]]) set(bx, by, bh, T.BLOCK);
  prop('sign', 52, 60, 'Sealed until the other five are beaten.');

  // Arenas with fences, and the bosses inside them
  bosses = {};
  for (const id of BOSS_ORDER) {
    const d = BOSS_DEFS[id], [x0, y0, x1, y1] = d.arena, fh = d.floor + 2.5;
    for (let x = x0; x <= x1; x++) { set(x, y0, fh, d.fence); set(x, y1, fh, d.fence); }
    for (let y = y0; y <= y1; y++) { set(x0, y, fh, d.fence); set(x1, y, fh, d.fence); }
    for (const [gx, gy] of d.gates) set(gx, gy, d.floor, TY(gx + (gx === x1 ? -1 : gx === x0 ? 1 : 0), gy + (gy === y1 ? -1 : gy === y0 ? 1 : 0)));
    bosses[id] = { id, def: d, x: d.at[0], y: d.at[1], z: d.floor, air: d.air, hp: d.hp, state: id === 'final' ? 'locked' : 'wait',
      t: 0, mv: null, queue: [], dir: [0, 1], face: 1, hurtT: 0, sq: 0, phase: 0 };
  }

  door = null;
  for (const e of enemies) {
    e.z = groundAt(e.x, e.y, 20, .3);
    if (e.kind === 'tinyspider') { e.hang = true; e.base = e.z; e.z = e.base + 3; }
  }
  for (const p of props) p.z = H(Math.floor(p.x), Math.floor(p.y));
  for (const p of pickups) p.z = H(Math.floor(p.x), Math.floor(p.y));
}
function sealCove(on) {
  for (const [gx, gy] of BOSS_DEFS.final.gates) set(gx, gy, on ? 9 : 1, on ? T.SEAL : T.WATER);
  mapDirty = true;
}

function groundAt(x, y, z, r) {
  let g = VOID;
  for (let i = 0; i < 4; i++) {
    const h = H(Math.floor(x + (i & 1 ? r : -r)), Math.floor(y + (i & 2 ? r : -r)));
    if (h !== VOID && h <= z + STEP && h > g) g = h;
  }
  return g;
}
function blocked(x, y, z, r) {
  for (let i = 0; i < 4; i++) {
    const h = H(Math.floor(x + (i & 1 ? r : -r)), Math.floor(y + (i & 2 ? r : -r)));
    if (h !== VOID && h > z + STEP) return true;
  }
  return false;
}

// ===== Audio =====
let AC = null, master = null, musicGain = null, nextNote = 0, noteIdx = 0, curSong = '';
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = .5; master.connect(AC.destination);
    musicGain = AC.createGain(); musicGain.gain.value = .5; musicGain.connect(master);
    // low creepy drone under everything
    const o = AC.createOscillator(), o2 = AC.createOscillator(), g = AC.createGain(), lfo = AC.createOscillator(), lg = AC.createGain();
    o.type = 'sawtooth'; o.frequency.value = 49; o2.type = 'sine'; o2.frequency.value = 73.4;
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 220;
    lfo.frequency.value = .13; lg.gain.value = .03; lfo.connect(lg); lg.connect(g.gain);
    g.gain.value = .05; o.connect(f); o2.connect(f); f.connect(g); g.connect(musicGain);
    o.start(); o2.start(); lfo.start();
    nextNote = AC.currentTime + .3;
  } catch (e) { AC = null; }
}
// Songs as [midi note, beats]. 0 = rest. All bent into minor keys to sound creepy.
const SONGS = {
  hush: [[64, 1], [69, .5], [69, .5], [69, 1], [67, .5], [69, .5], [67, .5], [65, .5], [64, 2], [0, .5],
    [64, .5], [64, .5], [67, .5], [67, .5], [65, .5], [65, .5], [64, .5], [62, .5], [60, 1], [62, .5], [64, 2.5], [0, 1],
    [64, 1], [69, .5], [69, .5], [69, 1], [67, .5], [69, .5], [67, .5], [65, .5], [64, 2], [0, .5],
    [62, .5], [62, .5], [65, .5], [64, .5], [62, .5], [60, .5], [59, .5], [57, 3], [0, 2]],
  mac: [[67, 1], [67, 1], [67, 1], [62, 1], [63, 1], [63, 1], [62, 2], [70, 1], [70, 1], [69, 1], [69, 1], [67, 3], [0, 1],
    [62, 1], [67, 1], [67, 1], [67, 1], [62, 1], [63, 1], [63, 1], [62, 2], [70, 1], [70, 1], [69, 1], [69, 1], [67, 4], [0, 2]],

const stick = { x: 0, y: 0, id: null };
const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

// ===== Game state =====
const MOM_ASKS = 10;
let state = 'title', P, time = 0, banner = { text: '', sub: '', t: 0 }, lastZone = -1, mapT = 0, momMsgT = 0, shake = 0, endT = 0, mapDirty = true, coveOpen = false;
const cam = { x: 0, y: 0 };
function newGame() {
  buildWorld();
  P = { x: 59.5, y: 59.5, z: 1, vz: 0, r: .28, h: .9, onGround: true, coyote: 0, jumpBuf: 0, dashT: 0, dashCd: 0, airDash: true, dashDir: [1, 0],
    face: 1, lives: 3, shield: false, inv: 0, safe: [59.5, 59.5, 1], safeT: 0, walkT: 0, mom: MOM_ASKS, slowT: 0, held: false, kT: 0 };
  const s = iso(P.x, P.y, P.z); cam.x = s[0]; cam.y = s[1];

function showBanner(text, sub, t) { banner = { text, sub, t: t || 3.2 }; }
function beatenCount() { return BOSS_ORDER.filter(id => id !== 'final' && bosses[id].state === 'dead').length; }

// ===== Update =====
const SPEED = 4.2, G = 21, JUMP = 7.2, DASH = 11, DASH_T = .22;
function hurt(fromX, fromY) {

  if (P.shield) { P.shield = false; P.inv = 1.2; sfx('shield'); burst(P.x, P.y, P.z + .5, '#ff9ad8', 14); return; }
  P.lives--; P.inv = 2; sfx('hurt'); shake = .35;

function gameOver() { state = 'over'; endT = 0; say('Nobody is coming, baby.', .4, .7); }
function burst(x, y, z, color, n) {

function overlap(a, b) {

function update(dt) {
  time += dt;
  if (pressed.pause) { state = state === 'pause' ? 'play' : 'pause'; }
  if (state !== 'play') return;
  if (mapT > 0) { mapT -= dt; return; } // the world waits while Mommy shows the map
  if (pressed.mom) {
    if (P.mom > 0) { P.mom--; mapT = 5; sfx('mom'); say(P.mom === 0 ? 'This is the last time, sweetie.' : 'Here, sweetie. This is where you are.', 1.15, .9); }

  }
  updatePlayer(dt);
  if (state !== 'play') return;

  // zone banner
  const tx = Math.floor(P.x), ty = Math.floor(P.y);
  if (H(tx, ty) !== VOID) {
    const zt = ZONE_OF[TY(tx, ty)];
    if (zt !== undefined && zt !== lastZone) { if (lastZone !== -1 || time > 5.5) showBanner(ZONES[zt][0], ZONES[zt][1], 3); lastZone = zt; }
  }

  updateEnemies(dt);
  for (const p of pickups) {
    if (p.got) continue;
    if (Math.hypot(P.x - p.x, P.y - p.y) < .6 && Math.abs(P.z - p.z) < 1) {
      p.got = true; sfx('pickup');
      if (p.kind === 'bottle') { P.lives = Math.min(P.lives + 1, 6); showBanner('Warm milk!', '+1 life', 1.8); burst(p.x, p.y, p.z + .5, '#ffffff', 12); }

    if (p.kind !== 'jack') continue;

function updatePlayer(dt) {
  // movement input is screen-relative: up on screen is up
  const ix = (keys.right ? 1 : 0) - (keys.left ? 1 : 0) + stick.x, iy = (keys.down ? 1 : 0) - (keys.up ? 1 : 0) + stick.y;

  const slow = P.slowT > 0 ? .45 : 1;

function updateEnemies(dt) {
  for (const e of enemies) {
    if (e.dead) continue;
    e.t += dt;
    const dx = P.x - e.x, dy = P.y - e.y, d = Math.hypot(dx, dy) || 1;

// --- Attacks that bosses leave behind: shots fly, waves spread, falls drop from the sky ---

  ox = oy = 0; if (shake > 0) { ox = (Math.random() - .5) * 12 * shake; oy = (Math.random() - .5) * 12 * shake; }
  drawVoid();
  // bucket moving things by the cell they stand in, so tiles in front can hide them
  const buckets = new Map();
  const add = (x, y, fn) => { const k = Math.floor(x + .3) + Math.floor(y + .3) * W; if (!buckets.has(k)) buckets.set(k, []); buckets.get(k).push(fn); };
  const near = (x, y) => Math.abs(x - P.x) < 30 && Math.abs(y - P.y) < 30;
  for (const p of props) if (near(p.x, p.y)) add(p.x, p.y, () => drawProp(p));
  for (const p of pickups) if (!p.got && near(p.x, p.y)) add(p.x, p.y, () => drawPickup(p));
  for (const e of enemies) if (near(e.x, e.y)) add(e.x, e.y, () => drawEnemy(e));
  for (const s of shots) add(s.x, s.y, () => drawShot(s));
  for (const f of falls) add(f.x, f.y, () => drawFall(f));
  for (const id of BOSS_ORDER) { const b = bosses[id]; if (near(b.x, b.y)) add(b.x, b.y, () => drawBoss(b)); }
  if (door) add(door.x, door.y, drawDoor);
  add(P.x, P.y, () => drawBaby(false));
  const R = 24, pi = Math.floor(P.x), pj = Math.floor(P.y);
  for (let s = pi + pj - 2 * R; s <= pi + pj + 2 * R; s++) {
    for (let i = Math.max(pi - R, s - (pj + R)); i <= Math.min(pi + R, s - (pj - R)); i++) {
      const j = s - i;
      if (i >= 0 && j >= 0 && i < W && j < W) {
        const c = S(i + .5, j + .5, 0);
        if (c[0] > -80 && c[0] < vw + 80 && c[1] > -260 && c[1] < vh + 140) drawTile(i, j);
      }
      const bk = buckets.get(i + j * W); if (bk) for (const fn of bk) fn();
    }
  }
  for (const w of waves) drawWave(w);
  for (const q of particles) { const [x, y] = S(q.x, q.y, q.z); ctx.fillStyle = q.color; ctx.globalAlpha = clamp(q.life * 2, 0, 1); ctx.fillRect(x - 2, y - 2, 4, 4); }
  ctx.globalAlpha = 1;
  drawBaby(true); // ghost outline so you never lose the baby behind walls
  // darkness around the baby
  const [px, py] = S(P.x, P.y, P.z + .8);
  const flick = Math.random() < .02 ? 40 : 0;
  const lit = door ? 520 : activeBoss() ? 420 : 330;
  const dk = ctx.createRadialGradient(px, py, 90 - flick, px, py, lit - flick);
  dk.addColorStop(0, 'rgba(3,0,8,0)'); dk.addColorStop(1, 'rgba(3,0,8,.94)');
  ctx.fillStyle = dk; ctx.fillRect(0, 0, vw, vh);
  if (P.inv > 1.5 && P.inv <= 2 && P.lives > 0) { ctx.fillStyle = `rgba(160,0,0,${(P.inv - 1.5) * .6})`; ctx.fillRect(0, 0, vw, vh); }
  drawHUD();
  if (mapT > 0) drawMap();
  if (state === 'pause') overlay('PAUSED', 'Press P to keep going');
  if (state === 'over') { endT += 1 / 60; overlay('THE NIGHTMARE GOT YOU', endT > 1 ? 'You have to start all over. Press Space or tap.' : ''); }
  if (state === 'win') { endT += 1 / 60; drawWin(); }
}
function heart(x, y, s, col) {
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x, y + s * .3);
  ctx.bezierCurveTo(x, y, x - s / 2, y, x - s / 2, y + s * .3); ctx.bezierCurveTo(x - s / 2, y + s * .6, x, y + s * .8, x, y + s);
  ctx.bezierCurveTo(x, y + s * .8, x + s / 2, y + s * .6, x + s / 2, y + s * .3); ctx.bezierCurveTo(x + s / 2, y, x, y, x, y + s * .3); ctx.fill();
}
// little picture of each boss for the list at the top of the screen
function bossIcon(id, x, y, on) {
  ctx.save(); ctx.translate(x, y); ctx.globalAlpha = on ? 1 : .35;
  ctx.fillStyle = on ? '#3a1a2a' : '#1a1020'; ctx.beginPath(); ctx.arc(0, 0, 15, 0, 7); ctx.fill();
  ctx.strokeStyle = on ? '#ffd23a' : '#5a4a6a'; ctx.lineWidth = 2; ctx.stroke();
  if (id === 'mac') { ctx.fillStyle = '#b89a50'; ctx.beginPath(); ctx.ellipse(0, 3, 11, 3, 0, 0, 7); ctx.fill(); ctx.fillRect(-6, -7, 12, 10); }
  else if (id === 'star') drawStar(0, 0, 10, '#f8e070');
  else if (id === 'bun') { ctx.fillStyle = '#9a5a28'; ctx.beginPath(); ctx.arc(0, 2, 9, Math.PI, 0); ctx.fill(); ctx.strokeStyle = '#f0e8d8'; ctx.beginPath(); ctx.moveTo(-7, -1); ctx.lineTo(7, -1); ctx.moveTo(0, -7); ctx.lineTo(0, 2); ctx.stroke(); }
  else if (id === 'spider') spiderBody(0, 6, .3, 0);
  else if (id === 'duck') { ctx.fillStyle = '#f0e8d0'; ctx.beginPath(); ctx.arc(-1, -1, 7, 0, 7); ctx.fill(); ctx.fillStyle = '#e8a020'; ctx.beginPath(); ctx.moveTo(5, -2); ctx.lineTo(12, 0); ctx.lineTo(5, 2); ctx.fill(); }
  else { ctx.fillStyle = on || coveOpen ? '#e4cdb8' : '#5a4a6a'; ctx.beginPath(); ctx.arc(0, 0, 8, 0, 7); ctx.fill(); if (!on && !coveOpen) { ctx.fillStyle = '#fff'; ctx.font = 'bold 12px monospace'; ctx.textAlign = 'center'; ctx.fillText('?', 0, 4); } }
  if (on) { ctx.strokeStyle = '#e02030'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-10, -10); ctx.lineTo(10, 10); ctx.moveTo(10, -10); ctx.lineTo(-10, 10); ctx.stroke(); }
  ctx.restore();
}
function drawHUD() {
  for (let i = 0; i < P.lives; i++) heart(26 + i * 28, 16, 22, '#d02040');
  if (P.shield) { ctx.fillStyle = '#ff6fb8'; ctx.font = 'bold 14px monospace'; ctx.textAlign = 'left'; ctx.fillText('PACIFIER SHIELD', 14, 58); }
  ctx.textAlign = 'right'; ctx.font = 'bold 14px monospace'; ctx.fillStyle = '#e8d8ff';
  ctx.fillText('ASK MOMMY (M)', vw - 14, 26);
  for (let i = 0; i < MOM_ASKS; i++) { ctx.fillStyle = i < P.mom ? '#ffd0f0' : '#3a2a44'; ctx.beginPath(); ctx.arc(vw - 18 - i * 14, 42, 5, 0, 7); ctx.fill(); }
  // bosses beaten
  const bx0 = vw / 2 - (BOSS_ORDER.length - 1) * 19;
  BOSS_ORDER.forEach((id, i) => bossIcon(id, bx0 + i * 38, 24, bosses[id].state === 'dead'));
  if (momMsgT > 0) { momMsgT -= 1 / 60; ctx.textAlign = 'center'; ctx.font = '26px Creepster, fantasy'; ctx.fillStyle = '#a080c0'; ctx.fillText('Mommy is asleep. You are on your own.', vw / 2, vh - 120); }
  const b = activeBoss();
  if (b) {
    const bw = Math.min(380, vw - 40), bx = vw / 2 - bw / 2, by = vh - 40;
    ctx.fillStyle = '#200'; ctx.fillRect(bx, by, bw, 16);
    ctx.fillStyle = '#c01818'; ctx.fillRect(bx, by, bw * b.hp / b.def.hp, 16);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; for (let k = 1; k < b.def.hp; k++) { ctx.beginPath(); ctx.moveTo(bx + bw * k / b.def.hp, by); ctx.lineTo(bx + bw * k / b.def.hp, by + 16); ctx.stroke(); }
    ctx.textAlign = 'center'; ctx.font = `${Math.min(22, vw / 22)}px Creepster, fantasy`; ctx.fillStyle = '#ff4040';
    ctx.fillText(b.id === 'final' ? b.def.name + ' - ' + PARTS[finalPhase(b)] : b.def.name, vw / 2, by - 8);
  }
  if (banner.t > 0) {
    banner.t -= 1 / 60; ctx.globalAlpha = clamp(banner.t, 0, 1);
    ctx.textAlign = 'center'; ctx.font = `${Math.min(46, vw / 12)}px Creepster, fantasy`; ctx.fillStyle = '#d8b0ff';
    ctx.fillText(banner.text, vw / 2, 100);
    if (banner.sub) { ctx.font = 'bold 15px monospace'; ctx.fillStyle = '#c8b8d8'; ctx.fillText(banner.sub, vw / 2, 128); }
    ctx.globalAlpha = 1;
  }
}
// Mommy's map is drawn once into its own picture, then shown when you ask
const mapCv = document.createElement('canvas'), MS = 4;
function buildMap() {
  mapCv.width = W * 2 * MS; mapCv.height = W * MS + 4;
  const m = mapCv.getContext('2d');
  m.clearRect(0, 0, mapCv.width, mapCv.height);
  for (let j = 0; j < W; j++) for (let i = 0; i < W; i++) {
    const h = H(i, j); if (h === VOID) continue;
    const x = W * MS + (i - j) * MS, y = (i + j) * MS / 2;
    m.fillStyle = tileColors(TY(i, j), i, j)[0]; m.globalAlpha = clamp(.5 + h * .06, 0, 1);
    m.beginPath(); m.moveTo(x, y); m.lineTo(x + MS, y + MS / 2); m.lineTo(x, y + MS); m.lineTo(x - MS, y + MS / 2); m.fill();
  }
  mapDirty = false;
}
function drawMap() {
  if (mapDirty) buildMap();
  ctx.fillStyle = 'rgba(10,4,20,.96)'; ctx.fillRect(0, 0, vw, vh);
  const sc = Math.min(vw * .9 / mapCv.width, vh * .78 / mapCv.height);
  const x0 = vw / 2 - mapCv.width * sc / 2, y0 = 72;
  ctx.drawImage(mapCv, x0, y0, mapCv.width * sc, mapCv.height * sc);
  const M = (x, y) => [x0 + (W * MS + (x - y) * MS) * sc, y0 + ((x + y) * MS / 2) * sc];
  ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center';
  for (const id of BOSS_ORDER) {
    const b = bosses[id], [bx, by] = M(b.x, b.y);
    if (b.state === 'dead') { ctx.strokeStyle = '#888'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(bx - 6, by - 6); ctx.lineTo(bx + 6, by + 6); ctx.moveTo(bx + 6, by - 6); ctx.lineTo(bx - 6, by + 6); ctx.stroke(); continue; }
    ctx.fillStyle = '#ff3030'; ctx.beginPath(); ctx.arc(bx, by, 6, 0, 7); ctx.fill();
    ctx.fillText(b.state === 'locked' ? '???' : b.def.name, bx, by - 10);
  }
  if (door) { const [bx, by] = M(door.x, door.y); ctx.fillStyle = '#fff4c0'; ctx.beginPath(); ctx.arc(bx, by, 7, 0, 7); ctx.fill(); ctx.fillText('WAKE UP', bx, by - 12); }
  const [mx, my] = M(P.x, P.y);
  ctx.fillStyle = '#9ad0ff'; ctx.beginPath(); ctx.arc(mx, my, 5 + Math.sin(time * 8) * 2, 0, 7); ctx.fill();
  ctx.fillText('YOU', mx, my - 10);
  ctx.font = `${Math.min(40, vw / 14)}px Creepster, fantasy`; ctx.fillStyle = '#ffd0f0';
  ctx.fillText("Mommy's Map", vw / 2, 44);
  ctx.fillStyle = '#ffd0f0'; ctx.fillRect(vw / 2 - 100, 56, 200 * mapT / 5, 6);
}
function overlay(t, sub) {
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, vw, vh);
  ctx.textAlign = 'center'; ctx.fillStyle = '#c0283a'; ctx.font = `${Math.min(56, vw / 11)}px Creepster, fantasy`;
  ctx.fillText(t, vw / 2, vh / 2);
  ctx.font = 'bold 16px monospace'; ctx.fillStyle = '#ddd'; ctx.fillText(sub, vw / 2, vh / 2 + 40);
}
function drawWin() {
  const a = clamp(endT / 2, 0, 1);
  ctx.fillStyle = `rgba(255,244,214,${a})`; ctx.fillRect(0, 0, vw, vh);
  if (a < 1) return;
  // the happy ending...
  ctx.textAlign = 'center'; ctx.fillStyle = '#5a3a6a'; ctx.font = `${Math.min(60, vw / 10)}px Creepster, fantasy`;
  ctx.fillText('YOU WOKE UP!', vw / 2, vh / 2 - 30);
  ctx.font = 'bold 17px monospace'; ctx.fillStyle = '#6a4a5a';
  ctx.fillText('Mommy: "Good morning, sweetie. It was only a dream."', vw / 2, vh / 2 + 14);
  // ...and the creepy hint
  if (endT > 6) {
    const k = clamp((endT - 6) / 2, 0, 1);
    ctx.fillStyle = `rgba(10,0,10,${k * .85})`; ctx.fillRect(0, 0, vw, vh);
    ctx.fillStyle = `rgba(220,20,40,${k})`; ctx.font = `${Math.min(26, vw / 20)}px Creepster, fantasy`;
    ctx.fillText('...but the music box under the crib is still playing.', vw / 2, vh / 2 + 60);
    ctx.fillText('Hush, little baby. Don\'t say a word.', vw / 2, vh / 2 + 92);
    const blink = Math.sin(endT * 1.3) > .9 ? .1 : 1;
    for (const ex of [-22, 22]) { ctx.save(); ctx.translate(vw / 2 + ex, vh * .8); ctx.scale(1, blink); ctx.fillStyle = `rgba(230,220,190,${k})`; ctx.beginPath(); ctx.ellipse(0, 0, 14, 7, 0, 0, 7); ctx.fill(); ctx.fillStyle = `rgba(150,0,0,${k})`; ctx.beginPath(); ctx.arc(0, 0, 4, 0, 7); ctx.fill(); ctx.restore(); }
  }
  if (endT > 9) { ctx.fillStyle = '#8a6a8a'; ctx.font = 'bold 15px monospace'; ctx.fillText('Press Space or tap to play again', vw / 2, vh - 40); }
}
function drawTitle() {
  cam.x = Math.sin(time * .1) * 300; cam.y = time * 10;
  drawVoid();
  ctx.textAlign = 'center';
  ctx.font = `${Math.min(84, vw / 7)}px Creepster, fantasy`;
  ctx.fillStyle = '#5a0a16'; ctx.fillText('HUSH LITTLE BABY', vw / 2 + 3, vh * .26 + 3);
  ctx.fillStyle = '#c0283a'; ctx.fillText('HUSH LITTLE BABY', vw / 2, vh * .26);
  ctx.font = `${Math.min(26, vw / 18)}px Creepster, fantasy`; ctx.fillStyle = '#a890c0';
  ctx.fillText("Don't say a word. The nursery rhymes are awake.", vw / 2, vh * .26 + 42);
  ctx.font = 'bold 14px monospace'; ctx.fillStyle = '#c8b8d8';
  const lines = isTouch
    ? ['Stick: move    JUMP: jump    DASH: dash', 'MOMMY: show the map for 5 seconds (10 times)', 'Jump on enemies to beat them. Beat all 6 bosses to wake up.']
    : ['Move: Arrow keys or WASD', 'Jump: Space or Z      Dash: Shift or X', 'Ask Mommy for the map: M (10 times)', 'Jump on enemies to beat them. Beat all 6 bosses to wake up.  Pause: P'];
  lines.forEach((l, i) => ctx.fillText(l, vw / 2, vh * .44 + i * 24));
  ctx.fillStyle = '#7a6a8a'; ctx.fillText(AC ? '' : '(press any key to hear the lullaby)', vw / 2, vh * .44 + lines.length * 24 + 12);
  if (Math.floor(time * 2) % 2) { ctx.font = `${Math.min(30, vw / 16)}px Creepster, fantasy`; ctx.fillStyle = '#ffd0f0'; ctx.fillText(isTouch ? 'Tap JUMP to begin' : 'Press Space to begin', vw / 2, vh * .84); }
}

// ===== Loop =====
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (state === 'title' || (state === 'over' && endT > 1) || (state === 'win' && endT > 9)) {
    if (pressed.jump || (pressed.start && state !== 'title')) { initAudio(); newGame(); }
    else if (pressed.start) initAudio();
    time += dt;
  } else update(dt);
  musicTick();
  render();
  for (const k in pressed) pressed[k] = false;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
