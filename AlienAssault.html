! This is fine. Everything is fine.`],[`unit`,`Great. A combat robot that cannot walk. Very useful.`],[`nova`,`The UFO door is wide open and the aliens are coming through it. Hold your ground.`],[`patch`,`{AIM} to fire moon blasts!`],[`patch`,`Your thrusters still work! {DASH} dashes sideways. {JUMP} jumps.`]],outro:[[`nova`,`Wave cleared. Nice shooting, UNIT-07.`],[`unit`,`They just ran straight at me. Not a great plan.`]]},{title:`HEAVY CONTACT`,sub:`Something big is coming through that door.`,music:`battle`,spawns:{zippit:10,bruteclaw:2},maxAlive:5,gap:[1,2.2],intro:[[`nova`,`Heavy footsteps on the scanner. Brace yourself.`],[`patch`,`When a big one slams the floor, a shockwave comes at you. JUMP over it!`]],outro:[[`nova`,`Bruteclaws down. The colony thanks you.`],[`patch`,`The floor is still shaking. Or is that me?`]]},{title:`SKY SWARM`,sub:`They fly now. Of course they fly.`,music:`battle`,spawns:{voidfly:8,zippit:8},maxAlive:6,gap:[.8,1.8],intro:[[`nova`,`Flying drones inbound. Voidflies. They shoot energy bolts in threes.`],[`patch`,`You can shoot their bolts out of the air! Or DASH out of the way!`],[`unit`,`Flying aliens. Wonderful. I will add that to my list of complaints.`]],outro:[[`nova`,`Airspace clear. But I am reading a huge energy signature...`],[`patch`,`Huge? How huge? Medium huge? Please say medium.`]]},{title:`GENERAL VRAX`,sub:`The warlord of the invasion.`,music:`boss`,boss:`vrax`,intro:[[`nova`,`That is General Vrax, commander of the invasion army.`],[`vrax`,`A single rusty robot? I have conquered forty-two planets. Yours will be forty-three!`],[`unit`,`Forty-two? Did you count them yourself?`],[`nova`,`Intel says he gets EXHAUSTED after his big attacks. That is when you hit him hardest.`]],outro:[[`vrax`,`This... is not... over...`],[`nova`,`General Vrax is down! Outstanding work.`],[`patch`,`I was not scared. My eye was just... leaking.`]]},{title:`SHADOWS IN THE SHIP`,sub:`Snipers. Invisible ones.`,music:`battle`,spawns:{riftstalker:4,zi
