<style>
/* One 320x180 pixel canvas scaled up to fill the screen, plus touch buttons on top. */
:root{--bg:#0b0d08;--khaki:#c8b77a;--red:#b8312f;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#c{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
#touch{position:fixed;inset:0;pointer-events:none;display:none}
#touch.on{display:block}
.tb{position:absolute;pointer-events:auto;box-sizing:border-box;width:54px;height:54px;border-radius:10px;background:rgba(200,183,122,.16);border:2px solid rgba(200,183,122,.5);color:#efe6c4;font:8px 'Press Start 2P',monospace;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.4;text-shadow:0 1px 0 #000}
.tb.down{background:rgba(200,183,122,.5)}
.tb.off{display:none}
#pad{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:162px;height:162px}
#pad.off{display:none}
#bt_up{left:54px;top:0}#bt_down{left:54px;top:108px}#bt_left{left:0;top:54px}#bt_right{left:108px;top:54px}
#btns{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:150px;height:150px}
#bt_a{right:0;top:44px;width:62px;height:62px;border-radius:50%;background:rgba(184,49,47,.32);border-color:rgba(230,110,100,.7)}
#bt_b{right:44px;top:96px;border-radius:50%}
#bt_c{right:44px;top:-8px;border-radius:50%}
#bt_d{right:88px;top:44px;border-radius:50%}
#bt_pause{position:absolute;right:calc(10px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));width:44px;height:36px;font-size:10px}
#rot{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;background:#0b0d08;color:#c8b77a;font:12px 'Press Start 2P',monospace;text-align:center;line-height:1.8;padding:20px;z-index:5}
@media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
@media (max-height:460px){#pad{transform:scale(.78);transform-origin:left bottom}#btns{transform:scale(.78);transform-origin:right bottom}.tb{background:rgba(200,183,122,.1)}}
</style>
</head>
<body>
<canvas id="c" width="320" height="180"></canvas>
<div id="touch">
  <div id="pad">
    <div class="tb" id="bt_up" data-k="up">&#9650;</div>
    <div class="tb" id="bt_left" data-k="left">&#9664;</div>
    <div class="tb" id="bt_right" data-k="right">&#9654;</div>
    <div class="tb" id="bt_down" data-k="down">&#9660;</div>
  </div>
  <div id="btns">
    <div class="tb" id="bt_a" data-k="a">A</div>
    <div class="tb" id="bt_b" data-k="b">B</div>
    <div class="tb" id="bt_c" data-k="c">C</div>
    <div class="tb" id="bt_d" data-k="d">D</div>
  </div>

</div>
<div id="rot"><div>&#x1F95A;&#x1F504;</div><div>Turn your device<br>sideways to play</div></div>
<script>
'use strict';
// ================= SOUND: every sound is made live with Web Audio (no files) =================
const Snd = (() => {
  let ac = null, master, musicBus, sfxBus, noiseBuf, pulse25, pulse12;
  let muted = false;
  const engines = new Set();
  const S = {};

  S.init = function () {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 5; comp.attack.value = 0.003; comp.release.value = 0.25;
    comp.connect(ac.destination);
    master = ac.createGain(); master.gain.value = muted ? 0 : 0.9; master.connect(comp);
    musicBus = ac.createGain(); musicBus.gain.value = 0.3; musicBus.connect(master);
    sfxBus = ac.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
    const len = ac.sampleRate * 2;
    noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    pulse25 = mkPulse(0.25); pulse12 = mkPulse(0.125);
    if (pendingSong) { const p = pendingSong; pendingSong = null; S.play(p); }
  };
  S.ready = () => !!ac;
  S.setMuted = function (m) { muted = m; if (master) master.gain.setTargetAtTime(m ? 0 : 0.9, ac.currentTime, 0.05); };
  S.isMuted = () => muted;

  function mkPulse(duty) {
    const n = 40, re = new Float32Array(n), im = new Float32Array(n);
    for (let k = 1; k < n; k++) re[k] = (2 / (k * Math.PI)) * Math.sin(k * Math.PI * duty);
    return ac.createPeriodicWave(re, im);
  }
  const now = () => ac.currentTime;
  function bus(vol, pan) {
    const g = ac.createGain(); g.gain.value = vol;
    if (pan && ac.createStereoPanner) {
      const p = ac.createStereoPanner(); p.pan.value = Math.max(-1, Math.min(1, pan));
      g.connect(p); p.connect(sfxBus);
    } else g.connect(sfxBus);
    return g;
  }
  function setWave(o, type) {
    if (type === 'p25') o.setPeriodicWave(pulse25);
    else if (type === 'p12') o.setPeriodicWave(pulse12);
    else o.type = type;
  }
  function tone(type, f, t, dur, vol, f2, dest, attack) {
    const o = ac.createOscillator(); setWave(o, type);
    o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + (attack || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || sfxBus);
    o.start(t); o.stop(t + dur + 0.05);
    return o;
  }
  function noise(t, dur, vol, ftype, f1, f2, q, dest, attack) {
    const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const f = ac.createBiquadFilter(); f.type = ftype || 'lowpass';
    f.frequency.setValueAtTime(f1, t);
    if (f2) f.frequency.exponentialRampToValueAtTime(f2, t + dur);
    f.Q.value = q || 1;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + (attack || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest || sfxBus);
    s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.05);
  }

  // ---------- one-shot sound effects ----------
  // A war explosion in 4 layers: thump, roar, crack, then falling debris and a long rumble.
  S.explosion = function (size = 1, vol = 1, pan = 0) {
    if (!ac || vol < 0.02) return;
    const t = now(), b = bus(vol, pan), far = vol < 0.4;
    tone('sine', 120, t, 0.7 * size, 0.95, 26, b);
    tone('triangle', 70, t, 0.5 * size, 0.5, 30, b);
    noise(t, 1.3 * size, 0.85, 'lowpass', far ? 900 : 3200, 110, 0.7, b);
    if (!far) noise(t, 0.12, 0.6, 'highpass', 1800, null, 0.6, b);
    const bits = Math.round(12 * size);
    for (let i = 0; i < bits; i++) {
      const tt = t + 0.18 + Math.random() * 1.1 * size;
      noise(tt, 0.02 + Math.random() * 0.05, 0.08 + Math.random() * 0.22, 'bandpass', 700 + Math.random() * 3500, null, 4, b);
    }
    noise(t + 0.25, 2.2 * size, 0.35, 'lowpass', 220, 50, 1, b, 0.35);
  };
  // The falling-bomb whistle (starts high, drops low).
  S.whistle = function (dur = 2, vol = 0.5, pan = 0) {
    if (!ac) return;
    const t = now(), b = bus(vol, pan);
    const o = ac.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(2300, t); o.frequency.exponentialRampToValueAtTime(380, t + dur);
    const lfo = ac.createOscillator(); lfo.frequency.value = 6.5;
    const lg = ac.createGain(); lg.gain.value = 22; lfo.connect(lg); lg.connect(o.frequency);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.22, t + Math.min(0.4, dur * 0.3));
    g.gain.setValueAtTime(0.22, t + dur - 0.06); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(b); o.start(t); lfo.start(t); o.stop(t + dur + 0.05); lfo.stop(t + dur + 0.05);
  };
  // Egg hit: CRUNCH (shell) then SQUISH (yolk), then a little drip.
  S.splat = function (vol = 1, pan = 0) {
    if (!ac || vol < 0.02) return;
    const t = now(), b = bus(vol, pan);
    for (let i = 0; i < 5; i++) noise(t + i * 0.011 + Math.random() * 0.006, 0.022, 0.55, 'bandpass', 2400 + Math.random() * 3000, null, 2.5, b);
    tone('square', 1900, t, 0.03, 0.07, 600, b);
    noise(t + 0.055, 0.34, 0.6, 'lowpass', 1500, 170, 10, b, 0.02);
    tone('sine', 440, t + 0.055, 0.26, 0.28, 85, b);
    tone('sine', 880, t + 0.38, 0.06, 0.07, 1500, b);
  };
  S.crunch = function (vol = 0.8) {
    if (!ac) return; const t = now(), b = bus(vol, 0);
    for (let i = 0; i < 4; i++) noise(t + i * 0.02, 0.025, 0.5, 'bandpass', 3000 + Math.random() * 2000, null, 2.5, b);
  };
  S.cannon = function (vol = 1, pan = 0) {
    if (!ac || vol < 0.02) return;
    const t = now(), b = bus(vol, pan);
    noise(t, 0.09, 1, 'highpass', 900, null, 0.5, b);
    tone('sine', 150, t, 0.5, 0.9, 32, b);
    noise(t, 0.7, 0.6, 'lowpass', 1800, 90, 0.8, b);
    tone('square', 330, t, 0.35, 0.05, 300, b); tone('square', 497, t, 0.3, 0.04, 470, b);
  };
  S.clank = function (vol = 0.5, pan = 0) {
    if (!ac) return; const t = now(), b = bus(vol, pan);
    tone('square', 520 + Math.random() * 60, t, 0.07, 0.09, null, b);
    tone('square', 787 + Math.random() * 80, t, 0.05, 0.07, null, b);
    noise(t, 0.04, 0.2, 'highpass', 3000, null, 1, b);
  };
  S.metalHit = function (vol = 1) {
    if (!ac) return; const t = now(), b = bus(vol, 0);
    noise(t, 0.3, 0.9, 'bandpass', 1200, 400, 2, b);
    tone('square', 180, t, 0.4, 0.2, 60, b);
    tone('triangle', 1250, t, 0.6, 0.12, 1180, b); tone('triangle', 1870, t, 0.5, 0.08, 1800, b);
  };
  S.release = function () { // bomb latch letting go
    if (!ac) return; const t = now();
    noise(t, 0.03, 0.4, 'bandpass', 1500, null, 2); tone('square', 220, t, 0.09, 0.12, 70);
  };
  S.blip = function (f = 880, vol = 0.12) { if (!ac) return; tone('p25', f, now(), 0.07, vol); };
  S.select = function () { if (!ac) return; const t = now(); tone('p25', 660, t, 0.05, 0.1); tone('p25', 990, t + 0.05, 0.07, 0.1); };
  S.confirm = function () { if (!ac) return; const t = now(); [523, 659, 784, 1046].forEach((f, i) => tone('p25', f, t + i * 0.05, 0.09, 0.1)); };
  S.buzz = function () { if (!ac) return; const t = now(); tone('square', 110, t, 0.25, 0.14); tone('square', 117, t, 0.25, 0.12); };
  S.snap = function () { if (!ac) return; const t = now(); noise(t, 0.025, 0.5, 'bandpass', 3200, null, 3); tone('p25', 1150, t, 0.06, 0.12, 1700); };
  S.thud = function (vol = 0.7) { if (!ac) return; const t = now(), b = bus(vol, 0); tone('sine', 170, t, 0.18, 0.7, 55, b); noise(t, 0.12, 0.4, 'lowpass', 500, null, 1, b); };
  S.dig = function () { if (!ac) return; const t = now(); noise(t, 0.16, 0.5, 'bandpass', 900, 350, 1.5); noise(t + 0.18, 0.14, 0.4, 'bandpass', 800, 300, 1.5); };
  S.step = function (vol = 0.25) { if (!ac) return; const t = now(); noise(t, 0.06, vol, 'lowpass', 450 + Math.random() * 200, null, 1); };
  S.jump = function () { if (!ac) return; tone('p25', 280, now(), 0.12, 0.09, 560); };
  S.whoosh = function (vol = 0.4) { if (!ac) return; const t = now(); noise(t, 0.3, vol, 'bandpass', 500, 2400, 1.5, null, 0.06); };
  S.rattle = function () { if (!ac) return; const t = now(); for (let i = 0; i < 6; i++) noise(t + i * 0.05, 0.04, 0.2, 'bandpass', 1800 + Math.random() * 800, null, 4); };
  S.repair = function () { if (!ac) return; [0, 0.13, 0.26].forEach(d => setTimeout(() => S.clank(0.6), d * 1000)); };
  S.hammer = S.repair;
  S.radio = function () { if (!ac) return; const t = now(); noise(t, 0.25, 0.25, 'bandpass', 1800, 900, 3); tone('square', 1200, t, 0.04, 0.05); };
  S.talk = function (pitch = 400) { if (!ac) return; tone('p25', pitch * (0.85 + Math.random() * 0.35), now(), 0.05, 0.05); };
  S.yell = function () {
    if (!ac) return; const t = now(), b = bus(0.9, 0);
    for (let i = 0; i < 12; i++) {
      const tt = t + i * 0.07, f = 140 + Math.random() * 120;
      tone('sawtooth', f, tt, 0.07, 0.25, f * 0.8, b);
      noise(tt, 0.05, 0.08, 'bandpass', 900, null, 3, b);
    }
  };
  S.siren = function (dur = 4, vol = 0.18) {
    if (!ac) return; const t = now(), b = bus(vol, 0);
    const o = ac.createOscillator(); o.type = 'sawtooth';
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1400;
    for (let i = 0; i <= dur; i += 1.5) { o.frequency.linearRampToValueAtTime(420, t + i); o.frequency.linearRampToValueAtTime(880, t + i + 0.75); }
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t + 0.3);
    g.gain.setValueAtTime(0.5, t + dur - 0.4); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f); f.connect(g); g.connect(b); o.start(t); o.stop(t + dur + 0.1);
  };
  S.beep = function (vol = 0.1) { if (!ac) return; tone('square', 1320, now(), 0.06, vol); };
  S.gloop = function () { if (!ac) return; const t = now(); noise(t, 0.4, 0.5, 'lowpass', 600, 150, 12, null, 0.03); tone('sine', 200, t, 0.35, 0.3, 90); };
  S.fanfare = function () { // short bugle call for promotions
    if (!ac) return; const t = now();
    [[392, 0, .14], [523, .15, .14], [659, .3, .14], [784, .45, .4], [659, .9, .14], [784, 1.05, .6]]
      .forEach(([f, d, l]) => tone('p25', f, t + d, l, 0.16, null, null, 0.02));
  };

  // ---------- engines (loop until stopped) ----------
  // Propeller plane: two buzzy saws + a low growl, chopped by a fast "propeller" wobble, with wind noise.
  S.planeEngine = function () {
    if (!ac) return null;
    const out = ac.createGain(); out.gain.value = 0;
    const pan = ac.createStereoPanner ? ac.createStereoPanner() : null;
    if (pan) { out.connect(pan); pan.connect(sfxBus); } else out.connect(sfxBus);
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900; lp.Q.value = 2;
    const am = ac.createGain(); am.gain.value = 0.6; lp.connect(am); am.connect(out);
    const o1 = ac.createOscillator(), o2 = ac.createOscillator(), o3 = ac.createOscillator();
    o1.type = 'sawtooth'; o2.type = 'sawtooth'; o3.type = 'square';
    o1.frequency.value = 70; o2.frequency.value = 70.9; o3.frequency.value = 35;
    const g3 = ac.createGain(); g3.gain.value = 0.45;
    o1.connect(lp); o2.connect(lp); o3.connect(g3); g3.connect(lp);
    const lfo = ac.createOscillator(); lfo.frequency.value = 17;
    const lfoG = ac.createGain(); lfoG.gain.value = 0.35; lfo.connect(lfoG); lfoG.connect(am.gain);
    const n = ac.createBufferSource(); n.buffer = noiseBuf; n.loop = true;
    const nf = ac.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = 520; nf.Q.value = 0.7;
    const ng = ac.createGain(); ng.gain.value = 0.28; n.connect(nf); nf.connect(ng); ng.connect(out);
    const srcs = [o1, o2, o3, lfo, n]; srcs.forEach(x => x.start());
    const e = {
      set(vol, throttle = 0.5, panv) {
        const t = now(), f = 55 + throttle * 45;
        out.gain.setTargetAtTime(vol * 0.32, t, 0.08);
        o1.frequency.setTargetAtTime(f, t, 0.2); o2.frequency.setTargetAtTime(f * 1.013, t, 0.2); o3.frequency.setTargetAtTime(f / 2, t, 0.2);
        lfo.frequency.setTargetAtTime(11 + throttle * 15, t, 0.2);
        lp.frequency.setTargetAtTime(450 + throttle * 1000, t, 0.2);
        if (pan && panv !== undefined) pan.pan.setTargetAtTime(Math.max(-1, Math.min(1, panv)), t, 0.05);
      },
      stop() {
        engines.delete(e);
        out.gain.setTargetAtTime(0, now(), 0.08);
        setTimeout(() => { srcs.forEach(x => { try { x.stop(); } catch (_) { } }); out.disconnect(); }, 500);
      }
    };
    engines.add(e); return e;
  };
  // Tank: a chugging diesel (low square chopped by a piston beat), ground rumble, and tread clanks.
  S.tankEngine = function () {
    if (!ac) return null;
    const out = ac.createGain(); out.gain.value = 0; out.connect(sfxBus);
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 260; lp.Q.value = 4;
    const am = ac.createGain(); am.gain.value = 0.6; lp.connect(am); am.connect(out);
    const o1 = ac.createOscillator(); o1.type = 'square'; o1.frequency.value = 38;
    const o2 = ac.createOscillator(); o2.type = 'sawtooth'; o2.frequency.value = 76.7;
    const g2 = ac.createGain(); g2.gain.value = 0.4; o1.connect(lp); o2.connect(g2); g2.connect(lp);
    const lfo = ac.createOscillator(); lfo.type = 'square'; lfo.frequency.value = 6;
    const lg = ac.createGain(); lg.gain.value = 0.35; lfo.connect(lg); lg.connect(am.gain);
    const n = ac.createBufferSource(); n.buffer = noiseBuf; n.loop = true;
    const nf = ac.createBiquadFilter(); nf.type = 'lowpass'; nf.frequency.value = 170;
    const ng = ac.createGain(); ng.gain.value = 0.7; n.connect(nf); nf.connect(ng); ng.connect(out);
    const srcs = [o1, o2, lfo, n]; srcs.forEach(x => x.start());
    let phase = 0, vol = 0;
    const e = {
      set(v, speed, broken) {
        vol = v; const t = now();
        out.gain.setTargetAtTime(v * (0.42 + speed * 0.2), t, 0.1);
        o1.frequency.setTargetAtTime(34 + speed * 24, t, 0.25); o2.frequency.setTargetAtTime((34 + speed * 24) * 2.02, t, 0.25);
        lfo.frequency.setTargetAtTime(5 + speed * 9 + (broken ? 2 : 0), t, 0.2);
        lp.frequency.setTargetAtTime(200 + speed * 420, t, 0.2);
      },
      tick(dt, speed, broken) { // tread clanks, faster when driving fast; broken treads clatter
        phase += dt * speed * (broken ? 5 : 9);
        while (phase > 1) { phase -= 1; S.clank(vol * (broken ? 0.4 : 0.14)); if (broken && Math.random() < 0.3) S.rattle(); }
      },
      stop() {
        engines.delete(e);
        out.gain.setTargetAtTime(0, now(), 0.08);
        setTimeout(() => { srcs.forEach(x => { try { x.stop(); } catch (_) { } }); out.disconnect(); }, 500);
      }
    };
    engines.add(e); return e;
  };
  S.stopEngines = function () { [...engines].forEach(e => e.stop()); };

  // ---------- music: a tiny 4-channel chip-tune player ----------
  const SCALES = { minor: [0, 2, 3, 5, 7, 8, 10], major: [0, 2, 4, 5, 7, 9, 11], harm: [0, 2, 3, 5, 7, 8, 11] };
  const tok = s => s.trim().split(/\s+/);
  const SONGS = {
    // Main theme: a slow, proud, sad march.
    title: { bpm: 92, root: 50, scale: 'minor', leadOct: 12, wave: 'p25', siren: true,
      prog: [0, 0, 0, 4, 5, 3, 4, 0],
      lead: ['0 - - . 0 . 2 . 4 - - - 4 . 3 .', '2 - - . 1 . 0 . 1 - - - - - . .', '0 - - . 0 . 2 . 4 - - - 7 - 6 .', '5 - - - 4 - - - 4 - - - - - . .',
        '7 - - . 7 . 6 . 5 - - - 4 . 3 .', '4 - - . 3 . 2 . 1 - - - - - . .', '2 - - . 3 . 4 . 2 - 1 - 0 - -1 .', '0 - - - - - - - . . . . . . . .'],
      bass: '0 . . . 0 . 0 . 4 . . . 4 . 0 .', drums: 'r.s.s.s.r.s.s.ss' },
    // Bombing: fast and intense.
    bombing: { bpm: 148, root: 52, scale: 'minor', leadOct: 12, wave: 'p25', harm: true,
      prog: [0, 0, 5, 4],

const FX = { shakeT: 0, shakeM: 0, flashA: 0, flashC: '#fff', banners: [] };
FX.shake = (m, t = 0.4) => { FX.shakeM = Math.max(FX.shakeM, m); FX.shakeT = Math.max(FX.shakeT, t); };
FX.flash = (c = '#fff', a = 0.6) => { FX.flashC = c; FX.flashA = Math.max(FX.flashA, a); };
FX.banner = (text, col = '#ffd23a', t = 2.2) => { FX.banners = [{ text, col, t, life: t }]; };
FX.update = dt => { FX.shakeT = Math.max(0, FX.shakeT - dt); if (!FX.shakeT) FX.shakeM = 0; FX.flashA = Math.max(0, FX.flashA - dt * 2.5); FX.banners.forEach(b => b.t -= dt); FX.banners = FX.banners.filter(b => b.t > 0); };
FX.drawTop = () => {
  if (FX.flashA > 0) { ctx.globalAlpha = FX.flashA; rect(0, 0, W, H, FX.flashC); ctx.globalAlpha = 1; }
  for (const b of FX.banners) { const a = Math.min(1, b.t * 3, (b.life - b.t) * 6); ctx.globalAlpha = a; const w = b.text.length * 8 + 16; rect(W / 2 - w / 2, 40, w, 16, 'rgba(0,0,0,.7)'); txt(b.text, W / 2, 44, b.col, 'center'); ctx.globalAlpha = 1; }
};
class Parts {
  constructor() { this.a = []; }
  add(p) { p.t = 0; this.a.push(p); }
  burst(x, y, n, cols, spd = 60, life = 0.8, g = 0, s = 2) { for (let i = 0; i < n; i++) { const a = R() * 7, v = R() * spd; this.add({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, c: pickR(cols), life: life * (0.5 + R() * 0.7), g, s, fade: true }); } }
  update(dt) { for (const p of this.a) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 0) * dt; if (p.drag) { p.vx *= 1 - p.drag * dt; p.vy *= 1 - p.drag * dt; } } this.a = this.a.filter(p => p.t < p.life); }
  draw(ox = 0, oy = 0) { for (const p of this.a) { const f = p.t / p.life; ctx.globalAlpha = p.fade ? 1 - f : 1; const s = p.grow ? p.s * (1 + f * p.grow) : p.s; rect(p.x - ox - s / 2, p.y - oy - s / 2, s, s, p.c); } ctx.globalAlpha = 1; }
}

// ================= VOICES =================
// Every line is spoken by the computer, and each egg gets its own voice (pitch, speed, and a
// different built-in voice when the device has several). If you record a line yourself and put
// it in a "voices" folder (voices/<id>.mp3), your recording plays instead.
const VOICE_STYLE = {
  narrator: { pitch: 0.55, rate: 0.82, slot: 0 },
  shelly: { pitch: 1.7, rate: 1.08, slot: 1 },   // gets deeper as Shelly grows up
  general: { pitch: 0.25, rate: 0.92, slot: 2, vol: 1 },
  scramble: { pitch: 0.45, rate: 0.95, slot: 3 },
  benny: { pitch: 1.25, rate: 1.25, slot: 4 },
  coddle: { pitch: 1.35, rate: 0.92, slot: 5 },
  poach: { pitch: 2, rate: 1.35, slot: 6 },
  rotten: { pitch: 0.05, rate: 0.72, slot: 7 },
};
const Voice = {
  cur: null, playing: false, enabled: null, missing: {}, tts: 'speechSynthesis' in window, on: true, voices: [],
  probe(id) { // find out once whether any recorded voice files exist
    const a = new Audio(); let i = 0; const exts = ['mp3', 'm4a', 'wav', 'ogg'];
    const next = () => { if (i >= exts.length) { Voice.enabled = false; return; } a.src = 'voices/' + id + '.' + exts[i++]; a.load(); };
    a.oncanplaythrough = () => { Voice.enabled = true; }; a.onerror = next;
    try { next(); } catch (_) { Voice.enabled = false; }
    if (this.tts) { this.loadVoices(); try { speechSynthesis.onvoiceschanged = () => this.loadVoices(); } catch (_) { } }
  },
  loadVoices() {
    try {
      const all = speechSynthesis.getVoices();
      let en = all.filter(v => /^en/i.test(v.lang));
      // prefer the nicer-sounding voices, and skip joke voices
      en = en.filter(v => !/bells|bubbles|bad news|good news|boing|cellos|jester|organ|trinoids|whisper|wobble|zarvox|superstar|deranged|hysterical|bahh|albert/i.test(v.name));
      this.voices = en.length ? en : all;
    } catch (_) { this.voices = []; }
  },
  unlock() { // phones and iPads only allow speech after a tap, so say nothing once on the first tap
    if (!this.tts || this.unlocked) return; this.unlocked = true;
    try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (_) { }
  },
  lineById(id) { for (const k in SCRIPT) { const v = SCRIPT[k]; const list = Array.isArray(v) ? v : [v]; for (const L of list) if (L.id === id) return L; } return null; },
  sayable(t) {
    return t.replace(/EGG WAR III/gi, 'egg war three').replace(/Egg War II\b/gi, 'egg war two').replace(/Egg War I\b/gi, 'egg war one')
      .replace(/-/g, ', ').replace(/\b[A-Z]{2,}\b/g, w => w.toLowerCase());
  },
  speak(L) {
    if (!this.tts || !this.on) return;
    try {
      speechSynthesis.cancel();
      const st = VOICE_STYLE[L.who] || VOICE_STYLE.narrator;
      const u = new SpeechSynthesisUtterance(this.sayable(L.text));
      let pitch = st.pitch, rate = st.rate;
      if (L.who === 'shelly') pitch = Math.max(0.6, 1.7 - Story.stage * 0.2);
      if (L.yell) { rate *= 1.15; }
      u.pitch = pitch; u.rate = rate; u.volume = st.vol || 0.95; u.lang = 'en-US';
      if (!this.voices.length) this.loadVoices();
      if (this.voices.length) u.voice = this.voices[st.slot % this.voices.length];
      u.onstart = () => { this.playing = true; };
      u.onend = u.onerror = () => { this.playing = false; };
      this.playing = true;
      speechSynthesis.speak(u);
    } catch (_) { this.playing = false; }
  },
  play(id) {
    this.stop();
    const L = this.lineById(id);
    if (!this.enabled || this.missing[id]) { if (L) this.speak(L); return; }
    const exts = ['mp3', 'm4a', 'wav', 'ogg']; let i = 0; const a = new Audio(); this.cur = a;
    const next = () => { if (i >= exts.length) { this.missing[id] = true; if (this.cur === a && L) this.speak(L); return; } a.src = 'voices/' + id + '.' + exts[i++]; a.play().then(() => { if (this.cur === a) this.playing = true; }).catch(() => { }); };
    a.onerror = () => { if (this.cur === a) next(); };
    a.onended = () => { if (this.cur === a) this.playing = false; };
    next();
  },
  stop() {
    if (this.cur) { this.cur.onerror = null; try { this.cur.pause(); } catch (_) { } this.cur = null; }
    if (this.tts) try { speechSynthesis.cancel(); } catch (_) { }
    this.playing = false;
  }
};

function drawBackdrop(kind, t) {
  if (kind === 'factory') {
    rect(0, 0, W, H, '#2a2620'); for (let i = 0; i < 6; i++) rect(i * 60 + 10, 20, 30, 70, '#3a3428');
    for (let i = 0; i < W; i += 16) { rect((i + t * 30) % W, 100, 10, 4, '#555'); } rect(0, 104, W, 6, '#222');
    for (let i = 0; i < 4; i++) rect(i * 90 + 20, 10, 4, 90, '#4a4234');
    return;
  }
  const sky = kind === 'night' ? ['#0a0c14', '#14182a'] : kind === 'fortress' ? ['#1e2410', '#3a3a1a'] : ['#2a2018', '#6a4428'];
  rect(0, 0, W, H, sky[0]); rect(0, 50, W, 60, sky[1]);
  // searchlights
  ctx.globalAlpha = 0.12; ctx.fillStyle = '#ffffd0';
  for (let i = 0; i < 2; i++) { const a = Math.sin(t * 0.4 + i * 2) * 0.5 - Math.PI / 2; const bx = 80 + i * 160; ctx.beginPath(); ctx.moveTo(bx, 130); ctx.lineTo(bx + Math.cos(a - 0.08) * 220, 130 + Math.sin(a - 0.08) * 220); ctx.lineTo(bx + Math.cos(a + 0.08) * 220, 130 + Math.sin(a + 0.08) * 220); ctx.fill(); }
  ctx.globalAlpha = 1;
  // distant flashes
  if ((t * 1.3) % 3 < 0.12) { ctx.globalAlpha = 0.3; rect(0, 90, W, 40, '#ff9a40'); ctx.globalAlpha = 1; }
  // ruined skyline
  srand(kind === 'fortress' ? 77 : 44);
  for (let x = 0; x < W; x += 14) { const h = 20 + rnd() * 40; rect(x, 130 - h, 14, h, '#0e0c0a'); if (rnd() < 0.4) rect(x + 3, 130 - h - 6, 4, 6, '#0e0c0a'); }
  rect(0, 128, W, 52, '#16120e');
}

function startStory() {
  if (save.chapter >= 5) { go(new Cutscene(SCRIPT.ending, () => go(new Ending()), 'fortress', 5)); return; }
  if (!save.prologue) { go(new Cutscene(SCRIPT.prologue, () => { save.prologue = true; writeSave(); playChapter(save.chapter, false); }, 'night', 0)); return; }
  playChapter(save.chapter, false);
}
function playChapter(i, replay) {
  Story.replay = replay; Story.stage = i;
  const after = () => go(new MissionCard(i));
  if (replay) after(); else go(new Cutscene(SCRIPT['c' + (i + 1)], after, CHAPTERS[i].bg, i));
}
function startMission(i) {
  const ch = CHAPTERS[i];
  go(ch.make({
    index: i,
    win: (stats) => missionWon(i, stats),
    lose: (stats) => go(new ResultScreen(i, false, stats)),
    timeUp: (stats) => buildingTimeUp(i, stats),
  }));
}
function missionWon(i, stats) {
  const first = !save.done[i];
  let promoted = false;
  if (first) { save.done[i] = true; if (save.rank < 5) { save.rank++; promoted = true; } save.chapter = Math.max(save.chapter, i + 1); }
  writeSave();
  go(new ResultScreen(i, true, stats, promoted));
}
function buildingTimeUp(i, stats) {
  const first = !save.done[i];
  if (first) { save.done[i] = true; save.chapter = Math.max(save.chapter, i + 1); }
  const demoted = save.rank > 0; if (demoted) save.rank--;
  writeSave();
  go(new Cutscene(SCRIPT.c2y, () => go(new ResultScreen(i, true, Object.assign({ demoted }, stats), false)), 'factory', 1));
}
function afterResult(i, won) {
  if (!won) { go(new TitleScreen()); return; }
  if (Story.replay) { go(new ChapterSelect()); return; }
  const winLines = SCRIPT['c' + (i + 1) + 'w'];
  const next = () => {
    if (i >= 4) { save.finished = true; writeSave(); go(new Cutscene(SCRIPT.ending, () => go(new Ending()), 'fortress', 5)); }
    else playChapter(i + 1, false);
  };
  if (winLines && !(i === 1 && Story.lastDemoted)) go(new Cutscene(winLines, next, CHAPTERS[i].bg, i)); else next();
}

// ================= SCENES: cutscene, title, menus, results =================
class Cutscene {
  constructor(lines, done, bg, stage) { this.lines = lines; this.done = done; this.bg = bg || 'night'; this.stage = stage || 0; this.i = -1; this.t = 0; this.touch = { a: 'NEXT', b: 'SKIP' }; }
  enter() { Story.stage = this.stage; Snd.play('story'); this.next(); }
  exit() { Voice.stop(); }
  next() {
    this.i++; if (this.i >= this.lines.length) { Voice.stop(); this.done(); this.i = this.lines.length - 1; this.finished = true; return; }
    const L = this.lines[this.i]; this.chars = 0; this.beepT = 0;
    if (L.radio) Snd.radio();
    if (L.sfx === 'siren') Snd.siren(4);

function spatial(cam, x, y, maxD = 20) {
  const d = dist(cam.x, cam.y, x, y), v = clamp(1 - d / maxD, 0, 1);
  const a = angDiff(cam.a, Math.atan2(y - cam.y, x - cam.x));
  return { vol: 0.15 + v * v * 0.85, pan: Math.sin(a) * 0.9, d };
}

class RunningMode {
  constructor(cb) { this.cb = cb; this.pausable = true; this.touch = { pad: true, a: 'JUMP', b: 'DIVE', c: 'ROLL', d: 'HIDE', pause: true }; this.reset(); }
  reset() {
    const N = 27, t = new Uint8Array(N * N);
    srand(2026);
    const blockTex = {};
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const border = x === 0 || y === 0 || x === N - 1 || y === N - 1;
      const street = x % 6 === 1 || x % 6 === 2 || y % 6 === 1 || y % 6 === 2;
      if (border) t[y * N + x] = 2;
      else if (!street) { const k = Math.floor((x - 3) / 6) + ',' + Math.floor((y - 3) / 6); if (!(k in blockTex)) blockTex[k] = rnd() < 0.18 ? 0 : pick([1, 1, 3, 3, 2, 3]); t[y * N + x] = blockTex[k]; }
    }
    // knock random holes in the buildings (ruins make shortcuts and hidey-holes)
    const holes = [];
    for (let y = 1; y < N - 1; y++) for (let x = 1; x < N - 1; x++) if (t[y * N + x] && rnd() < 0.13) { t[y * N + x] = 0; holes.push([x, y]); }
    t[24 * N + 26] = 9; // the bunker door
    this.map = { w: N, h: N, t };
    this.bunker = { x: 25.5, y: 24.5 };
    this.p = { x: 1.6, y: 1.6, a: 0.3, z: 0.5, h: 0, vz: 0, diveT: 0, diveCD: 0, roll: 0, rollA: 0, inv: 0, vx: 0, vy: 0, stepT: 0 };
    const free = []; for (let y = 1; y < N - 1; y++) for (let x = 1; x < N - 1; x++) if (!t[y * N + x] && (x > 4 || y > 4) && dist(x, y, 25, 24) > 3) free.push([x + 0.5, y + 0.5]);
    const take = () => free.splice((rnd() * free.length) | 0, 1)[0];
    this.covers = []; for (let i = 0; i < 16; i++) { const [x, y] = take(); this.covers.push({ x, y }); }
    holes.slice(0, 6).forEach(([x, y]) => this.covers.push({ x: x + 0.5, y: y + 0.5 }));
    this.rubble = []; for (let i = 0; i < 20; i++) { const [x, y] = take(); this.rubble.push({ x, y }); }
    this.fires = []; for (let i = 0; i < 10; i++) { const [x, y] = take(); this.fires.push({ x, y, f: rnd() * 4 }); }
    this.decals = []; for (let i = 0; i < 18; i++) { const [x, y] = free[(rnd() * free.length) | 0]; this.decals.push({ x: x + rr(-0.3, 0.3), y: y + rr(-0.3, 0.3), r: rr(0.4, 0.9), fill: 'rgba(15,10,6,.65)' }); }
    this.civs = []; for (let i = 0; i < 6; i++) { const [x, y] = take(); this.civs.push({ x, y, a: pick([0, 1, 2, 3]) * Math.PI / 2, img: friendSprites[i * 2 + 1], turnT: rr(1, 3), alive: true, bob: rnd() * 6 }); }
    this.bombs = []; this.booms = [];
    this.plane = { x: -10, y: -10, a: 0, active: false, wait: 2.5, dropT: 0 };
    this.time = 0; this.dead = 0; this.ready = 1.6; this.done = false;
  }
  enter() { Snd.play('running'); this.engine = Snd.planeEngine(); FX.banner('GET TO THE BUNKER!', '#ffd23a', 2); }
  exit() { if (this.engine) this.engine.stop(); }
  restart() { this.exit(); this.reset(); this.enter(); }
  explode(b) {

    this.booms.push({ x: b.x, y: b.y, t: 0 });
    this.decals.push({ x: b.x, y: b.y, r: 0.8, fill: 'rgba(12,8,4,.75)' });

  draw() {

    const sprites = [];
    for (const d of this.deco) sprites.push(d);
    for (const e of this.ents) {
      if (e.dead) continue;
      if (e.type === 'soldier') sprites.push(eggBillboard(e.img, e.x, e.y, { z: Math.abs(Math.sin(e.bob)) * 0.05 }));
      else sprites.push({ x: e.x, y: e.y, img: e.img, w: e.w, h: e.h });
    }
    for (const f of this.fires) { if (f.wreck) sprites.push({ x: f.x, y: f.y, img: SPR.wreck, w: 1.2, h: 0.55 }); sprites.push({ x: f.x, y: f.y, img: SPR.fire[((this.t * 8) | 0) % 4], w: 0.7, h: 0.9, z: 0.2 }); }
    if (this.golden) sprites.push({ x: this.golden.x, y: this.golden.y, img: SPR.golden, w: 0.6, h: 0.75, z: 0.15 + Math.sin(this.t * 3) * 0.05 });
    for (const s of this.shots) sprites.push({ x: s.x, y: s.y, img: SPR.shot, w: 0.18, h: 0.18, z: 0.42 });
    for (const s of this.eshots) sprites.push({ x: s.x, y: s.y, img: SPR.eshot, w: 0.22, h: 0.22, z: 0.42 });
    for (const b of this.booms) sprites.push({ x: b.x, y: b.y, img: BOOM[Math.min(9, (b.t / 0.8 * 10) | 0)], w: b.s, h: b.s, z: -0.2 });
    Ray.render({ x: p.x, y: p.y, a: p.a, z: 0.55, pitch: this.recoil * -4 }, this.map, sprites, { decals: this.decals, sky: ['#2a3020', '#4a4a2a', '#7a6a3a'], ground: ['#4a4630', '#38351f'], fog: '42,42,28', fogDist: 18 });
    // rotten egg goo on the periscope
    for (const g of this.goo) { ctx.globalAlpha = Math.min(1, g.t); ctx.fillStyle = '#7d8f3a'; ctx.beginPath(); ctx.ellipse(g.x, g.y, g.r, g.r * 0.8, 0, 0, 7); ctx.fill(); ctx.fillStyle = '#a0b048'; ctx.beginPath(); ctx.ellipse(g.x - 3, g.y - 3, g.r * 0.4, g.r * 0.3, 0, 0, 7); ctx.fill(); rect(g.x - 2, g.y + g.r * 0.6, 3, (2.5 - g.t) * 14, '#7d8f3a'); }
    ctx.globalAlpha = 1;
    // inside the tank: hull, barrel, crosshair
    const rc = this.recoil * 6;
    ctx.fillStyle = '#2a3018'; ctx.beginPath(); ctx.moveTo(0, H); ctx.lineTo(0, H - 26); ctx.lineTo(70, H - 34); ctx.lineTo(W - 70, H - 34); ctx.lineTo(W, H - 26); ctx.lineTo(W, H); ctx.fill();
    rect(70, H - 34, W - 140, 2, '#4a5428');
    ctx.fillStyle = '#1e2410'; ctx.beginPath(); ctx.moveTo(W / 2 - 14, H); ctx.lineTo(W / 2 - 6, H - 52 + rc); ctx.lineTo(W / 2 + 6, H - 52 + rc); ctx.lineTo(W / 2 + 14, H); ctx.fill();
    rect(W / 2 - 6, H - 54 + rc, 12, 4, '#3a4420');
    if (this.recoil > 0.7) { ctx.fillStyle = '#ffd040'; ctx.beginPath(); ctx.arc(W / 2, H - 60, 8 * this.recoil, 0, 7); ctx.fill(); }
    ctx.strokeStyle = this.cool <= 0 ? '#7dff6a' : '#ff5a4a'; ctx.lineWidth = 1;
    ctx.strokeRect(W / 2 - 8.5, H / 2 - 8.5, 17, 17); rect(W / 2, H / 2 - 14, 1, 6, ctx.strokeStyle); rect(W / 2, H / 2 + 8, 1, 6, ctx.strokeStyle);
    // tank damage card
    box(4, H - 50, 62, 46, '#14160e', '#6a6450');
    txt('TANK', 8, H - 46, '#c8b77a', 'left', 6);
    const part = (lbl, broken, y) => { rect(8, y, 6, 6, broken ? '#e22' : '#4c4'); txt(lbl, 18, y, broken ? '#ff6a5a' : '#d8d0b0', 'left', 6); };
    part('TREADS', this.dmg.treads, H - 37); part('CANNON', this.dmg.cannon, H - 28); part('HULL', this.dmg.hull, H - 19);
    txt('PLATES ' + this.plates, 8, H - 10, '#ffd23a', 'left', 6);
    // radar
    const RX = W - 30, RY = 30, RR = 24;
    ctx.fillStyle = 'rgba(0,30,0,.75)'; ctx.beginPath(); ctx.arc(RX, RY, RR, 0, 7); ctx.fill(); ctx.strokeStyle = '#3a8a3a'; ctx.beginPath(); ctx.arc(RX, RY, RR, 0, 7); ctx.stroke();
    const sw = (this.t * 2) % (Math.PI * 2); ctx.strokeStyle = 'rgba(120,255,120,.4)'; ctx.beginPath(); ctx.moveTo(RX, RY); ctx.lineTo(RX + Math.cos(sw) * RR, RY + Math.sin(sw) * RR); ctx.stroke();
    const blip = (x, y, c, s) => { const dx = x - p.x, dy = y - p.y, a = Math.atan2(dy, dx) - p.a - Math.PI / 2, d = Math.min(RR - 2, Math.hypot(dx, dy) * 1.2); rect(RX + Math.cos(a) * d - s / 2, RY + Math.sin(a) * d - s / 2, s, s, c); };
    for (const e of this.ents) if (!e.dead) { if (e.type === 'base') blip(e.x, e.y, '#ff4a3a', 4); else if (e.type === 'tank') blip(e.x, e.y, '#ff9a3a', 3); else if (e.type === 'stinker') blip(e.x, e.y, (this.t * 4) % 1 < 0.5 ? '#ff2a1a' : '#fff', 5); }
    if (this.golden) blip(this.golden.x, this.golden.y, '#ffd23a', 5);
    rect(RX - 1, RY - 1, 3, 3, '#7dff6a');
    txt(this.golden ? 'GRAB THE GOLDEN EGG!' : this.stinker && !this.stinker.dead ? 'DESTROY THE STINKER' : 'BASES LEFT ' + this.basesLeft(), 6, 6, '#ffd23a');
    if (this.stinker && !this.stinker.dead) bar(6, 16, 100, 6, this.stinker.hp / 12, '#7d8f3a');
    if (this.dead) { ctx.globalAlpha = Math.min(0.85, this.dead); rect(0, 0, W, H, '#1a0a04'); ctx.globalAlpha = 1; txt('KA-BOOM!', W / 2, H / 2 - 8, '#ff6a3a', 'center', 16); }
  }
}
// ================= MAIN LOOP =================
let scene = null, nextScene = null, fade = 0, fadeDir = 0, paused = false, pauseSel = 0;
function setScene(s) {
  if (scene && scene.exit) scene.exit();
  scene = s; paused = false; FX.banners = [];
  In.setTouch(s.touch || {});
  if (s.enter) s.enter();
}
function go(s) { if (fadeDir === 1) { nextScene = s; return; } nextScene = s; fadeDir = 1; }
const PAUSE_ITEMS = ['RESUME', 'RESTART', 'QUIT TO MENU'];
function updatePause() {
  if (In.hit('up')) { pauseSel = (pauseSel + 2) % 3; Snd.blip(); }
  if (In.hit('down')) { pauseSel = (pauseSel + 1) % 3; Snd.blip(); }
  let ch = In.ok() ? pauseSel : -1;
  PAUSE_ITEMS.forEach((_, i) => { if (tapIn(100, 70 + i * 18, 120, 16)) ch = i; });
  if (In.hit('pause')) ch = 0;
  if (ch === 0) { paused = false; In.setTouch(scene.touch || {}); Snd.blip(); }
  else if (ch === 1) { paused = false; FX.banners = []; scene.restart(); In.setTouch(scene.touch || {}); }
  else if (ch === 2) { paused = false; go(new TitleScreen()); }
}
function drawPause() {
  ctx.globalAlpha = 0.7; rect(0, 0, W, H, '#000'); ctx.globalAlpha = 1;
  txt('PAUSED', W / 2, 44, '#ffd23a', 'center', 16);
  PAUSE_ITEMS.forEach((s, i) => { box(100, 70 + i * 18, 120, 16, i === pauseSel ? '#3a3a22' : '#14160e', i === pauseSel ? '#ffd23a' : '#5a5440'); txt(s, W / 2, 74 + i * 18, '#f4ecd0', 'center'); });
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (fadeDir === 1) { fade += dt * 4; if (fade >= 1) { fade = 1; setScene(nextScene); nextScene = null; fadeDir = -1; } }
  else if (fadeDir === -1) { fade -= dt * 4; if (fade <= 0) { fade = 0; fadeDir = 0; } }
  if (scene) {
    if (paused) updatePause();
    else {
      if (scene.pausable && In.hit('pause') && fadeDir === 0) { paused = true; pauseSel = 0; In.setTouch({ pad: true, a: 'OK', pause: true }); Snd.blip(); }
      else if (fadeDir !== 1) { FX.update(dt); scene.update(dt); }
    }
    ctx.save();
    if (FX.shakeT > 0) ctx.translate(Math.round((R() - 0.5) * FX.shakeM * 2), Math.round((R() - 0.5) * FX.shakeM * 2));
    scene.draw();
    ctx.restore();
    FX.drawTop();
    if (paused) drawPause();
    if (fade > 0) { ctx.globalAlpha = fade; rect(0, 0, W, H, '#000'); ctx.globalAlpha = 1; }
  }
  In.end();
  requestAnimationFrame(frame);
}
// boot
loadSave(); Snd.setMuted(!!save.muted);
Voice.on = save.voices !== false; Voice.probe('p1');
class Boot { // "tap to start" so the browser allows sound
  constructor() { this.t = 0; this.touch = {}; }
  update(dt) { this.t += dt; if (In.ok() || In.ptr.pressed || Object.keys(In.k).some(k => In.k[k])) { Snd.init(); Voice.unlock(); go(new TitleScreen()); } }
  draw() {
    rect(0, 0, W, H, '#0b0d08');
    const s = eggSprite('shelly', 0); ctx.drawImage(s, W / 2 - s.width * 2, 40, s.width * 4, s.height * 4);
    txt('EGGSHELL: BOMBING', W / 2, 20, '#f4f1e6', 'center');
    if ((this.t * 2) % 1 < 0.65) txt('TAP OR PRESS ANY KEY', W / 2, 150, '#ffd23a', 'center');
    txt('headphones recommended', W / 2, 166, '#6a6450', 'center');
  }
}
setScene(new Boot());
requestAnimationFrame(frame);
// debug hook for testing: window.EGG.play(i) jumps straight into a mission
window.EGG = { play: i => { Snd.init(); startMission(i); }, scene: () => scene, save: () => save };
</script>
