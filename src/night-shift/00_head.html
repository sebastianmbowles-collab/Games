<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Night Shift</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=VT323&family=Reenie+Beanie&display=swap">
<style>
/* Layout: one 16:9 stage centred in the dark, a 3D shop under a film-grain overlay; every word on it is either typewriter (the station), LCD (machines) or handwriting (you). Single dark look on purpose. */
:root{
  color-scheme:dark;
  --night:#040608; --ink:#d8d3c2; --dim:#7f8679; --fluoro:#d9ecc9; --coat:#e3b616; --blood:#a52d24; --paper:#e6dfca; --typeink:#262320;
  --type:'Special Elite','Courier New',Courier,monospace; --lcd:'VT323','Courier New',monospace; --hand:'Reenie Beanie','Bradley Hand','Comic Sans MS',cursive;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--night);color:var(--ink);font-family:var(--type);display:flex;align-items:center;justify-content:center;overflow:hidden;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
#stage{position:relative;aspect-ratio:16/9;width:100%;max-width:100%;container-type:inline-size;background:#000;overflow:hidden;font-size:clamp(9px,2.05cqw,26px);line-height:1.35}
#gl,#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#cv{touch-action:none}
#xh{position:absolute;left:50%;top:50%;width:.36em;height:.36em;margin:-.18em 0 0 -.18em;border-radius:50%;background:rgba(216,211,194,.55);pointer-events:none}
#xh.on{background:var(--coat);transform:scale(1.7)}
#joy{position:absolute;left:1.2em;bottom:1.2em;width:7.4em;height:7.4em;border-radius:50%;border:1px solid rgba(216,211,194,.3);background:rgba(4,6,8,.35);touch-action:none}
#nub{position:absolute;left:50%;top:50%;width:3em;height:3em;margin:-1.5em 0 0 -1.5em;border-radius:50%;background:rgba(216,211,194,.35);pointer-events:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--coat);outline-offset:2px}
.hb{position:absolute;background:rgba(4,6,8,.62);border:1px solid rgba(216,211,194,.28);color:var(--ink);padding:.3em .7em;letter-spacing:.08em;font-size:.82em;border-radius:2px}
.hb:hover{border-color:var(--ink)}
#clock{position:absolute;left:1em;top:.7em;font-family:var(--lcd);color:var(--fluoro);text-shadow:0 0 .5em rgba(160,255,170,.35);line-height:1;pointer-events:none}
#ck{display:block;font-size:2.1em;font-weight:400;font-variant-numeric:tabular-nums}
#nt{font-size:.95em;color:var(--dim);letter-spacing:.14em}
#bRules{right:4.2em;top:.8em}#bMenu{right:1em;top:.8em}
#bEyes{right:1em;bottom:.9em;padding:.6em .8em}#bBack{left:50%;transform:translateX(-50%);top:.8em}
#bWave{right:1em;bottom:4em;border-color:var(--coat);color:var(--coat)}
#bEyes.on{background:var(--ink);color:var(--night)}
#tip{position:absolute;left:50%;top:54%;transform:translateX(-50%);font-size:.85em;color:var(--fluoro);letter-spacing:.06em;white-space:nowrap;pointer-events:none;text-shadow:0 1px 3px #000}
#cap{position:absolute;left:50%;bottom:1.4em;transform:translateX(-50%);width:50%;text-align:center;font-size:1.02em;text-shadow:0 1px 3px #000,0 0 8px #000,0 0 16px #000;pointer-events:none;text-wrap:balance;padding:.25em .6em;border-radius:3px}
#cap:not(:empty){background:rgba(3,5,7,.55)}
#cap.far{font-style:italic;color:#b9c4b0}
#cap.hint{color:var(--coat);font-size:.9em}
#flash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4em;pointer-events:none;text-align:center;background:radial-gradient(ellipse at center,rgba(60,6,4,.25),rgba(30,0,0,.72))}
#flash b{font-size:2.2em;font-weight:400;color:#e9d9cf;letter-spacing:.14em;text-decoration:line-through;text-decoration-color:var(--blood);text-decoration-thickness:.12em}
#flash span{font-size:1em;color:#d9b9ae}
#dlg{position:absolute;left:8%;right:8%;bottom:4%;background:rgba(5,7,9,.9);border:1px solid rgba(216,211,194,.3);padding:.9em 1.2em 1em;cursor:pointer}
#dWho{font-size:.78em;letter-spacing:.2em;color:var(--coat);min-height:1.2em}
#dTxt{font-size:1.08em;min-height:2.7em;white-space:pre-wrap}
#dOpt{display:flex;flex-wrap:wrap;gap:.5em;margin-top:.6em}
#dOpt button{background:transparent;border:1px solid var(--dim);padding:.35em .8em;font-size:.95em;text-align:left}
#dOpt button:hover{border-color:var(--ink);background:rgba(216,211,194,.08)}
#dMore{position:absolute;right:.8em;bottom:.3em;font-size:.8em;color:var(--dim)}
#doc{position:absolute;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;gap:1em}
#docIn{background:var(--paper);color:var(--typeink);width:56%;max-height:90%;overflow:auto;padding:1.4em 1.7em;box-sizing:border-box;font-size:.86em;line-height:1.42;transform:rotate(-.6deg);box-shadow:0 .6em 2.5em #000;-webkit-user-select:text;user-select:text}
#docIn h2{font-size:1.25em;margin:0 0 .5em;font-weight:400;letter-spacing:.06em;text-align:center}
#docIn p{margin:.45em 0}
#docIn .rule b{font-weight:400;text-decoration:underline}
#docIn .broken{text-decoration:line-through;text-decoration-color:var(--blood);text-decoration-thickness:.14em;color:#6d5f58}
#docIn .hand{font-family:var(--hand);font-size:1.75em;line-height:1.02;color:#1d2a52;transform:rotate(-1.2deg)}
#docIn .hand.red{color:var(--blood)}
#docIn .new{background:rgba(227,182,22,.28)}
#docIn .lcd{font-family:var(--lcd);font-size:1.3em;line-height:1.1}
#docIn.receipt{width:30%;font-family:var(--lcd);font-size:1.15em;line-height:1.15;transform:rotate(1deg);background:#f1eee4}
#docIn.photo{background:#d8cdb0;font-family:var(--hand);font-size:1.6em;line-height:1.05;color:#33291c;width:46%}
#docIn table{width:100%;border-collapse:collapse}#docIn td{padding:.12em .3em;border-bottom:1px dotted #8a8372;vertical-align:top}
#docBtns{display:flex;flex-direction:column;gap:.6em}
#docBtns button{position:static}
#card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.9em;padding:1.5em 12%;box-sizing:border-box;background:radial-gradient(ellipse at center,rgba(2,3,5,.62),rgba(2,3,5,.38))}
#card.solid{background:#020304}
#card h1{font-size:3.3em;font-weight:400;letter-spacing:.14em;margin:0;line-height:1;color:var(--paper);text-wrap:balance}
#card h1 small{display:block;font-size:.24em;letter-spacing:.2em;color:var(--coat);margin-top:1em}
#card h2{font-size:1.9em;font-weight:400;letter-spacing:.16em;margin:0;text-wrap:balance}
#card p{margin:0;max-width:34em;text-wrap:balance;text-shadow:0 1px 4px #000,0 0 12px #000}
#card .dim{color:var(--dim);font-size:.82em}
#card .lcd{font-family:var(--lcd);font-size:1.35em;line-height:1.25;color:var(--fluoro);text-align:left;white-space:pre-wrap}
#card .row{display:flex;gap:.8em;flex-wrap:wrap;justify-content:center}
#card button{background:transparent;border:1px solid var(--dim);padding:.5em 1.2em;letter-spacing:.14em;font-size:.95em}
#card button:hover{border-color:var(--ink);background:rgba(216,211,194,.08)}
#card button.pri{border-color:var(--coat);color:var(--coat)}
#card input[type=text]{font:inherit;background:transparent;border:0;border-bottom:1px solid var(--ink);color:var(--ink);text-align:center;padding:.3em;width:16em;max-width:100%;letter-spacing:.1em;text-transform:uppercase}
#card label{font-size:.85em;color:var(--dim);display:flex;align-items:center;gap:.5em;justify-content:center}
#card .slip{background:var(--paper);color:var(--typeink);padding:1em 1.6em;text-align:left;font-size:.9em;min-width:22em;transform:rotate(.5deg)}
#card .slip td{padding:.1em .6em .1em 0}#card .slip td:last-child{text-align:right;font-variant-numeric:tabular-nums}
#card .ends{display:grid;grid-template-columns:repeat(5,1fr);gap:.5em;font-size:.72em;letter-spacing:.08em}
#card .ends div{border:1px solid rgba(216,211,194,.2);padding:.5em .3em;color:var(--dim)}
#card .ends div.got{border-color:var(--coat);color:var(--ink)}
.fade{animation:fd .9s ease both}@keyframes fd{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="640" height="360"></canvas>
  <canvas id="cv" width="480" height="270"></canvas>
  <div id="hud" hidden>
    <div id="clock"><b id="ck">2:57 AM</b><span id="nt">NIGHT 1</span></div>
    <button class="hb" id="bRules">RULES</button>
    <button class="hb" id="bMenu" aria-label="Pause">II</button>
    <div id="xh"></div>
    <div id="joy" hidden><div id="nub"></div></div>
    <button class="hb" id="bEyes">CLOSE EYES (hold)</button>
    <button class="hb" id="bWave" hidden>WAVE BACK (F)</button>
    <button class="hb" id="bBack" hidden>STEP BACK</button>
    <div id="tip"></div>
  </div>
  <div id="cap"></div>
  <div id="flash" hidden><b id="flB"></b><span id="flS"></span></div>
  <div id="dlg" hidden><div id="dWho"></div><div id="dTxt"></div><div id="dOpt"></div><div id="dMore">&#9662;</div></div>
  <div id="doc" hidden><div id="docIn"></div><div id="docBtns"><button class="hb" id="docT">TURN OVER</button><button class="hb" id="docX">PUT IT DOWN</button></div></div>
  <div id="card" hidden></div>
</div>
