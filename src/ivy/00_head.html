<!doctype html>
<html lang="en">
<head>
<title>Ivy's Dessert Quest</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Ivy and the Quest for More Dessert.
   One canvas draws the world. One overlay panel (#ui) shows every menu and cutscene. */
:root{
  --pink:#ff7eb6;
  --pink-dark:#c2457f;
  --cream:#fff6e9;
  --choc:#5a3420;
  --mint:#3fc4a0;
  --mint-dark:#23866b;
  --gold:#ffd23f;
  --night:#2a1838;
  --font:'Fredoka','Comic Sans MS','Chalkboard SE',system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--night);overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);color:var(--choc)}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#c{display:block;background:#000;border-radius:6px}
#ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;box-sizing:border-box;background:rgba(42,24,56,.55);z-index:5}
#ui.cut{align-items:flex-end;background:rgba(42,24,56,.25)}
.card{background:var(--cream);border:5px solid var(--pink-dark);border-radius:26px;box-shadow:0 7px 0 var(--pink-dark),0 20px 50px rgba(0,0,0,.4);padding:18px 22px;max-width:820px;width:100%;max-height:calc(100% - 16px);overflow:auto;text-align:center;box-sizing:border-box}
h1{font-size:clamp(26px,5.5vw,50px);margin:2px 0 6px;color:var(--pink-dark);line-height:1.05;text-shadow:3px 3px 0 #ffd1e6}
h1 small{display:block;font-size:.48em;color:var(--choc);text-shadow:none;margin-bottom:4px}
h2{font-size:clamp(21px,4vw,32px);margin:2px 0 8px;color:var(--pink-dark)}
h3{margin:12px 0 6px;color:var(--choc);font-size:20px}
p{font-size:clamp(15px,2.4vw,19px);line-height:1.4;margin:6px 0}
.btn{font-family:var(--font);font-weight:700;font-size:clamp(16px,2.6vw,20px);border:none;border-radius:999px;padding:10px 22px;margin:5px;background:var(--pink);color:#fff;box-shadow:0 5px 0 var(--pink-dark);cursor:pointer;text-shadow:1px 1px 0 var(--pink-dark)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--pink-dark)}
.btn.mint{background:var(--mint);box-shadow:0 5px 0 var(--mint-dark);text-shadow:1px 1px 0 var(--mint-dark)}
.btn.choc{background:#8a5636;box-shadow:0 5px 0 var(--choc);text-shadow:1px 1px 0 var(--choc)}
.btn.gold{background:#f2b705;box-shadow:0 5px 0 #a87d00;text-shadow:1px 1px 0 #a87d00}
.btn.small{font-size:15px;padding:7px 14px}
.btn[disabled]{filter:grayscale(1);opacity:.6;cursor:not-allowed}
.btn:focus-visible,.lvl:focus-visible,.tab:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.stats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:4px 0 8px}
.chip{background:#fff;border:3px solid var(--choc);border-radius:999px;padding:4px 12px;font-weight:600;font-size:16px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.tab{font-family:var(--font);font-weight:700;font-size:15px;border:3px solid var(--choc);border-radius:14px;padding:6px 10px;background:#fff;color:var(--choc);cursor:pointer}
.tab.on{background:var(--gold)}
.tab[disabled]{opacity:.45;cursor:not-allowed}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.lvl{font-family:var(--font);border:4px solid var(--choc);border-radius:18px;padding:10px 8px;cursor:pointer;font-size:16px;font-weight:600;color:#fff;text-shadow:1px 1px 0 rgba(0,0,0,.55);min-height:96px}
.lvl[disabled]{filter:grayscale(1) brightness(.7);cursor:not-allowed}
.lvl .num{font-size:24px}
.lvl .got{font-size:15px;margin-top:4px;letter-spacing:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:8px 0}
.item{background:#fff;border:3px solid var(--choc);border-radius:16px;padding:8px;font-size:14px;font-weight:600}
.item canvas{display:block;margin:0 auto 4px}
.item.lock{opacity:.5}
.item.wear{background:#fff4c2;border-color:#f2b705}
.cutbox{display:flex;gap:14px;align-items:center;text-align:left;max-width:860px}
.cutbox canvas{flex:0 0 auto;background:#ffe3f0;border-radius:18px;border:3px solid var(--pink-dark)}
.cutbox .who{font-weight:700;color:var(--pink-dark);font-size:20px}
.cutbox p{font-size:clamp(17px,2.6vw,22px)}
.keys{text-align:left;display:inline-block;font-size:16px;line-height:1.6}
kbd{background:#fff;border:2px solid var(--choc);border-bottom-width:4px;border-radius:6px;padding:0 6px;font-family:var(--font);font-size:14px}
#touch{position:fixed;inset:auto 0 0 0;height:0;z-index:4}
.tb{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.28);border:4px solid rgba(255,255,255,.7);color:#fff;font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--font)}
.tb.on{background:rgba(255,126,182,.65)}
#tl{left:14px}#tr{left:104px}#td{left:59px;bottom:calc(100px + env(safe-area-inset-bottom,0px));width:60px;height:60px;font-size:24px}
#tj{right:18px;width:96px;height:96px}#ta{right:124px;width:70px;height:70px;font-size:26px}
#pauseBtn{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:10px;z-index:4;width:46px;height:46px;border-radius:14px;border:3px solid #fff;background:rgba(194,69,127,.85);color:#fff;font-size:20px;font-weight:700;font-family:var(--font);cursor:pointer}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="960" height="560" aria-label="Ivy and the Quest for More Dessert"></canvas></div>
<button id="pauseBtn" hidden aria-label="Pause">II</button>
<div id="touch" hidden>
  <div class="tb" id="tl">◀</div><div class="tb" id="tr">▶</div><div class="tb" id="td">▼</div>
  <div class="tb" id="ta">★</div><div class="tb" id="tj">⤒</div>
</div>
<div id="ui"><div class="card" id="card"></div></div>
