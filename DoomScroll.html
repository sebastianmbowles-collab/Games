<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Doom Scroll</title>
<style>
  :root {
    --bg: #ffffff; --ink: #14171a; --soft: #6b7682; --line: #e7ebef;
    --tint: #f4f6f8; --brand: #7a3cff; --heart: #ff2d6f; --gold: #f5a300;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at 50% 20%, #2b2350, #0c0a18 70%);
    color: var(--ink); display: flex; align-items: center; justify-content: center;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }

  /* ---------- the phone ---------- */
  #phone {
    position: relative; width: 100vw; height: 100vh; height: 100dvh;
    background: var(--bg); display: flex; flex-direction: column; overflow: hidden;
  }
  @media (min-width: 480px) and (min-height: 640px) {
    #phone {
      width: 390px; height: min(820px, calc(100vh - 40px));
      border-radius: 46px; border: 11px solid #111; outline: 2px solid #3a3a44;
      box-shadow: 0 30px 80px rgba(0,0,0,.6);
    }
    #notch { display: block; }
  }
  #notch { display: none; position: absolute; top: 7px; left: 50%; width: 96px; height: 24px; margin-left: -48px; background: #111; border-radius: 14px; z-index: 50; pointer-events: none; }

  #status { display: flex; justify-content: space-between; align-items: center; padding: 8px 22px 2px; font-size: 13px; font-weight: 700; flex: none; }
  #header { display: flex; justify-content: space-between; align-items: center; padding: 6px 16px 10px; border-bottom: 1px solid var(--line); flex: none; }
  #logo { font-size: 24px; font-weight: 900; letter-spacing: -1px; color: var(--brand); font-style: italic; }
  #mute { font-size: 20px; padding: 4px 8px; vertical-align: middle; }
  #dist { display: inline-block; vertical-align: middle; background: var(--tint); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }

  .screen { flex: 1; min-height: 0; overflow-y: auto; display: none; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  .screen.on { display: block; }

  #tabs { display: flex; border-top: 1px solid var(--line); flex: none; padding-bottom: env(safe-area-inset-bottom); background: var(--bg); }
  #tabs button { flex: 1; padding: 9px 0 8px; font-size: 22px; opacity: .4; position: relative; }
  #tabs button.on { opacity: 1; }
  #tabs button small { display: block; font-size: 10px; white-space: nowrap; font-weight: 700; margin-top: 1px; }
  #tabs .dot { position: absolute; top: 6px; left: 58%; width: 9px; height: 9px; border-radius: 50%; background: var(--heart); display: none; }

  /* ---------- posts ---------- */
  .post { border-bottom: 8px solid var(--tint); padding: 12px 0 8px; position: relative; }
  .who { display: flex; align-items: center; gap: 10px; padding: 0 14px 8px; }
  .av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 21px; flex: none; }
  .name { font-weight: 700; font-size: 14px; }
  .when { color: var(--soft); font-size: 12px; }
  .text { padding: 0 14px 10px; font-size: 16px; line-height: 1.4; overflow-wrap: anywhere; }
  .text.big { font-size: 21px; font-weight: 700; line-height: 1.3; }
  .pic { height: 240px; display: grid; place-items: center; font-size: 110px; position: relative; overflow: hidden; }
  .pic span { filter: drop-shadow(0 8px 10px rgba(0,0,0,.25)); }
  .bar { display: flex; gap: 18px; padding: 8px 14px 2px; font-size: 14px; color: var(--soft); font-weight: 600; align-items: center; }
  .like { display: flex; align-items: center; gap: 5px; font-variant-numeric: tabular-nums; }
  .like i { font-style: normal; font-size: 21px; filter: grayscale(1); opacity: .55; transition: transform .15s; }
  .like.on { color: var(--heart); }
  .like.on i { filter: none; opacity: 1; transform: scale(1.2); }
  .bigheart { position: absolute; left: 50%; top: 45%; font-size: 90px; pointer-events: none; animation: pop .8s ease-out forwards; z-index: 5; }
  @keyframes pop { 0% { transform: translate(-50%,-50%) scale(0); opacity: 0; } 25% { transform: translate(-50%,-50%) scale(1.25); opacity: 1; } 70% { transform: translate(-50%,-50%) scale(1); opacity: 1; } 100% { transform: translate(-50%,-80%) scale(1); opacity: 0; } }

  .tag { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .5px; padding: 3px 8px; border-radius: 6px; background: var(--tint); color: var(--soft); margin: 0 14px 8px; text-transform: uppercase; }
  .tag.news { background: #ffe3e3; color: #c21f1f; }
  .tag.ad { background: #fff3cf; color: #8a6200; }
  .truth { margin: 0 14px 10px; padding: 10px 12px; background: #e8f7ee; border-radius: 12px; font-size: 14px; line-height: 1.4; color: #17613a; }
  .opt { display: block; width: calc(100% - 28px); margin: 0 14px 8px; padding: 12px 14px; border-radius: 12px; background: var(--tint); text-align: left; font-weight: 600; font-size: 15px; position: relative; overflow: hidden; }
  .opt .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: #dccbff; transition: width .5s; }
  .opt.mine .fill { background: #b99cff; }
  .opt b, .opt em { position: relative; font-style: normal; }
  .opt em { float: right; }
  .cta { display: block; margin: 0 14px 8px; padding: 12px; width: calc(100% - 28px); border-radius: 12px; background: var(--brand); color: #fff; font-weight: 800; font-size: 15px; }
  .cta.red { background: #e5242f; box-shadow: 0 5px 0 #9c111a; }
  .cta.red:active { transform: translateY(4px); box-shadow: 0 1px 0 #9c111a; }
  .toy { margin: 0 14px 10px; background: var(--tint); border-radius: 16px; padding: 16px; text-align: center; }
  .toy .thing { font-size: 96px; line-height: 1.1; display: inline-block; transition: transform .08s; }
  .toy .thing:active { transform: scale(.9) rotate(-6deg); }
  .toy p { margin: 8px 0 0; font-size: 14px; color: var(--soft); font-weight: 600; min-height: 1.3em; }
  .wrap { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .wrap button { aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #b9d8ff 60%, #8fbaf0); box-shadow: inset 0 -3px 5px rgba(0,0,0,.12); }
  .wrap button.popped { background: #dbe4ee; box-shadow: inset 0 2px 4px rgba(0,0,0,.2); transform: scale(.85); }
  .mile { background: linear-gradient(135deg, #7a3cff, #ff5fa2); color: #fff; padding: 26px 18px; text-align: center; border-bottom: 8px solid var(--tint); }
  .mile div { font-size: 54px; }
  .mile h3 { margin: 6px 0 4px; font-size: 20px; }
  .mile p { margin: 0; font-size: 14px; opacity: .9; }

  /* ---------- pop-ups ---------- */
  #banner { position: absolute; top: 8px; left: 8px; right: 8px; background: rgba(28,28,34,.96); color: #fff; border-radius: 18px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; z-index: 60; transform: translateY(-140%); transition: transform .3s cubic-bezier(.2,1.2,.4,1); box-shadow: 0 8px 24px rgba(0,0,0,.35); text-align: left; width: calc(100% - 16px); }
  #banner.on { transform: none; }
  #banner .ic { font-size: 28px; }
  #banner b { display: block; font-size: 13px; }
  #banner span { font-size: 14px; opacity: .9; }
  #modal { position: absolute; inset: 0; background: rgba(0,0,0,.55); z-index: 70; display: none; align-items: center; justify-content: center; padding: 24px; }
  #modal.on { display: flex; }
  #card { background: #fff; border-radius: 22px; padding: 26px 20px 18px; width: 100%; text-align: center; position: relative; animation: drop .3s cubic-bezier(.2,1.4,.4,1); min-height: 250px; }
  @keyframes drop { from { transform: scale(.6); opacity: 0; } }
  #card .em { font-size: 64px; }
  #card h2 { margin: 6px 0; font-size: 21px; }
  #card p { margin: 0 0 16px; color: var(--soft); font-size: 15px; line-height: 1.4; }
  #card .cta { margin: 0 0 8px; width: 100%; }
  #card .cta.ghost { background: var(--tint); color: var(--ink); }
  #xbtn { position: absolute; width: 34px; height: 34px; border-radius: 50%; background: var(--tint); font-weight: 900; font-size: 15px; top: 10px; right: 10px; transition: top .15s, right .15s, left .15s, bottom .15s; }
  #toast { position: absolute; left: 50%; top: 96px; transform: translate(-50%, -30px); background: #14171a; color: #fff; padding: 10px 16px; border-radius: 99px; font-size: 14px; font-weight: 700; opacity: 0; transition: .3s; z-index: 80; pointer-events: none; white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- other tabs ---------- */
  .pad { padding: 16px; }
  .pad h2 { margin: 4px 0 4px; font-size: 22px; }
  .pad .sub { color: var(--soft); font-size: 14px; margin: 0 0 14px; }
  .trophy { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 14px; background: var(--tint); margin-bottom: 8px; opacity: .5; }
  .trophy.got { opacity: 1; background: #fff6dc; }
  .trophy .ti { font-size: 32px; filter: grayscale(1); }
  .trophy.got .ti { filter: none; }
  .trophy b { display: block; font-size: 15px; }
  .trophy span { font-size: 13px; color: var(--soft); }
  .stat { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .stat div { background: var(--tint); border-radius: 14px; padding: 14px; }
  .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--soft); font-weight: 600; }
  .link { color: var(--soft); font-size: 13px; text-decoration: underline; display: block; margin: 14px auto; }

  #snakeWrap { text-align: center; }
  #cv { width: 100%; max-width: 330px; aspect-ratio: 1; border-radius: 14px; background: #10261a; touch-action: none; display: block; margin: 0 auto; }
  #pad { display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(2, 50px); gap: 6px; justify-content: center; margin-top: 12px; }
  #pad button { background: var(--tint); border-radius: 12px; font-size: 20px; }
  #pad button:active { background: #dccbff; }

  /* ---------- videos ---------- */
  #videos { background: #000; scroll-snap-type: y mandatory; }
  .clip { position: relative; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; overflow: hidden; color: #fff; cursor: pointer; }
  .post .clip { height: 340px; }
  .stage { position: absolute; inset: 0; overflow: hidden; font-size: 96px; line-height: 1; }
  .stage::after { content: ''; position: absolute; inset: 55% 0 0 0; background: linear-gradient(transparent, rgba(0,0,0,.55)); }
  .act { position: absolute; }
  .mid { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .mid > * { display: inline-block; }
  .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 24%; background: rgba(0,0,0,.18); }
  .a-run { animation: run 2.6s linear infinite; }
  .a-hop { animation: hop .55s cubic-bezier(.2,.6,.4,1) infinite alternate; }
  .a-spin { animation: spin 1.6s linear infinite; }
  .a-fall { animation: fall 2s linear infinite; font-size: 42px; }
  .a-wob { animation: wob .38s ease-in-out infinite alternate; }
  .a-pulse { animation: pulse 1.5s ease-in-out infinite alternate; }
  .a-grow { animation: grow 6s ease-out infinite; transform-origin: 50% 100%; }
  .a-shake { animation: shake .12s linear infinite alternate; }
  .sq { width: 190px; height: 190px; border-radius: 24px; display: grid !important; place-items: center; animation: spin 6s linear infinite; }
  .sq .sq { width: 70%; height: 70%; animation-duration: 3s; animation-direction: reverse; }
  .ring { width: 80px; height: 80px; border-radius: 50%; border: 9px solid rgba(255,255,255,.25); border-top-color: #fff; animation: spin .9s linear infinite; }
  @keyframes run { from { left: 105%; } to { left: -40%; } }
  @keyframes hop { from { bottom: 20%; } to { bottom: 62%; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fall { from { top: -15%; } to { top: 105%; } }
  @keyframes wob { from { transform: rotate(-22deg) translateY(0); } to { transform: rotate(22deg) translateY(-18px); } }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.5); } }
  @keyframes grow { from { transform: scale(.15); } to { transform: scale(2.2); } }
  @keyframes shake { from { transform: translate(-3px, 2px) rotate(-47deg); } to { transform: translate(3px, -2px) rotate(-43deg); } }
  @keyframes vprog { from { width: 0; } to { width: 100%; } }
  .clip:not(.playing) *, .clip.paused * { animation-play-state: paused !important; }
  .vinfo { position: absolute; left: 14px; right: 76px; bottom: 20px; text-shadow: 0 1px 4px rgba(0,0,0,.6); z-index: 2; }
  .vinfo b { font-size: 15px; }
  .vinfo p { margin: 4px 0 0; font-size: 15px; line-height: 1.35; }
  .vside { position: absolute; right: 10px; bottom: 26px; z-index: 2; text-align: center; }
  .vlike { display: block; color: #fff; font-size: 12px; font-weight: 700; text-shadow: 0 1px 4px rgba(0,0,0,.6); padding: 6px; }
  .vlike i { display: block; font-style: normal; font-size: 34px; filter: grayscale(1) brightness(3); transition: transform .15s; }
  .vlike.on i { filter: none; transform: scale(1.2); }
  .vbar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,.3); z-index: 2; }
  .vbar i { display: block; height: 100%; background: #fff; animation: vprog 6s linear infinite; }
  .vpause { position: absolute; inset: 0; display: none; place-items: center; font-size: 70px; background: rgba(0,0,0,.25); z-index: 3; }
  .clip.paused .vpause { display: grid; }

  #off { position: absolute; inset: 0; background: #050507; color: #fff; z-index: 90; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px; }
  #off.on { display: flex; }
  #off .em { font-size: 70px; }
  #off h2 { font-size: 24px; margin: 10px 0; }
  #off p { opacity: .75; line-height: 1.5; margin: 0 0 24px; }
</style>
</head>
<body>
<div id="phone">
  <div id="notch"></div>
  <div id="status"><span id="clock">9:00 PM</span><span id="batt">🔋 100%</span></div>
  <div id="header"><span id="logo">scrollr</span><span><button id="mute" aria-label="sound on or off">🔊</button><span id="dist">0.00 m</span></span></div>

  <div id="feed" class="screen on"><div id="spacer"></div><div id="posts"></div></div>

  <div id="videos" class="screen"><div id="vspacer"></div></div>

  <div id="trophies" class="screen"><div class="pad"><h2>🏆 Trophies</h2><p class="sub" id="tcount"></p><div id="tlist"></div></div></div>

  <div id="snake" class="screen"><div class="pad" id="snakeWrap">
    <h2>🐍 Snake Break</h2><p class="sub" id="sscore">Tap the board to start. Swipe or use the arrows.</p>
    <canvas id="cv" width="330" height="330"></canvas>
    <div id="pad">
      <span></span><button data-d="0,-1">▲</button><span></span>
      <button data-d="-1,0">◀</button><button data-d="0,1">▼</button><button data-d="1,0">▶</button>
    </div>
  </div></div>

  <div id="me" class="screen"><div class="pad">
    <h2>👤 Your Scrolling</h2><p class="sub" id="compare"></p>
    <div class="stat" id="stats"></div>
    <button class="cta" id="putdown" style="margin:0;width:100%">📴 Put the phone down</button>
    <button class="link" id="reset">Start over (erase everything)</button>
  </div></div>

  <div id="tabs">
    <button data-tab="feed" class="on">🏠<small>Feed</small></button>
    <button data-tab="videos">🎬<small>Videos</small></button>
    <button data-tab="trophies">🏆<small>Trophies</small><span class="dot" id="tdot"></span></button>
    <button data-tab="snake">🐍<small>Snake</small></button>
    <button data-tab="me">👤<small>Me</small></button>
  </div>

  <button id="banner"><span class="ic"></span><span><b></b><span class="msg"></span></span></button>
  <div id="modal"><div id="card"></div></div>
  <div id="toast"></div>
  <div id="off"><div class="em">🌳</div><h2>Phone is down.</h2><p id="offmsg"></p><button class="cta" id="pickup" style="width:auto;padding:12px 22px">Pick it back up…</button></div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
// A "bag" hands out every item once, in a mixed-up order, before repeating any.
const bag = items => { let left = []; return () => { if (!left.length) left = items.slice().sort(() => Math.random() - .5); return left.pop(); }; };

/* ---------- saved progress ---------- */
const KEY = 'doomscroll_v1';
const fresh = () => ({ px: 0, likes: 0, swats: 0, polls: 0, eggs: 0, wraps: 0, rebel: 0, pets: 0, snakeBest: 0, snakePlays: 0, fastSwat: 0, grass: 0, owl: 0, vids: 0, mute: 0, got: {} });
let S = fresh();
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}
let saveTimer = 0;
const save = () => { clearTimeout(saveTimer); saveTimer = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }, 400); };

/* ---------- sounds (made by a tiny synthesizer, no sound files) ---------- */
let AC = null, master = null, hiss = null;
function unlock() { // browsers only let sound start after you touch the page
  if (!AC) {
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    AC = new C(); master = AC.createGain(); master.gain.value = .6; master.connect(AC.destination);
    hiss = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = hiss.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (AC.state === 'suspended') AC.resume();
}
['pointerdown', 'touchend', 'click', 'keydown'].forEach(ev => window.addEventListener(ev, unlock, { passive: true }));
const canPlay = () => AC && !S.mute && AC.state === 'running';
// a tone is one note: how high (f), how long (dur), and it can slide to another note (to)
function tone(f, dur, o = {}) {
  if (!canPlay()) return;
  const t = AC.currentTime + (o.at || 0), osc = AC.createOscillator(), g = AC.createGain();
  osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t);
  if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
  g.gain.setValueAtTime(o.vol || .2, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  osc.connect(g); g.connect(master); osc.start(t); osc.stop(t + dur + .03);
}
// noise is a "shhh" sound, good for pops, steps and sizzles
function noise(dur, o = {}) {
  if (!canPlay()) return;
  const t = AC.currentTime + (o.at || 0), src = AC.createBufferSource(), g = AC.createGain();
  src.buffer = hiss; src.loop = true;
  g.gain.setValueAtTime(o.vol || .15, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  let node = src;
  if (o.hp || o.lp) { const f = AC.createBiquadFilter(); f.type = o.hp ? 'highpass' : 'lowpass'; f.frequency.value = o.hp || o.lp; src.connect(f); node = f; }
  node.connect(g); g.connect(master); src.start(t, Math.random() * .5); src.stop(t + dur + .03);
}
const SFX = {
  like: () => { tone(660, .08, { type: 'triangle' }); tone(990, .14, { type: 'triangle', at: .07 }); },
  blip: () => tone(520, .07, { type: 'square', vol: .08 }),
  tick: () => tone(1400, .03, { vol: .06 }),
  pop: () => { tone(700 + rnd(500), .07, { to: 180, vol: .25 }); noise(.04, { vol: .12 }); },
  crack: () => noise(.05, { vol: .2, hp: 1500 + rnd(1500) }),
  hatch: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .14, { type: 'triangle', at: i * .08 })),
  buzz: () => tone(110, .28, { type: 'sawtooth', vol: .16, to: 95 }),
  purr: () => { for (let i = 0; i < 6; i++) tone(48, .05, { type: 'sawtooth', vol: .22, at: i * .045 }); },
  sad: () => [392, 370, 349, 262].forEach((f, i) => tone(f, i === 3 ? .5 : .2, { type: 'sawtooth', vol: .07, at: i * .2, to: i === 3 ? 240 : 0 })),
  trophy: () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, .28, { type: 'triangle', vol: .16, at: i * .09 })),
  alert: () => { tone(880, .1, { type: 'square', vol: .08 }); tone(880, .1, { type: 'square', vol: .08, at: .15 }); },
  swat: () => { noise(.09, { vol: .25, lp: 1800 }); tone(300, .1, { to: 90, vol: .2 }); },
  dodge: () => tone(400, .22, { to: 1300, vol: .12 }),
  eat: () => { tone(600, .05, { type: 'square', vol: .08 }); tone(900, .08, { type: 'square', vol: .08, at: .05 }); },
  die: () => tone(400, .5, { to: 70, type: 'sawtooth', vol: .12 }),
  birds: () => { for (let i = 0; i < 7; i++) tone(2200 + rnd(1400), .09, { to: 2800 + rnd(1200), vol: .07, at: i * .16 + Math.random() * .08 }); },
  // --- video sounds: these repeat while a video plays (i counts up each time) ---
  step: () => noise(.03, { vol: .07, hp: 2200 }),
  boing: () => tone(170, .26, { to: 540, vol: .14 }),
  whoosh: () => noise(.5, { vol: .05, lp: 900 }),
  plip: () => tone(1100 + rnd(900), .06, { to: 500, vol: .06 }),
  beat: i => { tone([262, 330, 392, 330][i % 4], .13, { type: 'square', vol: .045 }); i % 2 ? noise(.04, { vol: .06, hp: 5000 }) : tone(95, .12, { to: 50, vol: .22 }); },

  () => { const [f, e] = pick(FOODS); return { h: `<div class="mid" style="font-size:80px"><span class="a-wob">🧑‍🍳</span><span class="a-spin">${e}</span></div>`, c: `Cooking tutorial: how to make ${f}. Step 1: spin it. There is no step 2.` }; },
];
let nowClip = null; // the video you are looking at right now
const watcher = new IntersectionObserver(es => es.forEach(e => {
  const on = e.intersectionRatio >= .6; e.target.classList.toggle('playing', on);
  if (on) nowClip = e.target; else if (nowClip === e.target) nowClip = null;
}), { threshold: [0, .6, 1] });
setInterval(() => {
  const c = nowClip; if (!c || !c.snd || !c.isConnected || c.classList.contains('paused') || $('off').classList.contains('on')) return;
  const t = performance.now(); if (c.next && t < c.next) return;
  c.next = t + c.snd[1]; c.beat = (c.beat || 0) + 1; sfx(c.snd[0], c.beat);
}, 40);
let lastScene = -1;
function makeClip() {
  let k; do k = rnd(SCENES.length); while (k === lastScene); lastScene = k;
  const s = SCENES[k](), n = rnd(90000) + 100;
  const c = el('div', 'clip', `<div class="stage" style="background:${s.bg || pick(VGRADS)}">${s.h}</div><div class="vinfo"><b>@${pick(USERS)[0]}</b><p>${s.c}</p></div><div class="vside"><button class="vlike" aria-label="like"><i>❤️</i><span>${n.toLocaleString()}</span></button></div><div class="vbar"><i></i></div><div class="vpause">▶</div>`);
  // when the white bar fills up once, you watched the whole thing
  c.querySelector('.vbar i').addEventListener('animationiteration', () => { if (!c.dataset.seen) { c.dataset.seen = 1; S.vids++; check(); } });
  c.addEventListener('click', e => {
    const l = e.target.closest('.vlike');
    if (!l) return c.classList.toggle('paused');
    if (!l.classList.contains('on')) { l.classList.add('on'); sfx('like'); l.lastChild.textContent = (n + 1).toLocaleString(); S.likes++; check(); }
  });
  c.snd = VSND[k];
  watcher.observe(c); return c;
}
const vids = $('videos'), vspacer = $('vspacer');
let vSpacerH = 0, vLast = 0;
function vfill() {
  const h = vids.clientHeight; if (!h) return;
  while (vids.scrollHeight - vids.scrollTop - h < h * 2) vids.appendChild(makeClip());
  const clips = vids.querySelectorAll('.clip');
  if (clips.length > 24) { // make the empty space first, then take the old videos away, so nothing jumps
    vSpacerH += h * 10; vspacer.style.height = vSpacerH + 'px';
    for (let i = 0; i < 10; i++) { watcher.unobserve(clips[i]); clips[i].remove(); }
  }
}
vids.addEventListener('scroll', () => {
  const d = Math.abs(vids.scrollTop - vLast); vLast = vids.scrollTop;
  if (!d) return;
  moved(d); vfill(); hud(); check();
}, { passive: true });

/* ---------- the endless feed ---------- */
const feed = $('feed'), posts = $('posts'), spacer = $('spacer');
let spacerH = 0, lastTop = 0, sessionPx = 0, nextPop = 2600, mileIdx = TALL.findIndex(t => t[0] > metres());
if (mileIdx < 0) mileIdx = TALL.length;
let pendingMile = null;

function moved(d) {
  S.px += d; sessionPx += d;
  if (mileIdx < TALL.length && metres() >= TALL[mileIdx][0]) { pendingMile = TALL[mileIdx]; mileIdx++; }
}
function fill() {
  // add new posts at the bottom whenever you get close to it
  while (feed.scrollHeight - feed.scrollTop - feed.clientHeight < 1800) {
    if (pendingMile) { const [m, what, e] = pendingMile; pendingMile = null; posts.appendChild(el('div', 'mile', `<div>${e}</div><h3>You scrolled ${fmtM(m)}!</h3><p>That is as tall as ${what}. Your thumb did that.</p>`)); }
    posts.appendChild(makePost());
  }
  // swap far-away old posts for empty space, so the phone never gets slow
  if (posts.children.length > 70) {
    const before = posts.offsetHeight;
    for (let i = 0; i < 25; i++) { posts.firstChild.querySelectorAll('.clip').forEach(c => watcher.unobserve(c)); posts.firstChild.remove(); }
    spacerH += before - posts.offsetHeight; spacer.style.height = spacerH + 'px';
  }
  if (spacerH > 4e6) { const cut = spacerH - 2000; spacerH = 2000; spacer.style.height = '2000px'; feed.scrollTop -= cut; lastTop = feed.scrollTop; }
}
function hud() {
  $('dist').textContent = fmtM(metres());
  const mins = 21 * 60 + Math.floor(sessionPx / 300); // the phone clock starts at 9 PM
  const h24 = Math.floor(mins / 60) % 24, m = mins % 60;
  $('clock').textContent = `${h24 % 12 || 12}:${String(m).padStart(2, '0')} ${h24 < 12 ? 'AM' : 'PM'}`;
  if (!S.owl && mins >= 27 * 60) S.owl = 1;
  const b = Math.max(1, 100 - Math.floor(sessionPx / 2500));
  $('batt').textContent = (b <= 15 ? '🪫 ' : '🔋 ') + b + '%' + (b === 1 ? ' (somehow)' : '');
}
feed.addEventListener('scroll', () => {
  const d = Math.abs(feed.scrollTop - lastTop); lastTop = feed.scrollTop;
  if (!d) return;
  moved(d);
  if (sessionPx > nextPop && !popOpen) { nextPop = sessionPx + 3200 + rnd(3200); popUp(); }
  fill(); hud(); check();
}, { passive: true });

// hearts: tap the heart button, or double-tap anywhere on the post
function like(p, force) {
  const b = p.querySelector('.like'); if (!b) return;
  const on = b.classList.contains('on');
  if (on && force) return;
  b.classList.toggle('on', !on);
  b.querySelector('span').textContent = (+p.dataset.likes + (on ? 0 : 1)).toLocaleString();
  if (!on) { sfx('like'); S.likes++; check(); }
}
let lastTap = 0, lastPost = null;
posts.addEventListener('click', e => {
  const p = e.target.closest('.likeable'); if (!p) return;
  if (e.target.closest('.like')) return like(p);
  if (e.target.closest('button')) return;
  const now = performance.now();
  if (lastPost === p && now - lastTap < 350) { like(p, true); const h = p.appendChild(el('div', 'bigheart', '❤️')); setTimeout(() => h.remove(), 800); lastTap = 0; }
  else { lastTap = now; lastPost = p; }
});

/* ---------- pop-up traps ---------- */
let popOpen = false, popAt = 0, bannerTimer = 0;
function swatted() { popOpen = false; sfx('swat'); S.swats++; if (performance.now() - popAt < 1000) S.fastSwat = 1; check(); }
const BANNERS = [['💬', 'Mom', 'are you still on your phone??'], ['🔔', 'scrollr', 'Someone you do not know did something!'], ['🦆', 'sir_honks_a_lot', 'HONK'], ['🔋', 'Battery', 'I am tired. Are you not tired?'], ['👍', 'Your Thumb', 'I would like a day off, please.'], ['🛋️', 'The Couch', 'You have been sitting on me for a while.'], ['🕰️', 'Clock', 'It is later than you think. Probably.'], ['🐕', 'Dog', 'walk? walk? walk? walk? walk?']];
const MODALS = [
  { em: '🎁', h: 'YOU WON!!!', p: 'You are the 1,000,000th scroller! Your prize is one million socks.', btns: ['Claim socks'], dodge: 2, after: 'The socks are invisible. Enjoy!' },
  { em: '🤨', h: 'Still scrolling?', p: 'Just checking. You have been at it a while.', btns: ['Yes', 'Also yes'] },
  { em: '🍪', h: 'This app uses cookies', p: 'Chocolate chip, mostly. Would you like to eat them?', btns: ['Nom', 'Nom nom'], after: 'Delicious. No cookies left.' },
  { em: '⭐', h: 'Rate this app!', p: 'How many stars would you give scrollr?', btns: ['5 stars', '6 stars', 'A potato'], after: 'Thanks! We wrote it down on a napkin.' },
  { em: '🆙', h: 'Update available', p: 'Version 9.9.9 adds more scrolling and removes the bottom (again).', btns: ['Later', 'Even later'], dodge: 1 },
  { em: '🦖', h: 'A WILD POP-UP APPEARS', p: 'It blocks your way. What will you do?', btns: ['Swat it'], dodge: 3, after: 'It ran away!' },
];
function popUp() {
  popOpen = true; popAt = performance.now(); sfx('alert');
  if (rnd(5) < 2) { // a notification that drops from the top
    const [ic, who, msg] = pick(BANNERS), b = $('banner');
    b.querySelector('.ic').textContent = ic; b.querySelector('b').textContent = who; b.querySelector('.msg').textContent = msg;
    b.classList.add('on');
    clearTimeout(bannerTimer); bannerTimer = setTimeout(() => { b.classList.remove('on'); popOpen = false; }, 6000);
    return;
  }
  const m = pick(MODALS), card = $('card'); let dodges = m.dodge || 0;
  card.innerHTML = `<button id="xbtn" aria-label="close">✕</button><div class="em">${m.em}</div><h2>${m.h}</h2><p>${m.p}</p>`;
  const close = msg => { $('modal').classList.remove('on'); swatted(); if (msg) toast(msg); };
  m.btns.forEach((t, i) => { const b = card.appendChild(el('button', 'cta' + (i ? ' ghost' : ''), t)); b.onclick = () => close(m.after); });
  const x = card.querySelector('#xbtn');
  const spots = [{ top: '10px', left: '10px', right: 'auto', bottom: 'auto' }, { bottom: '10px', right: '10px', top: 'auto', left: 'auto' }, { bottom: '10px', left: '10px', top: 'auto', right: 'auto' }, { top: '10px', right: '10px', left: 'auto', bottom: 'auto' }];
  x.onclick = () => { if (dodges > 0) { dodges--; sfx('dodge'); Object.assign(x.style, spots[dodges % 4]); toast(pick(['Too slow!', 'Missed me!', 'Nope!'])); } else close(); };
  $('modal').classList.add('on');
}
$('banner').onclick = () => { if (!$('banner').classList.contains('on')) return; clearTimeout(bannerTimer); $('banner').classList.remove('on'); swatted(); };

/* ---------- tabs ---------- */
let tab = 'feed';
function show(name) {
  tab = name; sfx('tick');
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === name));
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  if (name === 'trophies') { $('tdot').style.display = 'none'; drawTrophies(); }
  if (name === 'me') drawMe();
  if (name === 'snake') drawSnake(); else stopSnake();
  if (name === 'feed') { feed.scrollTop = lastTop; fill(); }
  if (name === 'videos') { vids.scrollTop = vLast; vfill(); }
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { if (b.dataset.tab === 'feed' && tab === 'feed') return; show(b.dataset.tab); });

function compareLine() {
  const m = metres(); let best = null, next = null;
  for (const t of TALL) { if (m >= t[0]) best = t; else { next = t; break; } }
  let s = best ? `Your thumb has travelled ${fmtM(m)}. That is taller than ${best[1]} ${best[2]}.` : `Your thumb has travelled ${fmtM(m)}. Keep going!`;
  if (next) s += ` Next up: ${next[1]} at ${fmtM(next[0])}.`;
  return s;
}
function drawMe() {
  $('compare').textContent = compareLine();
  const rows = [[fmtM(metres()), 'scrolled'], [S.likes, 'posts liked'], [S.vids, 'videos watched'], [S.swats, 'pop-ups swatted'], [S.snakeBest, 'best Snake score'], [TROPHIES.filter(t => S.got[t[0]]).length + '/' + TROPHIES.length, 'trophies']];
  $('stats').innerHTML = rows.map(([v, l]) => `<div><b>${v}</b><span>${l}</span></div>`).join('');
}
$('putdown').onclick = () => { S.grass = 1; $('offmsg').textContent = compareLine() + ' The outside world says hi.'; $('off').classList.add('on'); check(); setTimeout(() => sfx('birds'), 700); };
$('pickup').onclick = () => $('off').classList.remove('on');
let resetArmed = 0;
$('reset').onclick = () => {
  if (Date.now() - resetArmed > 4000) { resetArmed = Date.now(); $('reset').textContent = 'Really erase everything? Tap again to say yes.'; return; }
  S = fresh(); try { localStorage.removeItem(KEY); } catch (e) {}
  location.reload();
};

/* ---------- snake ---------- */
const cv = $('cv'), cx = cv.getContext('2d'), N = 15;
let sn, dir, queue, food, score, alive = false, timer = 0, started = false;
function sizeCanvas() { const w = cv.clientWidth || 330, r = Math.min(window.devicePixelRatio || 1, 3); cv.width = cv.height = Math.round(w * r); }
function placeFood() { do { food = { x: rnd(N), y: rnd(N) }; } while (sn.some(s => s.x === food.x && s.y === food.y)); }
function startSnake() {
  sn = [{ x: 7, y: 7 }, { x: 6, y: 7 }, { x: 5, y: 7 }]; dir = { x: 1, y: 0 }; queue = []; score = 0; alive = true; started = true;
  placeFood(); S.snakePlays++; check();
  clearInterval(timer); timer = setInterval(step, 150);
  $('sscore').textContent = 'Score: 0';
}
function stopSnake() { clearInterval(timer); if (alive) { alive = false; started = false; } }
function turn(x, y) {
  if (!alive) return;
  const last = queue.length ? queue[queue.length - 1] : dir;
  if ((last.x === -x && last.y === -y) || (last.x === x && last.y === y) || queue.length > 2) return;
  queue.push({ x, y });
}
function step() {
  if (queue.length) dir = queue.shift();
  const h = { x: sn[0].x + dir.x, y: sn[0].y + dir.y };
  const ate = h.x === food.x && h.y === food.y;
  const body = ate ? sn : sn.slice(0, -1); // the tail moves out of the way unless we just ate
  if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || body.some(s => s.x === h.x && s.y === h.y)) {
    alive = false; clearInterval(timer); sfx('die');
    if (score > S.snakeBest) S.snakeBest = score;
    $('sscore').textContent = `Bonk! Score ${score}. Best ${S.snakeBest}. Tap the board to go again.`;
    check(); drawSnake(); return;
  }
  sn.unshift(h);
  if (ate) { sfx('eat'); score++; $('sscore').textContent = 'Score: ' + score; if (sn.length < N * N) placeFood(); } else sn.pop();
  drawSnake();
}
function drawSnake() {
  sizeCanvas(); const c = cv.width / N;
  cx.fillStyle = '#10261a'; cx.fillRect(0, 0, cv.width, cv.height);
  cx.fillStyle = '#16321f'; for (let y = 0; y < N; y++) for (let x = (y % 2); x < N; x += 2) cx.fillRect(x * c, y * c, c, c);
  if (!started) { cx.fillStyle = '#b8f5c8'; cx.font = `bold ${c * 1.1}px sans-serif`; cx.textAlign = 'center'; cx.fillText('Tap to play', cv.width / 2, cv.height / 2); return; }
  cx.font = `${c * .85}px sans-serif`; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText('🍎', (food.x + .5) * c, (food.y + .55) * c); cx.textBaseline = 'alphabetic';
  sn.forEach((s, i) => { cx.fillStyle = alive ? (i ? '#4fd67a' : '#b8f5c8') : '#7b8a80'; const g = c * .08; cx.beginPath(); cx.roundRect ? cx.roundRect(s.x * c + g, s.y * c + g, c - 2 * g, c - 2 * g, c * .25) : cx.rect(s.x * c + g, s.y * c + g, c - 2 * g, c - 2 * g); cx.fill(); });
}
let touch0 = null, swiped = false;
cv.addEventListener('pointerdown', e => { touch0 = { x: e.clientX, y: e.clientY }; swiped = false; });
cv.addEventListener('pointermove', e => {
  if (!touch0) return; const dx = e.clientX - touch0.x, dy = e.clientY - touch0.y;
  if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
  swiped = true; Math.abs(dx) > Math.abs(dy) ? turn(Math.sign(dx), 0) : turn(0, Math.sign(dy)); touch0 = { x: e.clientX, y: e.clientY };
});
window.addEventListener('pointerup', () => { touch0 = null; });
cv.addEventListener('click', () => { if (!alive && !swiped) startSnake(); });
document.querySelectorAll('#pad button').forEach(b => b.addEventListener('pointerdown', () => { const [x, y] = b.dataset.d.split(',').map(Number); if (!alive) startSnake(); turn(x, y); }));
const KEYS = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0] };
window.addEventListener('keydown', e => { if (tab !== 'snake') return; const k = KEYS[e.key]; if (k) { e.preventDefault(); if (!alive) startSnake(); turn(k[0], k[1]); } else if (e.key === ' ' && !alive) { e.preventDefault(); startSnake(); } });

$('mute').textContent = S.mute ? '🔇' : '🔊';
$('mute').onclick = () => { S.mute = S.mute ? 0 : 1; $('mute').textContent = S.mute ? '🔇' : '🔊'; save(); sfx('like'); };

/* ---------- go! ---------- */
const hello = el('div', 'post', '<div class="text big" style="padding-top:8px">👋 Welcome to scrollr</div><div class="text">There is no bottom. Just scroll and see how far your thumb can go.<br><br>❤️ Double-tap posts to like them<br>🪰 Swat the pop-ups<br>🎬 Watch videos in the Videos tab<br>🏆 Collect trophies<br>🔊 Tap the speaker up top to turn sound on or off<br>🐍 Psst… there is a snake down there ↓</div>');
posts.appendChild(hello);
fill(); hud(); drawTrophies();
})();
</script>
</body>
