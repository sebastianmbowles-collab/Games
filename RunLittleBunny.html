<!doctype html>
<html lang="en">
<head>
<title>Run Little Bunny!</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
/* Layout: one full-screen painted canvas; wooden buttons and a parchment panel float over it. */
:root{
  --ink:#3b2a22;
  --paper:#f4e7c9;
  --wood:#9a6436;
  --wood-dark:#5e3b1f;
  --carrot:#e8792b;
  --night:#1b1422;
  --display:'Caveat Brush','Comic Sans MS','Chalkboard SE',cursive;
  --body:'Patrick Hand','Comic Sans MS','Chalkboard SE',cursive;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--night);overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{font-family:var(--body);color:var(--ink)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.wbtn{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));width:46px;height:46px;border-radius:12px 14px 11px 13px;background:linear-gradient(#b47c47,#7d4f27);border:2px solid var(--wood-dark);box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 3px 0 var(--wood-dark);color:#fbeed3;font:24px/1 var(--display);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;z-index:5}
.wbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wood-dark)}
.wbtn svg{width:24px;height:24px}
#pauseBtn{right:calc(10px + env(safe-area-inset-right,0px))}
#muteBtn{right:calc(64px + env(safe-area-inset-right,0px))}
#panel{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(560px,calc(100% - 32px));box-sizing:border-box;max-height:calc(100% - 90px);overflow:auto;background:radial-gradient(ellipse at center,#f8eed6 55%,#e6cf9f 100%);border:3px solid var(--wood-dark);border-radius:14px 18px 12px 20px;padding:12px 18px 16px;box-shadow:0 6px 0 rgba(0,0,0,.35);text-align:center;z-index:6}
#panel h2{font:34px/1 var(--display);margin:2px 0 6px;color:var(--wood-dark);text-wrap:balance}
#panel p{font-size:19px;line-height:1.25;margin:5px 0}
#panel .say{font-style:italic;color:#6a4026}
#panel .small{font-size:16px;opacity:.85}
#panel table{margin:6px auto;border-collapse:collapse;font-size:18px;text-align:left}
#panel td{padding:2px 10px}
#panel td:first-child{font-family:var(--display);color:var(--wood-dark);white-space:nowrap}
#panel b{color:#b0521a}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.btn{font:24px/1 var(--display);padding:9px 20px 10px;color:#fff7e6;background:linear-gradient(#c58c51,#8a5629);border:2px solid var(--wood-dark);border-radius:10px 14px 10px 12px;box-shadow:0 4px 0 var(--wood-dark);cursor:pointer;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.primary{background:linear-gradient(#f2a24c,#c8661c)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wood-dark)}
.btn:focus-visible,.wbtn:focus-visible{outline:3px solid #fff3b0;outline-offset:2px}
#touch{position:fixed;inset:0;pointer-events:none;display:none;z-index:4}
body.touch.playing #touch{display:block}
.tbtn{position:absolute;width:82px;height:82px;border-radius:50%;pointer-events:auto;background:rgba(120,78,40,.5);border:3px solid rgba(60,36,18,.8);color:#fff3dc;font:26px/1 var(--display);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(40,24,10,.6);touch-action:none}
.tbtn.on{background:rgba(240,160,75,.75);transform:translateY(2px)}
#tLeft{left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px))}
#tRight{left:calc(110px + env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px))}
#tJump{right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:96px;height:96px}
#tSlide{right:calc(124px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px))}
@media (max-height:520px){#panel{padding:8px 14px 10px}#panel h2{font-size:26px;margin:0 0 2px}#panel p{font-size:16px;margin:3px 0}#panel table{font-size:15px}.btn{font-size:20px;padding:7px 16px 8px}.btns{margin-top:6px}.tbtn{width:68px;height:68px;font-size:22px}#tRight{left:calc(96px + env(safe-area-inset-left,0px))}#tJump{width:80px;height:80px}#tSlide{right:calc(106px + env(safe-area-inset-right,0px))}}
.tbtn{background:rgba(120,78,40,.38)}
@media (prefers-reduced-motion:reduce){.btn:active,.wbtn:active{transform:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="Run Little Bunny game"></canvas>
<button class="wbtn" id="muteBtn" aria-label="Sound on or off" title="Sound (M)"></button>
<button class="wbtn" id="pauseBtn" aria-label="Pause" title="Pause (P)" hidden>
  <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="#fbeed3"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="#fbeed3"/></svg>
</button>
<div id="panel" hidden>
  <h2 id="pTitle"></h2>
  <div id="pBody"></div>
  <div class="btns" id="pBtns"></div>
</div>
<div id="touch">
  <div class="tbtn" id="tLeft" data-k="left">&#9664;</div>
  <div class="tbtn" id="tRight" data-k="right">&#9654;</div>
  <div class="tbtn" id="tSlide" data-k="down">Slide</div>
  <div class="tbtn" id="tJump" data-k="jump">Jump</div>
</div>
<script>
(() => {
'use strict';
// =====================================================================
//  RUN LITTLE BUNNY!  -  Step 1: the Burrow, Carrot Meadows and the Fox
// =====================================================================
const TAU = Math.PI * 2;
const H = 540, GROUND = 450, BMAX = 340, JUMPV = 790;
const FOOD_GOAL = 200;
const CHASE_MAX = 450; // top speed while the fox is chasing
const FL = 352; // burrow floor
const VAL = { carrot: 1, berry: 1, apple: 3, gold: 10 };
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let DPR = 1, SCALE = 1, VW = 960, VH = 540, OX = 0, OY = 0, RES = 1;

const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function rng(seed) { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shade(hex, amt) {
  const v = parseInt(hex.slice(1), 16); let r = v >> 16, g = v >> 8 & 255, b = v & 255;
  if (amt > 0) { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  else { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
  return '#' + [r, g, b].map(x => Math.round(clamp(x, 0, 255)).toString(16).padStart(2, '0')).join('');
}
function mix(c1, c2, t) {
  const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
  const f = (s) => Math.round(lerp(a >> s & 255, b >> s & 255, t)).toString(16).padStart(2, '0');
  return '#' + f(16) + f(8) + f(0);
}
function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }

// ---------------------------------------------------------------------
//  Save data (lives only in this browser)
// ---------------------------------------------------------------------
const SAVE_KEY = 'runLittleBunny.v1';
const save = { food: 0, runs: 0, rescues: 0, best: 0, feast: false, muted: false, secrets: 0 };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s) Object.assign(save, s); } catch (e) { /* storage blocked */ }
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* storage blocked */ } }

// ---------------------------------------------------------------------
//  Hand-drawn drawing helpers
// ---------------------------------------------------------------------
const INK = '#3b2a22';
let WK = 0, WT = 0;   // "line boil": wobble strength + frame seed (8 times a second)
function blob(c, cx, cy, rx, ry, seed = 0, bumps = 9, amp = 0.05, N = 22) {
  const P = [];
  for (let i = 0; i < N; i++) {
    const a = i / N * TAU;
    const n = 1 + amp * Math.sin(a * bumps + seed * 13.7) + amp * 0.5 * Math.sin(a * (bumps + 3) + seed * 5.3) + WK * 0.03 * Math.sin(a * 4 + WT * 2.3 + seed);
    P.push(cx + Math.cos(a) * rx * n, cy + Math.sin(a) * ry * n);
  }
  c.beginPath();
  const L = 2 * (N - 1);
  c.moveTo((P[L] + P[0]) / 2, (P[L + 1] + P[1]) / 2);
  for (let i = 0; i < N; i++) {
    const j = (i + 1) % N;
    c.quadraticCurveTo(P[2 * i], P[2 * i + 1], (P[2 * i] + P[2 * j]) / 2, (P[2 * i + 1] + P[2 * j + 1]) / 2);
  }
  c.closePath();
}
function inkStroke(c, lw = 2, a = 0.9, col = INK) {
  c.save(); c.globalAlpha *= a; c.lineWidth = lw; c.strokeStyle = col; c.lineJoin = 'round'; c.lineCap = 'round'; c.stroke(); c.restore();
}
// fill a shape, then outline it twice like a pencil sketch
function paint(c, build, fill, lw = 1.8) {
  build();
  if (fill) { c.fillStyle = fill; c.fill(); }
  if (lw) {
    inkStroke(c, lw, 0.85);
    c.save(); c.translate(0.7, 0.5); build(); inkStroke(c, lw * 0.5, 0.3); c.restore();
  }
}
function rgrad(c, x, y, r, a, b) { const g = c.createRadialGradient(x, y, r * 0.1, x, y, r); g.addColorStop(0, a); g.addColorStop(1, b); return g; }
function lgrad(c, x0, y0, x1, y1, stops) { const g = c.createLinearGradient(x0, y0, x1, y1); stops.forEach((s, i) => g.addColorStop(s[0], s[1])); return g; }
function rrect(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function font(size, kind) { return `${size}px ${kind === 'display' ? '"Caveat Brush"' : '"Patrick Hand"'}, "Comic Sans MS", "Chalkboard SE", cursive`; }
function txt(c, s, x, y, size, col = INK, kind = 'body', align = 'center', stroke = null, sw = 0) {
  c.font = font(size, kind); c.textAlign = align; c.textBaseline = 'middle';
  if (stroke) { c.lineWidth = sw; c.strokeStyle = stroke; c.lineJoin = 'round'; c.strokeText(s, x, y); }
  c.fillStyle = col; c.fillText(s, x, y);
}
function star(c, x, y, r, n = 5, inner = 0.45) {
  c.beginPath();
  for (let i = 0; i < n * 2; i++) { const a = i / (n * 2) * TAU - Math.PI / 2, rr = i % 2 ? r * inner : r; c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  c.closePath();
}
function woodBoard(c, x, y, w, h, rot = 0) {
  c.save(); c.translate(x + w / 2, y + h / 2); c.rotate(rot);
  paint(c, () => rrect(c, -w / 2, -h / 2, w, h, 9), lgrad(c, 0, -h / 2, 0, h / 2, [[0, '#b98250'], [1, '#7f5029']]), 2.2);
  c.save(); c.globalAlpha = 0.25; c.strokeStyle = '#3b2412'; c.lineWidth = 1.2;
  for (let i = 1; i < 3; i++) { const yy = -h / 2 + h * i / 3; c.beginPath(); c.moveTo(-w / 2 + 8, yy); c.bezierCurveTo(-w / 6, yy - 3, w / 6, yy + 3, w / 2 - 8, yy); c.stroke(); }
  c.restore();
  c.fillStyle = '#3b2a22'; [-w / 2 + 8, w / 2 - 8].forEach(nx => { c.beginPath(); c.arc(nx, 0, 2.2, 0, TAU); c.fill(); });
  c.restore();
}
function parchment(c, x, y, w, h) {
  paint(c, () => rrect(c, x, y, w, h, 10), rgrad(c, x + w / 2, y + h / 2, w * 0.7, '#fbf2dc', '#e2c895'), 2);
}

// ---------------------------------------------------------------------
//  Little Bunny and the bunny family
// ---------------------------------------------------------------------
function bunnyPal(fur) { return { fur, hi: shade(fur, 0.28), dark: shade(fur, -0.32), light: shade(fur, 0.5), belly: shade(fur, 0.66), inner: '#eba5a1' }; }
const ME_PAL = bunnyPal('#8b5a3c');

function ear(c, bx, by, ang, len, w, fur, inner, sd, notch) {
  c.save(); c.translate(bx, by); c.rotate(ang);
  paint(c, () => blob(c, 0, -len / 2, w, len / 2, sd, 5, 0.04, 16), fur, 1.6);
  blob(c, 0.6, -len / 2 + 1.5, w * 0.45, len / 2 - 5, sd + 0.5, 5, 0.04, 14); c.fillStyle = inner; c.fill();
  if (notch) { c.beginPath(); c.moveTo(w - 1, -len + 6); c.lineTo(w - 4, -len + 9); c.lineTo(w - 1, -len + 12); inkStroke(c, 1.4, 0.9); }
  c.restore();
}
function drawEye(c, x, y, p) {
  const e = p.eye || 'open';
  if (e === 'happy') { c.beginPath(); c.moveTo(x - 3.5, y + 1); c.quadraticCurveTo(x, y - 4, x + 3.5, y + 1); inkStroke(c, 1.8, 1); return; }
  const bl = p.blink || 0;
  if (e === 'closed' || bl > 0.85) { c.beginPath(); c.moveTo(x - 3.5, y); c.quadraticCurveTo(x, y + 2.5, x + 3.5, y); inkStroke(c, 1.6, 1); return; }
  const open = 1 - bl, lk = p.look || 0;
  c.save();
  if (e === 'wide') {
    c.fillStyle = '#fffaf0'; c.beginPath(); c.ellipse(x, y, 4.8, 5.8 * open, 0, 0, TAU); c.fill(); inkStroke(c, 1.3, 0.9);
    c.fillStyle = '#1d120c'; c.beginPath(); c.ellipse(x + 1 + lk, y, 2, 2.5 * open, 0, 0, TAU); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(x + 1.6 + lk, y - 1, 0.8, 0, TAU); c.fill();
  } else {
    const ex = x + lk;
    c.fillStyle = '#1d120c'; c.beginPath(); c.ellipse(ex, y, 3.9, 4.9 * open, 0, 0, TAU); c.fill();
    c.fillStyle = 'rgba(140,82,44,.9)'; c.beginPath(); c.ellipse(ex + 0.3, y + 1.5 * open, 2.6, 2.3 * open, 0, 0, TAU); c.fill();
    c.fillStyle = '#0b0604'; c.beginPath(); c.ellipse(ex + 0.4, y + 0.2, 1.7, 2.4 * open, 0, 0, TAU); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(ex + 1.3, y - 1.9 * open, 1.55, 0, TAU); c.fill();
    c.globalAlpha *= 0.85; c.beginPath(); c.arc(ex - 1.2, y + 2 * open, 0.75, 0, TAU); c.fill();
  }
  c.restore();
  if (e !== 'wide') { c.beginPath(); c.moveTo(x + 2.4 + lk, y - 4.5 * open); c.quadraticCurveTo(x + 4.6 + lk, y - 5.8 * open, x + 5.8 + lk, y - 5 * open); inkStroke(c, 1, 0.75); }
}
// little fluffy tufts poking out of an outline
function furTufts(c, cx, cy, rx, ry, angs, fill, len = 5, wd = 3.4, ink = 0.6) {
  for (const a of angs) {
    const nx = Math.cos(a), ny = Math.sin(a), px = cx + nx * rx, py = cy + ny * ry, tx = -ny, ty = nx;
    const b1x = px - tx * wd - nx * 1.5, b1y = py - ty * wd - ny * 1.5, b2x = px + tx * wd - nx * 1.5, b2y = py + ty * wd - ny * 1.5;
    const tipx = px + nx * len + tx * 1.6, tipy = py + ny * len + ty * 1.6;
    c.beginPath(); c.moveTo(b1x, b1y); c.quadraticCurveTo(px + nx * 2.5 - tx, py + ny * 2.5 - ty, tipx, tipy); c.quadraticCurveTo(px + nx * 1.2 + tx * 2, py + ny * 1.2 + ty * 2, b2x, b2y); c.closePath();
    c.fillStyle = fill; c.fill();
    c.beginPath(); c.moveTo(b1x + nx, b1y + ny); c.quadraticCurveTo(px + nx * 2.5 - tx, py + ny * 2.5 - ty, tipx, tipy); c.quadraticCurveTo(px + nx * 1.2 + tx * 2, py + ny * 1.2 + ty * 2, b2x + nx, b2y + ny);
    inkStroke(c, 0.9, ink);
  }
}
function mouth(c, m, x, y) {
  if (!m) return;
  c.beginPath();
  if (m === 'w') { c.moveTo(x - 2.5, y); c.quadraticCurveTo(x - 1.2, y + 2, x, y); c.quadraticCurveTo(x + 1.2, y + 2, x + 2.5, y); inkStroke(c, 1.1, 0.8); }
  else if (m === 'o') { c.ellipse(x, y + 1, 1.6, 2, 0, 0, TAU); c.fillStyle = '#5a2a24'; c.fill(); }
  else if (m === 'open') { c.moveTo(x - 2.6, y); c.quadraticCurveTo(x, y + 4.8, x + 2.6, y); c.closePath(); c.fillStyle = '#8a3a34'; c.fill(); inkStroke(c, 1, 0.7); }
}
function drawCurled(c, pal, sd) {
  paint(c, () => blob(c, 0, -14, 20, 14, sd, 10, 0.06, 24), rgrad(c, -6, -22, 26, pal.hi, pal.fur), 1.8);
  c.save(); c.translate(6, -22); c.rotate(-1.8); paint(c, () => blob(c, 0, -11, 5, 11, sd + 1, 5, 0.04, 14), pal.fur, 1.4); c.restore();
  paint(c, () => blob(c, -19, -12, 6, 6, sd + 2, 7, 0.12, 12), '#f5ede1', 1.3);
  blob(c, 13, -9, 6, 5, sd + 3, 6, 0.08, 12); c.fillStyle = pal.belly; c.fill();
  c.beginPath(); c.moveTo(7, -14); c.quadraticCurveTo(10, -11.5, 13, -14); inkStroke(c, 1.5, 1);
  c.fillStyle = '#d9787a'; c.beginPath(); c.arc(18.5, -10, 1.6, 0, TAU); c.fill();
}
// o = { s, dir, pal, p (pose), seed, flower, notch, shadow }
function drawBunny(c, x, y, o) {
  const s = o.s || 1, p = o.p || {}, pal = o.pal || ME_PAL, sd = o.seed || 0;
  c.save(); c.translate(x, y);
  if (o.shadow !== false) {
    const sa = o.shadowA ?? 1;
    c.save(); c.globalAlpha *= 0.22 * sa; c.fillStyle = '#24160c'; c.beginPath(); c.ellipse(0, 1, 19 * s * (0.5 + sa * 0.5), 4 * s, 0, 0, TAU); c.fill(); c.restore();
  }
  c.translate(p.shake || 0, -(p.bob || 0) * s);
  c.scale((o.dir || 1) * s * (p.sx || 1), s * (p.sy || 1));
  if (p.curl) { drawCurled(c, pal, sd); c.restore(); return; }
  c.translate(0, -16); c.rotate(p.tilt || 0); c.translate(0, 16);
  const fx = p.fx || 0, fy = p.fy || 0, bx = p.bx || 0, by = p.by || 0;
  // tail
  paint(c, () => blob(c, -20, -21, 7.5, 7, sd + 2, 7, 0.12, 14), '#f5ede1', 1.5);
  // far back foot
  paint(c, () => { c.beginPath(); c.ellipse(-4 + bx * 0.8, -3 + by, 9, 3.4, 0, 0, TAU); }, pal.dark, 1.3);
  // body
  paint(c, () => blob(c, -3, -18, 19, 15, sd + 3, 11, 0.055, 26), rgrad(c, -8, -27, 27, pal.hi, pal.fur), 1.9);
  c.save(); c.globalAlpha *= 0.45; blob(c, -10, -14, 11, 10, sd + 4, 8, 0.06, 16); c.fillStyle = pal.dark; c.fill(); c.restore();
  blob(c, 8, -15, 8.5, 10, sd + 5, 7, 0.1, 16); c.fillStyle = pal.belly; c.fill();
  c.save(); c.strokeStyle = pal.dark; c.lineWidth = 1; c.globalAlpha *= 0.7; c.beginPath();
  c.moveTo(-14, -26); c.lineTo(-12, -23); c.moveTo(-8, -30); c.lineTo(-7, -27); c.moveTo(-19, -14); c.lineTo(-16, -13); c.stroke(); c.restore();
  furTufts(c, -3, -18, 19, 15, [-2.65, -2.1, -1.35, 2.45], pal.fur, 3.2, 2.6, 0.35);
  // near back foot + front paw
  paint(c, () => { c.beginPath(); c.ellipse(-8 + bx, -3 + by, 10, 3.8, p.bfr || 0, 0, TAU); }, pal.light, 1.5);
  paint(c, () => { c.beginPath(); c.ellipse(11 + fx, -3 + fy, 4.6, 3.6, 0, 0, TAU); }, pal.light, 1.4);
  // head group
  c.save(); c.translate(13, -33); c.rotate(p.head || 0);
  ear(c, -5, -9, (p.ear ?? -0.2) - 0.14, 26, 6.2, pal.dark, shade(pal.inner, -0.2), sd + 1);
  paint(c, () => blob(c, 0, 0, 13, 12, sd + 6, 9, 0.06, 22), rgrad(c, -4, -5, 18, pal.hi, pal.fur), 1.9);
  furTufts(c, 0, 0, 13, 12, [-1.75, 2.75], pal.fur, 3.2, 2.6, 0.35);
  blob(c, 8, 4, 6.5, 5, sd + 7, 6, 0.08, 14); c.fillStyle = pal.belly; c.fill();

// --- the family burrow (title screen and coming home) ---
function buildBurrow() {
  const w = VW, hh = H + OY * 2 + 4;
  const cnv = mk(w * RES, hh * RES), c = cnv.getContext('2d');
  c.scale(RES, RES); c.translate(0, OY + 2);
  const R = rng(91);
  c.fillStyle = lgrad(c, 0, -OY, 0, H + OY, [[0, '#2a1a12'], [1, '#3a2418']]); c.fillRect(0, -OY - 2, w, hh);
  // chamber
  wash(c, () => blob(c, w / 2, 250, w * 0.56, 250, 3, 6, 0.04, 40), '#7a5236', 1);
  c.save(); blob(c, w / 2, 250, w * 0.56, 250, 3, 6, 0.04, 40); c.clip();
  c.fillStyle = rgrad(c, w * 0.32, 180, w * 0.6, 'rgba(255,190,110,.35)', 'rgba(255,190,110,0)'); c.fillRect(0, 0, w, H);
  for (let i = 0; i < 60; i++) { c.globalAlpha = 0.12; c.fillStyle = R() < 0.5 ? '#4a2c18' : '#a77a50'; blob(c, R() * w, R() * H, 20 + R() * 40, 10 + R() * 20, R() * 9, 6, 0.1, 14); c.fill(); }
  c.globalAlpha = 1;
  for (let i = 0; i < 26; i++) { c.fillStyle = '#9c8f84'; blob(c, R() * w, 60 + R() * 280, 3 + R() * 5, 2 + R() * 3, R() * 9, 5, 0.1, 10); c.fill(); inkStroke(c, 1, 0.4); }
  c.restore();
  c.save(); blob(c, w / 2, 250, w * 0.56, 250, 3, 6, 0.04, 40); inkStroke(c, 3, 0.7); c.restore();
  // hanging roots
  for (let i = 0; i < 12; i++) {
    const x = w * 0.15 + R() * w * 0.7, len = 30 + R() * 70, y0 = 40 + Math.abs(x - w / 2) / w * 120;
    c.beginPath(); c.moveTo(x, y0 - 20); c.bezierCurveTo(x + 8, y0 + len * 0.3, x - 10, y0 + len * 0.6, x + 4, y0 + len);
    c.strokeStyle = '#5a3a22'; c.lineWidth = 3 + R() * 3; c.lineCap = 'round'; c.stroke(); inkStroke(c, 1, 0.4);
  }
  // exit tunnel with daylight
  c.save(); c.globalAlpha = 0.5; c.fillStyle = lgrad(c, 0, 60, 0, FL + 10, [[0, 'rgba(255,230,160,.9)'], [1, 'rgba(255,230,160,0)']]);
  c.beginPath(); c.moveTo(w * 0.09, 100); c.lineTo(w * 0.17, 100); c.lineTo(w * 0.32, FL + 10); c.lineTo(w * 0.02, FL + 10); c.closePath(); c.fill(); c.restore();
  paint(c, () => blob(c, w * 0.13, 110, 46, 36, 5, 5, 0.06, 20), '#1a100a', 2.5);
  c.save(); blob(c, w * 0.13, 110, 46, 36, 5, 5, 0.06, 20); c.clip(); c.fillStyle = rgrad(c, w * 0.13, 90, 50, '#f7e2a3', '#8a6a3a'); c.fillRect(0, 0, w, 200); c.restore();
  // shelves (food is drawn live on top)
  for (const sy of [200, 262]) {
    paint(c, () => rrect(c, w - 230, sy, 200, 12, 4), '#8a5a32', 2);
    c.beginPath(); c.moveTo(w - 210, sy + 12); c.lineTo(w - 200, sy + 30); c.moveTo(w - 52, sy + 12); c.lineTo(w - 62, sy + 30); inkStroke(c, 3, 0.6);
  }
  // a little drawing pinned to the wall (Little Bunny drew the family)
  c.save(); c.translate(w / 2 - 120, 232); c.rotate(-0.06);
  paint(c, () => rrect(c, -34, -26, 68, 50, 4), '#f3e3c0', 2);
  c.strokeStyle = '#8a5a3c'; c.lineWidth = 1.6;
  [[-18, 8, 7], [-4, 10, 5], [8, 10, 5], [20, 9, 6]].forEach(([dx, dy, r]) => { c.beginPath(); c.arc(dx, dy, r, 0, TAU); c.stroke(); c.beginPath(); c.moveTo(dx - 2, dy - r); c.lineTo(dx - 3, dy - r - 8); c.moveTo(dx + 2, dy - r); c.lineTo(dx + 3, dy - r - 8); c.stroke(); });
  c.fillStyle = '#e8792b'; c.beginPath(); c.moveTo(-26, -16); c.lineTo(-18, -18); c.lineTo(-24, -6); c.closePath(); c.fill();
  c.fillStyle = '#c0392b'; c.beginPath(); c.arc(0, -26, 2.5, 0, TAU); c.fill();
  c.restore();
  // straw floor
  wash(c, () => blob(c, w / 2, FL + 12, w * 0.44, 28, 8, 7, 0.06, 30), '#c9a25a', 0.95);
  for (let i = 0; i < 120; i++) {
    const x = w / 2 + (R() - 0.5) * w * 0.82, y = FL + R() * 24, a = (R() - 0.5) * 1.2, l = 8 + R() * 12;
    c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l * 0.3);
    c.strokeStyle = R() < 0.5 ? '#e4c27a' : '#a77f3d'; c.lineWidth = 1.4; c.stroke();
  }
  // woven rug
  paint(c, () => blob(c, w / 2 - 20, FL + 10, Math.min(300, w * 0.3), 20, 12, 6, 0.03, 30), '#9b3b2e', 2);
  blob(c, w / 2 - 20, FL + 10, Math.min(300, w * 0.3) - 16, 13, 13, 6, 0.03, 30); c.fillStyle = '#c4613f'; c.fill();
  c.save(); c.setLineDash([6, 5]); blob(c, w / 2 - 20, FL + 10, Math.min(300, w * 0.3) - 30, 7, 14, 6, 0.03, 30); c.strokeStyle = '#efc070'; c.lineWidth = 2; c.stroke(); c.restore();
  burrowBg = cnv;
}

// ---------------------------------------------------------------------
//  Update
// ---------------------------------------------------------------------
function blockedAbove(b) {
  for (const hz of G.L.hazards) if (hz.k === 'branch' && b.x + 13 > hz.x && b.x - 13 < hz.x + hz.w && b.y - 44 < hz.y + hz.h) return true;
  return false;
}
function stumble(b) {
  b.stun = 0.45; b.inv = 1.1; b.vx = -Math.sign(b.vx || b.dir) * 150; b.vy = -300; b.onGround = false; b.slideT = 0;
  sfx.oof(); G.cam.shake = Math.max(G.cam.shake, 7);
  for (let i = 0; i < 5; i++) addPart({ x: b.x + rand(-10, 10), y: b.y - 40, vx: rand(-60, 60), vy: rand(-140, -60), kind: 'star', col: '#ffe27a', life: 0.7, size: 5, g: 300 });
}
function stepBunny(dt) {

  b.coyote -= dt; b.jumpBuf -= dt; b.stun -= dt; b.inv -= dt; b.slideT -= dt; b.landT -= dt; b.happyT -= dt; b.twitch -= dt;
  if (Math.random() < dt * 0.4) b.twitch = 0.3;

  let want = 0;
  if (control) { if (input.left) want -= 1; if (input.right) want += 1; }
  if (input.jumpPressed) { b.jumpBuf = 0.13; input.jumpPressed = false; }
  const wantDown = control && input.down;
  if (wantDown && b.onGround && b.slideT <= 0 && !b.crouch && Math.abs(b.vx) > 140) { b.slideT = 0.62; sfx.slide(); }
  const under = blockedAbove(b);

  if (b.slideT > 0 && b.onGround) {
    b.vx -= Math.sign(b.vx) * 180 * dt;

  } else if (want) {
    const acc = (b.onGround ? 1500 : 1050) * (G.chase === 2 ? 1.35 : 1), before = Math.abs(b.vx);
    b.vx += want * acc * (Math.sign(b.vx) === -want ? 1.8 : 1) * dt;

    b.dir = want;

  }

    b.vy = -JUMPV; b.onGround = false; b.coyote = 0; b.jumpBuf = 0; b.slideT = 0; b.crouch = false; b.h = 44;
    sfx.jump(); puff(b.x, b.y, 4, '#b08b62', 50, 'dust', 0.35, 4);
  }
  const g = b.pop ? 1800 : b.vy < 0 ? (input.jump && control ? 2100 : 3800) : 2500;
  b.vy = Math.min(b.vy + g * dt, 1150);
  // move X
  b.x += b.vx * dt;
  if (b.x < 24) { b.x = 24; b.vx = 0; }
  if (b.x > L.END - 30) { b.x = L.END - 30; b.vx = 0; }
  for (const s of L.solids) {
    if (b.x + 14 > s.x && b.x - 14 < s.x + s.w && b.y > s.y + 3 && b.y - b.h < s.y + s.h) {
      if (b.x < s.x + s.w / 2) b.x = s.x - 14.01; else b.x = s.x + s.w + 14.01;

    }

    else if (p.kind === 'star') { c.translate(p.x, p.y); c.rotate(p.rot); c.fillStyle = p.col; star(c, 0, 0, p.size); c.fill(); inkStroke(c, 1, 0.8); }
    else if (p.kind === 'leaf') { c.translate(p.x, p.y); c.rotate(p.rot); c.fillStyle = p.col; c.beginPath(); c.ellipse(0, 0, p.size, p.size * 0.45, 0, 0, TAU); c.fill(); inkStroke(c, 0.8, 0.5); }
    else if (p.kind === 'txt') { txt(c, p.text, p.x, p.y, p.text.length > 3 ? 22 : 26, p.col, 'display', 'center', '#fff8e8', 4); }
    c.restore();
  }
}
function drawBubble(c, bb) {
  let x = bb.x, y = bb.y;
  if (bb.follow) [x, y] = bb.follow();
  if (bb.t < 0) return;
  const a = clamp(bb.t / 0.15, 0, 1) * clamp((bb.dur - bb.t) / 0.25, 0, 1);
  const label = bb.who ? bb.who + ': ' : '';
  c.save(); c.globalAlpha = a;
  c.font = font(19, 'body'); const tw = c.measureText(label + bb.text).width;
  const w = tw + 26, h = 34, bx = clamp(x - w / 2, G.cam.x + 8, G.cam.x + VW - w - 8), by = y - h - 16;
  paint(c, () => { rrect(c, bx, by, w, h, 12); c.moveTo(x - 7, by + h - 1); c.lineTo(x, y - 4); c.lineTo(x + 7, by + h - 1); }, bb.who === 'Fox' ? '#f2e2d8' : '#fbf2dc', 1.8);
  c.textAlign = 'left'; c.textBaseline = 'middle';
  c.fillStyle = bb.who === 'Fox' ? '#8a2a14' : '#8a5629'; c.fillText(label, bx + 13, by + h / 2);
  const lw = c.measureText(label).width; c.fillStyle = INK; c.fillText(bb.text, bx + 13 + lw, by + h / 2);
  c.restore();
}

function drawWorld(c) {
  const L = G.L, b = G.bunny, f = G.fox;
  drawSky(c); drawParallax(c);
  const sh = G.cam.shake, shx = sh ? rand(-sh, sh) : 0, shy = sh ? rand(-sh, sh) * 0.6 : 0;
  c.save(); c.translate(-Math.round(G.cam.x) + shx, shy);
  // background trees behind the hanging branches
  for (const hz of L.hazards) if (hz.k === 'branch' && inView(hz.x, hz.w + 80)) drawBranch(c, hz);
  // canopy secret: the tree trunk under it
  for (const s of L.secrets) if (s.kind === 'canopy' && inView(s.x, s.w)) drawTrunk(c, s.x + s.w / 2 + 40, s.y + 60);
  for (const s of L.streams) if (inView(s.x, s.w)) drawStreamWater(c, s);
  const c0 = Math.floor((G.cam.x - 40) / CH), c1 = Math.floor((G.cam.x + VW + 40) / CH);
  for (let i = c0; i <= c1; i++) { const ch = getChunk(i); c.drawImage(ch.cnv, i * CH, ch.top, CH, ch.hh); }
  c.fillStyle = '#553521'; c.fillRect(G.cam.x - 60, H + 38, VW + 120, OY + 10);
  if (inView(120, 0)) drawBurrowHole(c, 120);
  for (const sg of L.signs) if (inView(sg.x - 120, 240)) drawSign(c, sg);
  if (inView(L.foxBush.x, L.foxBush.w)) drawFoxBush(c);
  for (const l of L.ledges) if (inView(l.x, l.w)) drawLedge(c, l);
  for (const s of L.solids) if (inView(s.x, s.w)) drawSolid(c, s);
  for (const hz of L.hazards) if (hz.k === 'bramble' && inView(hz.x, hz.w)) drawBramble(c, hz);
  drawItems(c);
  drawButterflies(c);
  drawRescueHole(c);
  const foxBehind = f.active && f.x < b.x;
  const drawF = () => { if (f.active && inView(f.x - 100, 200)) {
    if (G.state === 'play' && G.chase === 2 && !f.duck) {
      const ex = f.x + 50, ey = GROUND - f.lift - 53;
      c.save(); c.globalCompositeOperation = 'lighter'; c.lineCap = 'round';
      c.strokeStyle = lgrad(c, ex - 70, 0, ex, 0, [[0, 'rgba(255,200,60,0)'], [1, 'rgba(255,210,70,.55)']]); c.lineWidth = 3;
      c.beginPath(); c.moveTo(ex - 70, ey + 4 + Math.sin(f.ph * TAU) * 3); c.quadraticCurveTo(ex - 30, ey + 2, ex, ey); c.stroke(); c.restore();
    }
    WK = 1; drawFox(c, f.x, GROUND, { ph: f.ph, mode: f.mode, jaw: f.jaw, lift: f.lift, duck: f.duck, t: f.t }); WK = 0; } };
  if (foxBehind) drawF();
  drawPlayBunny(c);
  drawRescueHole(c, true);
  if (!foxBehind) drawF();
  drawGoalLogFront(c);
  for (const s of L.secrets) drawSecret(c, s);
  drawParts(c, true);
  for (const bb of G.bubbles) drawBubble(c, bb);
  c.restore();
  // foreground grass
  const ft = tiles.fore, off = ((-G.cam.x * 1.25) % ft.w + ft.w) % ft.w - ft.w;
  c.save(); c.globalAlpha = 0.9; for (let x = off; x < VW; x += ft.w) c.drawImage(ft.cnv, x, ft.y0 + 20, ft.w, ft.h); c.restore();
  drawMotes(c);
  // speed lines
  if (G.speedLines.length) {
    c.save(); c.strokeStyle = 'rgba(255,248,230,.55)'; c.lineCap = 'round';
    for (const s of G.speedLines) { c.globalAlpha = s.life * 0.7; c.lineWidth = 2; c.beginPath(); c.moveTo(s.x, s.y); c.lineTo(s.x + s.len, s.y); c.stroke(); }
    c.restore();
  }
}

// ---------------------------------------------------------------------
//  HUD
// ---------------------------------------------------------------------
function drawMeter(c, x, y, w, pending) {
  parchment(c, x, y, w, 52);
  const total = save.food, frac = clamp(total / FOOD_GOAL, 0, 1), pfrac = clamp((total + pending) / FOOD_GOAL, 0, 1);
  txt(c, 'Family food supply', x + 12, y + 15, 17, '#6a4026', 'body', 'left');
  txt(c, pending ? `${total} + ${pending} / ${FOOD_GOAL}` : `${total} / ${FOOD_GOAL}`, x + w - 12, y + 15, 17, '#6a4026', 'body', 'right');
  const bx = x + 12, by = y + 28, bw = w - 24, bh = 14;
  paint(c, () => rrect(c, bx, by, bw, bh, 7), '#e9d6ad', 1.4);
  if (pfrac > frac) {
    c.save(); rrect(c, bx, by, bw * pfrac, bh, 7); c.clip();
    c.fillStyle = '#f6c48a'; c.fillRect(bx, by, bw * pfrac, bh);
    c.strokeStyle = 'rgba(232,121,43,.6)'; c.lineWidth = 3;
    for (let sx = bx - 20 + (G.t * 20) % 10; sx < bx + bw * pfrac; sx += 10) { c.beginPath(); c.moveTo(sx, by + bh); c.lineTo(sx + 10, by); c.stroke(); }
    c.restore();
  }
  if (frac > 0) { c.save(); rrect(c, bx, by, bw * frac, bh, 7); c.fillStyle = lgrad(c, 0, by, 0, by + bh, [[0, '#ffa559'], [1, '#d4621c']]); c.fill(); c.restore(); }
  rrect(c, bx, by, bw, bh, 7); inkStroke(c, 1.4, 0.8);
  drawCarrot(c, bx + bw * pfrac, by + bh / 2, 0.75, 0.6);
}
function drawHUD(c) {
  const L = G.L, rightPad = 124 / SCALE;
  woodBoard(c, 12, 10, 178, 52, -0.015);
  txt(c, 'Carrot Meadows', 101, 30, 24, '#fff3dc', 'display');
  txt(c, 'Bunwood  ·  Level 1', 101, 50, 14, '#f3dcb6');
  const counters = [['carrot', G.trip.carrot], ['berry', G.trip.berry], ['apple', G.trip.apple], ['gold', G.trip.gold]];
  const cw = 54, cx0 = VW - rightPad - counters.length * cw;
  const mw = clamp(cx0 - 210 - 16, 180, 360), mx = 200 + (cx0 - 200 - mw) / 2;
  drawMeter(c, mx, 10, mw, G.trip.food);
  parchment(c, cx0 - 6, 12, counters.length * cw + 4, 46);
  counters.forEach(([k, n], i) => {
    const x = cx0 + i * cw + 14;
    drawFood(c, k, x, 35, 0.8, G.t);
    txt(c, String(n), x + 22, 36, 20, INK, 'display');
  });
  // fox danger marker when he is off-screen behind you
  const f = G.fox, b = G.bunny;
  if (f.active && (G.state === 'play') && G.chase === 2) {
    const sx = f.x + 70 - G.cam.x;
    if (sx < 0) {
      const dist = b.x - f.x, k = clamp(1 - (dist - 90) / 420, 0, 1), pulse = 1 + Math.sin(G.t * (6 + k * 10)) * 0.08;
      c.save(); c.translate(34, 300); c.scale(pulse * (0.8 + k * 0.4), pulse * (0.8 + k * 0.4));
      c.fillStyle = `rgba(200,40,30,${0.25 + k * 0.4})`; c.beginPath(); c.arc(0, 0, 30, 0, TAU); c.fill();
      c.save(); c.scale(0.55, 0.55); drawFox(c, -24, 48, { mode: 'stand', t: G.t }); c.restore();
      c.restore();
    }
  }
  if (G.banner) {
    const B = G.banner, k = B.t / B.dur, a = clamp(B.t / 0.15, 0, 1) * clamp((B.dur - B.t) / 0.3, 0, 1);
    c.save(); c.globalAlpha = a; c.translate(VW / 2, 170); c.scale(1 + (1 - Math.min(1, B.t * 5)) * 0.4, 1 + (1 - Math.min(1, B.t * 5)) * 0.4); c.rotate(-0.03);
    txt(c, B.text, 0, 0, B.text.length > 14 ? 50 : 64, '#ffd36b', 'display', 'center', '#3b2a22', 9);
    c.restore();
    void k;
  }
  void L;
}
function drawVignette(c) {
  const f = G.fox, b = G.bunny;
  let danger = 0;
  if (G.state === 'play' && G.chase === 2) danger = clamp(1 - (b.x - f.x - 90) / 380, 0, 1);
  if (G.state === 'caught') danger = 1;
  const g = c.createRadialGradient(VW / 2, H / 2, Math.min(VW, H) * 0.35, VW / 2, H / 2, Math.max(VW, H) * 0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, danger > 0 ? `rgba(${Math.round(60 + danger * 80)},10,10,${0.35 + danger * 0.3})` : `rgba(40,20,10,${0.3 + G.chaseMix * 0.2})`);
  c.fillStyle = g; c.fillRect(-2, -OY - 2, VW + 4, H + OY * 2 + 4);
}

// ---------------------------------------------------------------------
//  The burrow scene
// ---------------------------------------------------------------------
function drawPantry(c) {
  const n = Math.round(clamp(save.food / FOOD_GOAL, 0, 1) * 20);
  const x0 = VW - 218;
  for (let i = 0; i < n; i++) {
    const shelf = i < 10 ? 0 : 1, k = i % 10, x = x0 + 10 + k * 17, y = shelf ? 262 : 200;
    const kind = ['carrot', 'apple', 'berry', 'carrot', 'berry'][i % 5];
    if (kind === 'carrot') drawCarrot(c, x, y - 4, 0.8, 0.15); else drawFood(c, kind, x, y - 6, 0.75, 0);
  }
  if (!n) txt(c, '(empty)', x0 + 92, 186, 16, 'rgba(255,240,210,.6)');
}
function drawBurrowScene(c) {
  c.drawImage(burrowBg, 0, -OY - 2, VW, H + OY * 2 + 4);
  // dust floating in the sunbeam
  c.save(); c.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 26; i++) {
    const u = (hash(i + 70) + G.t * 0.02 * (0.5 + hash(i))) % 1, yy = 110 + u * (FL - 110), spread = (yy - 100) / (FL - 100);
    const xx = VW * (0.13 + (hash(i + 80) - 0.5) * (0.08 + spread * 0.24)) + Math.sin(G.t * 0.7 + i) * 6 + spread * VW * 0.04;
    c.globalAlpha = 0.5 * Math.sin(u * Math.PI); c.fillStyle = '#fff1c0'; c.beginPath(); c.arc(xx, yy, 1 + hash(i + 90) * 1.5, 0, TAU); c.fill();
  }
  c.restore();
  // lantern
  const lx = VW * 0.3, ly = 150, fl = 0.85 + Math.sin(G.t * 7) * 0.05 + Math.sin(G.t * 13) * 0.03;
  c.fillStyle = rgrad(c, lx, ly, 200 * fl, 'rgba(255,200,110,.35)', 'rgba(255,200,110,0)'); c.beginPath(); c.arc(lx, ly, 200 * fl, 0, TAU); c.fill();
  c.beginPath(); c.moveTo(lx, 40); c.lineTo(lx, ly - 22); inkStroke(c, 1.5, 0.8);
  paint(c, () => rrect(c, lx - 13, ly - 22, 26, 34, 8), 'rgba(255,230,160,.85)', 2);
  for (let i = 0; i < 3; i++) { const a = G.t * 2 + i * 2.1; c.fillStyle = '#fff2a0'; c.beginPath(); c.arc(lx + Math.cos(a) * 6, ly - 5 + Math.sin(a * 1.3) * 8, 2, 0, TAU); c.fill(); }
  drawPantry(c);
  txt(c, 'Pantry', VW - 130, 292, 16, 'rgba(255,240,210,.75)');
  // family
  WK = 1;
  for (const m of G.family) {
    const hop = m.hop > 0 ? Math.sin((m.hop / 0.6) * Math.PI) * 22 : 0;
    let p = {};
    if (m.sleep) p = { curl: true };
    else {
      const br = Math.sin(G.t * 2 + m.seed); p = { sy: 1 + br * 0.015, ear: -0.15 + Math.sin(G.t * 1.3 + m.seed) * 0.06, earF: -0.08, blink: blinkVal(G.t, m.seed) };
      if (m.id === 'me') { const lk = Math.sin(G.t * 0.6); p.look = lk > 0.5 ? 1 : lk < -0.5 ? -1 : 0; }
      if (hop > 0) { p.sy = 1.08; p.sx = 0.94; p.ear = -0.5; p.earF = -0.4; }
      if (m.happy > 0 || G.homeMode === 'win' || G.homeMode === 'feast') { p.eye = 'happy'; p.mouth = 'open'; }
      if (G.homeMode === 'rescued' && m.id !== 'me' && m.happy <= 0) { p.eye = undefined; p.mouth = 'w'; }
      if (G.homeMode === 'rescued' && m.id === 'me') { p.ear = -0.9; p.earF = -0.8; p.eye = G.homeT < 2 ? 'wide' : undefined; }
    }
    drawBunny(c, m.x, m.y - hop, { pal: m.pal, s: m.s, dir: m.dir, p, seed: m.seed, flower: m.flower, notch: m.notch, shadowA: 1 - hop / 40 });
    if (m.sleep) { const z = (G.t * 0.8 + m.seed) % 1; txt(c, 'z', m.x + 10 + z * 14, m.y - 34 - z * 30, 14 + z * 8, `rgba(255,240,210,${1 - z})`, 'display'); }
  }
  WK = 0;
  // title
  if (G.state === 'title' || G.homeMode === 'title') {
    c.save(); c.translate(VW / 2, 62);
    const T = 'RUN LITTLE BUNNY!'; c.font = font(84, 'display');
    const total = c.measureText(T).width; let x = -total / 2;
    for (let i = 0; i < T.length; i++) {
      const ch = T[i], w = c.measureText(ch).width, wob = Math.sin(G.t * 2 + i * 0.7) * 2;
      c.save(); c.translate(x + w / 2, wob); c.rotate(Math.sin(i * 1.9) * 0.05);
      txt(c, ch, 0, 0, 84, i < 4 ? '#ff9a3c' : '#ffd36b', 'display', 'center', '#2a1810', 10);
      c.restore(); x += w;
    }
    c.restore();
    txt(c, 'A little bunny. A big forest. A hungry family.', VW / 2, 116, 22, '#f6e2bd');
  }
  drawMeter(c, VW / 2 - 170, G.state === 'title' || G.homeMode === 'title' ? 136 : 40, 340, 0);
  if (G.homeMode === 'rescued' && G.homeT < 4) {
    const me = G.family.find(m => m.id === 'me'), s = G.family.find(m => m.id === 's0');
    if (s) drawBubble(c, { x: s.x + G.cam.x * 0, y: s.y - 60, text: 'We got you, Bro-Bro!', who: '', t: G.homeT, dur: 4 });
    void me;
  }
}

// ---------------------------------------------------------------------
//  Render + main loop
// ---------------------------------------------------------------------
function render() {
  const c = ctx;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.fillStyle = '#1b1422'; c.fillRect(0, 0, cv.width, cv.height);
  c.setTransform(SCALE * DPR, 0, 0, SCALE * DPR, OX * SCALE * DPR, OY * SCALE * DPR);
  if (G.state === 'play' || G.state === 'caught' || G.state === 'escape') {
    const camSave = G.cam.x;
    drawWorld(c);
    G.cam.x = camSave;
    drawVignette(c);
  } else {
    G.cam.x = 0;
    drawBurrowScene(c);
    drawVignette(c);
  }
  // paper grain over everything
  if (paperPat) { c.save(); c.globalCompositeOperation = 'multiply'; c.globalAlpha = 0.55; c.fillStyle = paperPat; c.fillRect(-2, -OY - 2, VW + 4, H + OY * 2 + 4); c.restore(); }
  if (G.state === 'play' || G.state === 'caught' || G.state === 'escape') drawHUD(c);
  if (G.fade.a > 0) { c.fillStyle = `rgba(20,12,8,${G.fade.a})`; c.fillRect(-2, -OY - 2, VW + 4, H + OY * 2 + 4); }
}
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const cw = innerWidth, ch = innerHeight;
  cv.width = Math.round(cw * DPR); cv.height = Math.round(ch * DPR);
  SCALE = ch / H; VW = cw / SCALE;
  if (VW < 760) { SCALE = cw / 760; VW = 760; }
  VH = ch / SCALE; OY = (VH - H) / 2; OX = 0;
  buildArt();
  layoutFamily();
}
addEventListener('resize', resize);
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05;
  if (!G.paused) update(dt);
  render();
  musicTick();
}
resize();
showTitle();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { /* canvas text redraws every frame */ });
requestAnimationFrame(frame);
})();
</script>
